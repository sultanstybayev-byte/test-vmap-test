<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мастерская Велариса</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+SC:wght@600;700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Ruslan+Display&family=Kurale&family=Marck+Script&family=Bad+Script&family=Caveat:wght@500&display=swap">
<style>
/* Рукописные шрифты из папки fonts/ */
@font-face { font-family: "Lastochka"; src: url("fonts/lastochka.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Kosmos129"; src: url("fonts/kosmos129.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Roscherk SHA"; src: url("fonts/roscherk.otf") format("opentype"); font-display: swap; }
@font-face { font-family: "Denistina"; src: url("fonts/denistina.ttf") format("truetype"); font-display: swap; }
@font-face { font-family: "Aquiline"; src: url("fonts/aquiline.ttf") format("truetype"); font-display: swap; }
/* Мастерская: отдельная страница с инструментами мастера (письма и всё, что добавится потом). Тот же вид, что у главного меню. */
:root {
  --ink: #17110b; --leather: #2a1d12; --leather-hi: #3a2817;
  --gold: #c9a25a; --gold-hi: #f0d696;
  --parchment: #ecdcb6; --parchment-deep: #d6bd8c;
  --text-ink: #34230f; --text-muted: #6f5532; --blood: #8e2f1c;
  --shadow: rgba(10, 6, 2, .55);
  --font-display: "Cormorant SC", "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-body: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(.22, .8, .24, 1);
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .24  0 0 0 0 .1  0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  color-scheme: dark;
}
* , *::before, *::after { box-sizing: border-box; }
html { background: var(--ink); }
body { min-height: 100%; background: var(--ink); color: var(--parchment); font: 500 18px/1.5 var(--font-body); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
.bg { position: fixed; inset: 0; z-index: 0; background: url("map-mobile.jpg?v=8") center 40% / cover no-repeat; filter: saturate(.8) brightness(.42) blur(2px); transform: scale(1.04); }
.bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, rgba(23,17,11,.25), rgba(23,17,11,.88) 75%); }
main { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding-block: 24px 60px; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 12px; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 12px max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, rgba(23,17,11,.97), rgba(23,17,11,.88)); border-bottom: 1px solid rgba(201,162,90,.35); backdrop-filter: blur(6px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
.back { display: inline-flex; align-items: center; gap: 8px; flex: none; padding: 9px 14px 9px 10px; border: 1px solid rgba(201,162,90,.7); border-radius: 4px; background: var(--leather); font: 700 15px/1 var(--font-display); letter-spacing: .06em; color: var(--parchment); cursor: pointer; text-decoration: none; transition: border-color .3s, color .3s; }
.back svg { width: 16px; height: 16px; stroke: var(--gold); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .35s var(--ease); }
.back:hover { border-color: var(--gold-hi); color: var(--gold-hi); } .back:hover svg { transform: translateX(-3px); }
.bar h1 { margin: 0; min-width: 0; font: 700 22px/1.1 var(--font-display); letter-spacing: .04em; color: var(--gold-hi); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 22px; margin-top: 20px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 82px); display: flex; flex-direction: column; gap: 6px; }
.rail button { padding: 10px 14px; border: 1px solid rgba(201,162,90,.4); border-radius: 4px; background: rgba(42,29,18,.85); color: var(--parchment-deep); font: 700 15.5px/1.2 var(--font-display); letter-spacing: .03em; text-align: left; cursor: pointer; transition: border-color .25s, color .25s, background .25s, transform .3s var(--ease); }
.rail button:hover { border-color: var(--gold); color: var(--parchment); transform: translateX(3px); }
.rail button[aria-selected="true"] { color: #2a1a0c; border-color: var(--gold-hi); background: linear-gradient(180deg, #f1d79a, #c99a4e); }
.sheet { min-width: 0; padding: 30px clamp(18px, 4vw, 44px) 36px; color: var(--text-ink); background-color: var(--parchment); background-image: var(--grain), radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.4), transparent 55%), linear-gradient(180deg, var(--parchment), var(--parchment-deep));
  border: 1px solid var(--gold); border-radius: 5px; box-shadow: inset 0 0 0 5px var(--parchment), inset 0 0 0 6px rgba(111,85,50,.4), 0 16px 44px var(--shadow); animation: rise .5s var(--ease) both; }
.sheet > * { max-width: 70ch; }
.sheet > .wide { max-width: none; }
.sheet h3 { display: flex; align-items: center; gap: 10px; margin: 30px 0 10px; font: 700 16px/1.15 var(--font-display); letter-spacing: .13em; text-transform: uppercase; color: var(--text-ink); }
.sheet h3::before { content: ""; flex: none; width: 7px; height: 7px; background: var(--blood); transform: rotate(45deg); }
.sheet h3::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(111,85,50,.6), transparent); }
.sheet p { margin: 0 0 11px; line-height: 1.55; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border: 1px solid var(--gold); border-radius: 3px; background: linear-gradient(180deg, #f1d79a, #c99a4e); color: #2a1a0c; font: 700 16px/1 var(--font-display); letter-spacing: .05em; cursor: pointer; text-decoration: none; transition: filter .25s, transform .3s var(--ease); }
.btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
.btn.ghost { background: rgba(255,248,228,.45); border-color: rgba(111,85,50,.55); }
.btn.dark { background: var(--leather); color: var(--gold-hi); }
#zoom { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px; background: rgba(10,6,2,.88); opacity: 0; visibility: hidden; cursor: zoom-out; transition: opacity .3s, visibility 0s .3s; }
#zoom.on { opacity: 1; visibility: visible; transition: opacity .3s, visibility 0s; }
#zoom img { max-width: 100%; max-height: calc(100vh - 40px); max-height: calc(100dvh - 40px); width: auto; height: auto; cursor: zoom-in; border-radius: 4px; box-shadow: 0 20px 60px rgba(0,0,0,.6); transform: scale(.97); transition: transform .4s var(--ease); }
#zoom.on img { transform: none; }
#zoom.big { display: block; overflow: auto; padding: 0; cursor: grab; overscroll-behavior: contain; }
#zoom.big.drag { cursor: grabbing; }
#zoom.big img { display: block; max-width: none; max-height: none; margin: 40px auto; cursor: zoom-out; transition: none; }
.zx { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); right: 14px; z-index: 2; width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--gold); border-radius: 50%; background: var(--leather); cursor: pointer; }
.zx svg { width: 16px; height: 16px; stroke: var(--gold-hi); stroke-width: 2; fill: none; stroke-linecap: round; }
.zhint { position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 6px 12px; border-radius: 4px; background: rgba(23,17,11,.85); color: var(--parchment-deep); font: italic 500 15px/1.3 var(--font-body); pointer-events: none; white-space: nowrap; }
.f2 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; }
.fld label { display: block; margin-bottom: 4px; font: 700 13px/1.3 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); }
.fld small { display: block; margin-top: 3px; font: italic 500 14.5px/1.35 var(--font-body); color: var(--text-muted); }
input[type=text], input[type=url], textarea, select { width: 100%; padding: 9px 11px; border: 1px solid rgba(111,85,50,.5); border-radius: 3px; background: rgba(255,252,240,.7); color: var(--text-ink); font: 500 17px/1.4 var(--font-body); }
textarea { resize: vertical; min-height: 86px; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--gold); outline-offset: 0; border-color: var(--gold); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); z-index: 40; transform: translate(-50%, 20px); padding: 11px 16px; border-radius: 4px; background: var(--leather); border: 1px solid var(--gold); color: var(--parchment); font: 600 16px var(--font-body); opacity: 0; transition: opacity .3s, transform .4s var(--ease); pointer-events: none; max-width: calc(100% - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; gap: 12px; }
  .rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); z-index: 4; flex-direction: row; overflow-x: auto; gap: 6px; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 8px max(16px, env(safe-area-inset-left, 0px)); background: rgba(23,17,11,.92); scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .rail button { flex: none; white-space: nowrap; padding: 8px 12px; font-size: 14.5px; }
  .rail button:hover { transform: none; }
  .bar h1 { font-size: 19px; }
}
@media (max-width: 560px) { body { font-size: 17px; } .sheet { padding: 22px 16px 26px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.bar .sig { width: 30px; height: 30px; flex: none; stroke: var(--gold); fill: none; stroke-width: 1.4; }
.bar small { margin-left: auto; font: italic 500 15px/1.2 var(--font-body); color: var(--parchment-deep); white-space: nowrap; }
.rail .soon { padding: 10px 14px; border: 1px dashed rgba(201,162,90,.3); border-radius: 4px; color: rgba(214,189,140,.55); font: italic 500 15px/1.3 var(--font-body); }
@media (max-width: 860px) { .rail .soon, .bar small { display: none; } }
/* ---------- Письма ---------- */
.sheet:has(.lw) { padding-top: 24px; }
.lw { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 26px; align-items: start; }
.lw-ctl h3 { margin: 22px 0 10px; }
.lw-lead { font-style: italic; color: var(--text-muted); }
.lw-ctl .fld { margin-bottom: 12px; }
.lw-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; margin-top: 12px; }
.lw-seg { display: flex; flex-wrap: wrap; gap: 4px; }
.lw-seg button { flex: 1 1 auto; padding: 8px 10px; border: 1px solid rgba(111,85,50,.5); border-radius: 3px; background: rgba(255,252,240,.6); color: var(--text-ink); font: 700 15px/1 var(--font-display); letter-spacing: .03em; cursor: pointer; transition: background .2s, color .2s; }
.lw-seg button[aria-pressed="true"] { background: var(--leather); border-color: var(--leather); color: var(--gold-hi); }
.lw-wax { display: flex; flex-wrap: wrap; gap: 8px; }
.lw-wax button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; background: radial-gradient(circle at 35% 30%, var(--h), var(--w) 55%); box-shadow: 0 2px 4px rgba(0,0,0,.3); cursor: pointer; }
.lw-wax button[aria-pressed="true"] { border-color: var(--text-ink); outline: 2px solid var(--gold); outline-offset: 1px; }
.lw-chks { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-bottom: 12px; }
.lw-chk { display: flex; align-items: center; gap: 7px; font-size: 16px; cursor: pointer; }
.lw-chk input { width: 17px; height: 17px; accent-color: var(--blood); }
.lw-prev { position: sticky; top: 14px; }
.lw-cv { padding: 0; border-radius: 4px; background: repeating-conic-gradient(rgba(111,85,50,.08) 0 25%, transparent 0 50%) 0 0 / 18px 18px; }
.lw-cv canvas { display: block; width: 100%; height: auto; }
.lw-prev .actions { margin-top: 12px; }
.lw-hint { display: block; margin-top: 8px; font: italic 500 14.5px/1.35 var(--font-body); color: var(--text-muted); }
@media (max-width: 860px) { .lw { grid-template-columns: 1fr; } .lw-prev { position: static; order: -1; } }

.lw-full { grid-column: 1 / -1; }
.lw-font { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 6px; }
.lw-font label.btn { padding: 8px 14px; font-size: 15px; }
.lw-font small { flex: 1 1 200px; font: italic 500 14.5px/1.35 var(--font-body); color: var(--text-muted); }
/* ---------- Книга и стопка ---------- */
.btn:disabled { opacity: .45; cursor: default; transform: none; filter: none; }
.ws-holder { padding: 16px 10px 12px; border-radius: 4px; background: radial-gradient(ellipse at 50% 40%, #3d2a18, #160f09 80%); color: var(--parchment); }
.ws-nav { display: flex; align-items: center; justify-content: center; gap: 14px; margin-top: 12px; }
.ws-nav button { width: 42px; height: 42px; border-radius: 50%; border: 1px solid var(--gold); background: var(--leather); color: var(--gold-hi); font: 400 26px/1 var(--font-body); cursor: pointer; display: grid; place-items: center; padding-bottom: 4px; }
.ws-nav button:disabled { opacity: .35; cursor: default; }
.ws-count { min-width: 150px; text-align: center; font: 700 16px/1.2 var(--font-display); letter-spacing: .05em; }
.ws-link { margin-top: 10px; } .ws-link small { display: block; margin-top: 4px; font: italic 500 14.5px/1.35 var(--font-body); color: var(--text-muted); }
.bk-stage { user-select: none; -webkit-user-select: none; }
.bk-box { position: relative; width: 100%; cursor: pointer; touch-action: pan-y; }
.bk-scale { position: absolute; top: 0; transform-origin: 0 0; }
.bk { position: relative; width: 100%; height: 100%; perspective: 2600px; transition: transform .7s cubic-bezier(.35,.6,.2,1); }
.bk.noanim, .bk.noanim * { transition: none !important; }
.bk.spread .leaf { position: absolute; top: 0; left: 440px; width: 440px; height: 620px; transform-origin: 0 50%; transform-style: preserve-3d; transition: transform .85s cubic-bezier(.35,.6,.2,1); }
.bk.spread .leaf.flipped { transform: rotateY(-180deg); }
.leaf > .face { position: absolute; inset: 0; overflow: hidden; backface-visibility: hidden; -webkit-backface-visibility: hidden; box-shadow: 0 12px 30px rgba(0,0,0,.45); }
.leaf > .face.backf { transform: rotateY(180deg); }
.leaf > .face::after, .sface > .face::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: linear-gradient(90deg, rgba(0,0,0,.3), rgba(0,0,0,.07) 5%, transparent 13%); }
.leaf > .face.backf::after { background: linear-gradient(270deg, rgba(0,0,0,.3), rgba(0,0,0,.07) 5%, transparent 13%); }
.bk.single .sface { position: absolute; inset: 0; transform-origin: 0 50%; transition: transform .8s cubic-bezier(.35,.6,.2,1), opacity .45s .35s; }
.bk.single .sface > .face { position: absolute; inset: 0; overflow: hidden; box-shadow: 0 12px 30px rgba(0,0,0,.45); }
.bk.single .sface.gone { transform: perspective(2200px) rotateY(-100deg); opacity: 0; pointer-events: none; }
.face.cover { background-color: var(--lea); background-image: var(--grain), radial-gradient(ellipse at 35% 25%, rgba(255,235,200,.13), transparent 60%), radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.5)); }
.cv-frame { position: absolute; inset: 24px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 40px 34px; text-align: center; border: 2px solid #c9a25a; outline: 1px solid rgba(201,162,90,.55); outline-offset: -9px; }
.cv-c { position: absolute; width: 58px; height: 58px; background: no-repeat center / contain; }
.cv-c.tl { top: 4px; left: 4px; } .cv-c.tr { top: 4px; right: 4px; transform: scaleX(-1); } .cv-c.bl { bottom: 4px; left: 4px; transform: scaleY(-1); } .cv-c.br { bottom: 4px; right: 4px; transform: scale(-1); }
.cv-em { width: 86px; height: 86px; stroke: #d9b56a; fill: none; stroke-width: 1.2; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 1px 0 rgba(0,0,0,.6)); }
.face.cover h2 { margin: 0; font: 400 40px/1.15 "Ruslan Display", "Cormorant SC", Georgia, serif; color: #ebc978; text-shadow: 0 1px 0 rgba(0,0,0,.7), 0 0 14px rgba(240,200,110,.22); text-wrap: balance; }
.face.cover p { margin: 0; font: italic 500 21px/1.3 var(--font-body); color: #d9b56a; }
.face.backc .cv-em { width: 54px; height: 54px; opacity: .7; }
.face.endp { background-color: var(--lea); background-image: radial-gradient(ellipse at 30% 20%, rgba(255,240,210,.14), transparent 45%), repeating-radial-gradient(circle at 18% 28%, rgba(240,214,150,.10) 0 5px, transparent 5px 13px), repeating-radial-gradient(circle at 74% 76%, rgba(0,0,0,.18) 0 7px, transparent 7px 17px), repeating-radial-gradient(circle at 60% 15%, rgba(240,214,150,.06) 0 3px, transparent 3px 9px); }
.face.pg { color: var(--ink); background: var(--grain), radial-gradient(ellipse at center, transparent 55%, var(--pv)), linear-gradient(180deg, var(--pt), var(--pb)); }
.face.pg.burnt { box-shadow: inset 0 0 46px rgba(60,28,8,.6), 0 12px 30px rgba(0,0,0,.45); }
.pg-text { position: absolute; inset: 46px 44px 60px; overflow: hidden; }
.pg-text p { margin: 0 0 .4em; text-indent: 1.3em; text-align: left; }
.pg-text p.dc { text-indent: 0; }
.pg-h { margin: 0; text-align: center; font: inherit; font-size: 1.32em; line-height: 1.2; }
.pg-vine { display: block; width: 72%; height: 16px; margin: 4px auto 12px; background: no-repeat center / contain; opacity: .85; }
.pg-dc { float: left; width: 2.7em; height: 2.7em; margin: .2em .45em 0 0; display: grid; place-items: center; padding-top: .1em; background: no-repeat center / contain; font: normal 400 1.75em/1 "Ruslan Display", Georgia, serif; color: #7a2414; text-shadow: 1px 1px 0 rgba(255,240,200,.7); }
.pg-no { position: absolute; left: 0; right: 0; bottom: 22px; text-align: center; font: italic 500 16px/1 var(--font-body); color: var(--ink); opacity: .7; }
.bk-pages { margin: 6px 0 12px; }
.bk-page { margin-bottom: 10px; padding: 10px; border: 1px solid rgba(111,85,50,.35); border-radius: 4px; background: rgba(255,252,240,.35); }
.bk-page header { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.bk-page header b { font: 700 15px/1 var(--font-display); letter-spacing: .06em; }
.bk-warn { font: italic 600 14px/1.2 var(--font-body); color: var(--blood); }
.bk-ops { margin-left: auto; display: flex; gap: 4px; }
.bk-ops button { width: 30px; height: 30px; border: 1px solid rgba(111,85,50,.45); border-radius: 3px; background: rgba(255,252,240,.6); color: var(--text-ink); cursor: pointer; font-size: 16px; }
.bk-ops button:disabled { opacity: .35; cursor: default; }
.bk-page input { margin-bottom: 6px; }
.st-bar { margin-bottom: 18px; padding-bottom: 14px; border-bottom: 1px dashed rgba(111,85,50,.45); }
.st-bar .fld { margin-bottom: 10px; max-width: 520px; }
.st-tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.st-tabs button { padding: 8px 12px; border: 1px solid rgba(111,85,50,.5); border-radius: 3px; background: rgba(255,252,240,.6); color: var(--text-ink); font: 700 15px/1 var(--font-display); cursor: pointer; }
.st-tabs button[aria-pressed="true"] { background: var(--leather); border-color: var(--leather); color: var(--gold-hi); }
.st-tabs .st-add { border-style: dashed; background: transparent; }
.st-ops { display: flex; flex-wrap: wrap; gap: 6px; }
.st-ops .btn, .st-extra .btn { padding: 8px 12px; font-size: 14.5px; }
.st-extra { margin-top: 14px; padding-top: 12px; border-top: 1px dashed rgba(111,85,50,.45); }
.st-stage { user-select: none; -webkit-user-select: none; }
.st-pile { position: relative; width: 100%; height: 520px; touch-action: pan-y; }
.st-wait { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; font: italic 500 18px var(--font-body); color: var(--parchment-deep); }
.st-sheet { position: absolute; left: 50%; top: 50%; max-width: 94%; max-height: 96%; transform: translate(-50%, -50%) translate(var(--x), var(--y)) rotate(var(--r)); filter: drop-shadow(0 8px 16px rgba(0,0,0,.5)); transition: transform .38s cubic-bezier(.35,.6,.2,1), opacity .38s; cursor: pointer; }
.st-sheet.under { cursor: default; }

    urls.push(await new Promise(r => cv.toBlob(b => r(URL.createObjectURL(b)), "image/png")));

  pile.innerHTML = urls.map((u, i) => `<img class="st-sheet" src="${u}" alt="Лист ${i + 1}" draggable="false" style="--r:${((lwHash(i, 5) - .5) * 6).toFixed(2)}deg;--x:${((lwHash(i, 6) - .5) * 18).toFixed(1)}px;--y:${((lwHash(i, 7) - .5) * 12).toFixed(1)}px">`).join("");
  const imgs = [...pile.querySelectorAll(".st-sheet")], n = imgs.length;
  let order = imgs.map((_, i) => i), pos = 0, busy = false;
  const fit = () => { const h = host.closest("#viewer") ? innerHeight - 150 : 520; pile.style.height = Math.max(260, h) + "px"; };
  const lay = () => { order.forEach((idx, depth) => { const im = imgs[idx]; im.style.zIndex = n - depth; im.classList.toggle("under", depth > 0); }); host.querySelector(".ws-count").textContent = `Лист ${pos + 1} из ${n}`; };
  const next = () => {
    if (busy || n < 2) return; busy = true;
    const top = imgs[order[0]]; top.classList.add("out");
    setTimeout(() => { order.push(order.shift()); pos = (pos + 1) % n; lay(); top.classList.remove("out"); busy = false; }, 380);
  };
  const prev = () => {
    if (busy || n < 2) return; busy = true;
    const last = order.pop(), im = imgs[last]; order.unshift(last); pos = (pos - 1 + n) % n;
    im.classList.add("out", "noanim"); lay(); void im.offsetWidth; im.classList.remove("noanim");
    requestAnimationFrame(() => { im.classList.remove("out"); setTimeout(() => busy = false, 380); });
  };
  host.querySelector(".ws-prev").onclick = prev; host.querySelector(".ws-next").onclick = next;
  if (n === 1) host.querySelector(".ws-nav").innerHTML = `<span class="ws-count">Нажмите на письмо, чтобы приблизить</span>`;
  pile.addEventListener("click", e => {
    if (pile._swiped && Date.now() - pile._swiped < 300) return;
    if (!e.target.classList.contains("st-sheet")) return;
    if (n === 1) { const z = $("#zoom"); z.querySelector("img").src = e.target.src; z.classList.add("on"); return; }
    next();
  });
  wsSwipe(pile, next, prev);
  fit(); lay(); addEventListener("resize", fit);
  if (n === 1) host.querySelector(".ws-count").textContent = "Нажмите на письмо, чтобы приблизить";
  wsActive = { next, prev };
}

/* =====================================================================

   ===================================================================== */
const GH_KEY = "velaris-gh-v1";
const ghDefaults = () => {
  const h = location.hostname, m = h.match(/^([^.]+)\.github\.io$/i), seg = location.pathname.split("/").filter(Boolean);
  return { owner: m ? m[1] : "sultanstybayev-byte", repo: m && seg.length > 1 ? seg[0] : "vmap" };
};
const ghCfg = () => { let c = {}; try { c = JSON.parse(localStorage.getItem(GH_KEY)) || {}; } catch (_) {} return Object.assign(ghDefaults(), c); };
const ghSaveCfg = c => { try { localStorage.setItem(GH_KEY, JSON.stringify(c)); } catch (_) {} };
const siteBase = () => location.href.split("#")[0].split("?")[0].replace(/[^/]*$/, "");

const PUB = {

};
function pubHTML(tool) {
  const d = PUB[tool](), no = d.holder.pubNo, c = ghCfg();
  return `<div class="pub" data-pub="${tool}">
    <h4 class="pub-h">Для игроков</h4>
    <div class="actions">${no
      ? `<button type="button" class="btn" data-pubgo="update">Обновить документ №${no}</button><button type="button" class="btn ghost" data-pubgo="new">Сохранить как новый</button><button type="button" class="btn ghost" data-pubshow="${no}">Ссылка №${no}</button>`

      <ol class="pub-steps">
        <li>На GitHub: аватар справа вверху → <b>Settings</b> → внизу слева <b>Developer settings</b> → <b>Personal access tokens</b> → <b>Fine-grained tokens</b> → <b>Generate new token</b>.</li>
        <li>Название любое, срок — самый долгий. <b>Repository access</b>: «Only select repositories» → <b>${esc(c.repo)}</b>.</li>
        <li><b>Permissions</b> → Repository permissions → <b>Contents</b>: «Read and write». Нажмите <b>Generate token</b> и скопируйте ключ.</li>

const pubBox = el => el.closest(".pub");
function pubSay(box, url, msg) {
  const o = box.querySelector(".pub-out"); o.hidden = false;
  if (url != null) o.querySelector("input").value = url;
  o.querySelector(".pub-msg").textContent = msg || "";
}
async function ghApi(c, path, opt = {}) {
  const r = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${path}`, Object.assign({}, opt, {
    headers: Object.assign({ Accept: "application/vnd.github+json" }, c.token ? { Authorization: "Bearer " + c.token } : {}, opt.body ? { "Content-Type": "application/json" } : {})
  }));
  return r;
}
async function ghNextNo(c) {
  const r = await ghApi(c, "docs", { cache: "no-store" });
  if (r.status === 404) return 1;
  if (!r.ok) throw new Error(r.status === 401 ? "Ключ GitHub не подходит или истёк." : "GitHub ответил ошибкой " + r.status + ".");
  const list = await r.json(); let max = 0;
  (Array.isArray(list) ? list : []).forEach(f => { const m = /^(\d+)\.json$/.exec(f.name); if (m) max = Math.max(max, +m[1]); });
  return max + 1;
}
const utf8b64 = str => { const u = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); };
async function publish(tool, mode, btn) {
  const box = pubBox(btn), d = PUB[tool](), c = ghCfg();
  const doc = { v: 1, kind: d.kind, title: d.title, data: JSON.parse(JSON.stringify(d.data, (k, v) => k === "pubNo" ? undefined : v)) };
  const json = JSON.stringify(doc);
  const userFont = JSON.stringify(doc.data).match(/"(hand|sigHand)":"u-/);
  btn.disabled = true; const label = btn.textContent; btn.textContent = "Публикую…";
  try {
    let no = mode === "update" && d.holder.pubNo ? d.holder.pubNo : await ghNextNo(c);
    if (!c.token) {
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([json], { type: "application/json" })); a.download = no + ".json"; document.body.appendChild(a); a.click(); a.remove();
      d.holder.pubNo = no; pubSave(tool);
      pubSay(box, shortUrl(no), `Скачан файл ${no}.json. Загрузите его на GitHub в папку docs (Add file → Upload files, перетащите файл, а в начале имени допишите «docs/»). Через минуту ссылка заработает.`);
    } else {
      let sha;
      const g = await ghApi(c, `docs/${no}.json`, { cache: "no-store" });
      if (g.ok) sha = (await g.json()).sha; else if (g.status === 401) throw new Error("Ключ GitHub не подходит или истёк.");
      const r = await ghApi(c, `docs/${no}.json`, { method: "PUT", body: JSON.stringify({ message: `Документ №${no}: ${d.title}`, content: utf8b64(json), sha }) });
      if (!r.ok) throw new Error(r.status === 401 ? "Ключ GitHub не подходит или истёк." : r.status === 403 || r.status === 404 ? "У ключа нет права записи: в Permissions → Contents нужно «Read and write», и в доступе должен быть этот репозиторий." : "GitHub ответил ошибкой " + r.status + ".");
      d.holder.pubNo = no; pubSave(tool);
      pubSay(box, shortUrl(no), (mode === "update" ? `Документ №${no} обновлён.` : `Опубликовано как №${no}.`) + " Ссылка заработает примерно через минуту — сайту нужно обновиться." + (userFont ? " Свой шрифт игроки не увидят — у них будет запасной." : ""));
    }
    try { await navigator.clipboard.writeText(shortUrl(no)); toast("Короткая ссылка скопирована: " + shortUrl(no).replace(/^https?:\/\//, "")); } catch (_) {}
    const keep = box.querySelector(".pub-out").innerHTML, open = box.querySelector(".pub-set").open;
    const fresh = document.createElement("div"); fresh.innerHTML = pubHTML(tool); const nb = fresh.firstElementChild;
    nb.querySelector(".pub-out").innerHTML = keep; nb.querySelector(".pub-out").hidden = false; nb.querySelector(".pub-out input").value = shortUrl(no); nb.querySelector(".pub-set").open = open;
    box.replaceWith(nb);
  } catch (err) {
    btn.disabled = false; btn.textContent = label;
    pubSay(box, null, "Не получилось: " + (err.message || "нет связи с GitHub") + "");
    if (!c.token) pubSay(box, null, "Не получилось узнать следующий номер документа. Проверьте интернет или настройте публикацию с ключом.");
  }
}
function pubSave(tool) { if (tool === "kniga") bkSave(); else if (tool === "stopka") stSave(); else lwSave(); }
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-pubgo],[data-pubreset],[data-pubcopy],[data-publong],[data-ghsave],[data-ghforget],[data-pubshow]");
  if (!b) return;

  if (b.dataset.pubshow) { pubSay(box, shortUrl(b.dataset.pubshow), "Ссылка на уже опубликованную версию. Если вы что-то поменяли — нажмите «Обновить»."); return; }
  if (b.hasAttribute("data-pubcopy")) { const i = box.querySelector(".pub-out input"); navigator.clipboard.writeText(i.value).then(() => toast("Скопировано."), () => { i.focus(); i.select(); toast("Нажмите Ctrl+C."); }); return; }

    return;
  }
  if (b.hasAttribute("data-ghsave") || b.hasAttribute("data-ghforget")) {
    const c = ghCfg(); box.querySelectorAll("[data-gh]").forEach(i => c[i.dataset.gh] = i.value.trim());
    if (b.hasAttribute("data-ghforget")) delete c.token;
    ghSaveCfg(c); toast(b.hasAttribute("data-ghforget") ? "Ключ удалён из этого браузера." : "Сохранено.");
    const fresh = document.createElement("div"); fresh.innerHTML = pubHTML(tool); box.replaceWith(fresh.firstElementChild);
  }
});

document.addEventListener("click", e => {

        z.scrollLeft = img.offsetLeft + img.offsetWidth * fx - z.clientWidth / 2; z.scrollTop = img.offsetTop + img.offsetHeight * fy - z.clientHeight / 2;
      } else { z.classList.remove("big"); z.querySelector(".zhint").textContent = "Нажмите на картинку, чтобы приблизить"; }
      return;

/* перетаскивание мышью в режиме приближения (пальцем листается само) */
(() => {
  const z = $("#zoom"); let st = null;
  z.addEventListener("pointerdown", e => { if (!z.classList.contains("big") || e.pointerType !== "mouse" || e.target.closest(".zx")) return; st = { x: e.clientX, y: e.clientY, l: z.scrollLeft, t: z.scrollTop, m: false }; e.preventDefault(); });
  addEventListener("pointermove", e => { if (!st) return; const dx = e.clientX - st.x, dy = e.clientY - st.y; if (Math.abs(dx) + Math.abs(dy) > 4) { st.m = true; z.classList.add("drag"); } z.scrollLeft = st.l - dx; z.scrollTop = st.t - dy; });
  addEventListener("pointerup", () => { if (!st) return; if (st.m) z._dragged = true; st = null; z.classList.remove("drag"); });
})();
