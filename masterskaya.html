/* Мастерская: отдельная страница с инструментами мастера (письма и всё, что добавится потом). Тот же вид, что у главного меню. */
:root {
  --ink: #17110b; --leather: #2a1d12; --leather-hi: #3a2817;
  --gold: #c9a25a; --gold-hi: #f0d696;
  --parchment: #ecdcb6; --parchment-deep: #d6bd8c;
  --text-ink: #34230f; --text-muted: #6f5532; --blood: #8e2f1c;
  --shadow: rgba(10, 6, 2, .55);
  --font-display: "Cormorant SC", "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-body: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(.22, .8, .24, 1);
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .24  0 0 0 0 .1  0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  color-scheme: dark;
}
* , *::before, *::after { box-sizing: border-box; }
html { background: var(--ink); }
body { min-height: 100%; background: var(--ink); color: var(--parchment); font: 500 18px/1.5 var(--font-body); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
.bg { position: fixed; inset: 0; z-index: 0; background: url("map-mobile.jpg?v=8") center 40% / cover no-repeat; filter: saturate(.8) brightness(.42) blur(2px); transform: scale(1.04); }
.bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, rgba(23,17,11,.25), rgba(23,17,11,.88) 75%); }
main { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding-block: 24px 60px; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 12px; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 12px max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, rgba(23,17,11,.97), rgba(23,17,11,.88)); border-bottom: 1px solid rgba(201,162,90,.35); backdrop-filter: blur(6px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
.back { display: inline-flex; align-items: center; gap: 8px; flex: none; padding: 9px 14px 9px 10px; border: 1px solid rgba(201,162,90,.7); border-radius: 4px; background: var(--leather); font: 700 15px/1 var(--font-display); letter-spacing: .06em; color: var(--parchment); cursor: pointer; text-decoration: none; transition: border-color .3s, color .3s; }
.back svg { width: 16px; height: 16px; stroke: var(--gold); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .35s var(--ease); }
.back:hover { border-color: var(--gold-hi); color: var(--gold-hi); } .back:hover svg { transform: translateX(-3px); }
.bar h1 { margin: 0; min-width: 0; font: 700 22px/1.1 var(--font-display); letter-spacing: .04em; color: var(--gold-hi); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 22px; margin-top: 20px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 82px); display: flex; flex-direction: column; gap: 6px; }
.rail button { padding: 10px 14px; border: 1px solid rgba(201,162,90,.4); border-radius: 4px; background: rgba(42,29,18,.85); color: var(--parchment-deep); font: 700 15.5px/1.2 var(--font-display); letter-spacing: .03em; text-align: left; cursor: pointer; transition: border-color .25s, color .25s, background .25s, transform .3s var(--ease); }
.rail button:hover { border-color: var(--gold); color: var(--parchment); transform: translateX(3px); }
.rail button[aria-selected="true"] { color: #2a1a0c; border-color: var(--gold-hi); background: linear-gradient(180deg, #f1d79a, #c99a4e); }
.sheet { min-width: 0; padding: 30px clamp(18px, 4vw, 44px) 36px; color: var(--text-ink); background-color: var(--parchment); background-image: var(--grain), radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.4), transparent 55%), linear-gradient(180deg, var(--parchment), var(--parchment-deep));
  border: 1px solid var(--gold); border-radius: 5px; box-shadow: inset 0 0 0 5px var(--parchment), inset 0 0 0 6px rgba(111,85,50,.4), 0 16px 44px var(--shadow); animation: rise .5s var(--ease) both; }
.sheet > * { max-width: 70ch; }
.sheet > .wide { max-width: none; }
.sheet h3 { display: flex; align-items: center; gap: 10px; margin: 30px 0 10px; font: 700 16px/1.15 var(--font-display); letter-spacing: .13em; text-transform: uppercase; color: var(--text-ink); }
.sheet h3::before { content: ""; flex: none; width: 7px; height: 7px; background: var(--blood); transform: rotate(45deg); }
.sheet h3::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(111,85,50,.6), transparent); }
.sheet p { margin: 0 0 11px; line-height: 1.55; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border: 1px solid var(--gold); border-radius: 3px; background: linear-gradient(180deg, #f1d79a, #c99a4e); color: #2a1a0c; font: 700 16px/1 var(--font-display); letter-spacing: .05em; cursor: pointer; text-decoration: none; transition: filter .25s, transform .3s var(--ease); }
.btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
.btn.ghost { background: rgba(255,248,228,.45); border-color: rgba(111,85,50,.55); }
.btn.dark { background: var(--leather); color: var(--gold-hi); }
#zoom { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px; background: rgba(10,6,2,.88); opacity: 0; visibility: hidden; cursor: zoom-out; transition: opacity .3s, visibility 0s .3s; }
#zoom.on { opacity: 1; visibility: visible; transition: opacity .3s, visibility 0s; }
#zoom img { max-width: 100%; max-height: calc(100vh - 40px); max-height: calc(100dvh - 40px); width: auto; height: auto; cursor: zoom-in; border-radius: 4px; box-shadow: 0 20px 60px rgba(0,0,0,.6); transform: scale(.97); transition: transform .4s var(--ease); }
#zoom.on img { transform: none; }
#zoom.big { display: block; overflow: auto; padding: 0; cursor: grab; overscroll-behavior: contain; }
#zoom.big.drag { cursor: grabbing; }
#zoom.big img { display: block; max-width: none; max-height: none; margin: 40px auto; cursor: zoom-out; transition: none; }
.zx { position: fixed; top: max(12px, env(safe-area-inset-top, 0px)); right: 14px; z-index: 2; width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--gold); border-radius: 50%; background: var(--leather); cursor: pointer; }
.zx svg { width: 16px; height: 16px; stroke: var(--gold-hi); stroke-width: 2; fill: none; stroke-linecap: round; }
.zhint { position: fixed; left: 50%; bottom: max(12px, env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); padding: 6px 12px; border-radius: 4px; background: rgba(23,17,11,.85); color: var(--parchment-deep); font: italic 500 15px/1.3 var(--font-body); pointer-events: none; white-space: nowrap; }
.f2 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; }
.fld label { display: block; margin-bottom: 4px; font: 700 13px/1.3 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); }
.fld small { display: block; margin-top: 3px; font: italic 500 14.5px/1.35 var(--font-body); color: var(--text-muted); }
input[type=text], input[type=url], textarea, select { width: 100%; padding: 9px 11px; border: 1px solid rgba(111,85,50,.5); border-radius: 3px; background: rgba(255,252,240,.7); color: var(--text-ink); font: 500 17px/1.4 var(--font-body); }
textarea { resize: vertical; min-height: 86px; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--gold); outline-offset: 0; border-color: var(--gold); }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); z-index: 40; transform: translate(-50%, 20px); padding: 11px 16px; border-radius: 4px; background: var(--leather); border: 1px solid var(--gold); color: var(--parchment); font: 600 16px var(--font-body); opacity: 0; transition: opacity .3s, transform .4s var(--ease); pointer-events: none; max-width: calc(100% - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; gap: 12px; }
  .rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); z-index: 4; flex-direction: row; overflow-x: auto; gap: 6px; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 8px max(16px, env(safe-area-inset-left, 0px)); background: rgba(23,17,11,.92); scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .rail button { flex: none; white-space: nowrap; padding: 8px 12px; font-size: 14.5px; }
  .rail button:hover { transform: none; }
  .bar h1 { font-size: 19px; }
}
@media (max-width: 560px) { body { font-size: 17px; } .sheet { padding: 22px 16px 26px; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
.bar .sig { width: 30px; height: 30px; flex: none; stroke: var(--gold); fill: none; stroke-width: 1.4; }
.bar small { margin-left: auto; font: italic 500 15px/1.2 var(--font-body); color: var(--parchment-deep); white-space: nowrap; }
.rail .soon { padding: 10px 14px; border: 1px dashed rgba(201,162,90,.3); border-radius: 4px; color: rgba(214,189,140,.55); font: italic 500 15px/1.3 var(--font-body); }
@media (max-width: 860px) { .rail .soon, .bar small { display: none; } }
/* ---------- Письма ---------- */
.sheet:has(.lw) { padding-top: 24px; }
.lw { display: grid; grid-template-columns: minmax(280px, 360px) minmax(0, 1fr); gap: 26px; align-items: start; }
.lw-ctl h3 { margin: 22px 0 10px; }
.lw-lead { font-style: italic; color: var(--text-muted); }

.lw-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; margin-top: 12px; }
.lw-seg { display: flex; flex-wrap: wrap; gap: 4px; }
.lw-seg button { flex: 1 1 auto; padding: 8px 10px; border: 1px solid rgba(111,85,50,.5); border-radius: 3px; background: rgba(255,252,240,.6); color: var(--text-ink); font: 700 15px/1 var(--font-display); letter-spacing: .03em; cursor: pointer; transition: background .2s, color .2s; }
.lw-seg button[aria-pressed="true"] { background: var(--leather); border-color: var(--leather); color: var(--gold-hi); }
.lw-wax { display: flex; flex-wrap: wrap; gap: 8px; }
.lw-wax button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid transparent; background: radial-gradient(circle at 35% 30%, var(--h), var(--w) 55%); box-shadow: 0 2px 4px rgba(0,0,0,.3); cursor: pointer; }
.lw-wax button[aria-pressed="true"] { border-color: var(--text-ink); outline: 2px solid var(--gold); outline-offset: 1px; }

.lw-prev { position: sticky; top: 14px; }
.lw-cv { padding: 0; border-radius: 4px; background: repeating-conic-gradient(rgba(111,85,50,.08) 0 25%, transparent 0 50%) 0 0 / 18px 18px; }

@media (max-width: 860px) { .lw { grid-template-columns: 1fr; } .lw-prev { position: static; order: -1; } }

.lw-full { grid-column: 1 / -1; }

.lw-font small { flex: 1 1 200px; font: italic 500 14.5px/1.35 var(--font-body); color: var(--text-muted); }
/* ---------- Книга и стопка ---------- */

.ws-link { margin-top: 10px; } .ws-link small { display: block; margin-top: 4px; font: italic 500 14.5px/1.35 var(--font-body); color: var(--text-muted); }
.bk-stage { user-select: none; -webkit-user-select: none; }
.bk-box { position: relative; width: 100%; cursor: pointer; touch-action: pan-y; }
.bk-scale { position: absolute; top: 0; transform-origin: 0 0; }
.bk { position: relative; width: 100%; height: 100%; perspective: 2600px; transition: transform .7s cubic-bezier(.35,.6,.2,1); }
.bk.noanim, .bk.noanim * { transition: none !important; }

.face.cover { background-color: var(--lea); background-image: var(--grain), radial-gradient(ellipse at 35% 25%, rgba(255,235,200,.13), transparent 60%), radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.5)); }
.cv-art { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; filter: drop-shadow(0 1px 0 rgba(0,0,0,.55)); }
.cv-frame { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; padding: 70px 64px; text-align: center; }

.cv-gold { position: absolute; inset: 0; -webkit-mask-size: 100% 100%; mask-size: 100% 100%; }

const $ = s => document.querySelector(s);
const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const toast = m => { const t = $("#toast"); t.textContent = m; t.classList.add("on"); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove("on"), 3200); };

async function dbUpdate(mutate, message) {

      no = await dbUpdate(async docs => {
        let max = docs.reduce((m, x) => Math.max(m, x.no), 0);
        const r = await ghApi(c, "docs"); if (r.ok) (await r.json()).forEach(f => { const m = /^(\d+)\.json$/.exec(f.name); if (m) max = Math.max(max, +m[1]); });
        const n = max + 1; docs.push(Object.assign({ no: n, kind: d.kind, title, note, public: false, created: dbToday(), updated: dbToday() }, h.folder ? { folder: h.folder } : {})); docs.sort((a, b) => a.no - b.no); return n;
      }, `Новый документ: ${title}`);
      await ghWrite(c, `docs/${no}.json`, doc, null, `Документ №${no}: ${title}`);
      h.isPublic = false;
    }
    h.pubNo = no; pubSave(tool); pubRedraw(tool, false);
    const nb = document.querySelector(`.pub[data-pub="${tool}"]`);
    pubSay(nb, shortUrl(no), mode === "update" ? `Изменения сохранены. Игроки увидят их примерно через минуту.` : `Создан документ №${no}. Пока он скрыт — нажмите «Открыть игрокам», когда придёт время.`);
  } catch (err) { btn.disabled = false; btn.textContent = label; pubSay(box, null, "Не получилось: " + (err.message || "нет связи с GitHub")); }
}
async function pubToggle(tool, btn) {
  const box = pubBox(btn), h = PUB[tool]().holder; btn.disabled = true;
  try { await dbSetPublic(h.pubNo, !h.isPublic); h.isPublic = !h.isPublic; pubSave(tool); pubRedraw(tool, false);
    pubSay(document.querySelector(`.pub[data-pub="${tool}"]`), shortUrl(h.pubNo), h.isPublic ? "Открыт игрокам. В разделе «Документы» появится примерно через минуту." : "Скрыт. Игроки перестанут его видеть примерно через минуту.");
  } catch (err) { btn.disabled = false; pubSay(box, null, "Не получилось: " + err.message); }
}
document.addEventListener("input", e => {
  const t = e.target; if (!t.dataset || !t.dataset.dmeta) return;
  const box = pubBox(t), tool = box.dataset.pub; PUB[tool]().holder[t.dataset.dmeta] = t.value; pubSave(tool);
  const h = PUB[tool]().holder;
  if (t.dataset.dmeta === "folder" && h.pubNo && ghCfg().token) dbMove(h.pubNo, t.value).then(() => toast("Документ переложен в папку.")).catch(err => toast("Не получилось: " + err.message));
});
const copyText = (txt, ok) => navigator.clipboard.writeText(txt).then(() => toast(ok || "Скопировано."), () => toast(txt));
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-pubgo],[data-pubtoggle],[data-pubdel],[data-pubcopy],[data-pubshow],[data-ghsave],[data-ghforget]");
  if (!b) return;
  const box = pubBox(b), tool = box && box.dataset.pub;
  if (b.dataset.pubgo) return publish(tool, b.dataset.pubgo, b);
  if (b.hasAttribute("data-pubtoggle")) return pubToggle(tool, b);
  if (b.hasAttribute("data-pubdel")) {
    const h = PUB[tool]().holder, no = h.pubNo;
    askYes(`Удалить документ №${no} «${docTitleOf(PUB[tool]())}»? Он пропадёт у игроков, ссылка перестанет работать. Текст останется здесь как черновик.`, "Удалить", "Отмена", true).then(ok => { if (!ok) return;
    b.disabled = true;
    dbDelete(no).then(() => { delete h.pubNo; h.isPublic = false; pubSave(tool); pubRedraw(tool, false); toast(`Документ №${no} удалён. Текст остался черновиком — его можно создать заново под новым номером.`); })
      .catch(err => { b.disabled = false; pubSay(box, null, "Не получилось удалить: " + err.message); }); });
    return;
  }
  if (b.dataset.pubshow) { pubSay(box, shortUrl(b.dataset.pubshow), PUB[tool]().holder.isPublic ? "Ссылку можно отправлять игрокам." : "Документ скрыт: по ссылке его увидят только администраторы."); return; }
  if (b.hasAttribute("data-pubcopy")) { copyText(box.querySelector(".pub-out input").value); return; }
  if (b.hasAttribute("data-ghsave") || b.hasAttribute("data-ghforget")) {
    const gb = b.closest("[data-ghbox]"), c = ghCfg(); gb.querySelectorAll("[data-gh]").forEach(i => c[i.dataset.gh] = i.value.trim());
    if (b.hasAttribute("data-ghforget")) delete c.token;
    ghSaveCfg(c); toast(b.hasAttribute("data-ghforget") ? "Ключ удалён из этого браузера." : "Ключ сохранён.");
    route();
  }
});

/* ---------- список документов в Мастерской ---------- */
function docsHTML() {
  return `<div class="dl wide">
    <p class="lw-lead">Все документы. Скрытые видят только администраторы, открытые — игроки в разделе «Документы» главного меню.</p>
    <div class="dl-grid" id="dl-grid">
      <div class="dl-new"><button type="button" class="dl-plus" data-newdoc><span>+</span><b>Создать документ</b></button>
        <div class="dl-kinds" hidden><button type="button" data-newkind="pisma">Письмо или указ</button><button type="button" data-newkind="kniga">Книга</button><button type="button" data-newkind="stopka">Стопка бумаг</button></div></div>
      <p class="dl-wait">Загружаю список…</p>
    </div>
    ${ghSetHTML()}
  </div>`;
}
let DOCS = [];
function docCard(d) {
  return `<article class="dcard" data-no="${d.no}">
    <header><span class="dno">№${d.no}</span><span class="dkind">${esc(DOC_KINDS[d.kind] || "Документ")}${(WFOLDERS.find(f => f.id === d.folder) || {}).name ? " · " + esc(WFOLDERS.find(f => f.id === d.folder).name) : ""}</span><span class="dstat${d.public ? " on" : ""}">${d.public ? "открыт" : "скрыт"}</span></header>
    <h4>${esc(d.title || "Без названия")}</h4>${d.note ? `<p>${esc(d.note)}</p>` : ""}
    ${d.updated || d.created ? `<small>${esc(d.updated || d.created)}</small>` : ""}
    <div class="dbtns"><button type="button" data-dopen="${d.no}">Открыть</button><button type="button" data-dedit="${d.no}">Изменить</button><button type="button" data-dtoggle="${d.no}">${d.public ? "Скрыть" : "Открыть игрокам"}</button><button type="button" data-dlink="${d.no}">Ссылка</button><button type="button" class="danger" data-ddel="${d.no}">Удалить</button></div>
  </article>`;
}
function docsDraw() {
  const g = $("#dl-grid"); if (!g) return;
  g.querySelectorAll(".dcard,.dl-wait").forEach(x => x.remove());
  g.insertAdjacentHTML("beforeend", DOCS.length ? DOCS.slice().sort((a, b) => b.no - a.no).map(docCard).join("") : `<p class="dl-wait">Документов пока нет — нажмите «+».</p>`);
}
async function docsInit() {
  if (!ghCfg().token) { const g = $("#dl-grid .dl-wait"); if (g) g.textContent = "Чтобы видеть и создавать документы, подключите ключ GitHub — ниже."; return; }
  try { await dbAdopt(); const ix = await dbIndex(true); DOCS = ix.docs; WFOLDERS = ix.folders; docsDraw(); }
  catch (err) { const g = $("#dl-grid .dl-wait"); if (g) g.textContent = "Не получилось загрузить: " + err.message; }
}
function blankLetter() { return Object.assign({}, LW_BASE, LW_PRESETS.guild.s, { place: "", greet: "", body: "", close: "", sign: "", ps: "", seal: "none", seed: Math.floor(Math.random() * 9000) + 1 }); }
function newDocState(tool) {
  if (tool === "pisma") { const h = lwHost; lwHost = null; LW = blankLetter(); lwSave(); lwHost = h; }
  if (tool === "kniga") { BK = JSON.parse(JSON.stringify(BK_EMPTY)); bkFocus = 0; bkSave(); }
  if (tool === "stopka") { STK = { title: "", cur: 0, sheets: [blankLetter()] }; stSave(); }
}
/* черновик «настоящий», только если в нём свой текст, а не образец */
const SAMPLE_BODIES = new Set(Object.values(LW_PRESETS).map(p => (p.s.body || "").trim()));
const ownText = t => { t = (t || "").trim(); return !!t && !SAMPLE_BODIES.has(t); };
const draftDirty = tool => {
  const h = PUB[tool]().holder; if (h.pubNo) return false;
  if (tool === "pisma") return ownText(LW.body);
  if (tool === "kniga") return BK.pages.some(p => (p.t || "").trim()) && JSON.stringify(BK.pages) !== JSON.stringify(BK_SAMPLE.pages);
  return STK.sheets.some(s => ownText(s.body));
};
document.addEventListener("click", async e => {
  const b = e.target.closest && e.target.closest("[data-newdoc],[data-newkind],[data-dopen],[data-dedit],[data-dtoggle],[data-dlink],[data-ddel]");
  if (!b) return;
  if (b.hasAttribute("data-newdoc")) { const k = b.parentElement.querySelector(".dl-kinds"); k.hidden = !k.hidden; return; }
  if (b.dataset.newkind) {
    const tool = b.dataset.newkind;
    if (draftDirty(tool) && !(await askYes("Несохранённый черновик в этом редакторе будет заменён новым документом. Продолжить?", "Продолжить"))) return;
    newDocState(tool); location.hash = tool; return;
  }
  const no = +(b.dataset.dopen || b.dataset.dedit || b.dataset.dtoggle || b.dataset.dlink || b.dataset.ddel);
  if (b.dataset.ddel) {
    const d = DOCS.find(x => x.no === no);
    if (!(await askYes(`Удалить документ №${no} «${d ? d.title : ""}»? Он пропадёт у игроков, ссылка перестанет работать. Это нельзя отменить.`, "Удалить", "Отмена", true))) return;
    b.disabled = true;
    try { await dbDelete(no); DOCS = DOCS.filter(x => x.no !== no); docsDraw(); toast(`Документ №${no} удалён.`);
      ["pisma", "kniga", "stopka"].forEach(t => { const h = PUB[t]().holder; if (h.pubNo === no) { delete h.pubNo; h.isPublic = false; pubSave(t); } }); }
    catch (err) { b.disabled = false; toast("Не получилось удалить: " + err.message); }
    return;
  }
  if (b.dataset.dopen) { location.hash = String(no); return; }
  if (b.dataset.dlink) { const d = DOCS.find(x => x.no === no); copyText(shortUrl(no), d && d.public ? "Ссылка скопирована." : "Ссылка скопирована. Документ скрыт — игроки его пока не увидят."); return; }
  if (b.dataset.dtoggle) {
    const d = DOCS.find(x => x.no === no); b.disabled = true;
    try { await dbSetPublic(no, !d.public); d.public = !d.public; docsDraw(); toast(d.public ? "Открыт игрокам — появится в меню примерно через минуту." : "Скрыт от игроков."); }
    catch (err) { b.disabled = false; toast("Не получилось: " + err.message); }
    return;
  }
  if (b.dataset.dedit) editDoc(no, b);
});

async function editDoc(no, b) {
  if (b) b.disabled = true;
  try {
    if (!DOCS.length) DOCS = await dbList(true);
    const { data } = await ghRead(ghCfg(), `docs/${no}.json`); if (!data) throw new Error("файл не найден");
    const ent = DOCS.find(x => x.no === no) || {}, tool = KIND_TOOL[data.kind];
    const meta = { pubNo: no, docTitle: ent.title || data.title || "", note: ent.note != null ? ent.note : (data.note || ""), isPublic: !!ent.public, folder: ent.folder || "" };
    if (draftDirty(tool) && !(await askYes("Несохранённый черновик в этом редакторе будет заменён. Продолжить?", "Продолжить"))) { if (b) b.disabled = false; location.hash = "docs"; return; }
    if (tool === "pisma") { const h = lwHost; lwHost = null; LW = Object.assign({}, LW_BASE, data.data, meta); lwSave(); lwHost = h; }
    if (tool === "kniga") { BK = Object.assign({}, data.data, meta); bkFocus = 0; bkSave(); }
    if (tool === "stopka") { STK = Object.assign({ title: data.data.title || "", cur: 0, sheets: data.data.sheets || [blankLetter()] }, meta); stSave(); }
    location.hash = tool;
  } catch (err) { if (b) b.disabled = false; toast("Не получилось открыть: " + err.message); if (!b) location.hash = "docs"; }
}

/* ---------- открытие документа по номеру: …/vmap/#12 ---------- */
async function wsOpenNumber(no) {
  document.documentElement.classList.add("shared");
  const admin = isAdmin(), c = ghCfg(), closable = admin && (wsRouted || !inHub);
  wsBackHash = closable ? "docs" : null;
  const host = wsViewer("Документ №" + no, closable); host.innerHTML = `<p class="ws-bad">Открываю…</p>`;
  try {
    const list = await dbList(admin && !!c.token), ent = list.find(x => x.no === +no);
    if (!admin && (!ent || !ent.public)) { host.innerHTML = `<p class="ws-bad">${ent ? "Этот документ пока скрыт мастером." : `Документ №${esc(no)} не найден или ещё скрыт. Если мастер только что его открыл — подождите минуту и обновите страницу.`}</p>`; return; }
    let doc = null;
    if (admin && c.token) doc = (await ghRead(c, `docs/${no}.json`)).data;
    else { const r = await fetch("docs/" + no + ".json?t=" + Date.now(), { cache: "no-store" }); if (r.ok) doc = await r.json(); }
    if (!doc) throw 0;
    const title = (ent && ent.title) || doc.title || "Документ", note = ent ? ent.note : doc.note;
    const h = wsViewer(title + (admin && ent && !ent.public ? " · скрыт" : ""), closable, note);
    if (doc.kind === "kniga") bookView(h, doc.data, { full: true });
    else if (doc.kind === "stopka") stackView(h, doc.data.sheets || []);
    else stackView(h, [doc.data]);
    document.title = title + " — Империя Веларис";
  } catch (_) { host.innerHTML = `<p class="ws-bad">Документ №${esc(no)} не найден. Если мастер только что его создал — подождите минуту и обновите страницу.</p>`; }
}
lwExtra = () => pubHTML("pisma");


/* ---------- Инструменты мастерской ----------
   Новый инструмент: добавьте строку в TOOLS — [адрес, название, функция-разметка, функция-запуск]. */
const TOOLS = [
  ["docs", "Все документы", docsHTML, docsInit],
  ["pisma", "Письма и указы", letterHTML, letterInit],
  ["kniga", "Книга", bookHTML, bookInit],
  ["stopka", "Стопка бумаг", stackHTML, stackInit]
];
function route() {
  const id = location.hash.slice(1), sh = id.match(/^(kniga|stopka)=(.+)$/);
  if (sh) return wsOpenShared(sh[1], sh[2]);
  if (/^\d{1,8}$/.test(id)) return wsOpenNumber(id);
  if (document.documentElement.classList.contains("shared")) { document.documentElement.classList.remove("shared"); wsCloseViewer(); }
  wsCloseViewer();
  if (!isAdmin()) {
    /* мастерская — только для администраторов приложения (или браузера с ключом GitHub) */
    $("#rail").innerHTML = "";
    $("#sheet").innerHTML = `<div class="gate wide"><h2>Мастерская закрыта</h2><p>Здесь мастера создают письма, книги и бумаги. Она открыта администраторам и редакторам группы — откройте её из приложения ВК, из раздела «Документы».</p><p>Мастер на новом устройстве может войти, подключив свой ключ GitHub:</p>${ghSetHTML()}</div>`;
    document.title = "Мастерская Велариса"; return;
  }
  const ed = id.match(/^edit-(\d+)$/); if (ed) { $("#sheet").innerHTML = `<p class="lw-lead">Открываю документ №${ed[1]}…</p>`; return editDoc(+ed[1]); }
  const t = TOOLS.find(x => x[0] === id) || TOOLS[0];
  $("#rail").innerHTML = TOOLS.map(x => `<button type="button" data-tool="${x[0]}" aria-selected="${x === t}">${esc(x[1])}</button>`).join("");
  $("#sheet").innerHTML = t[2](); if (t[3]) t[3]();
  if (PUB[t[0]]) pubSync(t[0]);
  wsRouted = true;
  document.title = t[1] + " — Мастерская Велариса";
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-tool]"); if (b) { location.hash = b.dataset.tool; return; }
  const z = e.target.closest("#zoom");
  if (z) {
    if (z._dragged) { z._dragged = false; return; }
    const img = z.querySelector("img");
    if (e.target === img) {
      /* приблизить в настоящий размер — к тому месту, куда нажали */
      if (!z.classList.contains("big")) {
        const r = img.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
        z.classList.add("big"); z.querySelector(".zhint").textContent = "Тяните, чтобы двигать. Нажмите ещё раз — отдалить";
        z.scrollLeft = img.offsetLeft + img.offsetWidth * fx - z.clientWidth / 2; z.scrollTop = img.offsetTop + img.offsetHeight * fy - z.clientHeight / 2;
      } else { z.classList.remove("big"); z.querySelector(".zhint").textContent = "Нажмите на картинку, чтобы приблизить"; }
      return;
    }
    z.classList.remove("on", "big"); z.querySelector(".zhint").textContent = "Нажмите на картинку, чтобы приблизить";
  }
});
addEventListener("keydown", e => { if (e.key === "Escape") $("#zoom").classList.remove("on", "big"); });
/* перетаскивание мышью в режиме приближения (пальцем листается само) */
(() => {
  const z = $("#zoom"); let st = null;
  z.addEventListener("pointerdown", e => { if (!z.classList.contains("big") || e.pointerType !== "mouse" || e.target.closest(".zx")) return; st = { x: e.clientX, y: e.clientY, l: z.scrollLeft, t: z.scrollTop, m: false }; e.preventDefault(); });
  addEventListener("pointermove", e => { if (!st) return; const dx = e.clientX - st.x, dy = e.clientY - st.y; if (Math.abs(dx) + Math.abs(dy) > 4) { st.m = true; z.classList.add("drag"); } z.scrollLeft = st.l - dx; z.scrollTop = st.t - dy; });
  addEventListener("pointerup", () => { if (!st) return; if (st.m) z._dragged = true; st = null; z.classList.remove("drag"); });
})();
if (window.parent !== window) $(".hubback").hidden = false;
addEventListener("hashchange", route);
route();
</script>
