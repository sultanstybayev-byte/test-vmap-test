async function ghApi(c, path, opt = {}) {

const utf8b64 = str => { const u = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); };

async function ghRead(c, path) {
  const r = await ghApi(c, path);
  if (r.status === 404) return { data: null, sha: null };
  if (!r.ok) throw new Error(ghErr(r.status));
  const j = await r.json();
  return { data: JSON.parse(b64utf8(j.content)), sha: j.sha };
}

  if (!r.ok) { const e = new Error(ghErr(r.status)); e.status = r.status; throw e; }
  return (await r.json()).content.sha;
}

    catch (e) { if (e.status !== 409 && e.status !== 422) throw e; }

function applyQuestStates(st) {
  if (!st || typeof QUESTS === "undefined") return false;
  let changed = false;
  for (let i = QUESTS.length - 1; i >= 0; i--) {
    const q = QUESTS[i], s = st[q.n]; if (!s) continue;
    if ((s.who || []).length) { q.who = s.who.slice(); changed = true; }
    if (s.st === "done") { QUEST_ARCHIVE.unshift({ n: q.n, g: q.g, d: q.d, end: s.end || "", date: s.date || "", who: q.who }); QUESTS.splice(i, 1); changed = true; }
    else if (s.st && !!q.busy !== (s.st === "busy")) { q.busy = s.st === "busy"; changed = true; }
  }
  return changed;
}

async function publish(tool, mode, btn) {
  const box = pubBox(btn), d = PUB[tool](), c = ghCfg(), h = d.holder;

  const doc = { v: 2, kind: d.kind, title, note, data: JSON.parse(JSON.stringify(d.data, (k, v) => META.includes(k) ? undefined : v)) };

    let no;
    if (mode === "update" && h.pubNo) {
      no = h.pubNo;
      const { sha } = await ghRead(c, `docs/${no}.json`);
      await ghWrite(c, `docs/${no}.json`, doc, sha, `Документ №${no}: ${title}`);
      await dbUpdate(docs => { let e = docs.find(x => x.no === no); if (!e) { e = { no, public: false, created: dbToday() }; docs.push(e); } Object.assign(e, { kind: d.kind, title, note, updated: dbToday(), to: (h.to || []).slice() }); if (h.folder) e.folder = h.folder; else delete e.folder; h.vis = visOf(e); h.isPublic = h.vis === "all"; }, `Документ №${no}: ${title}`);
    } else {
      no = await dbUpdate(async docs => {
        let max = docs.reduce((m, x) => Math.max(m, x.no), 0);
        const r = await ghApi(c, "docs"); if (r.ok) (await r.json()).forEach(f => { const m = /^(\d+)\.json$/.exec(f.name); if (m) max = Math.max(max, +m[1]); });
        const n = max + 1; docs.push(Object.assign({ no: n, kind: d.kind, title, note, vis: hVis(h), public: hVis(h) === "all", to: (h.to || []).slice(), created: dbToday(), updated: dbToday() }, h.folder ? { folder: h.folder } : {})); docs.sort((a, b) => a.no - b.no); return n;
      }, `Новый документ: ${title}`);
      await ghWrite(c, `docs/${no}.json`, doc, null, `Документ №${no}: ${title}`);
    }
    h.pubNo = no; pubSave(tool); pubRedraw(tool, false);
    const nb = document.querySelector(`.pub[data-pub="${tool}"]`);
    pubSay(nb, shortUrl(no), mode === "update" ? `Изменения сохранены. Игроки увидят их примерно через минуту.` : `Создан документ №${no} — ${{ hidden: "пока скрыт от игроков", to: "тайный, его увидят только получатели", all: "открыт всем игрокам" }[hVis(h)]}.`);

}

async function editDoc(no, b) {
  if (b) b.disabled = true;
  try {
    if (!DOCS.length) DOCS = await dbList(true);
    const { data } = await ghRead(ghCfg(), `docs/${no}.json`); if (!data) throw new Error("файл не найден");
    const ent = DOCS.find(x => x.no === no) || {}, tool = KIND_TOOL[data.kind];
    const meta = { pubNo: no, docTitle: ent.title || data.title || "", note: ent.note != null ? ent.note : (data.note || ""), isPublic: visOf(ent) === "all", vis: visOf(ent) || "hidden", to: ent.to || [], folder: ent.folder || "" };
    if (draftDirty(tool) && !(await askYes("Несохранённый черновик в этом редакторе будет заменён. Продолжить?", "Продолжить"))) { if (b) b.disabled = false; location.hash = "docs"; return; }
    if (tool === "pisma") { const h = lwHost; lwHost = null; LW = Object.assign({}, LW_BASE, data.data, meta); lwSave(); lwHost = h; }
    if (tool === "kniga") { BK = Object.assign({}, data.data, meta); bkFocus = 0; bkSave(); }
    if (tool === "stopka") { STK = Object.assign({ title: data.data.title || "", cur: 0, sheets: data.data.sheets || [blankLetter()] }, meta); stSave(); }
    location.hash = tool;
  } catch (err) { if (b) b.disabled = false; toast("Не получилось открыть: " + err.message); if (!b) location.hash = "docs"; }
}

async function qaSet(name, patch, okMsg) {

function qaResults(box, val) {

/* =====================================================================
   ПОИСК ПЕРСОНАЖЕЙ В АНКЕТАХ НА СТЕНЕ ГРУППЫ
   Анкета = пост с разделами «Имя, возраст, пол», «Навыки», «Биография»…

}
function ankParse(p) {

      const inline = L.includes(":") ? after.trim() : "";

async function faInit() { try { FPL = await plLoad(!!ghCfg().token); FPL.list = FPL.list || []; FPL.npcs = FPL.npcs || []; } catch (err) { toast("Не получилось загрузить: " + err.message); } faDraw(); }
async function faSet(key, fac, add) {
  if (!ghCfg().token) { toast("Чтобы сохранить, подключите ключ GitHub."); return; }
  const upd = c => { const cur = facsOf(c); setFacs(c, add ? (fac === "none" ? ["none"] : cur.filter(x => x !== "none").concat([fac])) : cur.filter(x => x !== fac)); };
  const apply = P => {
    if (key.startsWith("npc:")) { P.npcs = P.npcs || []; const n = P.npcs.find(x => x.id === key.slice(4)); if (n) { upd(n); if (!facsOf(n).length) P.npcs = P.npcs.filter(x => x !== n); } return; }
    const [pid, cid] = key.split(":"), p = P.list.find(x => x.id === +pid); if (!p) return;
    const cs = charsOf(p).map(c => Object.assign({}, c)), c = cs.find(x => x.id === cid); if (!c) return; upd(c); setChars(p, cs);
  };
  apply(FPL); faDraw();
  try { FPL = await plUpdate(P => apply(P), "Фракции персонажей"); FPL.npcs = FPL.npcs || []; faDraw(); }
  catch (err) { toast("Не получилось: " + err.message); faInit(); }
}
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-faadd],[data-fapick],[data-fanpc],[data-fmrm]"); if (!b) return;
  if (b.dataset.faadd) { fPick = fPick === b.dataset.faadd ? null : b.dataset.faadd; faDraw(); const i = document.querySelector("[data-faq]"); if (i) { i.focus(); faResults(i.closest(".qa-pick"), ""); } return; }
  if (b.dataset.fapick) { const f = fPick; faSet(b.dataset.fapick, f, true).then(() => { const i = document.querySelector("[data-faq]"); if (i) faResults(i.closest(".qa-pick"), i.value); }); return; }
  if (b.dataset.fanpc) { const f = fPick, id = newCid(); fPick = null; FPL.npcs.push({ id, name: b.dataset.fanpc, fac: f, facs: [f] }); faDraw();
    if (ghCfg().token) plUpdate(P => { P.npcs = P.npcs || []; P.npcs.push({ id, name: b.dataset.fanpc, fac: f, facs: [f] }); }, "NPC мастера: " + b.dataset.fanpc).then(P => { FPL = P; FPL.npcs = FPL.npcs || []; faDraw(); }).catch(err => toast("Не получилось: " + err.message)); return; }
  if (b.dataset.fmrm) {
    const k = b.dataset.fmrm;
    const fid = b.closest(".fa-card").dataset.fid;
    faSet(k, fid, false);
  }
});
document.addEventListener("input", e => { if (e.target.hasAttribute && e.target.hasAttribute("data-faq")) faResults(e.target.closest(".qa-pick"), e.target.value); });
document.addEventListener("pointerdown", e => { if (fPick && !(e.target.closest && e.target.closest(".fa-card .qa-pick, [data-faadd]"))) { fPick = null; faDraw(); } });


/* ---------- Инструменты мастерской ----------
   Новый инструмент: добавьте строку в TOOLS — [адрес, название, функция-разметка, функция-запуск]. */
const TOOLS = [
  ["docs", "Все документы", docsHTML, docsInit],
  ["pisma", "Письма и указы", letterHTML, letterInit, true],
  ["kniga", "Книга", bookHTML, bookInit, true],
  ["stopka", "Стопка бумаг", stackHTML, stackInit, true],
  ["kvesty", "Квесты", questsAdminHTML, questsAdminInit],
  ["frakcii", "Фракции", factionsAdminHTML, faInit],
  ["igroki", "Игроки", playersHTML, playersInit]
];
const RAIL_IC = {
  docs: '<path d="M7 3h8l4 4v14H7z"/><path d="M15 3v4h4M10 11h6M10 15h6"/><path d="M4 6v15h11"/>',
  kvesty: '<path d="M7 3h10a2 2 0 0 1 2 2v1h-4M7 3a2 2 0 0 0-2 2v13a3 3 0 0 0 3 3h9a2 2 0 0 0 2-2v-1H10"/><path d="M15 6v12M9 8h3M9 12h3"/>',
  frakcii: '<path d="M6 21V3M6 4h11l-2.5 4L17 12H6"/>',
  igroki: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17" cy="9" r="2.6"/><path d="M16 14.6a5 5 0 0 1 5.5 5.4"/>'
};
const RAIL_KEY = "velaris-rail";
function railMode() { let v = null; try { v = localStorage.getItem(RAIL_KEY); } catch (_) {} const narrow = v ? v === "narrow" : (window.parent !== window || innerWidth < 1240); document.documentElement.classList.toggle("rail-narrow", narrow); }
railMode();
document.addEventListener("click", e => { if (!e.target.closest("[data-railfold]")) return; const n = !document.documentElement.classList.contains("rail-narrow"); try { localStorage.setItem(RAIL_KEY, n ? "narrow" : "wide"); } catch (_) {} railMode(); });
function route() {
  const id = location.hash.slice(1), sh = id.match(/^(kniga|stopka)=(.+)$/);
  if (sh) return wsOpenShared(sh[1], sh[2]);
  if (/^\d{1,8}$/.test(id)) return wsOpenNumber(id);
  if (document.documentElement.classList.contains("shared")) { document.documentElement.classList.remove("shared"); wsCloseViewer(); }
  wsCloseViewer();
  if (!isAdmin()) {
    $("#rail").innerHTML = "";
    $("#sheet").innerHTML = `<div class="gate wide"><h2>Мастерская закрыта</h2><p>Здесь мастера создают письма, книги и бумаги. Она открыта администраторам и редакторам группы — откройте её из приложения ВК, из раздела «Документы».</p><p>Мастер на новом устройстве может войти, подключив свой ключ GitHub:</p>${ghSetHTML()}</div>`;
    document.title = "Мастерская Велариса"; return;
  }
  const ed = id.match(/^edit-(\d+)$/); if (ed) { $("#sheet").innerHTML = `<p class="lw-lead">Открываю документ №${ed[1]}…</p>`; return editDoc(+ed[1]); }
  const t = TOOLS.find(x => x[0] === id) || TOOLS[0];
  $("#rail").innerHTML = TOOLS.filter(x => !x[4]).map(x => `<button type="button" data-tool="${x[0]}" aria-selected="${x === t || (t[4] && x[0] === "docs")}" title="${esc(x[1])}"><svg viewBox="0 0 24 24" aria-hidden="true">${RAIL_IC[x[0]] || ""}</svg><span>${esc(x[1])}</span></button>`).join("") + `<button type="button" class="rail-fold" data-railfold title="Свернуть / развернуть панель" aria-label="Свернуть или развернуть панель"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>`;
  $("#sheet").innerHTML = t[2](); if (t[3]) t[3]();
  if (PUB[t[0]]) pubSync(t[0]);
  wsRouted = true;
  document.title = t[1] + " — Мастерская Велариса";
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-tool]"); if (b) { location.hash = b.dataset.tool; return; }
  const z = e.target.closest("#zoom");
  if (z) {
    if (z._dragged) { z._dragged = false; return; }
    const img = z.querySelector("img");
    if (e.target === img) {
      if (!z.classList.contains("big")) {
        const r = img.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
        z.classList.add("big"); z.querySelector(".zhint").textContent = "Тяните, чтобы двигать. Нажмите ещё раз — отдалить";
        z.scrollLeft = img.offsetLeft + img.offsetWidth * fx - z.clientWidth / 2; z.scrollTop = img.offsetTop + img.offsetHeight * fy - z.clientHeight / 2;
      } else { z.classList.remove("big"); z.querySelector(".zhint").textContent = "Нажмите на картинку, чтобы приблизить"; }
      return;
    }
    z.classList.remove("on", "big"); z.querySelector(".zhint").textContent = "Нажмите на картинку, чтобы приблизить";
  }
});
addEventListener("keydown", e => { if (e.key === "Escape") $("#zoom").classList.remove("on", "big"); });
(() => {
  const z = $("#zoom"); let st = null;
  z.addEventListener("pointerdown", e => { if (!z.classList.contains("big") || e.pointerType !== "mouse" || e.target.closest(".zx")) return; st = { x: e.clientX, y: e.clientY, l: z.scrollLeft, t: z.scrollTop, m: false }; e.preventDefault(); });
  addEventListener("pointermove", e => { if (!st) return; const dx = e.clientX - st.x, dy = e.clientY - st.y; if (Math.abs(dx) + Math.abs(dy) > 4) { st.m = true; z.classList.add("drag"); } z.scrollLeft = st.l - dx; z.scrollTop = st.t - dy; });
  addEventListener("pointerup", () => { if (!st) return; if (st.m) z._dragged = true; st = null; z.classList.remove("drag"); });
})();
if (window.parent !== window) $(".hubback").hidden = false;
addEventListener("hashchange", route);
route();
</script>
