    main: ["sarkoniya"], presence: ["verkhniy-predel", "epira"],
    desc: ["Самая могущественная организация в империи после самого Императора. Это своего рода церковь, которая совмещает функции инквизиции, армии, полиции и суда. Они появились одновременно с первой вспышкой скверны и за три десятилетия превратились в главную силу, контролирующую жизнь каждого жителя Велариса.",
           "Их символ — пылающее сердце. Он вышит на знамёнах, выбит на доспехах и выжжен на дверях домов, где объявлен приговор. Для простого народа Орден — одновременно защита и угроза.",

  { id: "guild", known: true, name: "Гильдия «Плата и сталь»", color: "#8a6a22", kind: "Гильдия авантюристов",

    desc: ["Гильдия объединяет наёмников, охотников на упырей, искателей сокровищ и тех, кто готов выполнить любую работу за деньги. В империи, раздираемой скверной, она стала одной из немногих структур, которая сохранила нейтралитет и продолжает работать даже в самых опасных регионах.",
           "В каждом крупном городе есть Дом гильдии — укреплённое здание с комнатами, общей трапезной, кузницей и арсеналом. Член гильдии может остановиться там бесплатно в любой момент, получить первую помощь, пополнить припасы, продать добычу и найти союзников.",
           "Гильдия официально признана Императором. Орден терпит её, но относится с подозрением: гильдия не принимает заказы против Ордена, а инквизиторы не проверяют каждого члена на наличие Дара. На практике теневые заказы обходят это соглашение.",

    facts: [["Цель", "создание устойчивой фигуры в Веларисе"], ["Штаб", "Торговый Форпост"], ["Дома гильдии", "Верхний Предел, Кальдерон, Гнилой Удел"], ["Глава", "Мастер гильдии, личность скрыта"], ["Значок", "скрещённые меч и монета"], ["Народ и знать", "нейтрально, положительно"]],

  { id: "dead", known: true, name: "Усопшие Души", color: "#46564a", kind: "Погребальное бюро и гильдия костоправов",

    main: [], presence: [],
    desc: ["Для народа «Усопшие Души» берут на себя всё, что связано со смертью: похороны по любым обрядам, отпевания, бальзамирование. В их лавках можно купить всё — от гробовых гвоздей, похоронных свечей и горючих масел до обезболивающих трав, амулетов и украшений из костей казнённых преступников. В филиалах работают опытные палачи и костоправы.",
           "Гильдия зародилась в трущобах столицы и быстро пустила корни по всему государству. Обители открываются там, где вспыхивают эпидемии, бедствия или чумные бунты. Гильдия держится подчёркнуто нейтрально и помогает властям сжигать трупы после массовых моров, за что получает неприкосновенность и доступ к «материалу».",
           "За закрытыми дверями — подпольный научный синдикат, анатомическая чёрная биржа и охотники за нечистью. Гильдия ловит обескровленных для опытов, проводит нелегальные операции, торгует органами и редкими порошками. Криминальный мир ценит её за идеальную «утилизацию» улик.",
           "Официально гильдия зарабатывает на смерти. На деле Эдмунд ищет способ уничтожить скверну или лекарство от неё: зараза забрала его родителей. Об этой цели знают лишь основатели и узкий круг доверенных хирургов."],
    facts: [["Основатель", "Эдмунд Аушвиц Пэрес, Палач Верхнего Предела"], ["Заместитель", "Рафалия Аушвиц Пэрес"], ["Где", "столица и Обители по всей империи"], ["Символ", "череп в песочных часах; на одежде — треугольник с кругом, разделённым линией"], ["Маги", "не приветствуются"]],

             ["Известные члены", "Гидеон Мартель, Сольяти Ван Де Сол, Маргарет Жан Первэль, Ёхан Гассельский, Гордон Вален Тайн."]],
    rel: [["Союзники", "нет"], ["Нейтралитет", "Императорская власть, Орден, «Плата и сталь», Совет Здравия"], ["Перемирие", "Тени Кальдерона"], ["Враждебны", "Триединство, Певчие души"]] },
  { id: "bastards", known: true, name: "Ублюдки Чернолесья", color: "#5a3d1e", kind: "Хозяева руин Хельграда",
    motto: "Слабые служат сильным, сильные служат ненависти, ненависть служит Ульвару.",
    main: ["verkhniy-helgrad"], presence: ["nizhniy-helgrad", "chernolesye", "bagryanoe-zarevo"],
    desc: ["Ублюдки Чернолесья — это не орден и не союз, это последствие. Сообщество, которое сложилось вынужденно, из людей, запертых в городе, который должен был быть спасён, но был предан. Они не связывают жизнь с чем-то одним, не верят в одного бога, не выбирают один путь. Всё, что их объединяет, — ненависть и жажда мести.",
           "Двадцать лет назад Хельград можно было спасти. Первые вспышки вируса сводили с ума; до последнего не верилось, что город, не взятый за сотни лет, падёт вот так. Ульвар Гриммхольд остался, уверяя, что спасение близко, но и представить не мог, как быстро Империя оборвёт связь с военной столицей. Сотни тысяч человек оказались заперты изнутри, чувствуя, как приближается смерть.",
           "За двадцать лет бесконечных страданий, внутренних войн за власть над городом и взаимного уничтожения в Хельграде остались лишь они — самые жёсткие, кровавые, безумные. Обескровленных в городе мало не потому, что их перебили или отогнали: Ублюдки поглотили их от мучительного голода и сделали рабами наравне со слабейшими, которые уже не помнят себя и лишены права называться людьми.",
           "Предводитель Ублюдков знает, какую ненависть ему удалось обуздать. Им не движет ничего, кроме ненависти к Касселю. Настанет час — и Император ответит за ужасное предательство."],
    facts: [["Цель", "выживание, месть, уничтожение Касселя и всего, что он представляет"], ["Глава", "Ульвар Гриммхольд, Завоеватель и Царь над Руинами Хельграда"], ["Где", "руины Хельграда, Чернолесье"], ["Закон", "слабые служат сильным, сильные — ненависти, ненависть — Ульвару"]],
    people: [["Ульвар Гриммхольд", "Завоеватель и Царь над Руинами Хельграда. Предводитель Ублюдков."],
             ["Гриммольд Костогрыз", "Огромный, молчаливый, с руками, которые когда-то держали молот кузнеца, а теперь держат только плоть. Скверна забрала его семью — тогда Гриммольд забрал скверну. Не признаёт ни оружия, ни тактики: рвёт руками и грызёт то, что остаётся. К нему не подходят, когда он ест, и не смотрят в глаза, когда он молчит."],
             ["Вельзед Рваная Пасть", "Был красив, пока скверна не добралась до его челюсти. Теперь его рот — рваная дыра, которая не закрывается, а зубы растут вкривь и вкось, как гвозди в гнилой доске. Бросается на врага и грызёт лицо — не от голода, а из удовольствия."],
             ["Морвен Драугр", "Один из немногих, кто сохранил мнимую адекватность; приближённый Ульвара. Судит внутренние споры. Одним из первых встретил скверну и выжил, не потеряв разум: тело покрыто тёмными жилами, пульсирующими в такт чужому сердцу, раны затягиваются быстрее, чем их наносят. Не чувствует боли и не помнит страха."]],
    rel: [["Союзники", "нет"], ["Враги", "все; открытая вражда с Орденом Пылающего Сердца"]] },

  { id: "council", known: false, name: "Тайный совет", color: "#3d5a5a", kind: "Подпольная организация",

    main: [], presence: [],

    main: [], presence: ["tenegrad"],
    desc: ["Немногочисленная, но крайне опасная фракция, объявленная Орденом главным врагом империи. Император относится к ней с настороженностью и страхом. Центр влияния — заброшенная деревня с храмом, где идут проповеди; последователи рассеяны по империи.",

    facts: [["Цель", "подчинить Веларис и заставить каждого принять скверну как дар или наказание"], ["Главное лицо", "Моргана Эшворд, дева скверны"], ["Народ и знать", "не знают или осторожны"]],

             ["Старожилы", "Помнят Лирану и получили от неё вечную жизнь. Хранят знания, учат новичков и направляют Моргану."],

  { g: "temp", n: "Туман над океаном", busy: true, imp: 3, places: ["gniloy-udel"], d: "Трое аристократов из Верхнего предела были одержимы одним вопросом: что скрывается в тумане над океаном у западного побережья Велариса. Они потратили годы на изучение старых карт, записей мореходов и легенд о кораблях, которые уходили в этот туман и не возвращались. Никто не воспринимал их всерьёз, пока они не исчезли. Их дом, центр встречи, в Гнилом Уделе стоит пустым, но в их кабинете остались записи, которые указывают на то, что они нашли нечто важное. Просьба обращаться в поместье Спенсеров.", rec: "исследователям, дипломатам, тем, кто умеет работать с архивами и не боится моря", dur: "долго (3–4 сцены)", loc: "Гнилой Удел и ???" },

  { g: "temp", n: "Кара Небесная", busy: true, imp: 4, places: ["gniloy-udel"], d: "Гнилой удел всегда пах гнилью, но теперь к этому запаху примешалось что-то новое. Соседи, друзья, семья — ещё вчера совершенно здоровые, хмурые жители родного города, сегодня уже бездыханные тела с чёрной жидкостью, вытекающей из каждого отверстия. Кара распространяется быстрее, чем Орден успевает сжигать тела. И только у тебя есть возможность спасти людей или уничтожить Удел…", rec: "всем", dur: "долго (4–5 сцен)", loc: "Гнилой удел" },
  { g: "temp", n: "Верхний Хельград (Похищение)", imp: 2, places: ["verkhniy-helgrad"], d: "Герой просыпается в подземелье Верхнего Хельграда. Голова раскалывается, руки связаны, а за дверью слышны грубые голоса. Ублюдки похитили его, чтобы использовать в своих целях. Игроку нужно выжить несмотря ни на что: выбраться из камеры, обмануть стражу или перебить всех, кто встанет на пути, пока Ульвар Гриммхольд не узнал о «незваном госте».", rec: "всем", dur: "средне (2–3 сцены)", loc: "Верхний Хельград, подземелья" },

  { g: "order", n: "Вглубь ордена", imp: 3, places: ["sarkoniya"], d: "Что мы вообще знаем об Ордене? Мы видим алые рясы, слышим проповеди, чувствуем запах дыма. Но что скрывается за стенами штабов? Какие приказы отдаются шёпотом? Какие документы сжигаются в подвалах? Говорят, в старом храме на окраине Сарконии сохранились архивы, которые не должны были сохраниться. Орден выставил приказ о полном уничтожении архива.", rec: "тем, кто хочет понять истинную природу Ордена", dur: "средне (2–3 сцены)", loc: "Саркония, старый храм на окраине города" },
  { g: "order", n: "Личность Верховного инквизитора", imp: 3, places: ["verkhniy-predel"], d: "Верховный инквизитор — человек, чьё имя произносят шёпотом. Он не появляется на публике, не даёт слова, не покидает свой храм без охраны. Но что, если подобраться ближе? Что, если увидеть его лицо без маски? Что, если задать вопрос, который он не ожидает услышать? Риск огромен — одна ошибка, и ты лишишься головы. Но награда — знание. А знание, как известно, опаснее любого клинка.", rec: "тем, кто хочет узнать личность Верховного инквизитора", dur: "? (зависит от подхода)", loc: "Верхний предел, Храм Пылающего Сердца" },
  { g: "order", n: "Проповедь в пустоши", imp: 2, places: ["gniloy-udel"], d: "В заброшенной деревне недалеко от Гнилого удела появился проповедник. Он говорит, что скверна — это благословение, а Орден — лжецы. Приказ довольно ясен: ликвидировать.", rec: "инквизиторам, паладинам, жрецам", dur: "средне (2–3 сцены)", loc: "заброшенная деревня у Гнилого удела" },

  { g: "court", n: "Золото для короны", imp: 2, places: ["kalderon"], d: "Казна Императора нуждается в пополнении. По слухам, в одной из старых шахт Кальдерона до сих пор есть запасы серебра, которые не были учтены. Проблема в том, что шахта находится на территории, которую контролируют Тени Кальдерона.", rec: "солдатам, дипломатам, охотникам за сокровищами", dur: "средне (2–3 сцены)", loc: "Кальдерон (старые шахты)" },
  { g: "court", n: "По следам родства", imp: 4, places: [], d: "В общий доступ внезапно просочились старые записи самого Эдварда Смертного, отца нынешнего императора. Там упоминают экспедиции в Северные княжества и людей, которые вернулись оттуда не такими, как прежде. Игроки должны выяснить: что, если это и есть тот самый ответ на важнейший вопрос современности — откуда на самом деле взялась скверна?", rec: "магам, учёным, шпионам, тем, кто связан с Северными княжествами, кому интересна скверна", dur: "долго (3–4 сцены)", loc: "Веларис → Северные княжества (руины, старый дуб)" },
  { g: "court", n: "Тень за троном", imp: 4, places: ["verkhniy-predel"], d: "В Верхнем пределе получен донос: люди Императора вышли на след сбежавшей принцессы. По слухам, она скрывается в одном из приграничных городов под чужим именем. Кассель не хочет огласки — он поручает доверенным лицам (или наёмникам) перехватить принцессу до того, как случится нечто страшное. Но у этой операции есть двойное дно: одни хотят вернуть её во дворец, другие — «убрать» проблему навсегда. Игроки должны найти девушку первыми и решить, кому её отдать… или не отдавать никому.", rec: "шпионам, дипломатам, наёмникам, тем, кто умеет работать в тени", dur: "долго (3–4 сцены)", loc: "Верхний предел (дворец) → приграничные города" },

  { g: "tri", n: "Кровь Оскара", imp: 4, places: [],
    d: "Младший сын Императора, Оскар, — единственный, кого Кассель не контролирует. Мальчик живёт вдали от двора, под охраной, но слухи о нём ходят по всем трём державам. Триединство хочет заполучить его: одни — как заложника, другие — как оружие, третьи — как доказательство того, что кровь Касселя передаётся. Игроки должны выкрасть Оскара, пока за ним не пришли другие. Но мальчик не так прост…",

  { g: "shadows", n: "Грязный секрет", imp: 2, places: ["kalderon"], d: "Финансовая сторона Теней Кальдерона давно вызывает вопросы. Может… пора разобраться с одной из самых омерзительных сторон?", rec: "членам Теней, торговцам, заинтересованным", dur: "средне (2–3 сцены)", loc: "Кость" },
  { g: "shadows", n: "Тень Триединства", imp: 3, places: ["kalderon"], d: "Тени Кальдерона получили заказ от Триединства: убить одного из основателей Тайного Совета. Гильдия не хочет ссориться с Советом, но отказ невозможен. Игроки должны либо выполнить заказ, либо найти компромисс, либо раскрыть, кто из Триединства стоит за контрактом. Правда может оказаться неудобной: заказчик — тот, кому они доверяют.", rec: "убийцам, дипломатам, шпионам", dur: "средне (2–3 сцены)", loc: "Кальдерон, Триединство" },
  { g: "shadows", n: "Ворота в преисподнюю", imp: 4, places: ["sarkoniya"], d: "Тени Кальдерона готовят удар по Сарконии, но сначала нужно ослабить город. Саркония держится на торговле, на границе, на контроле над путями. Если ворота падут, падёт и крепость, а значит и город. Тени хотят не просто взорвать — они хотят показать, что Кассель не может защитить даже собственные границы. Каждый уничтоженный пункт — это удар по экономике, по доверию, по вере в Императора. Игроки должны либо помочь Теням, либо остановить их, либо использовать хаос для собственных целей.", rec: "шпионам, диверсантам, магам", dur: "долго (3–4 сцены)", loc: "границы Сарконии, пропускные пункты" },
  { g: "shadows", n: "Кровавый бал", imp: 4, places: ["epira"], d: "Тени Кальдерона получили заказ, или, возможно, сами решили, что пора. В Эпире готовится закрытый бал: сливки аристократии, самые богатые дома, самые старые семьи. Их всех объединяет лишь одно: полная поддержка императора. Одна ночь, один зал, один список гостей. Тени хотят не просто убить — они хотят устроить резню, которая войдёт в историю, чтобы каждый аристократ в Веларисе понял: никто не защищён. Ни титул, ни богатство, ни стража. Ваша задача — попасть на бал, дождаться нужного момента и уничтожить всех.", rec: "убийцам, шпионам, диверсантам", dur: "долго (3–4 сцены)", loc: "загородная резиденция в Эпире" },
  { g: "guild", n: "Кровавый бал", imp: 4, places: ["epira"], d: "«Плата и сталь» получили заказ. В Эпире готовится закрытый бал: сливки аристократии, самые богатые дома, самые старые семьи. Их всех объединяет лишь одно: полная поддержка императора. Одна ночь, один зал, один список гостей. Заказчик готов заплатить много, лишь бы спасти одну аристократку, отчаянно рвущуюся на бал.", rec: "авантюристам, убийцам", dur: "долго (3–4 сцены)", loc: "загородная резиденция в Эпире" },
  { g: "guild", n: "Охота на обескровленных", imp: 1, places: ["yasnaya-polyana"], d: "В окрестностях Ясной Поляны появилось гнездо обескровленных. Местные жители просят помощи. Гильдия готова заплатить за каждого убитого.", rec: "авантюристам, наёмникам", dur: "быстро (1–2 сцены)", loc: "Ясная Поляна" },
  { g: "guild", n: "Исчезновение в Форпосте", imp: 2, places: ["torgovyy-forpost"], d: "Один из членов гильдии не вернулся с задания. Он должен был доставить письмо в старый квартал Торгового форпоста. Его следы обрываются.", rec: "членам гильдии, авантюристам", dur: "средне (2–3 сцены)", loc: "Торговый форпост" },
  { g: "guild", n: "Под Тенеградом", imp: 4, places: ["tenegrad"], d: "«Плата и Сталь» получили странный заказ: расследовать и проверить местность под Тенеградом, где совсем недавно по неизвестным причинам расступился туман. Заказчик не назвался, оплата вперёд, инструкции простые: спуститься, осмотреть, вернуться с отчётом. Никто не говорит, что именно искать. Никто не говорит, почему туман расступился именно сейчас. Никто не говорит, что было под Тенеградом раньше.", rec: "наёмникам, исследователям, магам, тем, кто умеет работать в неизвестности", dur: "средне (2–3 сцены)", loc: "Тенеград и его подземелья" },

  { g: "guild", n: "Контракт на мертвеца", imp: 1, places: ["epira"], d: "«Плату и Сталь» нанимают, чтобы убить человека, который уже мёртв. Заказчик клянётся, что тот жив, но все доказательства говорят об обратном. Игроки должны найти «мертвеца» и понять: он действительно мёртв или просто хорошо прячется? И почему за него платят столько?", rec: "любителям расследований и разговоров", dur: "средне (2–3 сцены)", loc: "Эпира" },
  { g: "souls", n: "Голос из тишины", busy: true, imp: 0, places: ["les-strasti"], d: "Говорят, что глава Певчих душ редко покидает своё убежище. Говорят, что она слышит голоса мёртвых и говорит с теми, кто уже ушёл. Но правда в том, что она просто ждёт. Ждёт тех, кто способен слушать. Тех, кто не боится тишины. Тех, кто готов узнать, что скрывается за словами «скверна — это путь». Лидер Певчих душ не ищет последователей — она ждёт, когда они придут сами. Вопрос в том, готовы ли вы переступить порог и услышать то, что нельзя забыть.", rec: "искателям веры, магам, тем, кто потерял ориентиры и ищет новый путь", dur: "средне (2–3 сцены)", loc: "Лес Страсти, тайное убежище Певчих душ" },
  { g: "souls", n: "Жертвенный круг", imp: 2, places: ["les-strasti"], d: "В Лесу Страсти, глубоко в чаще, есть место, где земля помнит кровь. Там проводят ритуалы, о которых не говорят вслух. На рассвете, когда туман ещё не рассеялся, члены культа собираются вокруг старого камня, чтобы принести жертву. Не животное — человека. Того, кто согласился добровольно, или того, кто не знал, что согласился. Вы получили приглашение присутствовать.", rec: "членам Певчих душ, тем, кто готов увидеть их тёмную сторону", dur: "быстро (1–2 сцены)", loc: "Лес Страсти, тайная поляна" },
  { g: "souls", n: "Плачущий колодец", imp: 1, places: ["tenegrad"], d: "В одной из заброшенных деревень, недалеко от Тенеграда, есть колодец. Говорят, что если опустить в него руку и произнести имя умершего, можно услышать его голос. Певчие души считают это место священным. Они отправляют туда новичков, чтобы те услышали голоса тех, кого они потеряли. Но иногда колодец отвечает не тем, кого зовут. Иногда он зовёт сам.", rec: "членам Певчих душ, тем, кто ищет контакта с мёртвыми", dur: "быстро (1–2 сцены)", loc: "заброшенная деревня недалеко от Тенеграда" },
  { g: "souls", n: "Крест и пламя", imp: 4, places: [], d: "Рядом с Крестом, древним местом силы, где сходятся пути скверны и памяти, появился отряд инквизиторов. Не простых: они не уйдут, пока не выжгут всё, что связано со скверной, включая тех, кто рядом. Их нужно сдвинуть любой ценой: жертвой, уговорами, силой, хитростью или властью. Они мешают главному плану Морганы и скверны.", rec: "дипломатам, шпионам, наёмникам, тем, кто умеет говорить и торговаться", dur: "долго (3–4 сцены)", loc: "окрестности Старого креста" },

  { g: "bastards", n: "Пьяный Ульвар", busy: true, imp: 1, places: ["verkhniy-helgrad"], d: "Ульвар Гриммхольд напился и требует «зрелища». Он приказывает найти ему нового бойца для смертельной ямы. Игроки могут привести пленника, самим выйти на бой или подсунуть Ульвару «сюрприз» в виде отравленного вина. Главное — не дать ему заскучать, иначе он начнёт убивать своих.", rec: "наёмникам, дипломатам, шпионам", dur: "средне (2–3 сцены)", loc: "Верхний Хельград, пиршественный зал" },

const wsB64 = u8 => { let s = ""; for (let i = 0; i < u8.length; i += 32768) s += String.fromCharCode.apply(null, u8.subarray(i, i + 32768)); return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); };
const wsUnB64 = t => { const s = atob(t.replace(/-/g, "+").replace(/_/g, "/")), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; };
async function wsPack(obj) {
  const raw = new TextEncoder().encode(JSON.stringify(obj));
  if (window.CompressionStream) {
    try { const st = new Blob([raw]).stream().pipeThrough(new CompressionStream("deflate-raw")); return "z" + wsB64(new Uint8Array(await new Response(st).arrayBuffer())); } catch (_) {}
  }
  return "j" + wsB64(raw);
}
async function wsUnpack(s) {
  const u = wsUnB64(s.slice(1));
  if (s[0] === "z") { const st = new Blob([u]).stream().pipeThrough(new DecompressionStream("deflate-raw")); return JSON.parse(await new Response(st).text()); }
  return JSON.parse(new TextDecoder().decode(u));
}
async function wsShare(kind, data, usesUserFont) {
  const url = location.href.split("#")[0] + "#" + kind + "=" + await wsPack(data);
  const box = $("#ws-link");
  if (box) { box.hidden = false; box.querySelector("input").value = url; }
  const done = () => toast("Ссылка скопирована — отправьте её игрокам." + (usesUserFont ? " Свой шрифт в ссылку не попадает: у игроков будет запасной." : ""));
  try { await navigator.clipboard.writeText(url); done(); } catch (_) { if (box) { const i = box.querySelector("input"); i.focus(); i.select(); } toast("Скопируйте ссылку из поля ниже."); }
}

async function publish(tool, mode, btn) {
  const box = pubBox(btn), d = PUB[tool](), c = ghCfg(), h = d.holder;
  if (!c.token) { pubSay(box, null, "Сначала подключите ключ GitHub — ниже."); return; }
  const title = d.auto, note = "";
  const doc = { v: 2, kind: d.kind, title, note, data: JSON.parse(JSON.stringify(d.data, (k, v) => META.includes(k) ? undefined : v)) };
  btn.disabled = true; const label = btn.textContent; btn.textContent = mode === "new" ? "Создаю…" : "Сохраняю…";
  try {
    let no;
    if (mode === "update" && h.pubNo) {
      no = h.pubNo;
      const { sha } = await ghRead(c, `docs/${no}.json`);
      await ghWrite(c, `docs/${no}.json`, doc, sha, `Документ №${no}: ${title}`);
      await dbUpdate(docs => { let e = docs.find(x => x.no === no); if (!e) { e = { no, public: false, created: dbToday() }; docs.push(e); } Object.assign(e, { kind: d.kind, title, updated: dbToday() }); }, `Документ №${no}: ${title}`);
    } else {
      no = await dbUpdate(async docs => {
        let max = docs.reduce((m, x) => Math.max(m, x.no), 0);
        const r = await ghApi(c, "docs"); if (r.ok) (await r.json()).forEach(f => { const m = /^(\d+)\.json$/.exec(f.name); if (m) max = Math.max(max, +m[1]); });
        const n = max + 1; docs.push({ no: n, kind: d.kind, title, note: "", vis: "to", public: false, to: [], created: dbToday(), updated: dbToday() }); docs.sort((a, b) => a.no - b.no); return n;
      }, `Новый документ: ${title}`);
      await ghWrite(c, `docs/${no}.json`, doc, null, `Документ №${no}: ${title}`);
    }
    h.pubNo = no; pubSave(tool); pubRedraw(tool, false);
    const nb = document.querySelector(`.pub[data-pub="${tool}"]`);
    pubSay(nb, shortUrl(no), mode === "update" ? `Изменения сохранены. Игроки увидят их примерно через минуту.` : `Создан документ №${no}. Пока его видят только мастера — выдайте его игрокам в списке документов.`);
  } catch (err) { btn.disabled = false; btn.textContent = label; pubSay(box, null, "Не получилось: " + (err.message || "нет связи с GitHub")); }
}

}

/* =====================================================================
   КАРТОЧКА ИГРОКА: шапка (имя, роль, «Играет» / «Отпуск») и список персонажей.

   Павшие лежат в graves.json (pid + cid) — показываются тут же под надгробием, с кнопкой «Оживить».

let PK = { gr: [], heroes: [], fate: [], kill: null, busy: false };
const pkDead = p => (PK.gr || []).filter(g => g.kind === "pc" && +g.pid === +p.id);
const pkHero = (pid, cid) => (PK.heroes || []).find(h => +h.pid === +pid && h.cid === cid);
const pkFate = c => { const id = fateOfChar(c)[0]; return id ? (PK.fate || []).find(k => k.id === id) : null; };
const PK_TOMB = `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 21V10a6 6 0 0 1 12 0v11z" fill="currentColor" opacity=".25"/><path d="M6 21V10a6 6 0 0 1 12 0v11M4 21h16M12 8v6M9.5 10.5h5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>`;
function pkCard(p) {
  const L = charsOf(p), D = pkDead(p), live = L.length, dead = D.length;

      <span class="pk-tags">${p.manual ? `<span class="pl-role">не в группе</span>` : ""}${isStaff(p) ? `<span class="pl-role r-${p.role}">${ROLE_NAMES[p.role]}</span>` : ""}${p.left ? `<span class="pl-role">вышел из группы</span>` : ""}<small>${live ? `${live} ${live === 1 ? "персонаж" : live < 5 ? "персонажа" : "персонажей"}` : "нет персонажей"}${dead ? ` · ✝ ${dead}` : ""}</small></span></div>
    <div class="pk-tg"><button type="button" class="pk-t play" data-pktog="play" data-pid="${p.id}" aria-pressed="${!!p.play}">${p.play ? "● Играет" : "○ Не играет"}</button><button type="button" class="pk-t away" data-pktog="away" data-pid="${p.id}" aria-pressed="${!!p.away}">${p.away ? "В отпуске" : "Отпуск"}</button></div>

  return `<article class="pk${p.left ? " left" : ""}${p.away ? " away" : ""}${p.play ? " on" : ""}" data-pid="${p.id}">${head}<div class="pk-list">${rows || `<p class="pk-empty">Персонажей пока нет.</p>`}<button type="button" class="pc-add" data-pcadd="${p.id}">+ персонаж</button></div></article>`;
}
function pkLive(p, c) {
  const q = charQuest(p.id, c.id), fc = pkFate(c), h = pkHero(p.id, c.id), k = PK.kill && PK.kill.pid === p.id && PK.kill.cid === c.id;
  const tags = [q ? `<span class="pk-tag q" title="Занят в квесте">⚑ ${esc(q)}</span>` : `<span class="pk-tag free">свободен</span>`,

    `<button type="button" class="pk-tag deck${h ? " has" : ""}" data-pkdeck="${p.id}:${c.id}" title="${h ? "Открыть карту в Колоде сердец" : "Создать карту в Колоде сердец"}">${h ? "♥ в колоде" : "+ карта в колоду"}</button>`].join("");
  return `<div class="pkc${k ? " killing" : ""}"><span class="pkc-ic">${pcIcons(c, q)}</span>
    <input type="text" class="pkc-n" value="${esc(c.name)}" data-pcn="${p.id}" data-cid="${c.id}" aria-label="Имя персонажа">

function pkGrave(p, g) {

    <span class="pkc-tags"><span class="pk-tag rip" title="${esc(g.cause || "")}">✝ ${esc(g.date || "пал")}${g.cause ? " · " + esc(g.cause.length > 60 ? g.cause.slice(0, 58) + "…" : g.cause) : ""}</span></span>

}
function pkKillForm(p, c) {
  const K = PK.kill, pls = PL.list.filter(x => plays(x) || K.killers.includes(x.id)).sort((a, b) => String(a.name).localeCompare(String(b.name), "ru"));
  return `<div class="pk-kill"><b>Похоронить: ${esc(c.name)}</b>
    <label class="va-f"><span>Причина смерти</span><textarea rows="2" data-pkk="cause" placeholder="Пал от рук обескровленных у стен Эпиры…">${esc(K.cause)}</textarea></label>
    <div class="pk-kg"><label class="va-f"><span>Когда</span><input type="text" data-pkk="date" value="${esc(K.date)}"></label><label class="va-f"><span>Надпись на надгробии</span><input type="text" data-pkk="ep" value="${esc(K.ep)}" placeholder="необязательно"></label><label class="va-f"><span>Очки убийцам</span><input type="number" min="1" max="50" data-pkk="pts" value="${K.pts}"></label></div>
    <span class="ha-l">Кто убил — для Зала славы</span><div class="ga-kchips">${pls.filter(x => x.id !== p.id).map(x => `<button type="button" data-pkkiller="${x.id}" aria-pressed="${K.killers.includes(x.id)}">${esc(x.name)}</button>`).join("")}</div>
    <div class="actions"><button type="button" class="btn" data-pkbury ${PK.busy ? "disabled" : ""}>${PK.busy ? "Хороню…" : "✝ Похоронить"}</button><button type="button" class="btn ghost" data-pkcancel>Отмена</button></div>
    <small class="note">Персонаж исчезнет у игрока: из квестов, фракций и выборов. Карта Судьбы и карта в Колоде сердец сохранятся и вернутся вместе с ним, если его оживить.</small></div>`;
}
const pkToday = () => { const d = new Date(); return `${d.getDate()} ${["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"][d.getMonth()]}`; };
async function pkBury() {
  if (!ghCfg().token) return toast("Сначала подключите ключ GitHub.");
  const K = PK.kill; PK.busy = true; plDraw();
  try {
    let rec = null;
    PL = await plUpdate(P => { const p = P.list.find(x => x.id === K.pid); if (!p) return; const cs = charsOf(p).map(c => Object.assign({}, c)), c = cs.find(x => x.id === K.cid); if (!c) return; rec = { char: c, player: p.name }; setChars(p, cs.filter(x => x.id !== K.cid)); }, "Кладбище: персонаж пал");
    if (!rec) throw new Error("персонаж не найден — обновите страницу");
    const G = await grUpdate(G => G.list.unshift({ id: "g" + Date.now().toString(36), kind: "pc", n: rec.char.name, pid: K.pid, cid: K.cid, player: rec.player, fac: rec.char.fac || "", char: rec.char, cause: K.cause.trim(), date: K.date.trim(), ep: K.ep.trim(), killers: K.killers.slice(), pts: Math.max(1, Math.min(50, Math.round(+K.pts || 1))) }), `Кладбище: ${rec.char.name}`);
    PK.gr = G.list; toast(`${rec.char.name} похоронен. Надгробие появится на сайте через минуту.`); PK.kill = null;
  } catch (e) { toast("Не получилось: " + e.message); }
  PK.busy = false; plDraw();
}
async function pkRise(gid) {
  if (!ghCfg().token) return toast("Сначала подключите ключ GitHub.");
  const g = (PK.gr || []).find(x => x.id === gid); if (!g) return;
  try {
    if (g.char) PL = await plUpdate(P => { const p = P.list.find(x => x.id === g.pid); if (!p) return; const cs = charsOf(p).map(c => Object.assign({}, c)); if (!cs.some(c => c.id === g.cid)) cs.push(g.char); setChars(p, cs); }, `Кладбище: ${g.n} вернулся`);
    PK.gr = (await grUpdate(G => { G.list = G.list.filter(x => x.id !== g.id); }, `Кладбище: ${g.n} вернулся`)).list;
    toast(`${g.n} снова среди живых.`);
  } catch (e) { toast("Не получилось: " + e.message); }
  PK.riseAsk = null; plDraw();
}
document.addEventListener("click", e => {
  const t = e.target; if (!t.closest || !t.closest(".pk")) return;
  const tg = t.closest("[data-pktog]"); if (tg) { const id = +tg.dataset.pid, k = tg.dataset.pktog, p = PL.list.find(x => x.id === id); if (!p) return; plSaveOne(id, { [k]: !p[k] }); plDraw(); return; }
  const kl = t.closest("[data-pkkill]"); if (kl) { const [pid, cid] = kl.dataset.pkkill.split(":"); PK.kill = PK.kill && PK.kill.cid === cid ? null : { pid: +pid, cid, cause: "", date: pkToday(), ep: "", pts: 1, killers: [] }; plDraw(); return; }
  const kr = t.closest("[data-pkkiller]"); if (kr && PK.kill) { const id = +kr.dataset.pkkiller, K = PK.kill.killers, i = K.indexOf(id); if (i >= 0) K.splice(i, 1); else K.push(id); kr.setAttribute("aria-pressed", String(i < 0)); return; }
  if (t.closest("[data-pkcancel]")) { PK.kill = null; plDraw(); return; }
  if (t.closest("[data-pkbury]")) return pkBury();
  const rs = t.closest("[data-pkrise]"); if (rs) { const id = rs.dataset.pkrise; if (PK.riseAsk === id) return pkRise(id); PK.riseAsk = id; plDraw(); setTimeout(() => { if (PK.riseAsk === id) { PK.riseAsk = null; plDraw(); } }, 4000); return; }
  const fc = t.closest("[data-pkfate]"); if (fc) { FA.sel = fc.dataset.pkfate; FA.form = null; location.hash = "sudba"; return; }
  const dk = t.closest("[data-pkdeck]"); if (dk) { HA.goto = dk.dataset.pkdeck; location.hash = "geroi"; return; }
});

/* =====================================================================
   ФРАКЦИИ В МАСТЕРСКОЙ: какие персонажи (игроков и мастера) к кому принадлежат.
   Хранится у персонажей в docs/players.json: chars[].fac, а NPC мастера — в npcs[].
   ===================================================================== */
let FPL = { list: [], npcs: [] }, fPick = null;
const facAll = () => FACTIONS.filter(f => !FAC_HIDDEN.includes(f.id)).concat([FAC_NONE]);
function facMembers(fid) {
  const out = [];
  (FPL.list || []).filter(p => !p.left).forEach(p => charsOf(p).forEach(c => { if (facsOf(c).includes(fid)) out.push({ key: p.id + ":" + c.id, c, p }); }));
  (FPL.npcs || []).forEach(n => { if (facsOf(n).includes(fid)) out.push({ key: "npc:" + n.id, c: n, p: null }); });
  return out.sort((a, b) => a.c.name.localeCompare(b.c.name, "ru"));
}
function memberChip(m) {
  const pl = m.p, title = pl ? `${m.c.name} — игрок ${pl.name}` : `${m.c.name} — NPC мастера`;
  return `<span class="fm" title="${esc(title)}${facsOf(m.c).length > 1 ? " · " + esc(facNames(m.c)) : ""}" style="${facBg(m.c)}">${pl && pl.photo ? `<img src="${esc(pl.photo)}" alt="">` : `<b class="${pl ? "" : "npc"}">${pl ? esc(pl.name.charAt(0)) : "NPC"}</b>`}<span class="fm-n">${esc(m.c.name)}</span><small>${pl ? esc(initials(pl.name)) : "мастер"}</small><button type="button" data-fmrm="${esc(m.key)}" aria-label="Убрать из фракции">×</button></span>`;
}
function factionsAdminHTML() {
  return `<div class="fa wide">
    <p class="lw-lead">Кто из персонажей к какой фракции принадлежит. «+» — добавить персонажа игрока или NPC мастера.</p>
    <div id="fa-list"><p class="lw-lead">Загружаю…</p></div>
    ${ghCfg().token ? "" : `<p class="lw-lead">Чтобы сохранять, подключите ключ GitHub:</p>${ghSetHTML()}`}
  </div>`;
}
function faDraw() {
  const box = $("#fa-list"); if (!box) return;
  const free = []; (FPL.list || []).filter(p => !p.left && p.play).forEach(p => charsOf(p).forEach(c => { if (!facsOf(c).length) free.push(c.name); }));
  const cnt = id => facMembers(id).length;
  const TOP = ["crown"]; /* Императорская власть — всегда сверху */
  const order = FACTIONS.filter(f => !TOP.includes(f.id) && !FAC_HIDDEN.includes(f.id)).sort((a, b) => cnt(b.id) - cnt(a.id) || FACTIONS.indexOf(a) - FACTIONS.indexOf(b));
  const all = TOP.map(id => FACTIONS.find(f => f.id === id)).filter(Boolean).concat(order, [FAC_NONE]);
  box.innerHTML = all.map(f => { const M = facMembers(f.id);
    return `<section class="fa-card" data-fid="${f.id}" style="--fc:${f.color}"><header><i></i><b>${esc(f.name)}</b><span>${M.length}</span></header>
      <div class="fa-mem">${M.map(memberChip).join("")}<button type="button" class="ava-add" data-faadd="${f.id}" aria-label="Добавить персонажа" title="Добавить персонажа">+</button></div>
      ${fPick === f.id ? `<div class="qa-pick"><input type="search" data-faq placeholder="Найти персонажа или вписать NPC мастера…" autocomplete="off"><div class="qa-res"></div></div>` : ""}</section>`; }).join("") +
    (free.length ? `<p class="fa-free"><b>Без фракции (${free.length}):</b> ${free.map(esc).join(", ")}</p>` : "");
}
function faResults(box, val) {
  const v = (val || "").trim(), lv = v.toLowerCase(), rows = [];
  (FPL.list || []).filter(plays).forEach(p => charsOf(p).forEach(c => { if (!facsOf(c).includes(fPick)) rows.push({ key: p.id + ":" + c.id, c, p, hay: (c.name + " " + p.name).toLowerCase() }); }));
  (FPL.npcs || []).forEach(n => { if (!facsOf(n).includes(fPick)) rows.push({ key: "npc:" + n.id, c: n, p: null, hay: n.name.toLowerCase() }); });
  const list = rows.filter(r => !lv || r.hay.includes(lv)).sort((a, b) => (facsOf(a.c).length ? 1 : 0) - (facsOf(b.c).length ? 1 : 0) || a.c.name.localeCompare(b.c.name, "ru"));
  box.querySelector(".qa-res").innerHTML = list.map(r => `<button type="button" data-fapick="${esc(r.key)}">${r.p && r.p.photo ? `<img src="${esc(r.p.photo)}" alt="">` : ""}<span><b>${esc(r.c.name)}</b> · ${r.p ? esc(r.p.name) : "NPC мастера"}</span>${facsOf(r.c).length ? `<i class="busy">${facsOf(r.c).includes("none") ? "Странник — переедет" : "также в: " + esc(facNames(r.c))}</i>` : `<i>без фракции</i>`}</button>`).join("") +
    (v.length > 1 ? `<button type="button" data-fanpc="${esc(v)}"><span>＋ NPC мастера: <b>${esc(v)}</b></span></button>` : "");
}
async function faInit() { try { FPL = await plLoad(!!ghCfg().token); FPL.list = FPL.list || []; FPL.npcs = FPL.npcs || []; } catch (err) { toast("Не получилось загрузить: " + err.message); } faDraw(); }
async function faSet(key, fac, add) {
  if (!ghCfg().token) { toast("Чтобы сохранить, подключите ключ GitHub."); return; }
  const upd = c => { const cur = facsOf(c); setFacs(c, add ? (fac === "none" ? ["none"] : cur.filter(x => x !== "none").concat([fac])) : cur.filter(x => x !== fac)); };
  const apply = P => {
    if (key.startsWith("npc:")) { P.npcs = P.npcs || []; const n = P.npcs.find(x => x.id === key.slice(4)); if (n) { upd(n); if (!facsOf(n).length) P.npcs = P.npcs.filter(x => x !== n); } return; }
    const [pid, cid] = key.split(":"), p = P.list.find(x => x.id === +pid); if (!p) return;
    const cs = charsOf(p).map(c => Object.assign({}, c)), c = cs.find(x => x.id === cid); if (!c) return; upd(c); setChars(p, cs);
  };
  apply(FPL); faDraw();
  try { FPL = await plUpdate(P => apply(P), "Фракции персонажей"); FPL.npcs = FPL.npcs || []; faDraw(); }
  catch (err) { toast("Не получилось: " + err.message); faInit(); }
}
document.addEventListener("click", e => {
  const b = e.target.closest && e.target.closest("[data-faadd],[data-fapick],[data-fanpc],[data-fmrm]"); if (!b) return;
  if (b.dataset.faadd) { fPick = fPick === b.dataset.faadd ? null : b.dataset.faadd; faDraw(); const i = document.querySelector("[data-faq]"); if (i) { i.focus(); faResults(i.closest(".qa-pick"), ""); } return; }
  if (b.dataset.fapick) { const f = fPick; faSet(b.dataset.fapick, f, true).then(() => { const i = document.querySelector("[data-faq]"); if (i) faResults(i.closest(".qa-pick"), i.value); }); return; }
  if (b.dataset.fanpc) { const f = fPick, id = newCid(); fPick = null; FPL.npcs.push({ id, name: b.dataset.fanpc, fac: f, facs: [f] }); faDraw();
    if (ghCfg().token) plUpdate(P => { P.npcs = P.npcs || []; P.npcs.push({ id, name: b.dataset.fanpc, fac: f, facs: [f] }); }, "NPC мастера: " + b.dataset.fanpc).then(P => { FPL = P; FPL.npcs = FPL.npcs || []; faDraw(); }).catch(err => toast("Не получилось: " + err.message)); return; }
  if (b.dataset.fmrm) {
    const k = b.dataset.fmrm;
    const fid = b.closest(".fa-card").dataset.fid;

  }
});
document.addEventListener("input", e => { if (e.target.hasAttribute && e.target.hasAttribute("data-faq")) faResults(e.target.closest(".qa-pick"), e.target.value); });
document.addEventListener("pointerdown", e => { if (fPick && !(e.target.closest && e.target.closest(".fa-card .qa-pick, [data-faadd]"))) { fPick = null; faDraw(); } });

/* =====================================================================

let FS = { sel: null, color: "", svg: "", icon: "", cat: "war", q: "" };
const fsShield = (color, svg, cls = "") => `<span class="fs-emb ${cls}" style="--fc:${color}"><svg viewBox="0 0 24 24" aria-hidden="true">${svg || ""}</svg></span>`;
function facStyleHTML() {
  return `<div class="wide"><p class="lw-lead">Выберите фракцию, затем цвет и значок. После сохранения они сменятся везде: в меню, на карте, у персонажей и в квестах.</p>
    <div class="fs-wrap"><div class="fs-list" id="fs-list"></div><div class="fs-ed" id="fs-ed"><p class="note">Выберите фракцию слева.</p></div></div></div>`;
}
let FS_ST = null;
function fsInit() {
  stLoad(!!ghCfg().token).then(S => { FS_ST = S; facStyleApply(S); fsList(); if (FS.sel) fsEditor(); }).catch(() => fsList());
  fsList();
}
function fsList() {
  const box = $("#fs-list"); if (!box) return;
  box.innerHTML = FACTIONS.map(f => `<button type="button" class="fs-row${FS.sel === f.id ? " on" : ""}" data-fssel="${f.id}">${fsShield(f.color, EMBLEMS[f.id])}<span><b>${esc(f.name)}</b><small>${f.known ? "Известна всем" : "Тайная"}</small></span></button>`).join("");
}
function fsEditor() {
  const f = FACTIONS.find(x => x.id === FS.sel), box = $("#fs-ed"); if (!f || !box) return;
  const cats = [["base", "Исходные"]].concat(FS_ICONS.map(c => [c[0], c[1]]));
  const list = FS.q ? FS_ICONS.flatMap(c => c[2]).filter(i => i[0].toLowerCase().includes(FS.q.toLowerCase()))
    : FS.cat === "base" ? FACTIONS.filter(x => FAC_DEFAULT[x.id] && FAC_DEFAULT[x.id].svg).map(x => [x.name, FAC_DEFAULT[x.id].svg])
    : (FS_ICONS.find(c => c[0] === FS.cat) || FS_ICONS[0])[2];
  const def = FAC_DEFAULT[f.id] || {};
  box.innerHTML = `<div class="fs-top">${fsShield(FS.color, facScaled(FS.svg, FS.scale), "big")}<div><h3>${esc(f.name)}</h3><p class="note">${esc(f.kind || "")}</p></div></div>
    <h4>Цвет</h4><div class="fs-colors">${FS_PALETTE.map(([c, n]) => `<button type="button" class="fs-c${FS.color === c ? " on" : ""}" data-fscol="${c}" style="--c:${c}" title="${n}"></button>`).join("")}
      ${def.color && !FS_PALETTE.some(p => p[0] === def.color) ? `<button type="button" class="fs-c${FS.color === def.color ? " on" : ""}" data-fscol="${def.color}" style="--c:${def.color}" title="Исходный"></button>` : ""}</div>
    <h4>Размер значка</h4><div class="fs-sizes">${FAC_SCALES.map(p => `<button type="button" data-fsscale="${p}" aria-pressed="${(+FS.scale || 0) === p}">${p ? "+" + p + "%" : "Обычный"}</button>`).join("")}</div>
    <h4>Значок <small>${FS_ICONS.reduce((n, c) => n + c[2].length, 0)} на выбор</small></h4>
    <div class="fs-cats">${cats.map(([k, t]) => `<button type="button" data-fscat="${k}" aria-pressed="${!FS.q && FS.cat === k}">${t}</button>`).join("")}<input type="search" id="fs-q" placeholder="Поиск значка" value="${esc(FS.q)}"></div>
    <div class="fs-grid">${list.map(([n, d]) => { const svg = fsSvg(d); return `<button type="button" class="fs-i${svg === FS.svg ? " on" : ""}" data-fsico="${esc(n)}" title="${esc(n)}" style="--fc:${FS.color}"><svg viewBox="0 0 24 24" aria-hidden="true">${svg}</svg></button>`; }).join("") || `<p class="note">Ничего не нашлось.</p>`}</div>
    <div class="actions fs-act"><button type="button" class="btn" data-fssave>Сохранить</button><button type="button" class="btn ghost" data-fsreset>Вернуть исходные</button></div>`;
}
function fsPickIcon(name) {
  const all = FS_ICONS.flatMap(c => c[2]).concat(FACTIONS.filter(x => FAC_DEFAULT[x.id]).map(x => [x.name, FAC_DEFAULT[x.id].svg]));
  const it = all.find(i => i[0] === name); if (!it) return;
  FS.svg = fsSvg(it[1]); FS.icon = name; fsEditor();
}
async function fsSave(reset) {
  if (!ghCfg().token) { toast("Сначала подключите ключ GitHub."); return; }
  const id = FS.sel, btn = $(reset ? "[data-fsreset]" : "[data-fssave]"); if (btn) { btn.disabled = true; btn.textContent = "Сохраняю…"; }
  try {
    const S = await stUpdate(S => { S.facStyle = S.facStyle || {}; if (reset) delete S.facStyle[id]; else S.facStyle[id] = { color: FS.color, icon: FS.icon, svg: FS.svg }; if (+FS.scale) S.facStyle[id].scale = +FS.scale; }, `Знак фракции «${(FACTIONS.find(x => x.id === id) || {}).name}»`);
    FS_ST = S; facStyleApply(S); const f = FACTIONS.find(x => x.id === id); FS.color = f.color; FS.svg = FAC_RAW[id]; FS.scale = ((S.facStyle || {})[id] || {}).scale || 0;
    fsList(); fsEditor(); toast(reset ? "Вернул исходный знак и цвет." : "Сохранено. В меню и на карте обновится через минуту-две.");
  } catch (err) { toast("Не получилось: " + err.message); fsEditor(); }
}
document.addEventListener("click", e => {
  const t = e.target;
  const s = t.closest("[data-fssel]"); if (s) { const f = FACTIONS.find(x => x.id === s.dataset.fssel); FS.sel = f.id; FS.color = f.color; FS.svg = FAC_RAW[f.id] || EMBLEMS[f.id] || ""; FS.icon = ""; FS.scale = ((FS_ST && FS_ST.facStyle || {})[f.id] || {}).scale || 0; fsList(); fsEditor(); const ed = $("#fs-ed"); if (ed && innerWidth < 900) ed.scrollIntoView({ behavior: "smooth" }); return; }
  const sc = t.closest("[data-fsscale]"); if (sc) { FS.scale = +sc.dataset.fsscale; fsEditor(); return; }
  const c = t.closest("[data-fscol]"); if (c) { FS.color = c.dataset.fscol; fsEditor(); return; }
  const k = t.closest("[data-fscat]"); if (k) { FS.cat = k.dataset.fscat; FS.q = ""; fsEditor(); return; }
  const i = t.closest("[data-fsico]"); if (i) { fsPickIcon(i.dataset.fsico); return; }
  if (t.closest("[data-fssave]")) { fsSave(false); return; }
  if (t.closest("[data-fsreset]")) { askYes("Вернуть фракции исходный значок и цвет?", "Вернуть", "Отмена").then(ok => ok && fsSave(true)); }

const VESTNIK_SEED = [{"d": "01.08 – 09.08", "url": "https://vk.ru/@sagggakrov-vestnik-velarisa-0108-0908", "head": "Дожди, шторм и миграция обескровленных", "p": ["В империи продолжаются тревожные времена. В Тенеграде уже вторую неделю идут проливные дожди, улицы затоплены, а в Гнилом уделе бушует шторм, из-за которого рыбаки не могут выйти в море. В Верхнем пределе — столице — погода ясная и прохладная, но горожане чувствуют напряжение. В Кальдероне, Сарконии, Лесу Страсти и Эпире тепло и солнечно.", "В Эпире наследник императора Винсент Торнвуд вместе с матерью Роксаной проводят благотворительную миссию: раздают горячую еду и воду всем нуждающимся. Однако в толпе ходят слухи, что наследник прибыл не просто так — возможно, он кого-то ищет.", "На юге зафиксирована миграция обескровленных в сторону столицы. Императорская армия и Орден Пылающего Сердца уже вступили с ними в бой недалеко от Гнилого удела. Потерь среди солдат пока нет, но ситуация напряжённая. Жителям рекомендуют не выходить из домов и иметь при себе огонь.", "Также произошёл пожар в Торговом форпосте — предполагают, что причина в конфликте контрабандистов. Император Кассель Торнвуд подписал указ об усилении патрулей в приграничных районах."], "ads": "Набор в гильдию «Плата и сталь», продажа дома в Тенеграде, поиск пропавшей девушки из Ясной Поляны, выступление оркестра в Гнилом уделе и открытая лекция о травах в Сарконии."}, {"d": "06.08", "url": "https://vk.ru/@sagggakrov-vestnik-velarisa-0608", "head": "Пропала Маргарет Торнвуд", "p": ["Пропала 14-летняя Маргарет Торнвуд, младшая дочь императора. Она исчезла у стен Эпиры — гвардейцев нашли дезориентированными, они говорят о внезапном тумане. Император объявил награду: 10 000 империалов за информацию, 20 000 — за спасение живой. Наследник Винсент лично возглавил поисковый отряд в горах.", "Погода: в Тенеграде вода отступает, но грязь и болезни остались; в Гнилом уделе шторм стих, но море выбросило обломки кораблей; в столице солнечно и ветрено, охрана дворца усилена; в Кальдероне и Сарконии — небывалая жара; в Эпире — тепло, но патрули Ордена усиливаются.", "Южный рубеж: армия и Орден оттеснили обескровленных на 12 км от Гнилого удела, уничтожив более 50 тварей. Есть раненые, один тяжело. Главное — обескровленные начали действовать организованно, строем. Жителям приграничья рекомендована эвакуация.", "Орден Пылающего Сердца ужесточил наказания за ложные слухи и панику; трое задержаны за самосуд. Завершено дознание о пожаре в Торговом форпосте — обнаружены следы тёмного ритуала, подозреваемый задержан и передан инквизиции."], "ads": "Экстренный набор в Орден, поиск пропавшего мужчины в Эпире, нужны горные проводники для отряда Винсента, кузнецы Кальдерона ищут подмастерьев, сбор помощи в Тенеграде, таверна в Эпире платит грогом за информацию о леди Маргарет."}, {"d": "16.08", "url": "https://vk.ru/@sagggakrov-vestnik-velarisa-1608", "head": "Десять дней без принцессы. Сгорел храм Триединства", "p": ["Маргарет Торнвуд не найдена уже десять дней. Гвардейцев, сопровождавших её, казнили. Винсент Торнвуд вторую неделю лично ищет сестру в горах; отряд нашёл следы лагеря в ущелье, но поиски осложнил камнепад. Награда удвоена: 30 000 империалов за живую, 15 000 за сведения.", "Погода: в Тенеграде — дымка и запах гари, в Гнилом уделе — «мёртвая вода» и скудный улов, в столице — холодно и ветрено, в Кальдероне и Сарконии — пик жары, в Лесу Страсти и Эпире — странное марево и звон в ушах.", "Тенеград: храм Триединства сгорел дотла. Погибли паладин Альдрик Фарн и настоятель отец Ивесий — оба посмертно награждены, семьям выплачено по 5 000 империалов. Причина пожара — магический след.", "Кальдерон: Орден уничтожил четырёх магов-отступников, включая опасную преступницу Лидию Верн. Погиб один боевой маг, четверо солдат ранены. Лес объявлен запретной зоной. Также город атаковала гильдия «Тени Кальдерона»: убиты семь стражников, введён комендантский час.", "«Тихая Длань»: анонимная организация открыла пункты помощи в Тенеграде, Эпире и у Красной марки — кров, еда, лекарства, анонимность.", "Коротко: нападение обескровленных на караван в Эпире; странная лихорадка у детей в Гнилом уделе; смотр Императорской гвардии в столице; необычный вой в Лесу Страсти.", "Торговый форпост: объявился загадочный торговец «Кузнец» с запрещёнными артефактами против обескровленных и магов. Орден уже заинтересовался им."], "ads": "Набор в Орден, нужны горные проводники, сбор помощи в Тенеграде, таверна «Тихий огонь» платит грогом за информацию, ищут торговца древними книгами."}, {"d": "24.08", "url": "https://vk.ru/@sagggakrov-vestnik-velarisa-2408", "head": "Кальдерон пал", "p": ["Маргарет Торнвуд всё ещё не найдена. Отряд Винсента расширен до 50 человек; в ущелье найдены обрывки розового шёлка, но подлинность не подтверждена. Поиски осложняют заморозки и вспышка скверны. Награда поднята до 40 000 империалов за информацию и 25 000 за спасение.", "Экстренно: в горах у Эпиры вспышка скверны — дорога между Тенеградом и Эпирой перекрыта, поиски приостановлены. Орден уверяет, что очаг локализован.", "Тенеград: власть перешла к Дому Верн с одобрения императора. Городом управляет Изабель Верн — «Леди Туман». «Тихая Длань» признана главной благотворительной структурой. Орден почти покинул город; растут сепаратистские настроения.", "Кальдерон пал: гильдия «Тени Кальдерона» во главе с «Костоломом» захватила город. Штаб Ордена сожжён, более 20 членов Ордена погибли. Император отправил парламентёров, армия занята на юге. Город — первый, вышедший из-под контроля Империи.", "Эпира: загадочная смерть торговца Маркуса Холла — без ран и болезней, очевидцы винят туман и странный шёпот. В горах найдены следы неизвестного существа — трёхпалая птичья лапа, ведущая в западные ущелья.", "Гнилой удел: к порту прибило плот с четырьмя мёртвыми с застывшими от ужаса лицами; причина смерти неизвестна, плот сожжён. Лекари фиксируют 19 случаев детской лихорадки.", "Столица: Кассель Торнвуд выступил с речью — призвал не паниковать, обещал вернуть Кальдерон, найти дочь и победить скверну. Горожане поддерживают, но шепчутся о слишком многих неудачах.", "Прочее: нападение обескровленных на караван в Эпире; Орден отразил крупную атаку у Гнилого удела; вой в Лесу Страсти; в Тенеграде прошёл закрытый приём «Тихой Длани» — говорят об «альтернативном совете»."], "ads": "Экстренный набор в Орден, лагеря для беженцев из Кальдерона в Сарконии, нужны горные проводники, сбор помощи в Тенеграде и Эпире, таверна «Тихий огонь» платит грогом за информацию, кузнецы Сарконии ищут подмастерьев."}, {"d": "03.09", "url": "https://vk.ru/@sagggakrov-vestnik-velarisa-0309", "head": "Резня в доме Спенсеров", "p": ["Вспышка скверны в горах Эпиры отступила, проезд между Тенеградом и Эпирой снова открыт. Обескровленные ушли вглубь гор, карантин в Эпире снят. Император распорядился возобновить поставки продовольствия и медикаментов. Гуманитарные обеды возглавляют члены императорской семьи в разных городах.", "Поиски принцессы: Маргарет не найдена почти три недели. Отряд Винсента передислоцировался в западные ущелья. Обрывки шёлка не подтверждены. Награда — 100 000 империалов. Винсент заявил: «Я не вернусь без неё».", "Эпира: чудовищная резня в доме Спенсеров — убиты восемь человек, включая наследника управленца, его жену, сыновей-близнецов и слуг. Следов взлома и ограбления нет. Орден подозревает магов или контрабандистов.", "Ограбления: волна дерзких ограблений в Эпире и Сарконии. Подозревают экспансию «Теней Кальдерона». Император поручил Ордену усилить патрули.", "Тенеград: Дом Верн укрепляет власть, Изабель Верн управляет жёстко, но справедливо. Орден почти отсутствует. Город всё более независим. «Тихая Длань» продолжает работу. Новые загадочные смерти — ещё два случая.", "Гнилой удел: число заболевших лихорадкой достигло 35. Власти просят помощи столицы. Столица: император готовит кадровые перестановки после череды неудач.", "Прочее: на южном рубеже Орден отразил атаку обескровленных; в Лесу Страсти следы есть, но вой не найден; в Тенеграде Верн планирует свой городской совет."], "ads": "Бюро перевозок «Свет Ореона», набор в Орден, лагеря для беженцев, нужны горные проводники, сбор помощи «Тихой Длани», таверна «Тихий огонь» платит за информацию, кузнецы Сарконии ищут подмастерьев."}, {"d": "13.09", "url": "https://vk.ru/@sagggakrov-vestnik-velarisa-1309", "head": "Туман растёт. Пропали трое аристократов", "p": ["В Империю пришли ранние холода, а туман с гор Эпиры растёт и охватывает всё больше людей. Источник не найден. У людей — кашель, головокружение, странные сны. Орден призывает не приближаться к туману, держать окна закрытыми и постоянно поддерживать огонь. Жители Эпиры начинают покидать дома у гор, в городе паника.", "Поиски принцессы: Маргарет не найдена четвёртую неделю. Винсент продвинулся в западные ущелья, но безрезультатно. Награда — 100 000 империалов, но надежды тают.", "Пропажа аристократов: в Гнилом уделе исчезли трое молодых аристократов — Исабель Верн (дочь управляющей Тенеградом), Миления Фон Торн (дочь Верховного Инквизитора) и Эдвир Лугар. Верховный Инквизитор лично занимается поисками.", "Розыск: Орден объявил в розыск опасную магессу Розали Винвельт — запретные ритуалы, связи с тёмными культами, магия внушения. Награда: 20 000 за информацию, 50 000 за поимку.", "Эпира: взрыв и пожар в ювелирной лавке; расследование резни в доме Спенсеров продолжается; череда ограблений прекратилась — Орден подтвердил причастность «Теней Кальдерона».", "Тенеград: Изабель Верн укрепляет власть, Орден выслал отряд, но город всё более независим. Гнилой удел: число заболевших лихорадкой достигло 68. Столица: император провёл кадровые перестановки после череды кризисов."], "ads": "Лавка ритуальных услуг «Крест и топор», набор в Орден, лагеря для беженцев, нужны горные проводники, сбор помощи «Тихой Длани», таверна «Тихий огонь» платит за информацию (включая Розали Винвельт), кузнецы Сарконии ищут подмастерьев."}, {"d": "27.09", "url": "", "head": "Орды у Леса Страсти. Железные острова в столице", "p": ["Орды обескровленных движутся через Лес Страсти к землям Велариса. Они не атакуют первыми — занимают позиции и ждут. Орден подтверждает: это наступление, не миграция.", "Император Маррис Хладнор (Железные острова) прибыл в Верхний предел на переговоры с Касселем и привёл около 200 воинов. Итоги встречи неизвестны, Кассель вышел мрачным. Ходят слухи о возможном военном или брачном союзе: Хладнор привёз двух дочерей.", "Гнилой удел закрыт на карантин — неизвестная эпидемия, лекари бессильны. Джорах Спенсер, потерявший семью, финансирует закупку лекарств, «Тихая Длань» помогает.", "Великий съезд Ордена: переброска сил под Тенеград, ужесточение против магов (сокрытие — соучастие). Саркония готовится к крупнейшей казни — среди осуждённых бывший советник Императора и двое магов.", "«Кузнец», таинственный торговец, исчез; фонтан с орлом оцеплен Орденом.", "Погода: Тенеград — тревога, мобилизация Дома Верн; Гнилой удел — карантин; Верхний предел — усиленная охрана; Кальдерон — закрыт изнутри; Лес Страсти и Эпира — туман."], "ads": "Набор в Орден, помощь беженцам, поиск проводников для отряда Винсента, награда за информацию о Маргарет, Розали Винвельт и тумане."}, {"d": "22.10", "url": "", "img": "vestnik/2210.webp", "cap": "Беженка у стен Эпиры. Рисунок с натуры.", "head": "Волна обескровленных. Лес Страсти наступает", "p": ["Обескровленные больше не «ждут». Минувшей ночью из Леса Страсти пошла большая волна — плотная, организованная, и, по словам разведчиков, с каждым часом она только прибывает. Орден Пылающего Сердца официально подтверждает: это не отдельные группы, а массовое наступление на живые земли. Силам Ордена удаётся сдерживать волну у границ Эпиры, бои идут на подступах к городу, у восточных трактов. «Мы держим их, но они не кончаются!» — признаётся командир одного из заслонов. Жителям Эпиры приказано не покидать город без крайней необходимости, все дороги к Лесу перекрыты. Поиски Маргарет Торнвуд продолжаются; отряд Винсента вернулся в столицу.", "Итоги переговоров с Железными островами: Переговоры Императора Касселя Торнвуда и Императора Железных островов Марриса Хладнора завершились. Итоги оглашены лишь частично: в Веларис прибыло ещё около тысячи воинов с Железных островов. Они размещены в столице и, по слухам, готовятся к отправке к Лесу Страсти и в Сарконию. Стороны «достигли взаимопонимания по вопросам обороны и безопасности». Власти просят жителей быть аккуратнее в разговорах и не разжигать ненависть к гостям с Железных островов — подобное карается выговором и задержанием.", "Эпира — убит магистр Винсент: Глава обороны и безопасности города, 58 лет, найден мёртвым в собственном доме. Тело изувечено до неузнаваемости: убийцы вырвали ему язык и обескровили тело почти досуха. Стража оцепила квартал, Орден начал собственное дознание. За пару дней до гибели магистр призывал горожан не слушать сторонние организации: «Никто в Веларисе, кроме Императора и Ордена, не несёт правды. Мерзкие червяки, что пользуются нашей болью, не должны иметь права власти над людьми!» Кого он имел в виду — «Тихую Длань», Теней Кальдерона или кого-то ещё? Совет мудрецов обещает скоро назначить нового главу обороны.", "Саркония — первый шаг к разрушению: По всему городу прошли массовые беспорядки и взрывы, устроенные Тенями Кальдерона. Главные ворота уничтожены. Жители эвакуированы в лагеря у восточных ворот. Бои прекращены, Саркония всё ещё принадлежит Ордену и власти Велариса, но восстановление потребует сил.", "Казнь в Сарконии отменена: В ходе взрывов тюремные конвои были атакованы, и все, кто должен был быть повешен, бежали — среди них бывший советник Императора и двое магов из Сарконии. Орден объявил их в розыск.", "Въезд в Гнилой удел запрещён: Город закрыт на карантин; въезд и выезд — только для Ордена и представителей закона. Жителям предписано не покидать дома.", "Хельград — стены как кладбище Ордена: Власти подтверждают: город не под контролем Императора, приближаться запрещено. Уцелевшие стены увешаны телами членов function route() {
  const id = location.hash.slice(1), sh = id.match(/^(kniga|stopka)=(.+)$/);
  if (sh) return wsOpenShared(sh[1], sh[2]);
  if (/^\d{1,8}$/.test(id)) return wsOpenNumber(id);
  if (document.documentElement.classList.contains("shared")) { document.documentElement.classList.remove("shared"); wsCloseViewer(); }
  wsCloseViewer();
  if (!isAdmin()) {
    $("#rail").innerHTML = "";
    $("#sheet").innerHTML = `<div class="gate wide"><h2>Мастерская закрыта</h2><p>Здесь мастера создают письма, книги и бумаги. Она открыта администраторам и редакторам группы — откройте её из приложения ВК, из раздела «Документы».</p><p>Мастер на новом устройстве может войти, подключив свой ключ GitHub:</p>${ghSetHTML()}</div>`;
    document.title = "Мастерская Велариса"; return;
  }
  const ed = id.match(/^edit-(\d+)$/); if (ed) { $("#sheet").innerHTML = `<p class="lw-lead">Открываю документ №${ed[1]}…</p>`; return editDoc(+ed[1]); }
  if (!id || id === "menu") {
    $("#rail").innerHTML = ""; $(".layout").classList.add("home"); $(".wsback").hidden = true; if (window.parent !== window) $(".hubback").hidden = false;
    $("#sheet").innerHTML = wsHomeHTML(); wsRouted = true; document.title = "Мастерская Велариса"; return;
  }
  const t = TOOLS.find(x => x[0] === id) || TOOLS[0];
  $(".layout").classList.add("home"); $("#rail").innerHTML = ""; $(".wsback").hidden = false; $(".hubback").hidden = true;
  $("#sheet").innerHTML = wsTabsHTML(t[0]) + t[2](); if (t[3]) t[3]();
  if (PUB[t[0]]) pubSync(t[0]);
  wsRouted = true;
  document.title = t[1] + " — Мастерская Велариса";
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-tool]"); if (b) { location.hash = b.dataset.tool; return; }
  const z = e.target.closest("#zoom");
  if (z) {
    if (z._dragged) { z._dragged = false; return; }
    const img = z.querySelector("img");
    if (e.target === img) {
      if (!z.classList.contains("big")) {
        const r = img.getBoundingClientRect(), fx = (e.clientX - r.left) / r.width, fy = (e.clientY - r.top) / r.height;
        z.classList.add("big"); z.querySelector(".zhint").textContent = "Тяните, чтобы двигать. Нажмите ещё раз — отдалить";
        z.scrollLeft = img.offsetLeft + img.offsetWidth * fx - z.clientWidth / 2; z.scrollTop = img.offsetTop + img.offsetHeight * fy - z.clientHeight / 2;
      } else { z.classList.remove("big"); z.querySelector(".zhint").textContent = "Нажмите на картинку, чтобы приблизить"; }
      return;
    }
    z.classList.remove("on", "big"); z.querySelector(".zhint").textContent = "Нажмите на картинку, чтобы приблизить";
  }
});
addEventListener("keydown", e => { if (e.key === "Escape") $("#zoom").classList.remove("on", "big"); });
(() => {
  const z = $("#zoom"); let st = null;
  z.addEventListener("pointerdown", e => { if (!z.classList.contains("big") || e.pointerType !== "mouse" || e.target.closest(".zx")) return; st = { x: e.clientX, y: e.clientY, l: z.scrollLeft, t: z.scrollTop, m: false }; e.preventDefault(); });
  addEventListener("pointermove", e => { if (!st) return; const dx = e.clientX - st.x, dy = e.clientY - st.y; if (Math.abs(dx) + Math.abs(dy) > 4) { st.m = true; z.classList.add("drag"); } z.scrollLeft = st.l - dx; z.scrollTop = st.t - dy; });
  addEventListener("pointerup", () => { if (!st) return; if (st.m) z._dragged = true; st = null; z.classList.remove("drag"); });
})();
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
