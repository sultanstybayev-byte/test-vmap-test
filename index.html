ителями скверны. Это решение было принято после долгих споров, сейчас оно незыблемо."],["p","Службы:"],["p","Жрец не просит Огонь о милости. Он возвещает Огню о верности ордена."],["p","Жрец обращается к пламени как к Отцу. Это не личный бог в христианском смысле, а родовая, отцовская сила, дающая жизнь и забирающая ее."],["p","Служба включает:"],["p","Возжигание огня от священного угля."],["p","Молчание или звон металла (звук разгоняет духов тьмы)."],["p","Ритуальное касание огня (кратковременное, символическое)."],["p","Молитвы-декларации (не просьбы, а утверждения)."],["h","5. КАКИЕ У НИХ РИТУАЛЫ?"],["s","Утреннее возжигание"],["p","Каждый орденец должен зажечь малый светильник от общего храмового угля. Это символическое приветствие Огню на новый день. Сопровождается молитвой \"Зов Пробуждения\"."],["s","Вечерняя исповедь"],["p","Собрание у большого пламени. Каждый бросает щепотку травы в огонь, символически отдавая свои страхи и сомнения. Жрец наблюдает за реакцией пламени. Сопровождается молитвой \"Покаяние в Угасании\"."],["s","Посвящение в орден в качестве жреца"],["p","Длится 9 дней. Неофит должен стоять у горячей стены, каждый день приближаясь на шаг. В финале — касание раскаленного клейма. Если не кричит — принят."],["s","Суд над грешником"],["p","Проводится в подвалах храмов. Наказание — боль, сила, огонь. Виновного либо сжигают, либо подвергают \"испытанию пламенем\" (насколько долго может терпеть жар)."],["s","Очищение места"],["p","Если храм заподозрен в скверне, его перекрывают, проводят \"Малый Суд\" над всеми присутствующими, и заново возжигают огонь от священного угля."],["h","6. ИХ ЭТИКА: ЧТО ГРЕХ, А ЧТО — НЕТ"],["p","ВАЖНЕЙШЕЕ: Орден не зациклен на праведности. Они не моралисты, не судьи плотских утех. Их система ценностей — утилитарно-ритуальная. Единственный критерий: «Служит ли это Огню? Вредит ли это служению?»"],["s","СМЕРТНЫЕ ГРЕХИ (караются жестко)"],["p","Гордыня (возвышение себя над другими, над Огнем, отказ подчиняться)"],["p","Это корень всех зол. Гордый человек служит только себе. Он перестает быть инструментом Огня."],["p","Раздробление костей, затем низвержение в угольную яму или медленное сожжение."],["s","Ложь (утаивание правды, обман братьев, сокрытие скверны)"],["p","Ложь порождает холод и гниль. Она не дает вовремя выжечь заразу. Перед Огнем нельзя солгать — Он все видит."],["p","Клеймение языка, испытание дымом до потери сознания, затем изгнание."],["s","Сокрытие скверны (знал о маге, еретике, враге и не донес)"],["p","Это форма лжи. Ты позволил злу жить — значит, ты служишь злу."],["p","Сожжение заживо в медленном огне. Самое тяжелое наказание."],["s","Воровство (кража у братьев, у храма, у Императора)"],["p","Ты берешь то, что не принадлежит тебе. Значит, ты считаешь себя выше других. Это форма гордыни."],["p","Отрубание пальцев (чтобы не мог больше брать)."],["p","Убийство без смысла (беспричинное, ради удовольствия, из гнева)"],["p","Огонь уничтожает только скверну. Если ты убиваешь без причины, ты уподобляешься зверю. Ты гасишь жизнь, которая могла служить Огню. Это оскверняет сам акт уничтожения."],["p","Кровь за кровь — либо смерть, либо пожизненное рабство в угольных шахтах."],["s","Затухание сердца (избегает службы, не является в храм)"],["p","Ты отворачиваешься от Огня. Ты становишься холодным. Это путь к скверне."],["p","Три дня поста и испытания огнем. Если не раскаивается — отлучение и изгнание."],["s","ДОБРОДЕТЕЛИ (что поощряется)"],["s","Подозрительность"],["p","Лучше перепроверить сто раз, чем пропустить одну скверну. Считай каждого потенциальным врагом, пока Огонь не докажет обратное."],["s","Смирение перед Огнем"],["p","Ты — ничто перед пламенем. Твоя жизнь — искра, твоя смерть — пепел. Прими это и служи."],["s","Честность перед братьями"],["p","Не лги внутри ордена. Если солгал — навредил всему телу. Лучше признаться в слабости, чем утаить скверну."],["s","Готовность к боли"],["p","Боль — это язык Огня. Не избегай ее, когда она приходит ради очищения."],["s","Милосердие к достойным"],["p","Да, орден жесток, но если человек чист и служит Огню, он заслуживает защиты. Милосердие утилитарное: ты помогаешь тем, кто полезен Огню."],["h","7. ЧТО ОНИ ДУМАЮТ О СМЕРТИ?"],["p","Смерть — это возвращение к стихии. Человек был создан из плоти, которую Огонь может испепелить, и духа, который растворится в тепле."],["p","Нет рая, нет ада в классическом смысле. Есть переход в состояние пепла."],["p","Смерть не страшна — страшно умереть холодным, то есть без веры, без очищения, полным скверны."],["p","Именно поэтому они не боятся рисковать жизнью — смерть в огне (на костре или в бою) считается почетной."]]},{"id":"kodeks","tab":"Кодекс Ордена","kind":"Орден Пылающего Сердца","name":"Кодекс Ордена","b":[["p","(Выдержка из основного устава, утверждённого Верховным инквизитором)"],["h","РАЗДЕЛ IV. ОБ АРТЕФАКТАХ И ЗНАКАХ ПРИНАДЛЕЖНОСТИ"],["n","4.1","Каждый член ордена обязан носить блокатор — предмет, подавляющий магическую энергию владельца и защищающий его от внешнего колдовского воздействия. Утрата блокатора должна быть немедленно доложена."],["n","4.2","Инквизитор обязан иметь при себе флакон с жидким огнём. Данный флакон является средством последнего очищения и применяется в ситуациях, когда иные способы уничтожения скверны недоступны."],["n","4.3","Старшие инквизиторы и жрецы обладают дополнительными артефактами, выдаваемыми по решению Совета."],["n","4.4","Старший инквизитор дополнительно получает особый артефакт-определитель. Артефакт выдаётся лично в руки старшему инквизитору, не подлежит передаче и подлежит обязательному возврату в случае отставки."],["h","РАЗДЕЛ V. О ЖАЛОВАНИИ И МАТЕРИАЛЬНОМ ОБЕСПЕЧЕНИИ"],["n","5.1","Все члены ордена получают содержание, достаточное для выполнения своих обязанностей. Размер содержания определяется рангом и утверждается Советом Жрецов."],["n","5.2","Рядовые братья и сёстры получают питание, кров и уголь для ритуалов, помимо этого положено денежное довольствие."],["n","5.3","Жрецы храмов получают серебро и золото, предназначенное для обслуживания храмов, покупки необходимых материалов и оплаты помощников. Отчётность по расходам предоставляется ежемесячно."],["n","5.5","Старшие инквизиторы имеют право на долю от имущества, конфискованного у осуждённых, в порядке, установленном императорским указом. Доля зачисляется в казну ордена и распределяется по решению Совета."],["n","5.7","Личное обогащение, не направленное на нужды ордена, приравнивается к хищению и карается по разделу VI. Богатство, вложенное в служение, поощряется."],["h","РАЗДЕЛ VI. О НАРУШЕНИЯХ И НАКАЗАНИЯХ"],["n","6.1","Наказания назначаются в соответствии с тяжестью нарушения. Основанием для наказания является нанесение вреда служению Огню либо ордену."],["n","6.2","За гордыню (отказ подчиняться, возвышение себя над орденом, игнорирование приказов) назначается раздробление костей с последующим помещением в угольную яму."],["n","6.3","За ложь (утаивание информации, обман братьев, сокрытие скверны) назначается клеймение языка, испытание удушливым дымом."],["n","6.4","За сокрытие магов или защиту их назначается сожжение заживо в медленном огне. Данное наказание является высшей мерой и не подлежит смягчению."],["n","6.5","За воровство (хищение имущества братьев, храма или казны ордена) назначается отрубание пальцев с последующим изгнанием."],["n","6.6","За убийство без должного основания (беспричинное, из личных побуждений, не связанное с очищением скверны) назначается смертная казнь либо пожизненные работы в угольных шахтах."],["n","6.7","За уклонение от службы и систематическое отсутствие в храме («затухание сердца») назначается трёхдневный пост с испытанием огнём. При отсутствии раскаяния — изгнание."],["n","6.8","Орден не судит прелюбодеяние, пьянство, обжорство и излишества, поскольку данные нарушения относятся к слабостям плоти и не наносят ущерба служению. Исключение составляют случаи, когда указанные действия приводят к гордыне, лжи или нарушению обязанностей."],["h","РАЗДЕЛ VII. О ПРАВЕ АРЕСТА"],["n","7.1","Каждый член ордена в ранге не ниже инквизитора имеет право арестовать лицо, заподозренное в магии или сокрытии скверны, при соблюдении одного из следующих условий:"],["n","7.1.1","Подозреваемый застигнут при использовании магии."],["n","7.1.2","Подозреваемый отказался добровольно пройти проверку артефактом-определителем."],["n","7.1.3","Артефакт-определитель дал положительный результат при проверке крови или плоти подозреваемого."],["n","7.1.4","Подозреваемый признан магом ранее вынесенным судом ордена и объявлен в розыск."],["n","7.1.5","Подозреваемый задержан при попытке уничтожить, скрыть или подменить улики, связанные с магией."],["n","7.1.6","Подозреваемый оказывает сопротивление требованиям инквизитора, демонстрируя намерение скрыться или напасть."],["n","7.3","Арестованный должен быть доставлен в ближайший храм для проведения суда в течение трёх дней с момента задержания."],["n","7.4","В случае, если по истечении трёх дней вина арестованного не подтверждается, он подлежит освобождению."],["n","7.5","Заведомо ложный арест по личным мотивам приравнивается к лжи и карается по разделу VI, пункт 6.3."],["h","РАЗДЕЛ VIII. ОБ ОБЯЗАННОСТЯХ И СЛУЖЕНИИ"],["n","8.1","Основной обязанностью каждого члена ордена является служение Огню. Все действия оцениваются исключительно по критерию пользы для службы."],["n","8.2","Члены ордена обязаны ежедневно проводить утренний и вечерний ритуалы. Пропуск ритуалов без уважительной причины считается нарушением (см. раздел VI, п. 6.7)."],["n","8.3","Члены ордена обязаны доносить о любых признаках скверны, магии, замеченных в их окружении. Сокрытие указанных сведений приравнивается к лжи и карается по разделу VI, п. 6.3–6.4."],["n","8.4","Члены ордена обязаны носить блокатор в любое время. Исключения не допускаются."],["n","8.5","Члены ордена обязаны соблюдать субординацию, установленную уставом, и выполнять распоряжения вышестоящих лиц в рамках их полномочий."],["h","РАЗДЕЛ IX. ОБ ИЕРАРХИИ И ПОРЯДКЕ ПОДЧИНЕНИЯ"],["n","9.3","Старшие инквизиторы возглавляют региональные отделения ордена, руководят проведением судов и операциями против магов."],["n","9.4","Инквизиторы младшего ранга выполняют поручения старших инквизиторов, ведут расследования и проводят очищение на местах."],["n","9.5","Жрецы храмов обеспечивают проведение ритуалов, прием новых членов и повседневное управление храмами."],["n","9.6","Рядовые братья и сёстры составляют основу ордена, участвуют в службах, выполняют хозяйственные работы и оказывают поддержку высшим чинам."],["p","Утверждено Советом Жрецов. Переписано для внутреннего пользования."]]},{"id":"guild","tab":"Кодекс «Плата и сталь»","kind":"Гильдия авантюристов","name":"Кодекс авантюриста","b":[["h","РАЗДЕЛ I. ОБЩИЕ ПОЛОЖЕНИЯ"],["n","1.1","Гильдия «Плата и сталь» является объединением наёмников, охотников, искателей и иных лиц, готовых выполнять работу за плату. Членство в гильдии добровольное и платное."],["n","1.2","Основной целью гильдии является выполнение заказов любой сложности, за исключением случаев, прямо запрещённых настоящим кодексом."],["n","1.3","Девиз гильдии: «Никакой романтики. Только работа и оплата». Любые действия, не соответствующие данному принципу, не имеют отношения к гильдии и не покрываются её защитой."],["n","1.4","Гильдия сохраняет нейтралитет в отношении политических и религиозных конфликтов."],["h","РАЗДЕЛ II. ЧЛЕНСТВО"],["n","2.1","Для вступления в гильдию необходимо:"],["p","Лично явиться в штаб-квартиру или официальное представительство."],["p","Оплатить вступительный взнос в размере 50 серебряных грошей."],["p","Выполнить пробное задание, назначенное координатором."],["p","Получить значок с эмблемой гильдии (скрещённые меч и монета)."],["n","2.2","Значок является удостоверением члена гильдии. Он даёт право на:"],["p","Бесплатное проживание в любом Доме гильдии (комната, общая трапезная)."],["p","Доступ к доске заданий."],["p","Защиту гильдии в случае конфликтов, связанных с выполнением заказов."],["p","Право продавать добычу через гильдейских скупщиков."],["n","2.3","Утрата значка должна быть немедленно доложена координатору. За восстановление взимается плата в размере 10 серебряных грошей. Ношение чужого значка запрещено и карается изгнанием."],["n","2.4","Членство может быть прекращено по собственному желанию или по решению Совета гильдии в случае нарушений, перечисленных в разделе VI."],["h","РАЗДЕЛ III. СТРУКТУРА И ИЕРАРХИЯ"],["n","3.1","Высшим лицом гильдии является Мастер гильдии. Личность Мастера не разглашается. Решения Мастера не подлежат обсуждению."],["n","3.2","Старшие координаторы назначаются Мастером. Они отвечают за распределение заданий, расчёт платы и ведение архивов. Координаторы имеют право принимать новых членов и расторгать контракты."],["n","3.3","Члены гильдии делятся по рангам в зависимости от сложности выполненных заданий:"],["p","Новичок — допускается только к стандартным заказам."],["p","Опытный — допускается к опасным заказам."],["p","Ветеран — допускается к особо опасным и секретным заказам."],["n","3.4","Повышение ранга производится решением координатора на основании отчётов о выполненных заданиях. Личные заслуги и рекомендации учитываются, но не являются обязательным условием."],["n","3.5","В каждом крупном городе действует Дом гильдии — укреплённое здание, предоставляющее членам жильё, еду, кузницу и арсенал. Управление Домом осуществляет старший координатор города."],["h","РАЗДЕЛ IV. ЗАДАНИЯ И ПОРЯДОК ИХ ВЫПОЛНЕНИЯ"],["n","4.1","Все задания, принимаемые гильдией, делятся на категории:"],["table",["Категория","Пример","Оплата"],[["Стандартные","Охрана караванов, патрулирование, сопровождение","30–100 серебряных грошей"],["Опасные","Охота на упырей, зачистка гнёзд, поиск людей","100–300 грошей"],["Особо опасные","Экспедиции в заражённые зоны, поиск артефактов","от 500 грошей (часто золотом)"],["Секретные","Шпионаж, устранение, кража","индивидуально"]]],["n","4.2","Член гильдии имеет право отказаться от задания без объяснения причин. Отказ не влечёт санкций, если не является систематическим (более трёх отказов подряд без уважительной причины)."],["n","4.3","Задание считается принятым с момента подписания контракта. Контракт фиксирует:"],["p","Описание задачи."],["p","Срок выполнения."],["p","Размер и форму оплаты."],["p","Ответственность сторон."],["n","4.4","При успешном выполнении задания оплата выдаётся не позднее трёх дней после сдачи отчёта."],["n","4.5","При провале задания (невыполнение в срок, халатность, гибель заказчика) оплата не выдаётся. Дополнительные санкции налагаются по решению координатора."],["n","4.6","В случае форс-мажора (внезапная война, катастрофа, массовое заражение) сроки выполнения могут быть пересмотрены. Член гильдии обязан уведомить координатора о причинах задержки при первой возможности."],["h","РАЗДЕЛ V. ПРАВА И ОБЯЗАННОСТИ ЧЛЕНА ГИЛЬДИИ"],["n","5.1","Член гильдии имеет право:"],["p","Выбирать задания по своему усмотрению."],["p","Отказаться от задания, если оно угрожает его жизни без соразмерной оплаты."],["p","Требовать защиту гильдии в случае конфликта, возникшего при выполнении заказа."],["p","Продавать трофеи и добычу через гильдейских скупщиков по установленным расценкам."],["p","Объединяться в группы для выполнения совместных заданий."],["n","5.2","Член гильдии обязан:"],["p","Носить значок гильдии при выполнении заказов."],["p","Выполнять задания в соответствии с условиями контракта."],["p","Сохранять конфиденциальность информации, полученной в ходе выполнения секретных заданий."],["p","Уведомлять координатора о любых конфликтах с другими фракциями, связанных с деятельностью гильдии."],["p","Оказывать помощь другим членам гильдии при выполнении общего задания (в рамках разумного)."],["n","5.3","Член гильдии не обязан:"],["p","Участвовать в религиозных или политических конфликтах без прямого заказа."],["p","Сообщать о своём происхождении, прошлом или личных связях."],["p","Выполнять задания, противоречащие его личным убеждениям (отказ оформляется письменно)."],["h","РАЗДЕЛ VI. ЗАПРЕТЫ И НАРУШЕНИЯ"],["n","6.1","Члену гильдии запрещается:"],["p","Выполнять заказы, направленные против гильдии или её членов."],["p","Использовать значок гильдии для личной выгоды вне рамок заказов (вымогательство, самоуправство)."],["p","Продавать информацию о заказчиках, полученную в ходе секретных заданий."],["p","Вступать в конфликт с Орденом Пылающего Сердца в ходе выполнения заказов, если иное не одобрено координатором (согласно соглашению с Орденом)."],["p","Саботировать или срывать задания других членов гильдии."],["n","6.2","За нарушение пунктов 6.1 назначаются следующие санкции:"],["p","Предупреждение (за первое нарушение, не повлёкшее серьёзных последствий)."],["p","Штраф в размере стоимости задания (за нанесение ущерба гильдии)."],["p","Временное отстранение от заданий на срок до одного месяца."],["p","Изгнание из гильдии с конфискацией значка."],["p","Чёрный список — предательство гильдии (переход на сторону врага при выполнении заказа, умышленное убийство члена гильдии, передача конфиденциальной информации противнику). За такими членами ведётся охота до полного устранения."],["h","РАЗДЕЛ VII. ОТНОШЕНИЯ С ДРУГИМИ ФРАКЦИЯМИ"],["n","7.1","Гильдия сохраняет договорной союз со следующими фракциями:"],["p","Императорский двор (Кассель) — охрана дорог, разведка, устранение угроз."],["p","Орден Пылающего Сердца — взаимное соглашение о невмешательстве (гильдия не принимает заказы против Ордена, инквизиторы не проверяют членов гильдии на наличие Дара)."],["p","Местные власти Верхнего предела, Кальдерона и Гнилого удела — выполнение заказов на поддержание порядка."],["n","7.2","Гильдия не поддерживает союзных отношений с Певчими душами. Заказы от данной фракции принимаются только при условии, что они не нарушают соглашения с другими фракциями."],["n","7.3","Член гильдии, вступивший в конфликт с представителем союзной фракции, обязан уведомить координатора в течение суток. Самостоятельное решение конфликта силой допускается только в случае прямой угрозы жизни."],["n","7.4","Гильдия не задаёт вопросов о происхождении заказа. Любой клиент, способный оплатить работу, рассматривается как потенциальный заказчик. Исключение составляют заказы, направленные против подписанных союзов (пункт 7.1)."],["h","РАЗДЕЛ VIII. ДОМА ГИЛЬДИИ И УСЛОВИЯ ПРОЖИВАНИЯ"],["n","8.1","В каждом крупном городе действует Дом гильдии — укреплённое здание с:"],["p","Общими комнатами для проживания."],["p","Трапезной (питание предоставляется за умеренную плату)."],["p","Кузницей и арсеналом (ремонт и пополнение снаряжения)."],["p","Комнатой для первой помощи."],["n","8.2","Член гильдии имеет право бесплатно остановиться в любом Доме на срок до четырнадцати дней. Дальнейшее проживание оплачивается из расчёта 1 серебряный грош в день."],["n","8.3","В Домах гильдии запрещено:"],["p","Проводить личные разборки и конфликты."],["p","Приводить лиц, не являющихся членами гильдии, в жилые комнаты."],["p","Оставлять оружие без присмотра в общих зонах."],["n","8.4","Координатор Дома имеет право временно ограничить доступ члену гильдии в случае нарушения внутреннего порядка."],["h","РАЗДЕЛ IX. ФИНАНСЫ И ПЛАТЕЖИ"],["n","9.1","Все расчёты по заданиям производятся наличными серебром или золотом, если иное не оговорено в контракте."],["n","9.2","Гильдия удерживает комиссию в размере 10% от суммы каждого официального заказа, за исключением секретных заданий (комиссия обсуждается индивидуально)."],["n","9.3","Член гильдии может продавать добычу через гильдейских скупщиков. Цены устанавливаются на 10–20% ниже рыночных, но гарантируют быструю оплату и конфиденциальность."],["n","9.4","Долги перед гильдией (неуплаченные штрафы, комиссии, стоимость утерянного оборудования) могут быть взысканы путём удержания из последующих выплат."],["n","9.5","Споры о сумме оплаты решаются координатором. Решение координатора является окончательным и не подлежит обсуждению."],["h","РАЗДЕЛ X. ОТВЕТСТВЕННОСТЬ И РАСТОРЖЕНИЕ ЧЛЕНСТВА"],["n","10.1","Член гильдии несёт ответственность за:"],["p","Свои действия в рамках выполнения заданий."],["p","Сохранность выданного оборудования (значок, документы)."],["p","Соблюдение условий контракта."],["n","10.2","Гильдия не несёт ответственности за гибель, ранения или ущерб имуществу члена, полученные в ходе выполнения задания. Исключение составляют случаи, когда координатор намеренно направил члена на заведомо смертельное задание, не предупредив о рисках."],["n","10.3","Членство расторгается:"],["p","По личному заявлению члена (возврат значка, погашение долгов)."],["p","По решению Совета гильдии в случае грубых нарушений (пункт 6.2)."],["p","В случае смерти члена гильдии."],["n","10.4","При расторжении членства все права и привилегии члена аннулируются. Восстановление возможно только по решению Мастера гильдии с повторной уплатой вступительного взноса."],["h","РАЗДЕЛ XI. ЗАКЛЮЧИТЕЛЬНЫЕ ПОЛОЖЕНИЯ"],["n","11.1","Настоящий кодекс обязателен для исполнения всеми членами гильдии «Плата и сталь»."],["n","11.2","Изменения в кодекс вносятся исключительно Мастером гильдии или Советом старших координаторов."],["n","11.3","Незнание положений кодекса не освобождает от ответственности за их нарушение."],["n","11.4","В вопросах, не урегулированных настоящим кодексом, решения принимает координатор на месте."],["n","11.5","Девиз гильдии остаётся неизменным: «Никакой романтики. Только работа и оплата»."],["p","Утверждено Мастером гильдии. Переписано для внутреннего пользования. Копия выдаётся каждому новому члену гильдии."]]},{"id":"souls","tab":"Слово о гниении","kind":"Певчие души","name":"Слово о гниении и о любви","b":[["h","ПЕРВОЕ СЛОВО: О ЛИРАНЕ"],["p","Лирана есть мать, спасение и защита наша."],["p","Лирана не судит, ибо любовь не судит. Она принимает всех, кто приходит к ней, и не отвергает никого."],["p","Тот, кто говорит о Лиране как о богине, лжёт. Она не богиня. Она мать. Боги требуют жертв. Мать приносит жертву сама."],["h","ВТОРОЕ СЛОВО: О СКВЕРНЕ"],["p","Скверна есть не проклятие, но дар. Дар, который Лирана оставила детям своим, когда уходила. Скверна не убивает. Она очищает, как огонь очищает золото. Но её очищение — не жжение, а разложение. Ибо разложение есть рождение…"],["p","……Скверна есть любовь. Любовь, которую люди отвергли, назвав её злом. И потому она приходит к ним как боль — ибо они не умеют принимать иначе."],["p","Никто не избежит скверны. Ибо скверна есть сама земля, по которой вы ходите. И в скверну вы вернётесь, даже если будете бежать."],["h","ТРЕТЬЕ СЛОВО О ПУТИ"],["p","Каждый человек должен пройти через скверну. Это не право — это необходимость. Ибо лишь пройдя через гниль, можно родиться. Путь через скверну есть смерть. Смерть плоти, смерть страха, смерть гордыни. И тот, кто умирает так, не умирает вовсе. Лишь сильные проходят скверну. Слабые умирают в ней и становятся частью болота. И это тоже правильно, ибо слабые не достойны новой жизни."],["p","Не ищи лёгкого пути. Лёгкий путь есть ложь. Истинный путь — тот, где ты кричишь от боли и не просишь пощады."],["h","ЧЕТВЕРТОЕ СЛОВО: О ЛЮБВИ"],["p","….Любовь есть гниль. Не та любовь, что вы знаете — тёплая и сладкая. Любовь эта — чёрная, вязкая, благоухающая смертью…"],["p","Любовь не требует ответа. Она даёт себя, не ожидая возврата. Она принимает удар, чтобы ударенный перестал бить."],["p","Любовь не говорит: «Ты лучше» или «Ты хуже». Любовь говорит: «Ты есть. И этого достаточно»…."],["h","ПЯТОЕ СЛОВО: О ТЕХ, КТО НЕ ПРИНЯЛ"],["p","Не принявший скверну — не есть враг. Он не равный нам, он ниже по статусу, чести и смыслу. Не принявший скверну есть зверь. Он дышит, но не живёт. С не принявшими нельзя считаться как с равными. Ибо они не прошли путь. Они не видели чёрную воду. Они не вдыхали гниль. Они — дети, которые ещё не родились. А значит не принявшие понесут свой труд."],["h","ШЕСТОЕ СЛОВО: О НАКАЗАНИИ"],["p","Певчие души не карают из гнева. Гнев есть удел слабых. Мы караем из любви — ибо любовь не терпит лжи, а ложь есть отрицание матери."],["p","Тот, кто предал брата своего — кто выдал его Ордену, кто указал на его укрытие, кто привёл инквизиторов к его порогу, — не будет просто забыт. Он будет принят в лоно скверны — но не как дитя, а как жертва. Ибо он предал свою кровь, а кровь требует искупления. Предавший будет обнажён. Плоть его будет открыта для гнили."],["p","…Тот, кто говорит от имени Лираны, но несёт ложь, кто учит страху вместо любви, кто обещает лёгкий путь вместо пути через гниль, — тот есть мерзость. Он оскверняет имя той, кто не может защитить себя. И мы защитим её. Язык лжеца будет вырезан. Не для того, чтобы он замолчал — для того, чтобы он запомнил цену слова. Ибо слово есть святое, а святое не произносят всуе. Он будет стоять перед нами с открытым ртом, из которого течёт кровь, и мы будем смотреть на него. И в глазах наших он увидит не гнев — он увидит любовь. Любовь, которая не терпит лжи. Руки лжеца, которыми он писал свои лживые тексты, будут переломаны. Каждая кость — отдельно. Ибо ложь пишется руками, и руки должны помнить…"],["h","СЕДЬМОЕ СЛОВО: О МОРГАНЕ"],["p","Моргана есть явление Лираны в этом мире. Она не богиня, не пророчица, не святая. Она — сосуд, наполненный пустотой, чтобы Лирана могла говорить через неё."],["p","Моргана не ошибается. Ибо она не говорит от себя. Она говорит от той, кто слышит всё. Тот, кто не слушает Моргану, не слушает Лирану. Ибо Моргана — уста Лираны. И слово, сказанное ею, есть слово, сказанное матерью."]]},{"id":"dead","tab":"Усопшие Души","kind":"Гильдия погребения","name":"Устав и обители","b":[["p","Структура внутри организации:"],["h","Глава - Эдмунд Аушвиц Пэрес"],["n","1.1","Заместитель Рафалия Аушвиц Пэрес."],["p","2. Сольятти Ван Де Сол и Гидеон Мартель."],["n","2.1","Маргарет Жан Первэль и Ёхан Гассельский."],["n","2.2","Гордон Вален Тайн."],["p","3. Учёные, анатомы, офицеры секачей, алхимики, личная охрана главы. Стрижи Альбиносы - Только самые опытные из них."],["n","3.1","Секачи, палачи, могильщики, священники."],["n","3.2","Стрижи и остальные."],["s","Местоположение"],["p","В самом сердце угрюмого средневекового города, там, где узкие улочки сжимали пространство подобно костяной петле, притаилась обитель гробовщиков и обмывателей, торговцев атрибутикой смерти и охотников за тварями. Здание это казалось не построенным человеческими руками, а выросшим из самой сырой земли, впитав в себя её тлен и вечный холод."],["p","Его фасад был сложен из грубо тёсанного, потемневшего от сырости и копоти дикого камня. Время и частые дожди иссекли валуны глубокими трещинами, напоминающими морщины на лице умирающего старика. Никакой побелки, никаких изящных барельефов — лишь суровая, почти враждебная монументальность. Второй ярус, срубленный из почерневшего от времени дуба, несимметрично нависал над мостовой, навечно заслоняя от прохожих и без того скудный свет немого неба. Крыша, выложенная крошащимся сизым сланцем и обросшая густым, вязким мхом, походила на чешую спящего чудовища. С её карнизов постоянно капала мутная вода, даже если на улице стояла сушь. Главным «лицом» этого дома была дверь — массивный щит из погрузневших дубовых досок, стянутых полосами кованого железа, покрытого рыжими пятнами ржавчины. Дверной проём был утоплен в глубокую каменную арку, отчего вход казался разверзнутой пастью. Вместо привычного дверного кольца с резного крюка свисала тяжелая железная лапа, держащая полый заржавевший череп, стук которого о дерево отзывался гулким, похоронным эхом. Окна здания были тонкими и узкими, словно бойницы в крепостной стене. В них не было дорогого стекла — рамы затягивали пожелтевшим, пропитанным жиром бычьим пузырём. Сквозь него наружу пробивался лишь болезненный, желтушный свет сальных свечей, в котором призрачно вились тени тех, кто готовил усопших к последнему пути. Над входом, на скрипучем выкованном кронштейне, раскачивался под порывами хладного ветра деревянный щит. На нём выжженное клеймо изображало перевёрнутые песочные часы с черепом внутри и пучок сухой полыни. Из низкой закопчённой трубы на крыше непрерывно вился тонкий хвост сизого дыма, несущий в узкий переулок тяжеловесный, сладковатый запах мирры, сушёных болотных трав и едва уловимого, въевшегося в сами камни аромата тлена."],["p","Каждый, кто проходил мимо — от нищего до знатного горожанина, — невольно ускорял шаг, прижимая к носу край плаща и крестясь. Здание же стояло в немом, торжественном терпении: оно знало, что рано или поздно каждый житель этого города переступит его мрачный, неотесанный порог. - Так описывают один тз филиалов Усопших Душ."],["p","Главное же здание в столице представляет собой большой дом со множеством комнат высотой в пару этажей, подвалом, выходом в катакомбы и внутренним двором, где тренируются, молятся и собирают адептов."],["p","В каждом городе помимо основного филиала, иногда есть склад или дома для членов организации, а также кажлый дом или двор члена организации может быть использован для филиала или приюта."],["p","Правила внутри фракции:"],["p","1. Предатели будут судимы."],["n","1.1","За сокрытие предателей, будет рассматриваться отдельное дело по факту намеренного укрывания или же ненамеренного."],["p","2. Каждый член организации, обязан дать кров просящему товарищу. Оговорка: если к дому хозяина проявляется не уважение, гостя могут выгнать или написать донос."],["p","3. У каждого члена организации должен быть значок из ткани или металла со своим номером или особым символом. Это сделано для регистрации каждого и установлении его личности при подозрении в подмене или украденном знаке. Член организации не может отказать в названии своего номера иои символа, также сверяют записи с его отличительными чертами и особенностями внешности."],["p","4. Любые споры решаются внутри организации, избранными для этого судьями или переговорщиками."],["p","5. Воровство карается отрубанием руки, не распространяется на детей - заменяется исправительными работами."],["p","6. Тайны организации, остаются в организацие."],["p","7. Зарплата фиксирована, премии выписываются главами филиалов."],["p","8. Стрижей могут наказывать только их кураторы или офицеры Секачей."],["p","9. При заражении, вам помогут."],["p","10. Вы под защитой организации."]]}]};

  { g: "council", n: "Побег из Сарконии", imp: 2, places: ["sarkoniya"], d: "Молодой, но важный для Совета маг схвачен Орденом и ждёт казни в Сарконии. Игроки должны вытащить его до рассвета, но справятся ли они?", rec: "шпионам, членам Тайного Совета", dur: "средне (2–3 сцены)", loc: "Саркония, тюрьма под главным храмом" },
  { g: "health", n: "Пропавший ученик", imp: 2, places: ["les-strasti"],
    d: "Один из молодых учёных Совета Здравия исчез во время вылазки в Лес Страсти. Он отправился собирать образцы спор, которые, по его теории, могут замедлять распространение скверны. Его последнее сообщение пришло из района, который местные называют Гнилым Сердцем — местом, где скверна настолько сильна, что даже обескровленные обходят его стороной. Совет хочет знать, что с ним случилось. И если он жив — вернуть его.",
    rec: "исследователям, лекарям, тем, кто умеет выживать в лесу", dur: "средне (2–3 сцены)", loc: "Лес Страсти" },
  { g: "health", n: "Клетка с обескровленным", imp: 2, places: ["tenegrad"],
    d: "В подземельях Совета Здравия содержится обескровленный, который не теряет сознание. Он не рычит, не атакует и иногда даже пытается говорить. Совет хочет понять, почему он отличается от других. Но недавно клетка была найдена открытой, а обескровленный исчез. Совет хочет вернуть его, пока он не добрался до города.",
    rec: "охотникам, лекарям, тем, кто умеет обращаться с обескровленными", dur: "быстро (1–2 сцены)", loc: "Тенеград" },
  { g: "health", n: "Письмо от Певчих душ", imp: 2, places: ["les-strasti"],
    d: "Певчие души прислали Совету Здравия письмо с просьбой о помощи. Они нашли место, где скверна ведёт себя странно — она не распространяется, а словно замирает. Совет не доверяет Певчим душам полностью и подозревает, что это может быть ловушкой. Игроки должны отправиться туда и выяснить, что там на самом деле.",
    rec: "исследователям, лекарям, дипломатам", dur: "средне (2–3 сцены)", loc: "Лес Страсти" },
  { g: "order", n: "След мага в Эпире", imp: 2, places: ["epira"], d: "Эпира — город знаний, но даже здесь есть подвалы, куда не заглядывает свет. В одном из госпиталей, среди грязных палат и забытых больных, кто-то лечит людей магией. Орден получил донос, но инквизиторы, отправленные на проверку, не вернулись. Ни тел, ни следов, ни свидетелей. Тот, кто пойдёт по этому следу, должен быть готов к тому, что охота может идти в обе стороны.", rec: "инквизиторам, паладинам, жрецам", dur: "средне (2–3 сцены)", loc: "Эпира, госпиталь в бедном квартале" },
  { g: "order", n: "Вглубь ордена", imp: 3, places: ["sarkoniya"], d: "Что мы вообще знаем об Ордене? Мы видим алые рясы, слышим проповеди, чувствуем запах дыма. Но что скрывается за стенами штабов? Какие приказы отдаются шёпотом? Какие документы сжигаются в подвалах? Говорят, в старом храме на окраине Сарконии сохранились архивы, которые не должны были сохраниться. Орден выставил приказ о полном уничтожении архива.", rec: "тем, кто хочет понять истинную природу Ордена", dur: "средне (2–3 сцены)", loc: "Саркония, старый храм на окраине города" },
  { g: "order", n: "Личность Верховного инквизитора", imp: 3, places: ["verkhniy-predel"], d: "Верховный инквизитор — человек, чьё имя произносят шёпотом. Он не появляется на публике, не даёт слова, не покидает свой храм без охраны. Но что, если подобраться ближе? Что, если увидеть его лицо без маски? Что, если задать вопрос, который он не ожидает услышать? Риск огромен — одна ошибка, и ты лишишься головы. Но награда — знание. А знание, как известно, опаснее любого клинка.", rec: "тем, кто хочет узнать личность Верховного инквизитора", dur: "? (зависит от подхода)", loc: "Верхний предел, Храм Пылающего Сердца" },
  { g: "order", n: "Проповедь в пустоши", imp: 2, places: ["gniloy-udel"], d: "В заброшенной деревне недалеко от Гнилого удела появился проповедник. Он говорит, что скверна — это благословение, а Орден — лжецы. Приказ довольно ясен: ликвидировать.", rec: "инквизиторам, паладинам, жрецам", dur: "средне (2–3 сцены)", loc: "заброшенная деревня у Гнилого удела" },
  { g: "order", n: "Последнее слово еретика", imp: 3, places: ["sarkoniya"], d: "Приговорённый к сожжению еретик просит встречи с инквизитором. Он утверждает, что знает правду о скверне. Он готов рассказать — но только одному человеку и только перед смертью. Игроки должны решить: выслушать его или сжечь молча.", rec: "инквизиторам, следователям, тем, кто ищет правду", dur: "быстро (1–2 сцены)", loc: "Саркония" },
  { g: "order", n: "Три главных испытания", imp: 1, places: ["epira"], d: "Путь в Орден не начинается с меча или рясы.", rec: "новобранцам, послушникам, тем, кто хочет стать частью Ордена", dur: "средне (2–3 сцены)", loc: "Эпира" },
  { g: "court", n: "Поручение при дворе", untitled: true, imp: 3, places: ["verkhniy-predel"], d: "Говорят, что Император Кассель знает больше, чем говорит. Говорят, что он не просто правитель — он хранитель тайн, которые могут уничтожить империю. Но чтобы узнать эти тайны, нужно приблизиться к нему. Не как проситель, не как враг — как тот, кто может быть полезен. Во дворце всегда нужны люди, которые умеют молчать, слушать и выполнять поручения, о которых не спрашивают. Одно такое поручение может стать вашим входом в круг доверенных лиц. Или вашим выходом из жизни.", rec: "дипломатам, шпионам, верным Императору, тем, кто не боится дворцовых интриг", dur: "очень долго", loc: "Верхний предел, Императорский дворец" },
  { g: "court", n: "Дела любовные", imp: 2, places: ["torgovyy-forpost", "gniloy-udel"], d: "Курьер, направленный из Верхнего предела в Гнилой удел с личным письмом Императора, не прибыл на место. Последний раз его видели в Торговом форпосте.", rec: "верным Императору, любителям любовных интриг", dur: "средне (2–3 сцены)", loc: "Торговый форпост — Гнилой удел" },
  { g: "court", n: "Золото для короны", imp: 2, places: ["kalderon"], d: "Казна Императора нуждается в пополнении. По слухам, в одной из старых шахт Кальдерона до сих пор есть запасы серебра, которые не были учтены. Проблема в том, что шахта находится на территории, которую контролируют Тени Кальдерона.", rec: "солдатам, дипломатам, охотникам за сокровищами", dur: "средне (2–3 сцены)", loc: "Кальдерон (старые шахты)" },
  { g: "court", n: "По следам родства", imp: 4, places: [], d: "В общий доступ внезапно просочились старые записи самого Эдварда Смертного, отца нынешнего императора. Там упоминают экспедиции в Северные княжества и людей, которые вернулись оттуда не такими, как прежде. Игроки должны выяснить: что, если это и есть тот самый ответ на важнейший вопрос современности — откуда на самом деле взялась скверна?", rec: "магам, учёным, шпионам, тем, кто связан с Северными княжествами, кому интересна скверна", dur: "долго (3–4 сцены)", loc: "Веларис → Северные княжества (руины, старый дуб)" },
  { g: "court", n: "Тень за троном", imp: 4, places: ["verkhniy-predel"], d: "В Верхнем пределе получен донос: люди Императора вышли на след сбежавшей принцессы. По слухам, она скрывается в одном из приграничных городов под чужим именем. Кассель не хочет огласки — он поручает доверенным лицам (или наёмникам) перехватить принцессу до того, как случится нечто страшное. Но у этой операции есть двойное дно: одни хотят вернуть её во дворец, другие — «убрать» проблему навсегда. Игроки должны найти девушку первыми и решить, кому её отдать… или не отдавать никому.", rec: "шпионам, дипломатам, наёмникам, тем, кто умеет работать в тени", dur: "долго (3–4 сцены)", loc: "Верхний предел (дворец) → приграничные города" },
  { g: "tri", n: "Новый агент", imp: 3, places: ["sarkoniya"],
    d: "Триединство ищет человека для внедрения в штаб Ордена в Сарконии. Задание требует осторожности и хорошей легенды.",
    rec: "магам, дипломатам, шпионам", dur: "долго (3–5 сцен)", loc: "Саркония" },
  { g: "tri", n: "Кровь Золотого Колоса", imp: 3, places: ["sarkoniya"],
    d: "Глава дома Золотого Колоса болен. Его наследник должен доказать, что достоин занять его место. Для этого ему нужна информация, которая хранится в старом архиве.",
    rec: "членам Триединства, наследникам домов", dur: "средне (2–3 сцены)", loc: "Саркония, родовое поместье Золотого Колоса" },
  { g: "tri", n: "Кровь Оскара", imp: 4, places: [],
    d: "Младший сын Императора, Оскар, — единственный, кого Кассель не контролирует. Мальчик живёт вдали от двора, под охраной, но слухи о нём ходят по всем трём державам. Триединство хочет заполучить его: одни — как заложника, другие — как оружие, третьи — как доказательство того, что кровь Касселя передаётся. Игроки должны выкрасть Оскара, пока за ним не пришли другие. Но мальчик не так прост…",
    rec: "шпионам, дипломатам, тем, кто умеет обращаться с детьми", dur: "длинная (3–4 сцены)", loc: "загородная резиденция Касселя, дороги Триединства" },
  { g: "tri", n: "Сказ об идеальной ночи", imp: 4, places: ["verkhniy-predel"],
    d: "Чтобы попасть к Касселю, нужно стать кем-то, кого он не заподозрит. Фаворитка — идеальная роль. Игроки должны внедриться в ближайшее окружение Императора под видом новой возлюбленной (или приближённого), завоевать его доверие и собрать как можно больше информации: о вирусе, о Триединстве, о планах, о слабостях.",
    rec: "шпионам, дипломатам, тем, кто умеет играть роли", dur: "длинная (3–4 сцены)", loc: "императорский дворец" },
  { g: "tri", n: "Молчание Крысы", imp: 3, places: [],
    d: "Один из лучших информаторов Триединства внутри императорской знати перестал выходить на связь. Его дом пуст, слуги молчат, а на дверях — печать Императора. Игроки должны выяснить, что случилось: арест, бегство, предательство или что-то похуже. Чтобы восстановить связь, придётся либо вытащить информатора из-под носа Касселя, либо найти того, кто занял его место — и убедить работать на Триединство.",
    rec: "шпионам, следователям, дипломатам", dur: "средне (2–3 сцены)", loc: "кварталы знати" },
  { g: "shadows", n: "Потерянный долг", imp: 1, places: ["torgovyy-forpost"], d: "В Кости пропал должник, который должен был заплатить Лисе крупную сумму. Его видели в последний раз в Торговом форпосте.", rec: "членам Теней, наёмникам", dur: "быстро (1–2 сцены)", loc: "Торговый форпост" },
  { g: "shadows", n: "Грязный секрет", imp: 2, places: ["kalderon"], d: "Финансовая сторона Теней Кальдерона давно вызывает вопросы. Может… пора разобраться с одной из самых омерзительных сторон?", rec: "членам Теней, торговцам, заинтересованным", dur: "средне (2–3 сцены)", loc: "Кость" },
  { g: "shadows", n: "Тень Триединства", imp: 3, places: ["kalderon"], d: "Тени Кальдерона получили заказ от Триединства: убить одного из основателей Тайного Совета. Гильдия не хочет ссориться с Советом, но отказ невозможен. Игроки должны либо выполнить заказ, либо найти компромисс, либо раскрыть, кто из Триединства стоит за контрактом. Правда может оказаться неудобной: заказчик — тот, кому они доверяют.", rec: "убийцам, дипломатам, шпионам", dur: "средне (2–3 сцены)", loc: "Кальдерон, Триединство" },
  { g: "shadows", n: "Ворота в преисподнюю", imp: 4, places: ["sarkoniya"], d: "Тени Кальдерона готовят удар по Сарконии, но сначала нужно ослабить город. Саркония держится на торговле, на границе, на контроле над путями. Если ворота падут, падёт и крепость, а значит и город. Тени хотят не просто взорвать — они хотят показать, что Кассель не может защитить даже собственные границы. Каждый уничтоженный пункт — это удар по экономике, по доверию, по вере в Императора. Игроки должны либо помочь Теням, либо остановить их, либо использовать хаос для собственных целей.", rec: "шпионам, диверсантам, магам", dur: "долго (3–4 сцены)", loc: "границы Сарконии, пропускные пункты" },
  { g: "shadows", n: "Кровавый бал", imp: 4, places: ["epira"], d: "Тени Кальдерона получили заказ, или, возможно, сами решили, что пора. В Эпире готовится закрытый бал: сливки аристократии, самые богатые дома, самые старые семьи. Их всех объединяет лишь одно: полная поддержка императора. Одна ночь, один зал, один список гостей. Тени хотят не просто убить — они хотят устроить резню, которая войдёт в историю, чтобы каждый аристократ в Веларисе понял: никто не защищён. Ни титул, ни богатство, ни стража. Ваша задача — попасть на бал, дождаться нужного момента и уничтожить всех.", rec: "убийцам, шпионам, диверсантам", dur: "долго (3–4 сцены)", loc: "загородная резиденция в Эпире" },
  { g: "guild", n: "Кровавый бал", imp: 4, places: ["epira"], d: "«Плата и сталь» получили заказ. В Эпире готовится закрытый бал: сливки аристократии, самые богатые дома, самые старые семьи. Их всех объединяет лишь одно: полная поддержка императора. Одна ночь, один зал, один список гостей. Заказчик готов заплатить много, лишь бы спасти одну аристократку, отчаянно рвущуюся на бал.", rec: "авантюристам, убийцам", dur: "долго (3–4 сцены)", loc: "загородная резиденция в Эпире" },
  { g: "guild", n: "Охота на обескровленных", imp: 1, places: ["yasnaya-polyana"], d: "В окрестностях Ясной Поляны появилось гнездо обескровленных. Местные жители просят помощи. Гильдия готова заплатить за каждого убитого.", rec: "авантюристам, наёмникам", dur: "быстро (1–2 сцены)", loc: "Ясная Поляна" },
  { g: "guild", n: "Исчезновение в Форпосте", imp: 2, places: ["torgovyy-forpost"], d: "Один из членов гильдии не вернулся с задания. Он должен был доставить письмо в старый квартал Торгового форпоста. Его следы обрываются.", rec: "членам гильдии, авантюристам", dur: "средне (2–3 сцены)", loc: "Торговый форпост" },
  { g: "guild", n: "Под Тенеградом", imp: 4, places: ["tenegrad"], d: "«Плата и Сталь» получили странный заказ: расследовать и проверить местность под Тенеградом, где совсем недавно по неизвестным причинам расступился туман. Заказчик не назвался, оплата вперёд, инструкции простые: спуститься, осмотреть, вернуться с отчётом. Никто не говорит, что именно искать. Никто не говорит, почему туман расступился именно сейчас. Никто не говорит, что было под Тенеградом раньше.", rec: "наёмникам, исследователям, магам, тем, кто умеет работать в неизвестности", dur: "средне (2–3 сцены)", loc: "Тенеград и его подземелья" },
  { g: "guild", n: "Груз для Певчих Душ", imp: 3, places: [], d: "«Плата и Сталь» получают заказ: перехватить караван с особым грузом, который идёт в сторону владений Певчих Душ. Заказчик не говорит, что в грузе. Игроки должны либо отбить груз, либо помочь ему дойти — в зависимости от того, на чью сторону встанут. Но у Певчих Душ свои планы на этот груз. И они не любят, когда им мешают.", rec: "наёмникам, шпионам, диверсантам", dur: "быстро (1–2 сцены)", loc: "дорога к владениям Певчих Душ" },
  { g: "guild", n: "Контракт на мертвеца", imp: 1, places: ["epira"], d: "«Плату и Сталь» нанимают, чтобы убить человека, который уже мёртв. Заказчик клянётся, что тот жив, но все доказательства говорят об обратном. Игроки должны найти «мертвеца» и понять: он действительно мёртв или просто хорошо прячется? И почему за него платят столько?", rec: "любителям расследований и разговоров", dur: "средне (2–3 сцены)", loc: "Эпира" },
  { g: "souls", n: "Голос из тишины", busy: true, imp: 0, places: ["les-strasti"], d: "Говорят, что глава Певчих душ редко покидает своё убежище. Говорят, что она слышит голоса мёртвых и говорит с теми, кто уже ушёл. Но правда в том, что она просто ждёт. Ждёт тех, кто способен слушать. Тех, кто не боится тишины. Тех, кто готов узнать, что скрывается за словами «скверна — это путь». Лидер Певчих душ не ищет последователей — она ждёт, когда они придут сами. Вопрос в том, готовы ли вы переступить порог и услышать то, что нельзя забыть.", rec: "искателям веры, магам, тем, кто потерял ориентиры и ищет новый путь", dur: "средне (2–3 сцены)", loc: "Лес Страсти, тайное убежище Певчих душ" },

const GH_KEY = "velaris-gh-v1";

/* репозиторий берётся из адреса сайта: …github.io/vmap/ → vmap, …github.io/vmaptest/ → vmaptest.
   Так тестовая копия пишет только в свой репозиторий, даже если ключ сохранён в том же браузере. */
const GH_PAGES = (() => {
  const m = location.hostname.match(/^([^.]+)\.github\.io$/i), seg = location.pathname.split("/").filter(Boolean);
  return m && seg.length && !/\.html?$/i.test(seg[0]) ? { owner: m[1], repo: seg[0] } : null;
})();
const ghDefaults = () => GH_PAGES ? Object.assign({}, GH_PAGES) : { owner: "sultanstybayev-byte", repo: "vmap" };
const ghCfg = () => { let c = {}; try { c = JSON.parse(localStorage.getItem(GH_KEY)) || {}; } catch (_) {} return Object.assign(ghDefaults(), c, GH_PAGES || {}); };
const ghSaveCfg = c => { const o = Object.assign({}, c); if (GH_PAGES) { delete o.owner; delete o.repo; } try { localStorage.setItem(GH_KEY, JSON.stringify(o)); } catch (_) {} };

const VK_P = new URLSearchParams(location.search);
const VK_ROLE = VK_P.get("vk_viewer_group_role") || "";

async function ghApi(c, path, opt = {}) {
  return fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${path}`, Object.assign({ cache: "no-store" }, opt, {
    headers: Object.assign({ Accept: "application/vnd.github+json" }, c.token ? { Authorization: "Bearer " + c.token } : {}, opt.body ? { "Content-Type": "application/json" } : {})
  }));
}
const utf8b64 = str => { const u = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); };
const b64utf8 = b => { const s = atob(String(b).replace(/\s/g, "")), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return new TextDecoder().decode(u); };
const ghErr = st => st === 401 ? "Ключ GitHub не подходит или истёк." : st === 403 || st === 404 ? "У ключа нет права записи (Contents: Read and write) или выбран не тот репозиторий." : "GitHub ответил ошибкой " + st + ".";

async function ghRead(c, path) {
  const r = await ghApi(c, path);
  if (r.status === 404) return { data: null, sha: null };
  if (!r.ok) throw new Error(ghErr(r.status));
  const j = await r.json();
  return { data: JSON.parse(b64utf8(j.content)), sha: j.sha };
}
async function ghWrite(c, path, obj, sha, message) {
  const r = await ghApi(c, path, { method: "PUT", body: JSON.stringify({ message, content: utf8b64(JSON.stringify(obj, null, 1)), sha: sha || undefined }) });
  if (!r.ok) { const e = new Error(ghErr(r.status)); e.status = r.status; throw e; }
  return (await r.json()).content.sha;
}

}
async function dbList(fresh) { return (await dbIndex(fresh)).docs; }
async function dbUpdate(mutate, message) {
  const c = ghCfg();
  for (let attempt = 0; attempt < 3; attempt++) {
    const { data, sha } = await ghRead(c, "docs/index.json");
    const idx = { docs: (data && data.docs) || [], folders: (data && data.folders) || DEFAULT_FOLDERS.map(f => Object.assign({}, f)) };
    const res = await mutate(idx.docs, idx);
    try { await ghWrite(c, "docs/index.json", idx, sha, message); return res; }
    catch (e) { if (e.status !== 409 && e.status !== 422) throw e; }

}

}

/* Удалить документ: файл стирается, а в списке остаётся пометка «удалён»,

function blocks(list) {
  let html = "", ul = [];
  const flush = () => { if (ul.length) { html += `<ul class="list dots">${ul.map(t => `<li>${linkify(t)}</li>`).join("")}</ul>`; ul = []; } };
  list.forEach(b => {
    if (b[0] === "li") { ul.push(b[1]); return; }
    flush();
    if (b[0] === "h") html += `<h3>${esc(b[1].replace(/\.$/, ""))}</h3>`;
    else if (b[0] === "s") html += `<h4>${esc(b[1])}</h4>`;
    else if (b[0] === "n") html += `<div class="num"><b>${esc(b[1])}</b><span>${linkify(b[2])}</span></div>`;
    else if (b[0] === "q") html += `<p class="quote">${esc(b[1])}</p>`;
    else if (b[0] === "table") html += table(b[1], b[2]);
    else html += `<p>${linkify(b[1])}</p>`;
  });
  flush(); return html;
}
