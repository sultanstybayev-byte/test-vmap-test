<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Империя Веларис</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+SC:wght@600;700&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=Ruslan+Display&family=Kurale&family=Marck+Script&display=swap">
<style>
/* Layout: dark leather hall over the dimmed map; home = crest + grouped tiles; sections = parchment reading column with a sticky tab rail. Single deliberate look, same tokens as the map. */
:root {
  --ink: #17110b; --leather: #2a1d12; --leather-hi: #3a2817;
  --gold: #c9a25a; --gold-hi: #f0d696;
  --parchment: #ecdcb6; --parchment-deep: #d6bd8c;
  --text-ink: #34230f; --text-muted: #6f5532; --blood: #8e2f1c;
  --shadow: rgba(10, 6, 2, .55);
  --font-display: "Cormorant SC", "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-body: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(.22, .8, .24, 1);
  --grain: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .35  0 0 0 0 .24  0 0 0 0 .1  0 0 0 .16 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
  color-scheme: dark;
}
* , *::before, *::after { box-sizing: border-box; }
html { background: var(--ink); }
body { min-height: 100%; background: var(--ink); color: var(--parchment); font: 500 18px/1.5 var(--font-body); -webkit-font-smoothing: antialiased;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0; }
.bg { position: fixed; inset: 0; z-index: 0; background: url("map-mobile.jpg?v=8") center 40% / cover no-repeat; filter: saturate(.8) brightness(.42) blur(2px); transform: scale(1.04); }
.bg::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 30%, rgba(23,17,11,.25), rgba(23,17,11,.88) 75%); }
main { position: relative; z-index: 1; max-width: 1180px; margin: 0 auto; padding-block: 24px 60px; }
a { color: inherit; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold-hi); outline-offset: 2px; }

/* ---------- Home ---------- */
.crest { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 34px 0 10px; animation: rise .9s var(--ease) both; }
.sigil { width: 76px; height: 76px; stroke: var(--gold); fill: none; stroke-width: 1.4; filter: drop-shadow(0 0 14px rgba(240, 214, 150, .25)); }
.crest h1 { margin: 10px 0 0; font: 700 clamp(40px, 7vw, 64px)/1 var(--font-display); letter-spacing: .06em; color: var(--gold-hi); text-wrap: balance; text-shadow: 0 2px 24px rgba(0,0,0,.6); }
.crest p { margin: 10px 0 0; max-width: 34ch; font: italic 500 19px/1.4 var(--font-body); color: var(--parchment-deep); }
.rule-g { width: min(420px, 80%); height: 12px; margin: 18px auto 6px; background: radial-gradient(circle, var(--gold) 2.5px, transparent 3px) center / 12px 12px no-repeat, linear-gradient(var(--gold), var(--gold)) left center / calc(50% - 14px) 1px no-repeat, linear-gradient(var(--gold), var(--gold)) right center / calc(50% - 14px) 1px no-repeat; opacity: .7; }
.groups { display: grid; gap: 30px; margin-top: 24px; }
.group h2 { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; font: 700 15px/1 var(--font-display); letter-spacing: .2em; text-transform: uppercase; color: var(--gold); }
.group h2::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(201,162,90,.5), transparent); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
@media (max-width: 1060px) { .tiles, .tiles.three { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tiles.three .tile:last-child { grid-column: span 2; } }
.tile { position: relative; display: grid; grid-template-columns: 48px 1fr; gap: 4px 14px; align-items: center; min-height: 92px; padding: 16px 18px; text-decoration: none; border: 1px solid rgba(201,162,90,.7); border-radius: 5px; background: linear-gradient(180deg, rgba(58,40,23,.94), rgba(42,29,18,.94));
  box-shadow: inset 0 0 0 3px var(--leather), inset 0 0 0 4px rgba(201,162,90,.25), 0 10px 26px var(--shadow); cursor: pointer; text-align: left;
  animation: rise .7s var(--ease) both; animation-delay: calc(var(--i, 0) * 45ms + 150ms); transition: transform .4s var(--ease), border-color .3s, box-shadow .4s; }
.tile svg { grid-row: span 2; width: 44px; height: 44px; stroke: var(--gold); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; transition: stroke .3s, transform .5s var(--ease); }
.tile b { font: 700 22px/1.1 var(--font-display); letter-spacing: .03em; color: var(--parchment); }
.tile span { font: italic 500 15.5px/1.3 var(--font-body); color: var(--parchment-deep); }
.tile:hover, .tile:focus-visible { transform: translateY(-3px); border-color: var(--gold-hi); box-shadow: inset 0 0 0 3px var(--leather), inset 0 0 0 4px rgba(240,214,150,.55), 0 0 26px rgba(240,214,150,.18), 0 14px 30px var(--shadow); outline: none; }
.tile:hover svg { stroke: var(--gold-hi); transform: rotate(-6deg) scale(1.06); }
.tile.big { grid-column: span 2; min-height: 140px; background: linear-gradient(90deg, rgba(42,29,18,.96), rgba(42,29,18,.55)), url("map-mobile.jpg?v=8") 30% 45% / 160% auto; }
.tile.news { background: linear-gradient(90deg, rgba(42,29,18,.97), rgba(42,29,18,.78)), repeating-linear-gradient(0deg, rgba(240,214,150,.06) 0 1px, transparent 1px 7px); }
.tile.news::after { content: attr(data-fresh); position: absolute; top: 12px; right: 44px; padding: 3px 8px; border-radius: 3px; background: var(--blood); color: #f6e7c2; font: 700 12px/1.3 var(--font-display); letter-spacing: .1em; }
.tiles.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tile.big b { font-size: 28px; color: var(--gold-hi); }
.tile .arrow { position: absolute; right: 16px; top: 50%; width: 18px; height: 18px; margin-top: -9px; stroke: var(--gold); opacity: .6; grid-row: auto; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
.foot { margin-top: 34px; text-align: center; font: italic 500 15px/1.5 var(--font-body); color: rgba(214,189,140,.7); }
.foot a { color: var(--gold); }

/* ---------- Section view ---------- */
.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; gap: 12px; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 12px max(16px, env(safe-area-inset-left, 0px)); background: linear-gradient(180deg, rgba(23,17,11,.97), rgba(23,17,11,.88)); border-bottom: 1px solid rgba(201,162,90,.35); backdrop-filter: blur(6px); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--ink); }
.back { display: inline-flex; align-items: center; gap: 8px; flex: none; padding: 9px 14px 9px 10px; border: 1px solid rgba(201,162,90,.7); border-radius: 4px; background: var(--leather); font: 700 15px/1 var(--font-display); letter-spacing: .06em; color: var(--parchment); cursor: pointer; text-decoration: none; transition: border-color .3s, color .3s; }
.back svg { width: 16px; height: 16px; stroke: var(--gold); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .35s var(--ease); }
.back:hover { border-color: var(--gold-hi); color: var(--gold-hi); } .back:hover svg { transform: translateX(-3px); }
.bar h1 { margin: 0; min-width: 0; font: 700 22px/1.1 var(--font-display); letter-spacing: .04em; color: var(--gold-hi); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 22px; margin-top: 20px; align-items: start; }
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 82px); display: flex; flex-direction: column; gap: 6px; }
.rail button { padding: 10px 14px; border: 1px solid rgba(201,162,90,.4); border-radius: 4px; background: rgba(42,29,18,.85); color: var(--parchment-deep); font: 700 15.5px/1.2 var(--font-display); letter-spacing: .03em; text-align: left; cursor: pointer; transition: border-color .25s, color .25s, background .25s, transform .3s var(--ease); }
.rail button:hover { border-color: var(--gold); color: var(--parchment); transform: translateX(3px); }
@media (min-width: 861px) { #app .rail button[data-tab="npc"]:not(:first-child) { margin-top: 10px; } }
.rail button[aria-selected="true"] { color: #2a1a0c; border-color: var(--gold-hi); background: linear-gradient(180deg, #f1d79a, #c99a4e); }
.sheet { min-width: 0; padding: 30px clamp(18px, 4vw, 44px) 36px; color: var(--text-ink); background-color: var(--parchment); background-image: var(--grain), radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.4), transparent 55%), linear-gradient(180deg, var(--parchment), var(--parchment-deep));
  border: 1px solid var(--gold); border-radius: 5px; box-shadow: inset 0 0 0 5px var(--parchment), inset 0 0 0 6px rgba(111,85,50,.4), 0 16px 44px var(--shadow); animation: rise .5s var(--ease) both; }
.sheet > * { max-width: 70ch; }
.sheet > .wide { max-width: none; }
.kind { margin: 0; font: 700 13px/1 var(--font-display); letter-spacing: .18em; text-transform: uppercase; color: var(--blood); }
.sheet h2 { margin: 8px 0 6px; font: 700 clamp(28px, 4vw, 38px)/1.05 var(--font-display); letter-spacing: .02em; text-wrap: balance; }
.lead { margin: 0 0 6px; font: italic 500 19px/1.4 var(--font-body); color: var(--text-muted); }
.rule { height: 12px; margin: 14px 0 18px; background: radial-gradient(circle, var(--text-muted) 2.5px, transparent 3px) center / 12px 12px no-repeat, linear-gradient(var(--text-muted), var(--text-muted)) left center / calc(50% - 12px) 1px no-repeat, linear-gradient(var(--text-muted), var(--text-muted)) right center / calc(50% - 12px) 1px no-repeat; opacity: .55; max-width: none; }
.sheet h3 { display: flex; align-items: center; gap: 10px; margin: 30px 0 10px; font: 700 16px/1.15 var(--font-display); letter-spacing: .13em; text-transform: uppercase; color: var(--text-ink); }
.sheet h3::before { content: ""; flex: none; width: 7px; height: 7px; background: var(--blood); transform: rotate(45deg); }
.sheet h3::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(111,85,50,.6), transparent); }
.sheet h4 { margin: 20px 0 6px; font: 700 18px/1.2 var(--font-display); letter-spacing: .03em; color: var(--blood); }
.sheet p { margin: 0 0 11px; line-height: 1.55; }
.num { display: grid; grid-template-columns: auto 1fr; gap: 12px; margin: 0 0 11px; }
.num > b { min-width: 34px; padding-top: 2px; font: 700 14px/1.4 var(--font-display); color: var(--blood); font-variant-numeric: tabular-nums; }
.num > span { line-height: 1.55; }
.quote { margin: 14px 0; padding: 12px 16px; border-left: 3px solid var(--blood); background: rgba(255,248,228,.45); font: italic 500 18.5px/1.5 var(--font-body); }
.note { margin: 14px 0; padding: 10px 14px; border-left: 2px solid var(--gold); background: rgba(255,248,228,.35); font: italic 500 17px/1.45 var(--font-body); color: var(--text-muted); }
.list { margin: 0 0 12px; padding: 0; list-style: none; counter-reset: li; }
.list li { position: relative; margin: 0 0 9px; padding-left: 34px; line-height: 1.5; counter-increment: li; }
.list li::before { content: counter(li); position: absolute; left: 0; top: 2px; width: 22px; height: 22px; display: grid; place-items: center; border-radius: 50%; background: var(--blood); color: #f6e7c2; font: 700 13px/1 var(--font-display); }
.list.dots li::before { content: ""; top: 10px; left: 8px; width: 7px; height: 7px; border-radius: 0; transform: rotate(45deg); }
.tw { overflow-x: auto; margin: 6px 0 14px; max-width: none; }
table { width: 100%; border-collapse: collapse; font-size: 16.5px; }
th { padding: 7px 8px; text-align: left; font: 700 12.5px/1.2 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); border-bottom: 1px solid rgba(111,85,50,.5); }
td { padding: 8px; border-bottom: 1px dotted rgba(111,85,50,.4); vertical-align: top; }
td.v { white-space: nowrap; font-weight: 700; color: var(--blood); text-align: right; font-variant-numeric: tabular-nums; }
.links a, a.vk { color: var(--blood); font-weight: 700; text-decoration-color: rgba(142,47,28,.4); text-underline-offset: 3px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 16px; border: 1px solid var(--gold); border-radius: 3px; background: linear-gradient(180deg, #f1d79a, #c99a4e); color: #2a1a0c; font: 700 16px/1 var(--font-display); letter-spacing: .05em; cursor: pointer; text-decoration: none; transition: filter .25s, transform .3s var(--ease); }
.btn:hover { filter: brightness(1.06); transform: translateY(-1px); }
.btn.ghost { background: rgba(255,248,228,.45); border-color: rgba(111,85,50,.55); }
.btn.dark { background: var(--leather); color: var(--gold-hi); }

/* Stages */
.stages { display: grid; gap: 8px; max-width: none; }
.stage { display: grid; grid-template-columns: 96px 1fr; gap: 12px; padding: 12px 14px; border: 1px solid rgba(111,85,50,.3); border-radius: 4px; background: rgba(255,248,228,.4); }
.stage b { font: 700 16px/1.3 var(--font-display); color: var(--blood); }
.stage.end { background: rgba(42,29,18,.9); color: var(--parchment); border-color: var(--leather); }
.stage.end b { color: var(--gold-hi); }
figure { margin: 18px 0; max-width: 620px; }
figure img { display: block; width: 100%; height: auto; border-radius: 4px; border: 1px solid rgba(111,85,50,.5); box-shadow: 0 8px 24px rgba(40,25,10,.25); background: #fff; }
figcaption { margin-top: 6px; font: italic 500 15px/1.4 var(--font-body); color: var(--text-muted); }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 8px 0 14px; }
.kv dt { font: 700 13px/1.6 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); }
.kv dd { margin: 0; min-width: 0; }

#mapov { position: fixed; inset: 0; z-index: 60; background: var(--ink); }
#mapov iframe, #docov iframe { width: 100%; height: 100%; border: 0; display: block; }
#docov { position: fixed; inset: 0; z-index: 61; background: var(--ink); } #docov[hidden] { display: none; }
.tile.locked { opacity: .55; filter: saturate(.4); } .tile.locked::after { display: none !important; }
.tile.locked .arrow { opacity: .8; }
.crest-btn { margin-top: 14px; } .crest-btn svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.guest { margin-top: 12px !important; padding: 8px 14px; border: 1px dashed rgba(201,162,90,.5); border-radius: 4px; font-size: 16.5px !important; }
.locked-page { max-width: 46ch; margin: 10px auto; text-align: center; }
.locked-page > svg { width: 48px; height: 48px; stroke: var(--blood); fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
.locked-page h2 { margin-top: 6px; }
.doc-admin { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: 6px 0 16px; }
.doc-admin small { flex: 1 1 260px; font: italic 500 15px/1.35 var(--font-body); color: var(--text-muted); }
.docs { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 10px; }
.doc { display: flex; flex-direction: column; border: 1px solid rgba(111,85,50,.4); border-radius: 5px; background: rgba(255,248,228,.55); overflow: hidden; }
.doc.hid { border-style: dashed; background: rgba(255,248,228,.25); }
.doc-open { display: flex; flex-direction: column; gap: 4px; flex: 1; padding: 13px 15px; border: 0; background: none; text-align: left; cursor: pointer; color: var(--text-ink); transition: background .2s; }
.doc-open:hover { background: rgba(255,248,228,.85); }
.doc-k { font: 700 13px/1.2 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--blood); }
.doc-k i { margin-left: 4px; padding: 1px 7px 2px; border-radius: 999px; background: rgba(111,85,50,.2); color: var(--text-muted); font: 700 12px/1.3 var(--font-body); letter-spacing: 0; text-transform: none; font-style: normal; }
.doc-k i.on { background: #3f5a2c; color: #eef3df; }
.doc-open b { font: 700 20px/1.2 var(--font-display); }
.doc-n { font: italic 500 16px/1.4 var(--font-body); color: var(--text-ink); }
.doc-open small { font: italic 500 14px var(--font-body); color: var(--text-muted); }
.doc-ops { display: flex; gap: 6px; padding: 8px 12px; border-top: 1px dashed rgba(111,85,50,.35); }
.doc-ops button { padding: 6px 10px; border: 1px solid rgba(111,85,50,.5); border-radius: 3px; background: rgba(255,252,240,.7); color: var(--text-ink); font: 700 13.5px/1 var(--font-display); cursor: pointer; }
html.map-open, html.map-open body { overflow: hidden; }
html.map-open .bg, html.map-open #app, html.map-open #ov, html.map-open #toast { display: none !important; }

/* Search, factions, quests */
.search { margin-bottom: 10px; max-width: 420px; }
.fac { margin-bottom: 8px; border: 1px solid rgba(111,85,50,.35); border-left: 4px solid var(--fc); border-radius: 4px; background: rgba(255,248,228,.35); max-width: none; }
.fac.open { background: rgba(255,248,228,.6); }
.fac-h { display: flex; align-items: center; gap: 12px; width: 100%; padding: 12px 14px 12px 10px; border: 0; background: none; text-align: left; cursor: pointer; color: var(--text-ink); }
.fac-h > span { flex: 1; min-width: 0; } .fac-h b { display: block; font: 700 21px/1.1 var(--font-display); } .fac-h small { display: block; margin-top: 3px; font: italic 600 15px/1.2 var(--font-body); color: var(--text-muted); }
.fac-h > svg:last-child { flex: none; width: 20px; height: 20px; stroke: var(--text-muted); fill: none; stroke-width: 2; stroke-linecap: round; transition: transform .45s var(--ease); }
.fac.open .fac-h > svg:last-child { transform: rotate(180deg); }
.emb { flex: none; width: 40px; height: 44px; padding: 8px 9px 11px; background: var(--fc); clip-path: path("M0 0H40V20C40 32 30 39 20 44C10 39 0 32 0 20Z"); fill: none; stroke: #f6e7c2; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.fac .body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s var(--ease); } .fac.open .body { grid-template-rows: 1fr; } .fac .body > div { overflow: hidden; min-height: 0; } .fac .in { padding: 0 16px 14px; }
.fac .skill { margin-bottom: 6px; }
.qfree { display: inline-flex; align-items: center; gap: 8px; margin: 0 0 14px; font: 600 16px var(--font-body); cursor: pointer; }
.qfree input { width: 17px; height: 17px; accent-color: var(--blood); }
.quests { display: grid; gap: 10px; max-width: none; }
.quest { padding: 14px 16px 10px; border: 1px solid rgba(111,85,50,.32); border-radius: 4px; background: rgba(255,248,228,.45); }
.quest.busy { background: rgba(120,95,60,.12); } .quest.busy > p { opacity: .75; }
.quest header { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
.quest header b { display: block; font: 700 22px/1.12 var(--font-display); }
.qg { display: inline-block; margin: 5px 6px 0 0; padding: 2px 8px 3px; border-radius: 3px; background: rgba(111,85,50,.14); font-size: 13.5px; font-weight: 700; color: var(--text-muted); }
.qg.qt { background: rgba(142,47,28,.12); color: var(--blood); }
.qs { flex: none; padding: 4px 10px 5px; border-radius: 999px; border: 1px solid #4f6a3a; color: #3f5a2c; font: 700 13.5px/1 var(--font-body); white-space: nowrap; }
.qs.busy { background: var(--blood); border-color: var(--blood); color: #f6e7c2; } .qs.done { background: var(--leather); border-color: var(--leather); color: var(--gold-hi); }
.quest > p { margin: 9px 0 0; }
.quest .kv { font-size: 16px; }

/* ---------- Newspaper ---------- */
.sheet:has(.paper) { background-color: #efe4c8; background-image: var(--grain), linear-gradient(180deg, #f1e7cd, #e3d3ad); }
.paper { --pk: #241a10; color: var(--pk); font-family: "Old Standard TT", "Cormorant Garamond", Georgia, serif; }
.issues-nav { display: flex; flex-wrap: wrap; gap: 4px; margin: -6px 0 18px; padding-bottom: 12px; border-bottom: 1px solid rgba(36,26,16,.25); }
.issues-nav button { padding: 5px 10px; border: 1px solid rgba(36,26,16,.3); border-radius: 2px; background: transparent; font: 700 14px/1 "Old Standard TT", Georgia, serif; color: var(--pk); cursor: pointer; font-variant-numeric: tabular-nums; }
.issues-nav button[aria-pressed="true"] { background: var(--pk); color: #f1e7cd; }
.mast { text-align: center; border-top: 4px double var(--pk); border-bottom: 4px double var(--pk); padding: 6px 0 10px; }
.mast-top { display: flex; justify-content: space-between; gap: 10px; padding-bottom: 6px; margin-bottom: 4px; border-bottom: 1px solid var(--pk); font: italic 400 14.5px/1.3 "Old Standard TT", Georgia, serif; }
.mast-title { margin: 6px 0 2px !important; font: 400 clamp(34px, 6.4vw, 66px)/1.05 "Ruslan Display", "Cormorant SC", Georgia, serif !important; letter-spacing: .03em !important; color: var(--pk); }
.mast-sub { font: italic 400 15.5px/1.3 "Old Standard TT", Georgia, serif; letter-spacing: .04em; }
.lead-story { padding: 16px 0 14px; border-bottom: 2px solid var(--pk); text-align: left; }

/* Characters */
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 16px; max-width: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; border: 1px solid rgba(111,85,50,.45); border-radius: 999px; background: rgba(255,248,228,.4); color: var(--text-ink); font: 600 15.5px/1 var(--font-body); cursor: pointer; transition: background .25s, color .25s; }
.chip span { font-size: 12.5px; font-weight: 700; padding: 2px 6px; border-radius: 999px; background: rgba(111,85,50,.15); }
.chip[aria-pressed="true"] { background: var(--leather); color: var(--gold-hi); border-color: var(--leather); }
.cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; max-width: none; }
.card { display: grid; grid-template-columns: 48px 1fr; gap: 2px 12px; align-items: start; padding: 14px; border: 1px solid rgba(111,85,50,.35); border-radius: 4px; background: rgba(255,248,228,.45); text-align: left; cursor: pointer; transition: transform .35s var(--ease), background .25s, box-shadow .3s; }
.card:hover, .card:focus-visible { transform: translateY(-2px); background: rgba(255,248,228,.85); box-shadow: 0 8px 20px rgba(60,40,15,.18); outline: none; }
.mono { grid-row: span 3; width: 48px; height: 48px; display: grid; place-items: center; border-radius: 50%; border: 1.5px solid var(--blood); color: var(--blood); font: 700 22px/1 var(--font-display); background: rgba(255,248,228,.5); }
.card b { font: 700 20px/1.1 var(--font-display); }
.card .r { font: italic 600 15px/1.3 var(--font-body); color: var(--text-muted); }
.card .f { justify-self: start; margin-top: 4px; padding: 2px 8px; border-radius: 3px; background: rgba(142,47,28,.12); font: 700 13px/1.4 var(--font-body); color: var(--blood); }
.skills { display: grid; gap: 6px; }
.skill { padding: 8px 12px; border-left: 3px solid var(--gold); background: rgba(255,248,228,.45); border-radius: 0 3px 3px 0; }
.skill b { font: 700 17px/1.2 var(--font-display); }
.skill i { margin-left: 6px; font-style: normal; font-size: 14px; font-weight: 700; color: var(--blood); }
.skill p { margin: 3px 0 0; font-size: 16.5px; line-height: 1.45; }
.member { display: grid; grid-template-columns: 48px 1fr; gap: 12px; margin: 0 0 10px; padding: 12px 14px; border: 1px solid rgba(111,85,50,.3); border-radius: 4px; background: rgba(255,248,228,.4); }
.member b { display: block; font: 700 20px/1.1 var(--font-display); }
.member small { display: block; margin: 3px 0 4px; font: italic 600 15px/1.2 var(--font-body); color: var(--blood); }
.member p { margin: 0; }

.card { grid-template-columns: 64px 1fr; }
.card .mono { width: 64px; height: 64px; border-radius: 6px; }
.ava { object-fit: cover; object-position: center top; border-width: 2px; }
.mono.big { width: 56px; height: 56px; cursor: zoom-in; }
.member { grid-template-columns: 56px 1fr; }
.gal { display: flex; gap: 10px; margin: 4px 0 8px; overflow-x: auto; padding-bottom: 4px; }
.gp { flex: none; padding: 0; border: 1px solid rgba(111,85,50,.5); border-radius: 4px; background: var(--leather); cursor: zoom-in; overflow: hidden; box-shadow: 0 6px 16px rgba(40,25,10,.25); transition: transform .35s var(--ease); }
.gp img { display: block; height: 300px; width: auto; max-width: none; }
.gp:hover { transform: translateY(-2px); }
#zoom { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) 16px; background: rgba(10,6,2,.88); opacity: 0; visibility: hidden; cursor: zoom-out; transition: opacity .3s, visibility 0s .3s; }

#zoom img { max-width: 100%; max-height: 100%; border-radius: 4px; box-shadow: 0 20px 60px rgba(0,0,0,.6); transform: scale(.97); transition: transform .4s var(--ease); }
#zoom.on img { transform: none; }
@media (max-width: 560px) { .gp img { height: 220px; } }

/* Overlay sheet for character detail */
#ov { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); background: rgba(10,6,2,.6); opacity: 0; visibility: hidden; transition: opacity .35s, visibility 0s .35s; }

.x { position: sticky; top: 0; float: right; margin: -14px -20px 0 10px; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--gold); border-radius: 50%; background: var(--leather); cursor: pointer; z-index: 2; }
.x svg { width: 16px; height: 16px; stroke: var(--gold-hi); stroke-width: 2; fill: none; stroke-linecap: round; }

/* Vestnik */
.issues { display: grid; gap: 10px; max-width: none; }
.issue { border: 1px solid rgba(111,85,50,.35); border-radius: 4px; background: rgba(255,248,228,.4); }
.issue > button { display: grid; grid-template-columns: 96px 1fr 20px; gap: 12px; align-items: center; width: 100%; padding: 13px 14px; border: 0; background: none; text-align: left; cursor: pointer; }
.issue .dt { font: 700 15px/1.2 var(--font-display); color: var(--blood); font-variant-numeric: tabular-nums; }
.issue .hd { font: 700 19px/1.2 var(--font-display); color: var(--text-ink); }
.issue svg { width: 18px; height: 18px; stroke: var(--text-muted); fill: none; stroke-width: 2; stroke-linecap: round; transition: transform .45s var(--ease); }
.issue.open svg { transform: rotate(180deg); }
.issue .body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s var(--ease); }
.issue.open .body { grid-template-rows: 1fr; }
.issue .body > div { overflow: hidden; min-height: 0; }
.issue .in { padding: 0 16px 14px; }
.issue .ads { margin-top: 6px; padding: 9px 12px; border: 1px dashed rgba(111,85,50,.5); font-size: 16.5px; }
.issue .ads b { font: 700 13px/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); margin-right: 6px; }
.badge-new { display: inline-block; margin-left: 8px; padding: 2px 7px; border-radius: 3px; background: var(--blood); color: #f6e7c2; font: 700 11px/1.3 var(--font-display); letter-spacing: .1em; vertical-align: 3px; }

/* Anketa form */
.form { display: grid; gap: 14px; max-width: none; }
.f2 { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; }
.fld label { display: block; margin-bottom: 4px; font: 700 13px/1.3 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); }
.fld small { display: block; margin-top: 3px; font: italic 500 14.5px/1.35 var(--font-body); color: var(--text-muted); }
input[type=text], input[type=url], textarea, select { width: 100%; padding: 9px 11px; border: 1px solid rgba(111,85,50,.5); border-radius: 3px; background: rgba(255,252,240,.7); color: var(--text-ink); font: 500 17px/1.4 var(--font-body); }
textarea { resize: vertical; min-height: 86px; }
input:focus, textarea:focus, select:focus { outline: 2px solid var(--gold); outline-offset: 0; border-color: var(--gold); }
.skillrow { display: grid; grid-template-columns: 1fr 150px 36px; gap: 6px; margin-bottom: 6px; }
.rm { border: 1px solid rgba(142,47,28,.45); border-radius: 3px; background: transparent; color: var(--blood); cursor: pointer; font-size: 20px; line-height: 1; }
.counter { font: italic 600 14.5px var(--font-body); color: var(--text-muted); }
.counter.bad { color: var(--blood); }
.out { white-space: pre-wrap; padding: 14px 16px; border: 1px solid rgba(111,85,50,.45); border-radius: 3px; background: rgba(255,252,240,.75); font: 500 16.5px/1.5 var(--font-body); max-height: 420px; overflow: auto; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toast { position: fixed; left: 50%; bottom: max(20px, env(safe-area-inset-bottom, 0px)); z-index: 40; transform: translate(-50%, 20px); padding: 11px 16px; border-radius: 4px; background: var(--leather); border: 1px solid var(--gold); color: var(--parchment); font: 600 16px var(--font-body); opacity: 0; transition: opacity .3s, transform .4s var(--ease); pointer-events: none; max-width: calc(100% - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 860px) {
  .layout { grid-template-columns: 1fr; gap: 12px; }
  .rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 64px); z-index: 4; flex-direction: row; overflow-x: auto; gap: 6px; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 8px max(16px, env(safe-area-inset-left, 0px)); background: rgba(23,17,11,.92); scrollbar-width: none; }
  .rail::-webkit-scrollbar { display: none; }
  .rail { align-items: stretch; }
  .rail button { flex: none; white-space: nowrap; padding: 8px 12px; font-size: 14.5px; margin: 0 !important; }
  .rail button:hover { transform: none; }
  .tile.big { grid-column: auto; }
  .bar h1 { font-size: 19px; }
  .back b { display: none; }
}
@media (max-width: 860px) { .cols { column-count: 2; } }
@media (max-width: 560px) {
  .cols { column-count: 1; }

  body { font-size: 17px; }
  .tiles, .tiles.three { grid-template-columns: 1fr; } .tiles.three .tile:last-child { grid-column: auto; }
  .tile.news::after { position: static; grid-column: 2; justify-self: start; margin-top: 4px; }
  .crest { padding-top: 20px; } .sigil { width: 60px; height: 60px; }
  .sheet { padding: 22px 16px 26px; }
  .f2 { grid-template-columns: 1fr 1fr; } .f2 .fld:first-child { grid-column: 1 / -1; }
  .skillrow { grid-template-columns: 1fr 120px 34px; }
  .stage { grid-template-columns: 1fr; gap: 2px; }
  .issue > button { grid-template-columns: 1fr 20px; } .issue .dt { grid-column: 1; } .issue .hd { grid-column: 1; grid-row: 2; } .issue > button svg { grid-row: 1 / 3; grid-column: 2; }
  .x { margin: -8px -6px 0 8px; }
}
@media (max-width: 1060px) and (min-width: 561px) { .tiles.three { grid-template-columns: repeat(2, minmax(0, 1fr)); } .tiles.three .tile:last-child { grid-column: span 2; } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<script>
const D = {"master":"https://vk.com/id1120771500","album":"https://vk.ru/album-240493526_313071031","npcTopic":"https://vk.ru/topic-240493526_67557106","rulesHero":["Без разговора с мастером или создателем игры персонаж не будет принят.","Автор или мастер игры — единственный, кто может предъявить требование к чему-либо в вашей анкете. Такие требования просим выполнять, иначе анкета не будет принята. Правило создано для исключения дисбаланса.","Анкета отклоняется, если грамотность ниже среднего или она не соответствует требованиям. А также: большое количество оружия; что-то, что просто высосано из пальца или ведёт к дисбалансу.","Биография — не главный пункт анкеты, строго не оценим.","В отличие от магии, артефакты не запрещены законом. Игрок может начать с одним небольшим артефактом (амулет, кольцо, зелье), если это обосновано биографией. Мощные артефакты требуют согласования с мастером и могут быть получены только по ходу игры.","Не сравнивайте способности друг друга. Уровни выставляются индивидуально, как и слабости и суть способностей в целом. Нет такой способности, против которой не было бы оружия."],"rulesChat":[["n","3.1","Действия образно проходят в стилистике классического средневековья. Гаджеты, огнестрельное оружие - ничего нет."],["n","3.2","Посты не меньше 7-ти телефонных строк (в бою можно три). Это не так много, просто чуть больше воды и символов. В случае если пост меньше указанного числа строк, мастер пишет вам, с просьбой предоставить скриншот-доказательство. Если вы отказываете - предупреждение."],["n","3.3","В случае если вы просто бросаете ролевой мир, другой игрок получает право делать с вашим персонажем все, что только пожелает, а при желании и забрать все пожитки."],["n","3.4","По желанию мастер игры может отписать пост за NPC или в целом поиграть с вами, (вдруг кому захочется отролить сюжет по убийству богатой местной жительницы, убив и забрав все сбережения, а сорола не нашлось, саморол скучно). Но не пользуйтесь часто, всё-таки свободного времени на всех не хватит."],["n","3.5","Разрешены сцена насилия, жестокого обращения, сексуальных действий и т.д. Взаимодействие между персонажами может включать романтическую линию. Однако любые интимные сцены (NSFW) вы можете по желанию отыграть не в беседе, а в личных сообщениях."],["n","3.6","Цены, как опора. Не требуем, чтобы вы строго соответствовали, но 100 золота за то, чтобы NPC продать яблоко - это предупреждение."],["n","3.7","Мастер игры оставляет за собой право вводить неигровых персонажей (NPC) и глобальные события (нападение тварей, шторм, объявление войны) без предварительного согласования с игроками, если это необходимо для развития сюжета."],["n","3.8","Запрещено использовать информацию, которую вы прочитали в чате или в личных сообщениях других игроков, если ваш персонаж не мог этого знать. Если персонаж А убил кого-то в тайной беседе, персонаж Б не может прийти и арестовать его \"просто так\". За систематическое использование метгейминга — исключение из ролевой."],["n","3.9","Запрещено прописывать действия за другого персонажа без согласия его игрока (например: \"Я бью его мечом, он падает и умирает\"). Описание удара должно быть сформулировано как ПОПЫТКА действия (например: \"Я пытаюсь нанести удар, целясь в плечо\"). Мастер следит за тем, чтобы игроки не прописывали концовку за других. Нарушение карается предупреждением."],["n","3.10","Ваши действия влияют на отношение к вам со стороны фракций. Убийство члена Ордена сделает вас врагом инквизиции. Помощь Теням Кальдерона может открыть доступ к их ресурсам. Мастер отслеживает ключевые события и может менять статус вашего персонажа в зависимости от его поступков."],["n","3.11","Посты строго от 3-го лица. По активности: 1 пост раз в 4 дня"],["n","3.12","Независимо от вашего желания - гейм мастер не принимает больше пяти игроков одновременно. Не обслуживает больше одного вашего героя в одно время."],["n","3.13","В начале поста необходимо указывать город, в котором происходят события в посте. Если забыли и пропустили - ничего страшного, просто поставите в следующем."]],"rulesFlood":["Мат разрешён в любом количестве.","Прямые оскорбления запрещены (шутки — это хорошо, если они не слишком грязные).","Религия, нетрадиционная ориентация — любые спорные темы разрешены, но переходить на личности, а главное путать выражение мнения и оскорбление не стоит. Тема политики под запретом.","Предупреждение или бан можно получить даже спустя N-ое количество часов за нарушение любого из правил.","Очень важное правило. Если вам наскучило ролить, но общаться во флуде хочется, обсудите это с администратором — вас оставят во флуд-беседе. Правила всё так же применимы. Мы понимаем: иногда человеку просто необходимо поддерживать общение, и отказывать было бы некрасиво.","Без пиара других ролевых.","У каждого могут быть проблемы в жизни. Если из ролевой уходить желания нет, а время и ситуация не позволяют, обратитесь к автору или мастеру игры. Вы и ваш персонаж будете указаны в закреплённом сообщении беседы со статусом «заморожен» или «в отпуске»."],"rulesBans":"С банами всё просто. Три предупреждения — исключение из беседы. После каждого предупреждения также исключают из беседы на определённое время (зависит от нарушения). Если вас исключили только из флуд-беседы, в ролевой вы остаётесь; если исключили из ролевой беседы — удаляют и из флуда.","rulesNpc":["Анкету на каждого NPC необходимо загрузить в обсуждение. Принятые анкеты допускаются к игре.","NPC, которых создают игроки, никогда не владеют магией. Магия у NPC бывает только у персонажей мастера.","NPC не может выполнять квесты.","NPC всегда живёт до 1-го касания: любой NPC умирает после первого же успешного удара. Они не могут выдержать больше — они не герои. Это не позволяет использовать их как бесконечный щит.","Нельзя использовать больше пяти NPC в одной боевой ситуации.","Если NPC больше шести, они считаются за одну боевую единицу: группа из семи неписей действует как один персонаж — одно действие, одна реакция. Это позволяет использовать массовку, но не даёт ей несправедливого преимущества."],"combat":["Бой в игре длится до трёх касаний. Каждое касание означает успешное попадание противника — удар, ранение или иное воздействие, которое в реальности вывело бы персонажа из строя.","Три касания означают, что персонаж либо погибает, либо проигрывает битву — это определяется заранее, до начала сцены, по договорённости между игроками или с мастером.","В ситуациях, где бой идёт против мастера игры, действует строгое правило: три касания — смерть персонажа. Мастер не договаривается о «просто проигрыше». Если вы вступили в бой с мастерским персонажем, вы рискуете жизнью.","В боевой ситуации: 1 пост — 1 действие + 1 реакция."],"races":"В мире существует только одна разумная раса — люди. Однако их внешность крайне разнообразна: высокие и стройные, острые уши, кошачья внешность, хвосты, крылья, зелёная кожа — любые черты объясняются происхождением от древних родов и региональными особенностями. Игрок может придумать своему персонажу любую внешность, но он остаётся человеком, со всеми присущими людям страхами, амбициями и уязвимостью перед скверной.","anketaMaster":["Принят / не принят.","Способности и слабости не прописывайте. Их мы обсуждаем лично, они отдельно вносятся в фотоальбом группы."],"anketaPlayer":["Имя, возраст, пол.","Навыки — что персонаж умеет делать хорошо, со степенью мастерства: начальный, средний, высокий. Не перебарщивайте: персонаж не может быть лучшим во всём сразу. Пример: Зельеварение — средний уровень; Владение арбалетом — начальный; Кузнечное дело — высокий.","Биография — 4–7 предложений достаточно.","Арт (голос по желанию).","Местожительство. Где проживает персонаж? Что есть в жилище?","Инвентарь — кратко об оружии, снаряжении, вещах.","Финансы — сколько монет с собой (исходя из биографии), есть ли жильё или какое-либо имущество.","Принадлежность к какому-либо обществу, фракции."],"skverna":[["p","Скверна — это смертельная болезнь, которая превращает заражённых в Обескровленных. Она поражает не только людей, но и животных, и даже растения. Деревья скручиваются в болезненные узлы, выпуская споры, животные сращиваются с почвой, превращаясь в неподвижные, но живые ловушки. Это медленное перерождение мира, и лекарства от него нет."],["p","Название появилось из народной молвы. Первые выжившие, столкнувшиеся с ними, говорили, что у них будто-бы нет крови совсем, точно Обескровленные. Имя прижилось и стало официальным. Они питаются чужой кровью, но сами не имеют своей — они как пустые сосуды, которые нужно наполнить, чтобы существовать. Их кожа напоминает трупную, с синеватыми венами, которые видны сквозь истончившийся покров — кажется, что их обескровили ещё до того, как они превратились."],["s","Внешний вид"],["p","Кожа преимущественно тусклая, бледная, покрытая будто одним сплошным ожогом, потрескавшаяся, как старая земля. Зрение сохранено, но в глазах нет жизни — только голод. Они передвигаются быстро и бесшумно, и иногда в их движениях можно угадать того, кем они были при жизни."],["s","Поведение"],["p","Они не помнят себя, помнят лишь далёкие обрывки прошлого — лица, звуки, события, которые уже не имеют для них значения. Обескровленные нападают друг на друга и иногда игнорируют некоторых избранных, будто чувствуя в них родственную природу. Питаются исключительно кровью и за годы эпидемии истребили большую часть животных на землях Велариса. Иногда обескровленные, что раньше были магами, могут атаковать, используя свой дар."],["p","Время от времени обескровленные начинают двигаться в одном направлении, подчиняясь далёкому зову. Они словно слышат неслышимую команду, которая заставляет их мигрировать, убивать или застывать на месте. Но такие приказы редки, и большую часть времени они просто бродят в поисках крови, как дикие твари, забывшие свою природу."],["p","Защита:"],["p","Единственное, чего боятся обескровленные — это огня. Факел, свеча, костёр — они ненавидят любой его источник. Убить обескровленного можно только полным сожжением."],["p","Вирус передается через укус, через попадание слюны или крови заражённого на рану или слизистую."],["s","Остановка заражения"],["p","Вирус поддаётся остановке только на ранней стадии. Если укус пришёлся на конечность, ампутация в течение первых часов может спасти жизнь. Прижигание ран помогает в редких случаях. Маги огня заражаются медленнее — высокие температуры в их теле замедляют распространение вируса, но не останавливают его полностью."]],"stages":[["1–2 день","Почти никаких признаков. Лёгкая лихорадка, округлые покраснения по всему телу, зуд."],["2–4 день","Появляются гнойные язвы или первые мутации. Кожа начинает стягиваться, появляются разрывы, светочувствительность, сильнейшие головные боли, провалы в памяти."],["4–5 день","Явные внешние мутации. Кожа всё больше напоминает один сплошной ожог. Появляется паническая боязнь огня. Провалы в памяти становятся сильнее."],["6 день","Клиническая смерть. Человек умирает и вскоре превращается в обескровленного."]],"stagesChosen":[["1–2 день","Зуд, частые головокружения, лёгкая лихорадка."],["2–4 день","Первые мутации — стягивание кожи, разрывы, светочувствительность, сильнейшие головные боли, провалы в памяти."],["4–5 день","Появляются прямые внешние симптомы — на теле возникают подобия шрамов, похожих на ожоговые. Возможны изменения во внешности: высветление пигмента глаз, кожи и другие мутации. На этом этапе болезнь словно замирает. Потеря памяти и головные боли становятся повседневным бытом."]],"chosenNote":"Их тела всегда носят следы скверны — язвы, бледные вены, изменённую кожу. Если носитель теряет контроль или сильно ослабевает, он может превратиться в обескровленного.","other":["Не все маги, пережившие контакт со скверной, обретают Дар и сохраняют разум. Некоторые, даже обладая наследственной магией, не могут противостоять заражению. Их разум ломается, тело перестраивается, и вместо избранного рождается нечто иное — обескровленный, сохранивший часть своей прежней силы. Таких существ называют Иными обескровленными. Они встречаются реже обычных, но каждый такой экземпляр — смертельная угроза даже для опытного отряда.","Иные обескровленные опасны не просто голодом и агрессией: они помнят, что когда-то умели колдовать. Их магия искажена, нестабильна, но она всё ещё работает. Они могут неосознанно создавать защитные поля, призывать иллюзии, выжигать пространство вокруг себя или двигаться с неестественной скоростью. Их поведение непредсказуемо, потому что оно смешивает звериный голод с остатками человеческого разума."],"otherRules":[["Редкость","Встречаются реже обычных обескровленных — встреча с ними неожиданна и опасна."],["Устойчивость","Мастер определяет её случайно перед боем: к огню, к холоду, к физическим атакам или к ментальной магии."],["Способность","Одна случайная, тоже определяется мастером перед боем: от слабого защитного поля до кратковременной невидимости."],["Добыча","С них можно снять артефакты, зелья или даже книги, сохранившиеся с прошлой жизни."]],"otherEnd":"Иные обескровленные — напоминание о том, что магия не всегда спасает. Скверна не различает избранных и обычных людей. Они — предупреждение для тех, кто слишком надеется на свой Дар.","dar":[["p","Дар — это сверхъестественная способность, которая появляется у человека, наследственно или после контакта со скверной (в 1 на 50 случаев заражения). Помимо этого дар можно приобрести через магический артефакт, древний ритуал или случайное стечение обстоятельств. Каждый Дар уникален и обговаривается индивидуально с мастером игры лично."],["p","Дар — это не статичная способность. Чем чаще персонаж использует свою магию, тем она становится сильнее. Существует система прокачки: постепенное развитие навыка через практику, риск и преодоление. Ваш первоначальный уровень зависит от биографии персонажа — ребёнок не может владеть магией на максимальном уровне, как и взрослый, получивший Дар вчера. Все Дары разделены на уровни. Базовые способности имеют +\\- 7 уровней, более сложные и сильные Дары — 10 и больше. Каждые три уровня персонаж должен обрести новую слабость — цену, которую он платит за силу. Слабости также обговариваются с мастером игры."],["p","Особое направление Даров — магия скверны. Она отличается от остальных тем, что напрямую связана со скверной и чаще всего имеет негативный, разрушительный или тёмный характер. Магия — это не обязательно материальное воздействие. Это может быть контроль над разумом, способность видеть прошлое, чувствовать эмоции или управлять живыми существами. Всё, что душе вашей угодно, может стать вашим Даром — но за всё придётся платить."],["p","Каждое действие, связанное с использованием дара, оставляет след и его можно измерить. Мы ведём учёт ваших магических действий, когда вы набираете достаточное количество «балов», герой переходит на новый уровень. Ваш прогресс зависит только от вас. Чем чаще вы используете магию, чем глубже изучаете её природу и чем больше рискуете — тем быстрее растёте. Важно: баллы не конкурируют между игроками, каждый развивается в своём темпе; уровень дара влияет на доступные способности и их силу — но не на ваше право играть; если вы не используете магию долгое время, ваш дар не деградирует, просто ждёт."]],"darPoints":[["Использование способности (1 пост)","+1"],["Изучение книг, свитков, литературы по вашему дару (1 пост)","+2"],["Использование всех доступных способностей подряд (за один раз)","+3"],["Убийство мага (любого, с любым Даром)","+7"],["Глубокая работа со слабостями (осознание, принятие, попытка контроля)","+2"],["Изучение других магических школ (не вашего Дара)","+0,5"],["Пассивное использование Дара (пост, где магия работает фоном)","+0,2"]],"sled":[["p","Магия — это древняя сила, которая существовала в мире задолго до появления скверны, Императорской династии и даже первых городов. Она не была создана никем и не появилась из ничего. Магия — это естественная часть мироздания, такая же, как ветер, вода или огонь. Но в отличие от стихий, магия имеет собственную волю и память. Она чувствует, откликается и даже выбирает, кому открыться. Именно поэтому одни люди рождаются с Даром, а другие — нет."],["p","Это неотъемлемая часть того, кто ею пользуется. Она оставляет свой отпечаток на всём, чего касается. На оружии, на одежде, на коже, на крови. Этот отпечаток называется магическим следом — точкой соприкосновения с магией, которая остаётся после любого её использования. Магический след не живёт вечно. Через 48 часов без использования магии он полностью исчезает. Исключения составляют пассивные способности дара, когда магический след накладывается на предыдущий непрерывно."],["p","Независимо от способности или метода применения, след остаётся всегда. Авантюрист, призывающий существо из древнего свитка, оставляет след на руках. Воин, обдавший клинок магией огня, — на руках и на мече. Маг, использовавший контроль над разумом, — в крови. Погибший, чья жизнь была прервана магией - удерживает след на теле, как след от ранения. След не зависит от силы или сложности магии. Он есть всегда или его нет. Это закон, который нельзя обойти."],["p","Особое внимание стоит уделить тому, что магия отпечатывается на крови мага. Это касается даже тех способностей, которые не связаны с прямым физическим воздействием. Контроль над разумом, телепатия, иллюзии, проклятие — всё это оставляет след в крови, потому что магия проходит через тело, через саму суть человека. В случае, если в теле мага находится подселенец (сущность, дух или иной магический симбиот), магия также отпечатывается на крови носителя. Это делает анализ крови наиболее точным способом проверки на причастность к магии. Однако Орден понимает, что магия — сложная и не всегда очевидная вещь. След, оставленный на герое, не всегда говорит о том, что он сознательно использовал магию. Он мог коснуться зачарованного предмета, находиться рядом с магом или просто случайно попасть в зону магического воздействия. Поэтому протокол инквизиции предусматривает право инквизитора посадить подозреваемого в карцер на срок до 48 часов для наблюдения и дальнейшей проверки."]],"zapret":[["p","Магия в Веларисе находится под строжайшим запретом. Орден Пылающего Сердца считает магов виновниками скверны, и любой, кто уличен в использовании магии, подлежит немедленному сожжению. Это не просто закон — это догма, закреплённая в каждом храме, каждом указе Императора, каждом страхе, который живёт в сердцах людей. Достаточно одного слуха, одного подозрения — и костёр уже горит на площади. Никто не смеет спорить. Никто не смеет сомневаться. Те, кто всё же решается задавать вопросы, сами оказываются на костре."],["h","Блокирующие артефакты"],["p","Орден обладает универсальными артефактами, подавляющими магию. Среди них:"],["p","Наручники — самый распространённый тип блокаторов. Замыкаются на запястьях, блокируя любые проявления Даров. Не имеют замка в привычном смысле — механизм схлопывается при закреплении и не открывается без специального воздействия."],["p","Ошейники — используются для особо опасных магов или для длительного содержания. Полностью подавляют магию и не снимаются без специального кольца, которое находится у смотрителя тюрьмы или старшего инквизитора."],["p","Мантии и плащи — реже, но также применяются. Создают поле подавления вокруг мага, блокируя любые попытки использовать Дар."],["p","Элементы одежды — могут быть вшиты в рясу, перчатки или даже обувь. Используются для скрытого контроля над заключёнными."],["p","Все блокаторы имеют механизм схлопывания или скрепления, который не позволяет снять их самостоятельно. Замков в привычном смысле у них нет — это цельные конструкции, которые снять самостоятельно невозможно; более сложные блокаторы, применяемые в карцерах и тюрьмах можно снять специальным ключом-кольцом. Существует еще более строгий класс блокаторов, которые в случае обнаружения попытки взлома самоуничтожается путем взрыва."],["h","Артефакты для поиска магии"],["p","Помимо блокаторов, Орден активно использует артефакты, предназначенные для обнаружения магического следа:"],["li","Артефакты по крови — классический и наиболее надёжный способ проверки. Одна капля крови помещается в специальный артефакт, который показывает наличие или отсутствие магического следа. Такой тест тяжело подделать — он реагирует на саму природу крови, а не на внешние признаки. Протокол Ордена разрешает казнь на месте задержания при положительном результате."],["li","Артефакты сканирования — менее точные, но позволяют проверить мага на расстоянии. Указывают на скопление магического следа. Крайне не эффективно."],["li","Амулеты слежения — крепятся к блокаторам и позволяют инквизиторам отслеживать местоположение мага, даже если он сбежал. Изредка применяются в обычной жизни."],["li","Артефакт магического следа. Помимо анализа крови, существуют более редкие и мощные артефакты, способные указывать на магический след напрямую. Это очень сильные артефакты, которые редко доступны даже старшим инквизиторам. Они никогда не ошибаются. Такой артефакт способен не просто обнаружить наличие магии, но и определить её источник. Если инквизитор видит воина с пылающим клинком, артефакт мгновенно укажет, что именно этот воин является источником магии, а не его оружие или одежда. Это делает подобные артефакты самым надёжным инструментом для выявления магов, но их редкость и сложность в использовании не позволяют применять их повсеместно. Обычно они используются только в особо важных расследованиях или при задержании особо опасных магов."],["p","3. Артефакты на поиск анти-блокаторов или анти-поисковиков. Такие артефакты встречаются редко, их начали вводить совсем недавно. Позволяют на расстоянии выявить средство, препятствующее поиску."],["p","4. Наличие скверны несколько облегчает проверку для инквизиторов. Магический след и анализ крови остаются в силе, но современные инквизиторы чаще всего имеют при себе артефакты, чувствующие скверну на определённом расстоянии."]],"trick":["Сильные маги с развитым контролем могут частично подавить действие блокатора, но это требует огромной концентрации и может привести к травме.","Артефакты-антиблокаторы — крайне редкие и дорогие предметы, которые можно найти только на чёрном рынке. Их использование — смертельный риск. Разработка Тайного совета.","Физическое разрушение блокатора требует огромной силы и часто приводит к травме мага."],"items":["В отличие от магии, артефакты не караются смертью. Считается, что их можно использовать во благо империи. Свитки с записями древних знаний и зелья, сваренные по старым рецептам, тоже находятся вне юрисдикции Ордена. Многие выжившие пользуются магическими предметами, не имея собственного дара — это единственный способ защитить себя от обескровленных или обмануть судьбу.","На специальном рынке можно купить почти всё: от амулета, отпугивающего упырей, до зелья, временно усиливающего тело. Но цена таких вещей всегда высока — и не всегда в монетах.","Любой свиток или зелье можно использовать лишь единожды."],"vestnik":[{"d":"01.08 – 09.08","url":"https://vk.ru/@sagggakrov-vestnik-velarisa-0108-0908","head":"Дожди, шторм и миграция обескровленных","p":["В империи продолжаются тревожные времена. В Тенеграде уже вторую неделю идут проливные дожди, улицы затоплены, а в Гнилом уделе бушует шторм, из-за которого рыбаки не могут выйти в море. В Верхнем пределе — столице — погода ясная и прохладная, но горожане чувствуют напряжение. В Кальдероне, Сарконии, Лесу Страсти и Эпире тепло и солнечно.","В Эпире наследник императора Винсент Торнвуд вместе с матерью Роксаной проводят благотворительную миссию: раздают горячую еду и воду всем нуждающимся. Однако в толпе ходят слухи, что наследник прибыл не просто так — возможно, он кого-то ищет.","На юге зафиксирована миграция обескровленных в сторону столицы. Императорская армия и Орден Пылающего Сердца уже вступили с ними в бой недалеко от Гнилого удела. Потерь среди солдат пока нет, но ситуация напряжённая. Жителям рекомендуют не выходить из домов и иметь при себе огонь.","Также произошёл пожар в Торговом форпосте — предполагают, что причина в конфликте контрабандистов. Император Кассель Торнвуд подписал указ об усилении патрулей в приграничных районах."],"ads":"Набор в гильдию «Плата и сталь», продажа дома в Тенеграде, поиск пропавшей девушки из Ясной Поляны, выступление оркестра в Гнилом уделе и открытая лекция о травах в Сарконии."},{"d":"06.08","url":"https://vk.ru/@sagggakrov-vestnik-velarisa-0608","head":"Пропала Маргарет Торнвуд","p":["Пропала 14-летняя Маргарет Торнвуд, младшая дочь императора. Она исчезла у стен Эпиры — гвардейцев нашли дезориентированными, они говорят о внезапном тумане. Император объявил награду: 10 000 империалов за информацию, 20 000 — за спасение живой. Наследник Винсент лично возглавил поисковый отряд в горах.","Погода: в Тенеграде вода отступает, но грязь и болезни остались; в Гнилом уделе шторм стих, но море выбросило обломки кораблей; в столице солнечно и ветрено, охрана дворца усилена; в Кальдероне и Сарконии — небывалая жара; в Эпире — тепло, но патрули Ордена усиливаются.","Южный рубеж: армия и Орден оттеснили обескровленных на 12 км от Гнилого удела, уничтожив более 50 тварей. Есть раненые, один тяжело. Главное — обескровленные начали действовать организованно, строем. Жителям приграничья рекомендована эвакуация.","Орден Пылающего Сердца ужесточил наказания за ложные слухи и панику; трое задержаны за самосуд. Завершено дознание о пожаре в Торговом форпосте — обнаружены следы тёмного ритуала, подозреваемый задержан и передан инквизиции."],"ads":"Экстренный набор в Орден, поиск пропавшего мужчины в Эпире, нужны горные проводники для отряда Винсента, кузнецы Кальдерона ищут подмастерьев, сбор помощи в Тенеграде, таверна в Эпире платит грогом за информацию о леди Маргарет."},{"d":"16.08","url":"https://vk.ru/@sagggakrov-vestnik-velarisa-1608","head":"Десять дней без принцессы. Сгорел храм Триединства","p":["Маргарет Торнвуд не найдена уже десять дней. Гвардейцев, сопровождавших её, казнили. Винсент Торнвуд вторую неделю лично ищет сестру в горах; отряд нашёл следы лагеря в ущелье, но поиски осложнил камнепад. Награда удвоена: 30 000 империалов за живую, 15 000 за сведения.","Погода: в Тенеграде — дымка и запах гари, в Гнилом уделе — «мёртвая вода» и скудный улов, в столице — холодно и ветрено, в Кальдероне и Сарконии — пик жары, в Лесу Страсти и Эпире — странное марево и звон в ушах.","Тенеград: храм Триединства сгорел дотла. Погибли паладин Альдрик Фарн и настоятель отец Ивесий — оба посмертно награждены, семьям выплачено по 5 000 империалов. Причина пожара — магический след.","Кальдерон: Орден уничтожил четырёх магов-отступников, включая опасную преступницу Лидию Верн. Погиб один боевой маг, четверо солдат ранены. Лес объявлен запретной зоной. Также город атаковала гильдия «Тени Кальдерона»: убиты семь стражников, введён комендантский час.","«Тихая Длань»: анонимная организация открыла пункты помощи в Тенеграде, Эпире и у Красной марки — кров, еда, лекарства, анонимность.","Коротко: нападение обескровленных на караван в Эпире; странная лихорадка у детей в Гнилом уделе; смотр Императорской гвардии в столице; необычный вой в Лесу Страсти.","Торговый форпост: объявился загадочный торговец «Кузнец» с запрещёнными артефактами против обескровленных и магов. Орден уже заинтересовался им."],"ads":"Набор в Орден, нужны горные проводники, сбор помощи в Тенеграде, таверна «Тихий огонь» платит грогом за информацию, ищут торговца древними книгами."},{"d":"24.08","url":"https://vk.ru/@sagggakrov-vestnik-velarisa-2408","head":"Кальдерон пал","p":["Маргарет Торнвуд всё ещё не найдена. Отряд Винсента расширен до 50 человек; в ущелье найдены обрывки розового шёлка, но подлинность не подтверждена. Поиски осложняют заморозки и вспышка скверны. Награда поднята до 40 000 империалов за информацию и 25 000 за спасение.","Экстренно: в горах у Эпиры вспышка скверны — дорога между Тенеградом и Эпирой перекрыта, поиски приостановлены. Орден уверяет, что очаг локализован.","Тенеград: власть перешла к Дому Верн с одобрения императора. Городом управляет Изабель Верн — «Леди Туман». «Тихая Длань» признана главной благотворительной структурой. Орден почти покинул город; растут сепаратистские настроения.","Кальдерон пал: гильдия «Тени Кальдерона» во главе с «Костоломом» захватила город. Штаб Ордена сожжён, более 20 членов Ордена погибли. Император отправил парламентёров, армия занята на юге. Город — первый, вышедший из-под контроля Империи.","Эпира: загадочная смерть торговца Маркуса Холла — без ран и болезней, очевидцы винят туман и странный шёпот. В горах найдены следы неизвестного существа — трёхпалая птичья лапа, ведущая в западные ущелья.","Гнилой удел: к порту прибило плот с четырьмя мёртвыми с застывшими от ужаса лицами; причина смерти неизвестна, плот сожжён. Лекари фиксируют 19 случаев детской лихорадки.","Столица: Кассель Торнвуд выступил с речью — призвал не паниковать, обещал вернуть Кальдерон, найти дочь и победить скверну. Горожане поддерживают, но шепчутся о слишком многих неудачах.","Прочее: нападение обескровленных на караван в Эпире; Орден отразил крупную атаку у Гнилого удела; вой в Лесу Страсти; в Тенеграде прошёл закрытый приём «Тихой Длани» — говорят об «альтернативном совете»."],"ads":"Экстренный набор в Орден, лагеря для беженцев из Кальдерона в Сарконии, нужны горные проводники, сбор помощи в Тенеграде и Эпире, таверна «Тихий огонь» платит грогом за информацию, кузнецы Сарконии ищут подмастерьев."},{"d":"03.09","url":"https://vk.ru/@sagggakrov-vestnik-velarisa-0309","head":"Резня в доме Спенсеров","p":["Вспышка скверны в горах Эпиры отступила, проезд между Тенеградом и Эпирой снова открыт. Обескровленные ушли вглубь гор, карантин в Эпире снят. Император распорядился возобновить поставки продовольствия и медикаментов. Гуманитарные обеды возглавляют члены императорской семьи в разных городах.","Поиски принцессы: Маргарет не найдена почти три недели. Отряд Винсента передислоцировался в западные ущелья. Обрывки шёлка не подтверждены. Награда — 100 000 империалов. Винсент заявил: «Я не вернусь без неё».","Эпира: чудовищная резня в доме Спенсеров — убиты восемь человек, включая наследника управленца, его жену, сыновей-близнецов и слуг. Следов взлома и ограбления нет. Орден подозревает магов или контрабандистов.","Ограбления: волна дерзких ограблений в Эпире и Сарконии. Подозревают экспансию «Теней Кальдерона». Император поручил Ордену усилить патрули.","Тенеград: Дом Верн укрепляет власть, Изабель Верн управляет жёстко, но справедливо. Орден почти отсутствует. Город всё более независим. «Тихая Длань» продолжает работу. Новые загадочные смерти — ещё два случая.","Гнилой удел: число заболевших лихорадкой достигло 35. Власти просят помощи столицы. Столица: император готовит кадровые перестановки после череды неудач.","Прочее: на южном рубеже Орден отразил атаку обескровленных; в Лесу Страсти следы есть, но вой не найден; в Тенеграде Верн планирует свой городской совет."],"ads":"Бюро перевозок «Свет Ореона», набор в Орден, лагеря для беженцев, нужны горные проводники, сбор помощи «Тихой Длани», таверна «Тихий огонь» платит за информацию, кузнецы Сарконии ищут подмастерьев."},{"d":"13.09","url":"https://vk.ru/@sagggakrov-vestnik-velarisa-1309","head":"Туман растёт. Пропали трое аристократов","p":["В Империю пришли ранние холода, а туман с гор Эпиры растёт и охватывает всё больше людей. Источник не найден. У людей — кашель, головокружение, странные сны. Орден призывает не приближаться к туману, держать окна закрытыми и постоянно поддерживать огонь. Жители Эпиры начинают покидать дома у гор, в городе паника.","Поиски принцессы: Маргарет не найдена четвёртую неделю. Винсент продвинулся в западные ущелья, но безрезультатно. Награда — 100 000 империалов, но надежды тают.","Пропажа аристократов: в Гнилом уделе исчезли трое молодых аристократов — Исабель Верн (дочь управляющей Тенеградом), Миления Фон Торн (дочь Верховного Инквизитора) и Эдвир Лугар. Верховный Инквизитор лично занимается поисками.","Розыск: Орден объявил в розыск опасную магессу Розали Винвельт — запретные ритуалы, связи с тёмными культами, магия внушения. Награда: 20 000 за информацию, 50 000 за поимку.","Эпира: взрыв и пожар в ювелирной лавке; расследование резни в доме Спенсеров продолжается; череда ограблений прекратилась — Орден подтвердил причастность «Теней Кальдерона».","Тенеград: Изабель Верн укрепляет власть, Орден выслал отряд, но город всё более независим. Гнилой удел: число заболевших лихорадкой достигло 68. Столица: император провёл кадровые перестановки после череды кризисов."],"ads":"Лавка ритуальных услуг «Крест и топор», набор в Орден, лагеря для беженцев, нужны горные проводники, сбор помощи «Тихой Длани», таверна «Тихий огонь» платит за информацию (включая Розали Винвельт), кузнецы Сарконии ищут подмастерьев."},{"d":"27.09","url":"","head":"Орды у Леса Страсти. Железные острова в столице","p":["Орды обескровленных движутся через Лес Страсти к землям Велариса. Они не атакуют первыми — занимают позиции и ждут. Орден подтверждает: это наступление, не миграция.","Император Маррис Хладнор (Железные острова) прибыл в Верхний предел на переговоры с Касселем и привёл около 200 воинов. Итоги встречи неизвестны, Кассель вышел мрачным. Ходят слухи о возможном военном или брачном союзе: Хладнор привёз двух дочерей.","Гнилой удел закрыт на карантин — неизвестная эпидемия, лекари бессильны. Джорах Спенсер, потерявший семью, финансирует закупку лекарств, «Тихая Длань» помогает.","Великий съезд Ордена: переброска сил под Тенеград, ужесточение против магов (сокрытие — соучастие). Саркония готовится к крупнейшей казни — среди осуждённых бывший советник Императора и двое магов.","«Кузнец», таинственный торговец, исчез; фонтан с орлом оцеплен Орденом.","Погода: Тенеград — тревога, мобилизация Дома Верн; Гнилой удел — карантин; Верхний предел — усиленная охрана; Кальдерон — закрыт изнутри; Лес Страсти и Эпира — туман."],"ads":"Набор в Орден, помощь беженцам, поиск проводников для отряда Винсента, награда за информацию о Маргарет, Розали Винвельт и тумане."}],"chars":[{"key":"valdis","name":"Вальдис Сигрид","age":"34 года","sex":"Женский","extra":[],"art":"","skills":[["Владение оружием","высокий уровень",""],["Тактика и стратегия","средний уровень",""],["Скрытность и маскировка","высокий уровень",""],["Дисциплина и стойкость","высокий уровень",""],["Интриги и допрос","средний уровень",""]],"bio":["Вальдис Сигрид родилась в семье, которая на протяжении нескольких поколений служила Ордену Пылающего Сердца и культу Огня. Её отец ждал сына, но родилась дочь. Он никогда не знал к ней жалости. Она выжила. При первой возможности уехала в Железную цитадель, быстро зарекомендовала себя как сильный и безжалостный воин. Старший инквизитор в Верхнем пределе был старым другом семьи и прощал ей то, что другим бы не простили. Когда её семья погибла во время нападения на Красную Марку, она не проявила скорби. После одной из стычек прошла подготовку для работы под прикрытием, выдавая себя за наёмницу.","За спиной бесчисленное количество убийств, награды: за хорошую службу старший инквизитор Сарконии торжественно вручил артефакт «Пламенный круг» — старый наруч, который при активации выпускает волну огня вокруг владельца и даёт временную защиту от магии. Она не испытывает особенной ненависти к магам, хотя и согласна с позицией Ордена. Считает, что магов лучше брать в плен и использовать в своих целях. Упряма, азартна, идёт к своей цели несмотря ни на что."],"home":["Живёт в казарме Ордена в Верхнем пределе, но часто бывает в командировках."],"inv":["Полный боевой доспех с символикой Ордена.","Одежда наёмницы (для работы под прикрытием).","Двуручный меч.","Несколько кинжалов.","Артефакт «Пламенный круг» (наруч на левом запястье).","Крест-обнаружитель контроля.","Три флакона с алхимическим огнём.","Амулет с символом Огня (скрыт под одеждой).","Походный набор: кремень, фляга, сухой паёк, верёвка, нож."],"money":["Как старший паладин, она получает около 100–150 серебряных грошей в месяц. Живёт скромно."],"facText":["Орден Пылающего Сердца. Верна Ордену и Огню, но её преданность холодна и расчётлива."],"fac":"Орден Пылающего Сердца","role":"Старший паладин"},{"key":"olivia","name":"Оливия","age":"32 года","sex":"","extra":[],"art":"","skills":[["Врачевание","высокий уровень","Умеет обрабатывать раны, накладывать повязки, готовить травяные отвары и помогать при родах."],["Знание храмовых ритуалов","высокий уровень","Знает все обряды, молитвы и обычаи храма Триединства."],["Травничество","высокий уровень","Разбирается в целебных растениях, может отличить ядовитое от съедобного."],["Чтение и письмо","средний уровень","Умеет читать и писать, знает основы старых языков, на которых написаны храмовые книги."],["Уход за больными","высокий уровень","Умеет успокоить, поддержать и облегчить страдания."]],"bio":["Оливия родилась в семье, где о магии говорили шёпотом. Её мать, по слухам, обладала даром, но умерла, когда Оливия была совсем маленькой. Отец, боясь за судьбу дочери, привёл её в храм Триединства, где она выросла среди бинтов, трав и молитв. Она почти не помнила матери, только смутные тени и запах ладана, который почему-то всегда ассоциировался у неё с её голосом.","Храм стал её домом. Она не знала другой жизни — только стены, которые пахли старым деревом и воском, только привычные лица прихожан, только тихие голоса священников и шорох ряс. Она была счастлива там. Или думала, что счастлива. Когда храм сгорел, она потеряла не просто место — она потеряла всё, что знала о себе."],"home":["Раньше она жила в храме Триединства."],"inv":["Небольшой мешочек с сушёными травами.","Чистые бинты и ткань для перевязок.","Маленький нож для срезания трав.","Книга молитв храма Триединства (единственное, что осталось от храма).","Фляга с водой.","Тёплая шаль, которую она связала сама."],"money":["У неё почти нет денег. Всё, что у неё осталось — это одежда, травы и молитвы."],"facText":["Никакой. Она служительница храма Триединства, который не принадлежал ни Ордену, ни Тайному совету. Она не знает, кому можно доверять, и не делает выбора."],"fac":"Без фракции","role":"Служительница сгоревшего храма"},{"key":"silvana","name":"Сильвана Валькур","age":"22 года","sex":"Женский","extra":[],"art":"https://vk.ru/photo-240493526_457239332?z=photo-24049..","skills":[["Акробатика","высокий уровень",""],["Искусство и риторика","высокий уровень","До скверны она училась в академии и была талантливой художницей и оратором. Её речи зажигают, её магия — уничтожает."],["Уличная хватка","средний уровень","После изгнания семьи она научилась выживать в подполье и общаться с преступниками и изгоями."],["Провокация и манипуляция","высокий уровень","Она умеет заставить людей делать то, что ей нужно, даже если они не хотят этого."],["Стрельба из лука","высокий уровень",""]],"bio":["Сильвана Валькур родилась в семье магов, которые были вынуждены скрываться от Ордена, но продолжали обучать своих детей. Её родители, мудрецы и учёные, надеялись, что Сильвана сможет завершить своё обучение в академии и стать новой надеждой для магов. Однако её семья была изгнана из академии из-за подозрений в скверне, и Сильвана была вынуждена скрываться с ними. Она потеряла всё — будущее, друзей, мечты. Но она не сдалась.","Сильвана считает Триединство единственным правильным путём. Она верит, что маги должны быть властью, и скверна — это не проклятие, а дар. Она не понимает, почему должна унижаться и бегать, если у неё есть дар, который способен уничтожать целые армии. Она громкая, амбициозная и уверена, что она должна быть той, кто поведёт магов к их новому будущему.","Она часто говорит с жаром и гневом, её слова заставляют людей сомневаться в Ордене и Императоре. Она не боится оскорблять инквизиторов и не скрывает своей ненависти к ним."],"home":["Скрывается в подполье Триединства. Её местоположение постоянно меняется, но она часто находится в Сарконии или на окраинах Леса Страсти. Она никогда не задерживается на одном месте слишком долго."],"inv":["Амулет из чёрного камня, позволяющий скрыть любую ложь 1 раз в 5 постов.","Лук, колчан стрел (20 стрел)","Красивый нож для самообороны","Книга с записями её исследований скверны и магии."],"money":["У неё нет постоянного дохода. Она выживает за счёт поддержки Триединства. Её главное богатство — её знания и магия."],"facText":["Триединство. Сильвана — одна из самых ярых сторонниц фракции, она верит, что маги должны занять место власти, и не сомневается в правоте Триединства. Она готова уничтожить любого, кто встанет на пути, и не боится говорить это вслух."],"fac":"Триединство","role":"Маг-исполнитель, «голос» фракции"},{"key":"kayden","name":"Кайден","age":"19 лет","sex":"","extra":[],"art":"","skills":[["Владение мечом","средний уровень","Уверенно держит оружие, знает базовые стойки и удары, но не имеет боевого опыта за пределами тренировочного двора."],["Алхимия","высокий уровень","Хорошо разбирается в ингредиентах, может приготовить базовые зелья и определить состав неизвестных смесей."],["Скрытность","начальный уровень","Умеет двигаться тише, чем среднестатистический паладин, но до настоящей тени ему далеко."]],"bio":["Кайден вырос в небольшой деревне на окраине Велариса, где жизнь текла тихо и размеренно, пока скверна не пришла и в их дом. Его родителей сожгли на костре по ложному доносу — сосед обвинил их в магии, чтобы завладеть землёй. Кайдену тогда было тринадцать, а его младшей сестре Пенелопе — всего девять. Их разлучили: Кайдена забрали в Орден, увидев в нём потенциал для воспитания «правильного солдата», а Пенелопу приютил старый лекарь, который пожалел девочку. С тех пор они не виделись. Кайден не любит говорить про Орден. Он только что получил звание паладина-новичка и первое серьёзное задание — добыть информацию в одном из городов. Он старается не думать о том, что может встретить там сестру или что задание может быть связано с теми, кого он не хочет предавать."],"home":["Живёт в казарме Ордена в Верхнем пределе. Комната маленькая, на двоих, но сосед редко бывает. На стене висит выцветший рисунок, который Пенелопа нарисовала ему перед разлукой — он хранит его, хотя никогда никому не показывает."],"inv":["Меч в ножнах, простой, без украшений.","Два метательных ножа.","Артефакт-воспламенитель (небольшой камень с руной) — позволяет поджечь что угодно одним касанием, например лезвие меча, на 2 хода, после чего артефакт требует перезарядки в течение суток или специального состава.","Браслет-блокатор магии на левом запястье.","Дневник (почти пустой, только списки, расписания и заметки от старших паладинов).","Походный набор для алхимических экспериментов (несколько флаконов, сухие травы, ступка)."],"money":["При себе имеет 15 серебряных грошей и несколько медных монет. Никакого имущества, кроме личных вещей, нет."],"facText":["Орден Пылающего Сердца (паладин-новичок). Вступил не по убеждениям, а потому что некуда было идти. Внутри Ордена старается не выделяться."],"fac":"Орден Пылающего Сердца","role":"Паладин-новичок"},{"key":"redrif","name":"Редриф Коленвойл","age":"19 лет","sex":"Мужской","extra":[],"art":"","skills":[["Везение","высокий уровень","Он сам не знает, как ему это удаётся, но он часто оказывается в нужном месте в нужное время. Или просто слишком глуп, чтобы осознавать, что находится в опасности."],["Наблюдательность","средний уровень","Он замечает странные вещи, но интерпретирует их совершенно неправильно. Например, следы крови он может принять за пролитое вино или сок ягод."],["Умение задавать глупые вопросы","высокий уровень","Он может вывести из себя любого человека, просто спросив что-то невинное."],["Ориентация в лесу","средний уровень","Он действительно умеет находить дорогу, но часто путает направление, потому что ему кажется, что «вон та сосна похожа на вчерашнюю, а та — на позавчерашнюю»."]],"bio":["Редриф вырос в маленькой деревне, где его считали немного странным. Он всегда был тем парнем, который спрашивал слишком много вопросов и не понимал, когда его шутки перестают быть смешными. Его отец был лесником, и Редриф с детства привык бродить по лесам, собирать грибы и мечтать о приключениях. Он всегда хотел стать героем, но его идея геройства заключалась в том, чтобы найти потерянную корову соседа или помочь старушке перейти дорогу.","Когда он услышал, что в отряд ищут добровольцев для поиска пропавшей принцессы, он записался первым. Он не понимал, что это опасно. Он думал, что это будет похоже на его обычные прогулки по лесу, только с более важной целью. Его отец пытался отговорить его, но Редриф уже собрал вещи и ушёл, оставив записку: «Я спасу принцессу и вернусь героем!»"],"home":["Раньше жил с отцом в лесной сторожке, но теперь ему выделено койко-место от гильдии авантюристов \"Плата и сталь\""],"inv":["Старый кожаный нагрудник (протёртый до дыр).","Короткий меч, больше похожий на нож.","Сумка с сушёными грибами и хлебом (он всегда берёт с собой еду, потому что любит перекусывать).","Фляга с водой.","Компас (который он почти не умеет использовать).","Артефакт \"Взгляд\" позволяющий 3р/день выйти на след принцессы, (заранее настроенный лично императорскими мудрецами)"],"money":["Никакого имущества. У него есть несколько медных монет, которые он потерял бы, если бы они не лежали в самом глубоком кармане."],"facText":["Авантюрист гильдии \"Плата и сталь\""],"fac":"«Плата и сталь»","role":"Авантюрист"},{"key":"margaret","name":"Маргарет Торнвуд","age":"14 лет","sex":"Женский","extra":[],"art":"","skills":[["Языки","высокий уровень","Свободно говорит на веларисийском, азуранском, языке Железных островов и тир-морском наречии. Также изучает древний диалект, на котором говорили в Эпире до прихода Императорской династии."],["Дипломатия и этикет","высокий уровень","Знает все тонкости придворного этикета, умеет вести переговоры, сглаживать конфликты и располагать к себе собеседников."],["Музыка и рисование","высокий уровень","Играет на лютне, поёт и рисует. Это единственное, что помогает ей справляться с тоской."],["Знание истории и географии","средний уровень","Много читает, знает историю империи и соседних государств, может составить карту и рассказать о культуре разных народов."]],"bio":["Маргарет Торнвуд — единственная дочь Императора Касселя и его третьей возлюбленной Изабеллы. Она родилась, когда её матери было всего пятнадцать лет, и выросла во дворце, окружённая книгами, учителями и тишиной. Её отец не был жесток к ней, но и не был ласков — он смотрел на неё скорее как на продолжение династии, чем как на дочь. Маргарет рано поняла, что в этом мире, чтобы выжить, нужно уметь говорить на языке врага, знать его обычаи и угадывать его мысли. Она проводила часы в библиотеке, изучая карты, языки и историю, представляя, как однажды сможет покинуть стены дворца и увидеть мир, который изучала по книгам. Её мать, Изабелла, была единственным человеком при дворе, кто действительно любил её. Она рассказывала Маргарет о том, какой была когда-то, учила её не бояться задавать вопросы и видеть людей за их титулами. Но даже мать не могла защитить её от придворных интриг и холода императорского взгляда. Маргарет часто оставалась одна — слуги боялись говорить с ней лишнего, учителя были слишком осторожны, а отец был занят делами империи. Она научилась прятаться в библиотеке, рисовать портреты незнакомых людей и играть на лютне, представляя, что играет для кого-то, кто её действительно слушает.","Она знает, что отец скрывает что-то, но не знает что. Она чувствует, что дворец хранит тайны, но никто не решается говорить с ней о них. Она хочет вырваться из золотой клетки, но не знает, как. Она тоскует по свободе и видит её только на страницах книг о дальних странах, куда ей никогда не дадут уехать."],"home":["Её покои находятся в Императорском дворце — отдельная большая комната на западной стороне, выходящая окнами в сад. В комнате — книги, лютня, стол для рисования, несколько карт на стенах. Она редко покидает свои покои, предпочитая им библиотеку и внутренний сад, где можно побыть одной."],"inv":["Несколько книг на разных языках.","Дневник, который она ведёт на азуранском — чтобы никто не мог прочитать его случайно.","Лютня, инкрус
