<script>
const D = {"master":"https://vk.com/id1120771500","album":"https://vk.ru/album-240493526_313071031","npcTopic":"https://vk.ru/topic-240493526_67557106","rulesHero":["Без разговора с мастером или создателем игры персонаж не будет принят.","Автор или мастер игры — единственный, кто может предъявить требование к чему-либо в вашей анкете. Такие требования просим выполнять, иначе анкета не будет принята. Правило создано для исключения дисбаланса.","Анкета отклоняется, если грамотность ниже среднего или она не соответствует требованиям. А также: большое количество оружия; что-то, что просто высосано из пальца или ведёт к дисбалансу.","Биография — не главный пункт анкеты, строго не оценим.","В отличие от магии, артефакты не запрещены законом. Игрок может начать с одним небольшим артефактом (амулет, кольцо, зелье), если это обосновано биографией. Мощные артефакты требуют согласования с мастером и могут быть получены только по ходу игры.","Не сравнивайте способности друг друга. Уровни выставляются индивидуально, как и слабости и суть способностей в целом. Нет такой способности, против которой не было бы оружия."],"rulesChat":[["n","3.1","Действия образно проходят в стилистике классического средневековья. Гаджеты, огнестрельное оружие - ничего нет."],["n","3.2","Посты не меньше 7-ти телефонных строк (в бою можно три). Это не так много, просто чуть больше воды и символов. В случае если пост меньше указанного числа строк, мастер пишет вам, с просьбой предоставить скриншот-доказательство. Если вы отказываете - предупреждение."],["n","3.3","В случае если вы просто бросаете ролевой мир, другой игрок получает право делать с вашим персонажем все, что только пожелает, а при желании и забрать все пожитки."],["n","3.4","По желанию мастер игры может отписать пост за NPC или в целом поиграть с вами, (вдруг кому захочется отролить сюжет по убийству богатой местной жительницы, убив и забрав все сбережения, а сорола не нашлось, саморол скучно). Но не пользуйтесь часто, всё-таки свободного времени на всех не хватит."],["n","3.5","Разрешены сцена насилия, жестокого обращения, сексуальных действий и т.д. Взаимодействие между персонажами может включать романтическую линию. Однако любые интимные сцены (NSFW) вы можете по желанию отыграть не в беседе, а в личных сообщениях."],["n","3.6","Цены, как опора. Не требуем, чтобы вы строго соответствовали, но 100 золота за то, чтобы NPC продать яблоко - это предупреждение."],["n","3.7","Мастер игры оставляет за собой право вводить неигровых персонажей (NPC) и глобальные события (нападение тварей, шторм, объявление войны) без предварительного согласования с игроками, если это необходимо для развития сюжета."],["n","3.8","Запрещено использовать информацию, которую вы прочитали в чате или в личных сообщениях других игроков, если ваш персонаж не мог этого знать. Если персонаж А убил кого-то в тайной беседе, персонаж Б не может прийти и арестовать его \"просто так\". За систематическое использование метгейминга — исключение из ролевой."],["n","3.9","Запрещено прописывать действия за другого персонажа без согласия его игрока (например: \"Я бью его мечом, он падает и умирает\"). Описание удара должно быть сформулировано как ПОПЫТКА действия (например: \"Я пытаюсь нанести удар, целясь в плечо\"). Мастер следит за тем, чтобы игроки не прописывали концовку за других. Нарушение карается предупреждением."],["n","3.10","Ваши действия влияют на отношение к вам со стороны фракций. Убийство члена Ордена сделает вас врагом инквизиции. Помощь Теням Кальдерона может открыть доступ к их ресурсам. Мастер отслеживает ключевые события и может менять статус вашего персонажа в зависимости от его поступков."],["n","3.11","Посты строго от 3-го лица. По активности: 1 пост раз в 4 дня"],["n","3.12","Независимо от вашего желания - гейм мастер не принимает больше пяти игроков одновременно. Не обслуживает больше одного вашего героя в одно время."],["n","3.13","В начале поста необходимо указывать город, в котором происходят события в посте. Если забыли и пропустили - ничего страшного, просто поставите в следующем."]],"rulesFlood":["Мат разрешён в любом количестве.","Прямые оскорбления запрещены (шутки — это хорошо, если они не слишком грязные).","Религия, нетрадиционная ориентация — любые спорные темы разрешены, но переходить на личности, а главное путать выражение мнения и оскорбление не стоит. Тема политики под запретом.","Предупреждение или бан можно получить даже спустя N-ое количество часов за нарушение любого из правил.","Очень важное правило. Если вам наскучило ролить, но общаться во флуде хочется, обсудите это с администратором — вас оставят во флуд-беседе. Правила всё так же применимы. Мы понимаем: иногда человеку просто необходимо поддерживать общение, и отказывать было бы некрасиво.","Без пиара других ролевых.","У каждого могут быть проблемы в жизни. Если из ролевой уходить желания нет, а время и ситуация не позволяют, обратитесь к автору или мастеру игры. Вы и ваш персонаж будете указаны в закреплённом сообщении беседы со статусом «заморожен» или «в отпуске»."],"rulesBans":"С банами всё просто. Три предупреждения — исключение из беседы. После каждого предупреждения также исключают из беседы на определённое время (зависит от нарушения). Если вас исключили только из флуд-беседы, в ролевой вы остаётесь; если исключили из ролевой беседы — удаляют и из флуда.","rulesNpc":["Анкету на каждого NPC необходимо загрузить в обсуждение. Принятые анкеты допускаются к игре.","NPC, которых создают игроки, никогда не владеют магией. Магия у NPC бывает только у персонажей мастера.","NPC не может выполнять квесты.","NPC всегда живёт до 1-го касания: любой NPC умирает после первого же успешного удара. Они не могут выдержать больше — они не герои. Это не позволяет использовать их как бесконечный щит.","Нельзя использовать больше пяти NPC в одной боевой ситуации.","Если NPC больше шести, они считаются за одну боевую единицу: группа из семи неписей действует как один персонаж — одно действие, одна реакция. Это позволяет использовать массовку, но не даёт ей несправедливого преимущества."],"combat":["Бой в игре длится до трёх касаний. Каждое касание означает успешное попадание противника — удар, ранение или иное воздействие, которое в реальности вывело бы персонажа из строя.","Три касания означают, что персонаж либо погибает, либо проигрывает битву — это определяется заранее, до начала сцены, по договорённости между игроками или с мастером.","В ситуациях, где бой идёт против мастера игры, действует строгое правило: три касания — смерть персонажа. Мастер не договаривается о «просто проигрыше». Если вы вступили в бой с мастерским персонажем, вы рискуете жизнью.","В боевой ситуации: 1 пост — 1 действие + 1 реакция."],"races":"В мире существует только одна разумная раса — люди. Однако их внешность крайне разнообразна: высокие и стройные, острые уши, кошачья внешность, хвосты, крылья, зелёная кожа — любые черты объясняются происхождением от древних родов и региональными особенностями. Игрок может придумать своему персонажу любую внешность, но он остаётся человеком, со всеми присущими людям страхами, амбициями и уязвимостью перед скверной.","anketaMaster":["Принят / не принят.","Способности и слабости не прописывайте. Их мы обсуждаем лично, они отдельно вносятся в фотоальбом группы."],"anketaPlayer":["Имя, возраст, пол.","Навыки — что персонаж умеет делать хорошо, со степенью мастерства: начальный, средний, высокий. Не перебарщивайте: персонаж не может быть лучшим во всём сразу. Пример: Зельеварение — средний уровень; Владение арбалетом — начальный; Кузнечное дело — высокий.","Биография — 4–7 предложений достаточно.","Арт (голос по желанию).","Местожительство. Где проживает персонаж? Что есть в жилище?","Инвентарь — кратко об оружии, снаряжении, вещах.","Финансы — сколько монет с собой (исходя из биографии), есть ли жильё или какое-либо имущество.","Принадлежность к какому-либо обществу, фракции."],"skverna":[["p","Скверна — это смертельная болезнь, которая превращает заражённых в Обескровленных. Она поражает не только людей, но и животных, и даже растения. Деревья скручиваются в болезненные узлы, выпуская споры, животные сращиваются с почвой, превращаясь в неподвижные, но живые ловушки. Это медленное перерождение мира, и лекарства от него нет."],["p","Название появилось из народной молвы. Первые выжившие, столкнувшиеся с ними, говорили, что у них будто-бы нет крови совсем, точно Обескровленные. Имя прижилось и стало официальным. Они питаются чужой кровью, но сами не имеют своей — они как пустые сосуды, которые нужно наполнить, чтобы существовать. Их кожа напоминает трупную, с синеватыми венами, которые видны сквозь истончившийся покров — кажется, что их обескровили ещё до того, как они превратились."],["s","Внешний вид"],["p","Кожа преимущественно тусклая, бледная, покрытая будто одним сплошным ожогом, потрескавшаяся, как старая земля. Зрение сохранено, но в глазах нет жизни — только голод. Они передвигаются быстро и бесшумно, и иногда в их движениях можно угадать того, кем они были при жизни."],["s","Поведение"],["p","Они не помнят себя, помнят лишь далёкие обрывки прошлого — лица, звуки, события, которые уже не имеют для них значения. Обескровленные нападают друг на друга и иногда игнорируют некоторых избранных, будто чувствуя в них родственную природу. Питаются исключительно кровью и за годы эпидемии истребили большую часть животных на землях Велариса. Иногда обескровленные, что раньше были магами, могут атаковать, используя свой дар."],["p","Время от времени обескровленные начинают двигаться в одном направлении, подчиняясь далёкому зову. Они словно слышат неслышимую команду, которая заставляет их мигрировать, убивать или застывать на месте. Но такие приказы редки, и большую часть времени они просто бродят в поисках крови, как дикие твари, забывшие свою природу."],["p","Защита:"],["p","Единственное, чего боятся обескровленные — это огня. Факел, свеча, костёр — они ненавидят любой его источник. Убить обескровленного можно только полным сожжением."],["p","Вирус передается через укус, через попадание слюны или крови заражённого на рану или слизистую."],["s","Остановка заражения"],["p","Вирус поддаётся остановке только на ранней стадии. Если укус пришёлся на конечность, ампутация в течение первых часов может спасти жизнь. Прижигание ран помогает в редких случаях. Маги огня заражаются медленнее — высокие температуры в их теле замедляют распространение вируса, но не останавливают его полностью."]],"stages":[["1–2 день","Почти никаких признаков. Лёгкая лихорадка, округлые покраснения по всему телу, зуд."],["2–4 день","Появляются гнойные язвы или первые мутации. Кожа начинает стягиваться, появляются разрывы, светочувствительность, сильнейшие головные боли, провалы в памяти."],["4–5 день","Явные внешние мутации. Кожа всё больше напоминает один сплошной ожог. Появляется паническая боязнь огня. Провалы в памяти становятся сильнее."],["6 день","Клиническая смерть. Человек умирает и вскоре превращается в обескровленного."]],"stagesChosen":[["1–2 день","Зуд, частые головокружения, лёгкая лихорадка."],["2–4 день","Первые мутации — стягивание кожи, разрывы, светочувствительность, сильнейшие головные боли, провалы в памяти."],["4–5 день","Появляются прямые внешние симптомы — на теле возникают подобия шрамов, похожих на ожоговые. Возможны изменения во внешности: высветление пигмента глаз, кожи и другие мутации. На этом этапе болезнь словно замирает. Потеря памяти и головные боли становятся повседневным бытом."]],"chosenNote":"Их тела всегда носят следы скверны — язвы, бледные вены, изменённую кожу. Если носитель теряет контроль или сильно ослабевает, он может превратиться в обескровленного.","other":["Не все маги, пережившие контакт со скверной, обретают Дар и сохраняют разум. Некоторые, даже обладая наследственной магией, не могут противостоять заражению. Их разум ломается, тело перестраивается, и вместо избранного рождается нечто иное — обескровленный, сохранивший часть своей прежней силы. Таких существ называют Иными обескровленными. Они встречаются реже обычных, но каждый такой экземпляр — смертельная угроза даже для опытного отряда.","Иные обескровленные опасны не просто голодом и агрессией: они помнят, что когда-то умели колдовать. Их магия искажена, нестабильна, но она всё ещё работает. Они могут неосознанно создавать защитные поля, призывать иллюзии, выжигать пространство вокруг себя или двигаться с неестественной скоростью. Их поведение непредсказуемо, потому что оно смешивает звериный голод с остатками человеческого разума."],"otherRules":[["Редкость","Встречаются реже обычных обескровленных — встреча с ними неожиданна и опасна."],["Устойчивость","Мастер определяет её случайно перед боем: к огню, к холоду, к физическим атакам или к ментальной магии."],["Способность","Одна случайная, тоже определяется мастером перед боем: от слабого защитного поля до кратковременной невидимости."],["Добыча","С них можно снять артефакты, зелья или даже книги, сохранившиеся с прошлой жизни."]],"otherEnd":"Иные обескровленные — напоминание о том, что магия не всегда спасает. Скверна не различает избранных и обычных людей. Они — предупреждение для тех, кто слишком надеется на свой Дар.","dar":[["p","Дар — это сверхъестественная способность, которая появляется у человека, наследственно или после контакта со скверной (в 1 на 50 случаев заражения). Помимо этого дар можно приобрести через магический артефакт, древний ритуал или случайное стечение обстоятельств. Каждый Дар уникален и обговаривается индивидуально с мастером игры лично."],["p","Дар — это не статичная способность. Чем чаще персонаж использует свою магию, тем она становится сильнее. Существует система прокачки: постепенное развитие навыка через практику, риск и преодоление. Ваш первоначальный уровень зависит от биографии персонажа — ребёнок не может владеть магией на максимальном уровне, как и взрослый, получивший Дар вчера. Все Дары разделены на уровни. Базовые способности имеют +\\- 7 уровней, более сложные и сильные Дары — 10 и больше. Каждые три уровня персонаж должен обрести новую слабость — цену, которую он платит за силу. Слабости также обговариваются с мастером игры."],["p","Особое направление Даров — магия скверны. Она отличается от остальных тем, что напрямую связана со скверной и чаще всего имеет негативный, разрушительный или тёмный характер. Магия — это не обязательно материальное воздействие. Это может быть контроль над разумом, способность видеть прошлое, чувствовать эмоции или управлять живыми существами. Всё, что душе вашей угодно, может стать вашим Даром — но за всё придётся платить."],["p","Каждое действие, связанное с использованием дара, оставляет след и его можно измерить. Мы ведём учёт ваших магических действий, когда вы набираете достаточное количество «балов», герой переходит на новый уровень. Ваш прогресс зависит только от вас. Чем чаще вы используете магию, чем глубже изучаете её природу и чем больше рискуете — тем быстрее растёте. Важно: баллы не конкурируют между игроками, каждый развивается в своём темпе; уровень дара влияет на доступные способности и их силу — но не на ваше право играть; если вы не используете магию долгое время, ваш дар не деградирует, просто ждёт."]],"darPoints":[["Использование способности (1 пост)","+1"],["Изучение книг, свитков, литературы по вашему дару (1 пост)","+2"],["Использование всех доступных способностей подряд (за один раз)","+3"],["Убийство мага (любого, с любым Даром)","+7"],["Глубокая работа со слабостями (осознание, принятие, попытка контроля)","+2"],["Изучение других магических школ (не вашего Дара)","+0,5"],["Пассивное использование Дара (пост, где магия работает фоном)","+0,2"]],"sled":[["p","Магия — это древняя сила, которая существовала в мире задолго до появления скверны, Императорской династии и даже первых городов. Она не была создана никем и не появилась из ничего. Магия — это естественная часть мироздания, такая же, как ветер, вода или огонь. Но в отличие от стихий, магия имеет собственную волю и память. Она чувствует, откликается и даже выбирает, кому открыться. Именно поэтому одни люди рождаются с Даром, а другие — нет."],["p","Это неотъемлемая часть того, кто ею пользуется. Она оставляет свой отпечаток на всём, чего касается. На оружии, на одежде, на коже, на крови. Этот отпечаток называется магическим следом — точкой соприкосновения с магией, которая остаётся после любого её использования. Магический след не живёт вечно. Через 48 часов без использования магии он полностью исчезает. Исключения составляют пассивные способности дара, когда магический след накладывается на предыдущий непрерывно."],["p","Независимо от способности или метода применения, след остаётся всегда. Авантюрист, призывающий существо из древнего свитка, оставляет след на руках. Воин, обдавший клинок магией огня, — на руках и на мече. Маг, использовавший контроль над разумом, — в крови. Погибший, чья жизнь была прервана магией - удерживает след на теле, как след от ранения. След не зависит от силы или сложности магии. Он есть всегда или его нет. Это закон, который нельзя обойти."],["p","Особое внимание стоит уделить тому, что магия отпечатывается на крови мага. Это касается даже тех способностей, которые не связаны с прямым физическим воздействием. Контроль над разумом, телепатия, иллюзии, проклятие — всё это оставляет след в крови, потому что магия проходит через тело, через саму суть человека. В случае, если в теле мага находится подселенец (сущность, дух или иной магический симбиот), магия также отпечатывается на крови носителя. Это делает анализ крови наиболее точным способом проверки на причастность к магии. Однако Орден понимает, что магия — сложная и не всегда очевидная вещь. След, оставленный на герое, не всегда говорит о том, что он сознательно использовал магию. Он мог коснуться зачарованного предмета, находиться рядом с магом или просто случайно попасть в зону магического воздействия. Поэтому протокол инквизиции предусматривает право инквизитора посадить подозреваемого в карцер на срок до 48 часов для наблюдения и дальнейшей проверки."]],"zapret":[["p","Магия в Веларисе находится под строжайшим запретом. Орден Пылающего Сердца считает магов виновниками скверны, и любой, кто уличен в использовании магии, подлежит немедленному сожжению. Это не просто закон — это догма, закреплённая в каждом храме, каждом указе Императора, каждом страхе, который живёт в сердцах людей. Достаточно одного слуха, одного подозрения — и костёр уже горит на площади. Никто не смеет спорить. Никто не смеет сомневаться. Те, кто всё же решается задавать вопросы, сами оказываются на костре."],["h","Блокирующие артефакты"],["p","Орден обладает универсальными артефактами, подавляющими магию. Среди них:"],["p","Наручники — самый распространённый тип блокаторов. Замыкаются на запястьях, блокируя любые проявления Даров. Не имеют замка в привычном смысле — механизм схлопывается при закреплении и не открывается без специального воздействия."],["p","Ошейники — используются для особо опасных магов или для длительного содержания. Полностью подавляют магию и не снимаются без специального кольца, которое находится у смотрителя тюрьмы или старшего инквизитора."],["p","Мантии и плащи — реже, но также применяются. Создают поле подавления вокруг мага, блокируя любые попытки использовать Дар."],["p","Элементы одежды — могут быть вшиты в рясу, перчатки или даже обувь. Используются для скрытого контроля над заключёнными."],["p","Все блокаторы имеют механизм схлопывания или скрепления, который не позволяет снять их самостоятельно. Замков в привычном смысле у них нет — это цельные конструкции, которые снять самостоятельно невозможно; более сложные блокаторы, применяемые в карцерах и тюрьмах можно снять специальным ключом-кольцом. Существует еще более строгий класс блокаторов, которые в случае обнаружения попытки взлома самоуничтожается путем взрыва."],["h","Артефакты для поиска магии"],["p","Помимо блокаторов, Орден активно использует артефакты, предназначенные для обнаружения магического следа:"],["li","Артефакты по крови — классический и наиболее надёжный способ проверки. Одна капля крови помещается в специальный артефакт, который показывает наличие или отсутствие магического следа. Такой тест тяжело подделать — он реагирует на саму природу крови, а не на внешние признаки. Протокол Ордена разрешает казнь на месте задержания при положительном результате."],["li","Артефакты сканирования — менее точные, но позволяют проверить мага на расстоянии. Указывают на скопление магического следа. Крайне не эффективно."],["li","Амулеты слежения — крепятся к блокаторам и позволяют инквизиторам отслеживать местоположение мага, даже если он сбежал. Изредка применяются в обычной жизни."],["li","Артефакт магического следа. Помимо анализа крови, существуют более редкие и мощные артефакты, способные указывать на магический след напрямую. Это очень сильные артефакты, которые редко доступны даже старшим инквизиторам. Они никогда не ошибаются. Такой артефакт способен не просто обнаружить наличие магии, но и определить её источник. Если инквизитор видит воина с пылающим клинком, артефакт мгновенно укажет, что именно этот воин является источником магии, а не его оружие или одежда. Это делает подобные артефакты самым надёжным инструментом для выявления магов, но их редкость и сложность в использовании не позволяют применять их повсеместно. Обычно они используются только в особо важных расследованиях или при задержании особо опасных магов."],["p","3. Артефакты на поиск анти-блокаторов или анти-поисковиков. Такие артефакты встречаются редко, их начали вводить совсем недавно. Позволяют на расстоянии выявить средство, препятствующее поиску."],["p","4. Наличие скверны несколько облегчает проверку для инквизиторов. Магический след и анализ крови остаются в силе, но современные инквизиторы чаще всего имеют при себе артефакты, чувствующие скверну на определённом расстоянии."]],"trick":["Сильные маги с развитым контролем могут частично подавить действие блокатора, но это требует огромной концентрации и может привести к травме.","Артефакты-антиблокаторы — крайне редкие и дорогие предметы, которые можно найти только на чёрном рынке. Их использование — смертельный риск. Разработка Тайного совета.","Физическое разрушение блокатора требует огромной силы и часто приводит к травме мага."],"items":["В отличие от магии, артефакты не караются смертью. Считается, что их можно использовать во благо империи. Свитки с записями древних знаний и зелья, сваренные по старым рецептам, тоже находятся вне юрисдикции Ордена. Многие выжившие пользуются магическими предметами, не имея собственного дара — это единственный способ защитить себя от обескровленных или обмануть судьбу.","На специальном рынке можно купить почти всё: от амулета, отпугивающего упырей, до зелья, временно усиливающего тело. Но цена таких вещей всегда высока — и не всегда в монетах.","Любой свиток или зелье можно использовать лишь единожды."],"vestnik":[{"d":"01.08 – 09.08","url":"https://vk.ru/@sagggakrov-vestnik-velarisa-0108-0908","head":"Дожди, шторм и миграция обескровленных","p":["В империи продолжаются тревожные времена. В Тенеграде уже вторую неделю идут проливные дожди, улицы затоплены, а в Гнилом уделе бушует шторм, из-за которого рыбаки не могут выйти в море. В Верхнем пределе — столице — погода ясная и прохладная, но горожане чувствуют напряжение. В Кальдероне, Сарконии, Лесу Страсти и Эпире тепло и солнечно.","В Эпире наследник императора Винсент Торнвуд вместе с матерью Роксаной проводят благотворительную миссию: раздают горячую еду и воду всем нуждающимся. Однако в толпе ходят слухи, что наследник прибыл не просто так — возможно, он кого-то ищет.","На юге зафиксирована миграция обескровленных в сторону столицы. Императорская армия и Орден Пылающего Сердца уже вступили с ними в бой недалеко от Гнилого удела. Потерь среди солдат пока нет, но ситуация напряжённая. Жителям рекомендуют не выходить из домов и иметь при себе огонь.","Также произошёл пожар в Торговом форпосте — предполагают, что причина в конфликте контрабандистов. Император Кассель Торнвуд подписал указ об усилении патрулей в приграничных районах."],"ads":"Набор в гильдию «Плата и сталь», продажа дома в Тенеграде, поиск пропавшей девушки из Ясной Поляны, выступление оркестра в Гнилом уделе и открытая лекция о травах в Сарконии."},{"d":"06.08","url":"https://vk.ru/@sagggakrov-vestnik-velarisa-0608","head":"Пропала Маргарет Торнвуд","p":["Пропала 14-летняя Маргарет Торнвуд, младшая дочь императора. Она исчезла у стен Эпиры — гвардейцев нашли дезориентированными, они говорят о внезапном тумане. Император объявил награду: 10 000 империалов за информацию, 20 000 — за спасение живой. Наследник Винсент лично возглавил поисковый отряд в горах.","Погода: в Тенеграде вода отступает, но грязь и болезни остались; в Гнилом уделе шторм стих, но море выбросило обломки кораблей; в столице солнечно и ветрено, охрана дворца усилена; в Кальдероне и Сарконии — небывалая жара; в Эпире — тепло, но патрули Ордена усиливаются.","Южный рубеж: армия и Орден оттеснили обескровленных на 12 км от Гнилого удела, уничтожив более 50 тварей. Есть раненые, один тяжело. Главное — обескровленные начали действовать организованно, строем. Жителям приграничья рекомендована эвакуация.","Орден Пылающего Сердца ужесточил наказания за ложные слухи и панику; трое задержаны за самосуд. Завершено дознание о пожаре в Торговом форпосте — обнаружены следы тёмного ритуала, подозреваемый задержан и передан инквизиции."],"ads":"Экстренный набор в Орден, поиск пропавшего мужчины в Эпире, нужны горные проводники для отряда Винсента, кузнецы Кальдерона ищут подмастерьев, сбор помощи в Тенеграде, таверна в Эпире платит грогом за информацию о леди Маргарет."},{"d":"16.08","url":"https://vk.ru/@sagggakrov-vestnik-velarisa-1608","head":"Десять дней без принцессы. Сгорел храм Триединства","p":["Маргарет Торнвуд не найдена уже десять дней. Гвардейцев, сопровождавших её, казнили. Винсент Торнвуд вторую неделю лично ищет сестру в горах; отряд нашёл следы лагеря в ущелье, но поиски осложнил камнепад. Награда удвоена: 30 000 империалов за живую, 15 000 за сведения.","Погода: в Тенеграде — дымка и запах гари, в Гнилом уделе — «мёртвая вода» и скудный улов, в столице — холодно и ветрено, в Кальдероне и Сарконии — пик жары, в Лесу Страсти и Эпире — странное марево и звон в ушах.","Тенеград: храм Триединства сгорел дотла. Погибли паладин Альдрик Фарн и настоятель отец Ивесий — оба посмертно награждены, семьям выплачено по 5 000 империалов. Причина пожара — магический след.","Кальдерон: Орден уничтожил четырёх магов-отступников, включая опасную преступницу Лидию Верн. Погиб один боевой маг, четверо солдат ранены. Лес объявлен запретной зоной. Также город атаковала гильдия «Тени Кальдерона»: убиты семь стражников, введён комендантский час.","«Тихая Длань»: анонимная организация открыла пункты помощи в Тенеграде, Эпире и у Красной марки — кров, еда, лекарства, анонимность.","Коротко: нападение обескровленных на караван в Эпире; странная лихорадка у детей в Гнилом уделе; смотр Императорской гвардии в столице; необычный вой в Лесу Страсти.","Торговый форпост: объявился загадочный торговец «Кузнец» с запрещёнными артефактами против обескровленных и магов. Орден уже заинтересовался им."],"ads":"Набор в Орден, нужны горные проводники, сбор помощи в Тенеграде, таверна «Тихий огонь» платит грогом за информацию, ищут торговца древними книгами."},{"d":"24.08","url":"https://vk.ru/@sagggakrov-vestnik-velarisa-2408","head":"Кальдерон пал","p":["Маргарет Торнвуд всё ещё не найдена. Отряд Винсента расширен до 50 человек; в ущелье найдены обрывки розового шёлка, но подлинность не подтверждена. Поиски осложняют заморозки и вспышка скверны. Награда поднята до 40 000 империалов за информацию и 25 000 за спасение.","Экстренно: в горах у Эпиры вспышка скверны — дорога между Тенеградом и Эпирой перекрыта, поиски приостановлены. Орден уверяет, что очаг локализован.","Тенеград: власть перешла к Дому Верн с одобрения императора. Городом управляет Изабель Верн — «Леди Туман». «Тихая Длань» признана главной благотворительной структурой. Орден почти покинул город; растут сепаратистские настроения.","Кальдерон пал: гильдия «Тени Кальдерона» во главе с «Костоломом» захватила город. Штаб Ордена сожжён, более 20 членов Ордена погибли. Император отправил парламентёров, армия занята на юге. Город — первый, вышедший из-под контроля Империи.","Эпира: загадочная смерть торговца Маркуса Холла — без ран и болезней, очевидцы винят туман и странный шёпот. В горах найдены следы неизвестного существа — трёхпалая птичья лапа, ведущая в западные ущелья.","Гнилой удел: к порту прибило плот с четырьмя мёртвыми с застывшими от ужаса лицами; причина смерти неизвестна, плот сожжён. Лекари фиксируют 19 случаев детской лихорадки.","Столица: Кассель Торнвуд выступил с речью — призвал не паниковать, обещал вернуть Кальдерон, найти дочь и победить скверну. Горожане поддерживают, но шепчутся о слишком многих неудачах.","Прочее: нападение обескровленных на караван в Эпире; Орден отразил крупную атаку у Гнилого удела; вой в Лесу Страсти; в Тенеграде прошёл закрытый приём «Тихой Длани» — говорят об «альтернативном совете»."],"ads":"Экстренный набор в Орден, лагеря для беженцев из Кальдерона в Сарконии, нужны горные проводники, сбор помощи в Тенеграде и Эпире, таверна «Тихий огонь» платит грогом за информацию, кузнецы Сарконии ищут подмастерьев."},{"d":"03.09","url":"https://vk.ru/@sagggakrov-vestnik-velarisa-0309","head":"Резня в доме Спенсеров","p":["Вспышка скверны в горах Эпиры отступила, проезд между Тенеградом и Эпирой снова открыт. Обескровленные ушли вглубь гор, карантин в Эпире снят. Император распорядился возобновить поставки продовольствия и медикаментов. Гуманитарные обеды возглавляют члены императорской семьи в разных городах.","Поиски принцессы: Маргарет не найдена почти три недели. Отряд Винсента передислоцировался в западные ущелья. Обрывки шёлка не подтверждены. Награда — 100 000 империалов. Винсент заявил: «Я не вернусь без неё».","Эпира: чудовищная резня в доме Спенсеров — убиты восемь человек, включая наследника управленца, его жену, сыновей-близнецов и слуг. Следов взлома и ограбления нет. Орден подозревает магов или контрабандистов.","Ограбления: волна дерзких ограблений в Эпире и Сарконии. Подозревают экспансию «Теней Кальдерона». Император поручил Ордену усилить патрули.","Тенеград: Дом Верн укрепляет власть, Изабель Верн управляет жёстко, но справедливо. Орден почти отсутствует. Город всё более независим. «Тихая Длань» продолжает работу. Новые загадочные смерти — ещё два случая.","Гнилой удел: число заболевших лихорадкой достигло 35. Власти просят помощи столицы. Столица: император готовит кадровые перестановки после череды неудач.","Прочее: на южном рубеже Орден отразил атаку обескровленных; в Лесу Страсти следы есть, но вой не найден; в Тенеграде Верн планирует свой городской совет."],"ads":"Бюро перевозок «Свет Ореона», набор в Орден, лагеря для беженцев, нужны горные проводники, сбор помощи «Тихой Длани», таверна «Тихий огонь» платит за информацию, кузнецы Сарконии ищут подмастерьев."},{"d":"13.09","url":"https://vk.ru/@sagggakrov-vestnik-velarisa-1309","head":"Туман растёт. Пропали трое аристократов","p":["В Империю пришли ранние холода, а туман с гор Эпиры растёт и охватывает всё больше людей. Источник не найден. У людей — кашель, головокружение, странные сны. Орден призывает не приближаться к туману, держать окна закрытыми и постоянно поддерживать огонь. Жители Эпиры начинают покидать дома у гор, в городе паника.","Поиски принцессы: Маргарет не найдена четвёртую неделю. Винсент продвинулся в западные ущелья, но безрезультатно. Награда — 100 000 империалов, но надежды тают.","Пропажа аристократов: в Гнилом уделе исчезли трое молодых аристократов — Исабель Верн (дочь управляющей Тенеградом), Миления Фон Торн (дочь Верховного Инквизитора) и Эдвир Лугар. Верховный Инквизитор лично занимается поисками.","Розыск: Орден объявил в розыск опасную магессу Розали Винвельт — запретные ритуалы, связи с тёмными культами, магия внушения. Награда: 20 000 за информацию, 50 000 за поимку.","Эпира: взрыв и пожар в ювелирной лавке; расследование резни в доме Спенсеров продолжается; череда ограблений прекратилась — Орден подтвердил причастность «Теней Кальдерона».","Тенеград: Изабель Верн укрепляет власть, Орден выслал отряд, но город всё более независим. Гнилой удел: число заболевших лихорадкой достигло 68. Столица: император провёл кадровые перестановки после череды кризисов."],"ads":"Лавка ритуальных услуг «Крест и топор», набор в Орден, лагеря для беженцев, нужны горные проводники, сбор помощи «Тихой Длани», таверна «Тихий огонь» платит за информацию (включая Розали Винвельт), кузнецы Сарконии ищут подмастерьев."},{"d":"27.09","url":"","head":"Орды у Леса Страсти. Железные острова в столице","p":["Орды обескровленных движутся через Лес Страсти к землям Велариса. Они не атакуют первыми — занимают позиции и ждут. Орден подтверждает: это наступление, не миграция.","Император Маррис Хладнор (Железные острова) прибыл в Верхний предел на переговоры с Касселем и привёл около 200 воинов. Итоги встречи неизвестны, Кассель вышел мрачным. Ходят слухи о возможном военном или брачном союзе: Хладнор привёз двух дочерей.","Гнилой удел закрыт на карантин — неизвестная эпидемия, лекари бессильны. Джорах Спенсер, потерявший семью, финансирует закупку лекарств, «Тихая Длань» помогает.","Великий съезд Ордена: переброска сил под Тенеград, ужесточение против магов (сокрытие — соучастие). Саркония готовится к крупнейшей казни — среди осуждённых бывший советник Императора и двое магов.","«Кузнец», таинственный торговец, исчез; фонтан с орлом оцеплен Орденом.","Погода: Тенеград — тревога, мобилизация Дома Верн; Гнилой удел — карантин; Верхний предел — усиленная охрана; Кальдерон — закрыт изнутри; Лес Страсти и Эпира — туман."],"ads":"Набор в Орден, помощь беженцам, поиск проводников для отряда Винсента, награда за информацию о Маргарет, Розали Винвельт и тумане."},{"d":"22.10","url":"","img":"vestnik/2210.webp","cap":"Беженка у стен Эпиры. Рисунок с натуры.","head":"Волна обескровленных. Лес Страсти наступает","p":["Обескровленные больше не «ждут». Минувшей ночью из Леса Страсти пошла большая волна — плотная, организованная, и, по словам разведчиков, с каждым часом она только прибывает. Орден Пылающего Сердца официально подтверждает: это не отдельные группы, а массовое наступление на живые земли. Силам Ордена удаётся сдерживать волну у границ Эпиры, бои идут на подступах к городу, у восточных трактов. «Мы держим их, но они не кончаются!» — признаётся командир одного из заслонов. Жителям Эпиры приказано не покидать город без крайней необходимости, все дороги к Лесу перекрыты. Поиски Маргарет Торнвуд продолжаются; отряд Винсента вернулся в столицу.","Итоги переговоров с Железными островами: Переговоры Императора Касселя Торнвуда и Императора Железных островов Марриса Хладнора завершились. Итоги оглашены лишь частично: в Веларис прибыло ещё около тысячи воинов с Железных островов. Они размещены в столице и, по слухам, готовятся к отправке к Лесу Страсти и в Сарконию. Стороны «достигли взаимопонимания по вопросам обороны и безопасности». Власти просят жителей быть аккуратнее в разговорах и не разжигать ненависть к гостям с Железных островов — подобное карается выговором и задержанием.","Эпира — убит магистр Винсент: Глава обороны и безопасности города, 58 лет, найден мёртвым в собственном доме. Тело изувечено до неузнаваемости: убийцы вырвали ему язык и обескровили тело почти досуха. Стража оцепила квартал, Орден начал собственное дознание. За пару дней до гибели магистр призывал горожан не слушать сторонние организации: «Никто в Веларисе, кроме Императора и Ордена, не несёт правды. Мерзкие червяки, что пользуются нашей болью, не должны иметь права власти над людьми!» Кого он имел в виду — «Тихую Длань», Теней Кальдерона или кого-то ещё? Совет мудрецов обещает скоро назначить нового главу обороны.","Саркония — первый шаг к разрушению: По всему городу прошли массовые беспорядки и взрывы, устроенные Тенями Кальдерона. Главные ворота уничтожены. Жители эвакуированы в лагеря у восточных ворот. Бои прекращены, Саркония всё ещё принадлежит Ордену и власти Велариса, но восстановление потребует сил.","Казнь в Сарконии отменена: В ходе взрывов тюремные конвои были атакованы, и все, кто должен был быть повешен, бежали — среди них бывший советник Императора и двое магов из Сарконии. Орден объявил их в розыск.","Въезд в Гнилой удел запрещён: Город закрыт на карантин; въезд и выезд — только для Ордена и представителей закона. Жителям предписано не покидать дома.","Хельград — стены как кладбище Ордена: Власти подтверждают: город не под контролем Императора, приближаться запрещено. Уцелевшие стены увешаны телами членов Ордена — сотни, на цепях, крючьях и вбитые в щели кладки, ровно, как знамёна. Это не расправа, а предупреждение: всякий, кто подойдёт, закончит так же. Неужели в Хельграде всё-таки кто-то есть? И почему Орден до сих пор не сравнял город с землёй?","Тенеград — Дом Верн отказал Ордену: Изабель Верн не пустила в город отряд Ордена, прибывший «для усиления патрулей»: «Тенеград сам решит, кого пускать за свои стены. Нашему городу более не нужен контроль Ордена!» Орден назвал это «опасным самоуправством». Отряд стоит лагерем за воротами, между стражей Верн и паладинами уже были словесные стычки.","Дочь Хладнора осталась в столице: Официально — «для продолжения переговоров». Её уже видели с наследным принцем Альбертом Торнвудом в дворцовом саду. Слухи о брачном союзе крепнут; в трактирах уже пьют «за здоровье молодых», хотя шепчут и другое: не слишком ли дорогая плата за тысячу воинов?","Особый отряд для поисков принцессы: Император издал указ о поиске Маргарет Торнвуд. Создан особый отряд — лучшие следопыты, маги Ордена и люди, лично знавшие принцессу. Награда — 100 000 империалов за достоверную информацию. Император лично курирует работу.","Шёпот улиц — примет ли Император дочь: Всё громче звучит имя Аврелии Торнвуд. «Он потерял Маргарет. Он теряет Сарконию, Тенеград. А теперь ему предлагают принять ещё одну дочь — обнять или спрятать?» — рассуждает торговец у ворот. «Аврелия Торнвуд может стать нашим агнцем, фигурой стойкости и веры!» — считает представитель знатной семьи Сарконии.","Погода: Тенеград — 4°, сыро, мобилизация стражи, на юге города пункт помощи Ордену. Гнилой удел — 3°, карантин. Верхний предел — 8°, ясно, усиленная охрана дворца, воины Железных островов на улицах. Кальдерон — 10°, город закрыт изнутри. Лес Страсти и Эпира — 2°, туман не отступает, бои у границ леса. Хельград — 5°, холодный ветер, пепел в воздухе. Не приближаться!"],"ads":["Набор на строительство стен и ворот в Сарконии — двойная плата, нужны каменщики, плотники, молотобойцы","Экстренный набор в Орден Пылающего Сердца — от 18 лет, в любом штабе, кроме Кальдерона и Хельграда","«Тихая Длань» открывает новые пункты лекарств и масла в Гнилом уделе","Ночлег для не вернувшихся в Гнилой удел — особняк Бавасто в Тенеграде","Лагеря для беженцев из Сарконии, Эпиры и земель у Леса Страсти — у восточных ворот Сарконии","Таверна «Тихий огонь» в Эпире — кружка грога за вести о Маргарет, беглецах из Сарконии, Розали Винвельт, тумане, ордах, убийстве магистра Винсента и Хельграде","Кузнецы Сарконии ищут подмастерьев — работа в три смены","Особняк Бавасто благодарит Дом Верн за щедрое пожертвование"]}],"chars":[{"key":"valdis","name":"Вальдис Сигрид","age":"34 года","sex":"Женский","extra":[],"art":"","skills":[["Владение оружием","высокий уровень",""],["Тактика и стратегия","средний уровень",""],["Скрытность и маскировка","высокий уровень",""],["Дисциплина и стойкость","высокий уровень",""],["Интриги и допрос","средний уровень",""]],"bio":["Вальдис Сигрид родилась в семье, которая на протяжении нескольких поколений служила Ордену Пылающего Сердца и культу Огня. Её отец ждал сына, но родилась дочь. Он никогда не знал к ней жалости. Она выжила. При первой возможности уехала в Железную цитадель, быстро зарекомендовала себя как сильный и безжалостный воин. Старший инквизитор в Верхнем пределе был старым другом семьи и прощал ей то, что другим бы не простили. Когда её семья погибла во время нападения на Красную Марку, она не проявила скорби. После одной из стычек прошла подготовку для работы под прикрытием, выдавая себя за наёмницу.","За спиной бесчисленное количество убийств, награды: за хорошую службу старший инквизитор Сарконии торжественно вручил артефакт «Пламенный круг» — старый наруч, который при активации выпускает волну огня вокруг владельца и даёт временную защиту от магии. Она не испытывает особенной ненависти к магам, хотя и согласна с позицией Ордена. Считает, что магов лучше брать в плен и использовать в своих целях. Упряма, азартна, идёт к своей цели несмотря ни на что."],"home":["Живёт в казарме Ордена в Верхнем пределе, но часто бывает в командировках."],"inv":["Полный боевой доспех с символикой Ордена.","Одежда наёмницы (для работы под прикрытием).","Двуручный меч.","Несколько кинжалов.","Артефакт «Пламенный круг» (наруч на левом запястье).","Крест-обнаружитель контроля.","Три флакона с алхимическим огнём.","Амулет с символом Огня (скрыт под одеждой).","Походный набор: кремень, фляга, сухой паёк, верёвка, нож."],"money":["Как старший паладин, она получает около 100–150 серебряных грошей в месяц. Живёт скромно."],"facText":["Орден Пылающего Сердца. Верна Ордену и Огню, но её преданность холодна и расчётлива."],"fac":"Орден Пылающего Сердца","role":"Старший паладин"},{"key":"olivia","name":"Оливия","age":"32 года","sex":"","extra":[],"art":"","skills":[["Врачевание","высокий уровень","Умеет обрабатывать раны, накладывать повязки, готовить травяные отвары и помогать при родах."],["Знание храмовых ритуалов","высокий уровень","Знает все обряды, молитвы и обычаи храма Триединства."],["Травничество","высокий уровень","Разбирается в целебных растениях, может отличить ядовитое от съедобного."],["Чтение и письмо","средний уровень","Умеет читать и писать, знает основы старых языков, на которых написаны храмовые книги."],["Уход за больными","высокий уровень","Умеет успокоить, поддержать и облегчить страдания."]],"bio":["Оливия родилась в семье, где о магии говорили шёпотом. Её мать, по слухам, обладала даром, но умерла, когда Оливия была совсем маленькой. Отец, боясь за судьбу дочери, привёл её в храм Триединства, где она выросла среди бинтов, трав и молитв. Она почти не помнила матери, только смутные тени и запах ладана, который почему-то всегда ассоциировался у неё с её голосом.","Храм стал её домом. Она не знала другой жизни — только стены, которые пахли старым деревом и воском, только привычные лица прихожан, только тихие голоса священников и шорох ряс. Она была счастлива там. Или думала, что счастлива. Когда храм сгорел, она потеряла не просто место — она потеряла всё, что знала о себе."],"home":["Раньше она жила в храме Триединства."],"inv":["Небольшой мешочек с сушёными травами.","Чистые бинты и ткань для перевязок.","Маленький нож для срезания трав.","Книга молитв храма Триединства (единственное, что осталось от храма).","Фляга с водой.","Тёплая шаль, которую она связала сама."],"money":["У неё почти нет денег. Всё, что у неё осталось — это одежда, травы и молитвы."],"facText":["Никакой. Она служительница храма Триединства, который не принадлежал ни Ордену, ни Тайному совету. Она не знает, кому можно доверять, и не делает выбора."],"fac":"Без фракции","role":"Служительница сгоревшего храма"},{"key":"silvana","name":"Сильвана Валькур","age":"22 года","sex":"Женский","extra":[],"art":"https://vk.ru/photo-240493526_457239332?z=photo-24049..","skills":[["Акробатика","высокий уровень",""],["Искусство и риторика","высокий уровень","До скверны она училась в академии и была талантливой художницей и оратором. Её речи зажигают, её магия — уничтожает."],["Уличная хватка","средний уровень","После изгнания семьи она научилась выживать в подполье и общаться с преступниками и изгоями."],["Провокация и манипуляция","высокий уровень","Она умеет заставить людей делать то, что ей нужно, даже если они не хотят этого."],["Стрельба из лука","высокий уровень",""]],"bio":["Сильвана Валькур родилась в семье магов, которые были вынуждены скрываться от Ордена, но продолжали обучать своих детей. Её родители, мудрецы и учёные, надеялись, что Сильвана сможет завершить своё обучение в академии и стать новой надеждой для магов. Однако её семья была изгнана из академии из-за подозрений в скверне, и Сильвана была вынуждена скрываться с ними. Она потеряла всё — будущее, друзей, мечты. Но она не сдалась.","Сильвана считает Триединство единственным правильным путём. Она верит, что маги должны быть властью, и скверна — это не проклятие, а дар. Она не понимает, почему должна унижаться и бегать, если у неё есть дар, который способен уничтожать целые армии. Она громкая, амбициозная и уверена, что она должна быть той, кто поведёт магов к их новому будущему.","Она часто говорит с жаром и гневом, её слова заставляют людей сомневаться в Ордене и Императоре. Она не боится оскорблять инквизиторов и не скрывает своей ненависти к ним."],"home":["Скрывается в подполье Триединства. Её местоположение постоянно меняется, но она часто находится в Сарконии или на окраинах Леса Страсти. Она никогда не задерживается на одном месте слишком долго."],"inv":["Амулет из чёрного камня, позволяющий скрыть любую ложь 1 раз в 5 постов.","Лук, колчан стрел (20 стрел)","Красивый нож для самообороны","Книга с записями её исследований скверны и магии."],"money":["У неё нет постоянного дохода. Она выживает за счёт поддержки Триединства. Её главное богатство — её знания и магия."],"facText":["Триединство. Сильвана — одна из самых ярых сторонниц фракции, она верит, что маги должны занять место власти, и не сомневается в правоте Триединства. Она готова уничтожить любого, кто встанет на пути, и не боится говорить это вслух."],"fac":"Триединство","role":"Маг-исполнитель, «голос» фракции"},{"key":"kayden","name":"Кайден","age":"19 лет","sex":"","extra":[],"art":"","skills":[["Владение мечом","средний уровень","Уверенно держит оружие, знает базовые стойки и удары, но не имеет боевого опыта за пределами тренировочного двора."],["Алхимия","высокий уровень","Хорошо разбирается в ингредиентах, может приготовить базовые зелья и определить состав неизвестных смесей."],["Скрытность","начальный уровень","Умеет двигаться тише, чем среднестатистический паладин, но до настоящей тени ему далеко."]],"bio":["Кайден вырос в небольшой деревне на окраине Велариса, где жизнь текла тихо и размеренно, пока скверна не пришла и в их дом. Его родителей сожгли на костре по ложному доносу — сосед обвинил их в магии, чтобы завладеть землёй. Кайдену тогда было тринадцать, а его младшей сестре Пенелопе — всего девять. Их разлучили: Кайдена забрали в Орден, увидев в нём потенциал для воспитания «правильного солдата», а Пенелопу приютил старый лекарь, который пожалел девочку. С тех пор они не виделись. Кайден не любит говорить про Орден. Он только что получил звание паладина-новичка и первое серьёзное задание — добыть информацию в одном из городов. Он старается не думать о том, что может встретить там сестру или что задание может быть связано с теми, кого он не хочет предавать."],"home":["Живёт в казарме Ордена в Верхнем пределе. Комната маленькая, на двоих, но сосед редко бывает. На стене висит выцветший рисунок, который Пенелопа нарисовала ему перед разлукой — он хранит его, хотя никогда никому не показывает."],"inv":["Меч в ножнах, простой, без украшений.","Два метательных ножа.","Артефакт-воспламенитель (небольшой камень с руной) — позволяет поджечь что угодно одним касанием, например лезвие меча, на 2 хода, после чего артефакт требует перезарядки в течение суток или специального состава.","Браслет-блокатор магии на левом запястье.","Дневник (почти пустой, только списки, расписания и заметки от старших паладинов).","Походный набор для алхимических экспериментов (несколько флаконов, сухие травы, ступка)."],"money":["При себе имеет 15 серебряных грошей и несколько медных монет. Никакого имущества, кроме личных вещей, нет."],"facText":["Орден Пылающего Сердца (паладин-новичок). Вступил не по убеждениям, а потому что некуда было идти. Внутри Ордена старается не выделяться."],"fac":"Орден Пылающего Сердца","role":"Паладин-новичок"},{"key":"redrif","name":"Редриф Коленвойл","age":"19 лет","sex":"Мужской","extra":[],"art":"","skills":[["Везение","высокий уровень","Он сам не знает, как ему это удаётся, но он часто оказывается в нужном месте в нужное время. Или просто слишком глуп, чтобы осознавать, что находится в опасности."],["Наблюдательность","средний уровень","Он замечает странные вещи, но интерпретирует их совершенно неправильно. Например, следы крови он может принять за пролитое вино или сок ягод."],["Умение задавать глупые вопросы","высокий уровень","Он может вывести из себя любого человека, просто спросив что-то невинное."],["Ориентация в лесу","средний уровень","Он действительно умеет находить дорогу, но часто путает направление, потому что ему кажется, что «вон та сосна похожа на вчерашнюю, а та — на позавчерашнюю»."]],"bio":["Редриф вырос в маленькой деревне, где его считали немного странным. Он всегда был тем парнем, который спрашивал слишком много вопросов и не понимал, когда его шутки перестают быть смешными. Его отец был лесником, и Редриф с детства привык бродить по лесам, собирать грибы и мечтать о приключениях. Он всегда хотел стать героем, но его идея геройства заключалась в том, чтобы найти потерянную корову соседа или помочь старушке перейти дорогу.","Когда он услышал, что в отряд ищут добровольцев для поиска пропавшей принцессы, он записался первым. Он не понимал, что это опасно. Он думал, что это будет похоже на его обычные прогулки по лесу, только с более важной целью. Его отец пытался отговорить его, но Редриф уже собрал вещи и ушёл, оставив записку: «Я спасу принцессу и вернусь героем!»"],"home":["Раньше жил с отцом в лесной сторожке, но теперь ему выделено койко-место от гильдии авантюристов \"Плата и сталь\""],"inv":["Старый кожаный нагрудник (протёртый до дыр).","Короткий меч, больше похожий на нож.","Сумка с сушёными грибами и хлебом (он всегда берёт с собой еду, потому что любит перекусывать).","Фляга с водой.","Компас (который он почти не умеет использовать).","Артефакт \"Взгляд\" позволяющий 3р/день выйти на след принцессы, (заранее настроенный лично императорскими мудрецами)"],"money":["Никакого имущества. У него есть несколько медных монет, которые он потерял бы, если бы они не лежали в самом глубоком кармане."],"facText":["Авантюрист гильдии \"Плата и сталь\""],"fac":"«Плата и сталь»","role":"Авантюрист"},{"key":"margaret","name":"Маргарет Торнвуд","age":"14 лет","sex":"Женский","extra":[],"art":"","skills":[["Языки","высокий уровень","Свободно говорит на веларисийском, азуранском, языке Железных островов и тир-морском наречии. Также изучает древний диалект, на котором говорили в Эпире до прихода Императорской династии."],["Дипломатия и этикет","высокий уровень","Знает все тонкости придворного этикета, умеет вести переговоры, сглаживать конфликты и располагать к себе собеседников."],["Музыка и рисование","высокий уровень","Играет на лютне, поёт и рисует. Это единственное, что помогает ей справляться с тоской."],["Знание истории и географии","средний уровень","Много читает, знает историю империи и соседних государств, может составить карту и рассказать о культуре разных народов."]],"bio":["Маргарет Торнвуд — единственная дочь Императора Касселя и его третьей возлюбленной Изабеллы. Она родилась, когда её матери было всего пятнадцать лет, и выросла во дворце, окружённая книгами, учителями и тишиной. Её отец не был жесток к ней, но и не был ласков — он смотрел на неё скорее как на продолжение династии, чем как на дочь. Маргарет рано поняла, что в этом мире, чтобы выжить, нужно уметь говорить на языке врага, знать его обычаи и угадывать его мысли. Она проводила часы в библиотеке, изучая карты, языки и историю, представляя, как однажды сможет покинуть стены дворца и увидеть мир, который изучала по книгам. Её мать, Изабелла, была единственным человеком при дворе, кто действительно любил её. Она рассказывала Маргарет о том, какой была когда-то, учила её не бояться задавать вопросы и видеть людей за их титулами. Но даже мать не могла защитить её от придворных интриг и холода императорского взгляда. Маргарет часто оставалась одна — слуги боялись говорить с ней лишнего, учителя были слишком осторожны, а отец был занят делами империи. Она научилась прятаться в библиотеке, рисовать портреты незнакомых людей и играть на лютне, представляя, что играет для кого-то, кто её действительно слушает.","Она знает, что отец скрывает что-то, но не знает что. Она чувствует, что дворец хранит тайны, но никто не решается говорить с ней о них. Она хочет вырваться из золотой клетки, но не знает, как. Она тоскует по свободе и видит её только на страницах книг о дальних странах, куда ей никогда не дадут уехать."],"home":["Её покои находятся в Императорском дворце — отдельная большая комната на западной стороне, выходящая окнами в сад. В комнате — книги, лютня, стол для рисования, несколько карт на стенах. Она редко покидает свои покои, предпочитая им библиотеку и внутренний сад, где можно побыть одной."],"inv":["Несколько книг на разных языках.","Дневник, который она ведёт на азуранском — чтобы никто не мог прочитать его случайно.","Лютня, инкрустированная серебром.","Тонкая серебряная цепочка с кулоном-книгой.","Набор для рисования (уголь, бумага, перья)."],"money":["Принадлежит императорской семье, поэтому формально не нуждается в деньгах. Но у неё нет личных сбережений — всё, что она имеет, предоставлено дворцом. Иногда она получает небольшие суммы от матери, но тратит их только на книги."],"facText":["Формально — императорская семья. Но она не разделяет взгляды отца, не доверяет Ордену и тайно сочувствует тем, кого сжигают на кострах. Она старается не показывать этого, но в её дневнике есть записи о том, как она мечтает сбежать из дворца и отправиться в Тир-Мор или Лес Страсти — туда, где её никто не знает."],"fac":"Императорская семья","role":"Дочь императора"},{"key":"penelopa","name":"Пенелопа","age":"19 лет","sex":"Женский","extra":[],"art":"https://vk.ru/photo-240493526_457239257","skills":[["Скрытность","высокий уровень","Умеет бесшумно двигаться, прятаться, выбирать тенистые тропы и уходить от преследования."],["Знание дорог","высокий уровень","Знает все основные и второстепенные тропы Велариса, может провести отряд по самым безопасным маршрутам."],["Зельеварение","средний уровень","Знает несколько ключевых рецептов, которые выучила у лекаря: зелье невидимости (3 поста, рассеивается при получении урона), зелье сонливости (усыпляет цель на 1 пост), зелье лёгкого исцеления (заживляет небольшие раны). Может приготовить зелья, имеющее базовые целебные свойства."]],"bio":["Пенелопа была совсем маленькой, когда их деревню сожгли. Она помнит только крики, запах дыма и то, как старший брат сжимал её руку, пока их разлучали. Кайдена забрали в Орден, а её — к старому лекарю в Сарконии, который приютил девочку и научил её всему, что знал сам. Она росла среди банок с мазями, сухих трав и книг, но никогда не чувствовала себя учёной — она чувствовала себя беженкой, которой повезло выжить. Лекарь часто отправлял её с поручениями: принести редкие ингредиенты из соседних городов, доставить заказы клиентам, которые не могли прийти сами. Со временем это стало её работой. Она любила свою профессию за свободу — можно бродить по дорогам, видеть людей, дышать свежим воздухом и чувствовать себя нужной. В одном из таких путешествий встретила Алдрика. Длинная история и ожидание в целый год окончились для Пенелопы знакомством со скверной. Каждый раз, когда она проходит мимо патруля Ордена, ей становится страшно. Она боится, что однажды встретит брата на другой стороне и погибнет от его рук."],"home":["В бегах"],"inv":["Плащ с капюшоном (серый, потёртый на краях, любимый)","Книга о Зельеварении (когда-то писалась от руки лекаря), заполнена лишь наполовину. Используется для заметок. Маленькая книга \"Искусство разговора с мертвыми\" - случайная находка. Несмотря на то что внутри описаны скорее мифы, чем правда, Пенелопа вовсю поглощена изучением трактатов и периодически пытается их использовать на призраках.","Дорожная сумка с несколькими зельями (невидимость, сонливость, лёгкое исцеление).","Карта Велариса с пометками (отмечены безопасные тропы, места ночлега и опасные зоны).","Флакон с сухим концентратом для быстрого приготовления зелья.","Чистые ткани для перевязки ожогов на руках и ногах, (часто кровоточат)","Гребень, сделанный руками лекаря"],"money":["Имеет около 30 серебряных грошей, отложенных с заказов."],"facText":["Никакой. Она не состоит в Ордене, не связана с Тайным советом и не принадлежит к Теням."],"fac":"Без фракции","role":"Посыльная, в бегах"},{"key":"kain","name":"Каин Кроунфорд","age":"26–27 лет","sex":"Мужской","extra":[],"art":"","skills":[["Риторика и проповедь","высокий уровень","Он говорит тихо, ровно, но каждое слово падает, как камень в воду. Его проповеди заставляют носителей плакать, а инквизиторов — сжимать кулаки. Он умеет говорить с теми, кого все считают монстрами."],["Пение","высокий уровень","Его голос проникает в кости. Говорят, когда он поёт, скверна в носителях отзывается — не болью, а чем-то древним. Он не понимает, как это работает. Он просто поёт."],["Медитация и самоконтроль","высокий уровень","Он научился слышать скверну в своей крови и не отвечать ей. Каин не спит без свечи, но не потому что боится темноты. Потому что в темноте скверна говорит громче."],["Знание ритуалов Певчих Душ","высокий уровень","Он знает все песни, все обряды, все символы. Он сам выжег клеймо на груди — не для других, для себя."],["Скрытность","средний уровень","Он выжил в подвале Красной Марки, прячась среди тел. Он умеет быть незаметным, когда нужно. Но он не любит это. Он предпочитает свет."],["Сопротивление скверне","средний уровень","Он заражён с двенадцати лет, но не потерял контроль."]],"bio":["Каин Кроунфорд родился в Красной Марке — небольшом городке на границе с бывшими Северными княжествами. Большую часть жизни провел вместе с семьей в той же Красной марке, выполняя поручения семьи Торнов. Когда ему было двенадцать, вспыхнула скверна. Вирус распространился через воду, через землю, через страх. Люди начали гореть изнутри. Буквально: кожа трескалась, из трещин шёл дым, а потом — огонь.","Орден инквизиторов пришёл через три дня. К тому времени поселение уже не нуждалось в спасении. Каин выжил не потому, что был сильным, он спрятался в храме, как когда-то его учил отец. Моргана нашла его на четвёртый день. В лесу, в десяти километрах от Красной Марки. Мальчик сидел под деревом, дрожал, и его глаза в темноте отсвечивали красным..","Сейчас Каин — один из самых уважаемых жрецов Певчих Душ. Он служит, слушает скверну. Многие уверены, что Каин слышит голос самой Лираны. н"],"home":["Постоянно перемещается между владениями Певчих Душ и тайными убежищами на границе с бывшими Северными княжествами. Он не скрывается — но и не афиширует своё местоположение."],"inv":["Свеча, записная книга. Ряса певчих душ, ритуальный арсенал."],"money":["У него нет постоянного дохода. Певчие Души обеспечивают его всем необходимым. Его главное богатство — вера."],"facText":["Певчие Души"],"fac":"Певчие души","role":"Жрец, «голос» Морганы"},{"key":"talira","name":"Талира Верда","age":"Около тридцати","sex":"Женский","extra":[["Известна как","«Звёздная Ведьма», «Та, что носит маски»"]],"art":"","skills":[["Магия иллюзий и мороков","высокий уровень","Она не просто меняет внешность. Она меняет восприятие. Люди видят то, что она хочет, слышат то, что нужно, забывают то, что она решила стереть. Орден называет это «дьявольским обманом». Она называет это выживанием."],["Маскировка и перевоплощение","высокий уровень","Она была торговкой, служанкой, жрицей, наёмницей, даже инквизитором. Каждая маска — новая жизнь. Каждая жизнь — новый побег."],["Ритуальная магия","высокий уровень","Она знает ритуалы, которых нет в академиях. Некоторые она нашла сама. Некоторые — украла у Ордена. Некоторые — подсказала скверна."],["Уклонение и изворотливость","высокий уровень","Она не боец. Она — тень. Она не побеждает в прямом бою. Она исчезает до того, как бой начинается."],["Знание Ордена","высокий уровень","Она знает их методы, их слабости, их страхи. Она знает, как они думают. Потому что когда-то думала так же."],["Языки","высокий уровень","Она говорит на нескольких языках, включая древние. Некоторые она выучила. Некоторые — вспомнила. Она не помнит, откуда."]],"bio":["Талира Верда родилась в семье, которая не должна была существовать. Её мать была магом, отец — инквизитором. Она узнала об этом слишком поздно. Когда Орден пришёл за её матерью, Талире было семь. Она видела, как её мать сожгли. Она видела, как её отец стоял в толпе и смотрел.","После смерти матери Талиру забрал Орден. Не как пленницу — как «искупление». Её отец отдал её в ученицы, чтобы она «очистилась» от греха матери. Но разве орден способен на такое благородство? Талира сбежала из ордена, словно предчувствуя собственную казнь в пятнадцать лет. По чистой случайности встретилась с Элиан де Верис, что приняла заботливо под свое крыло."],"home":["Нигде и везде. Она не задерживается на одном месте дольше недели."],"inv":["Амулет из чёрного камня. Позволяет скрыть ложь один раз в пять постов.","Кинжал. Маленький, острый, спрятанный в рукаве.","Книга масок. Записывает каждую жизнь, каждое имя, каждое предательство."],"money":["У неё нет постоянного дохода. Она выживает за счёт того, что продаёт информацию, оказывает услуги, исчезает до того, как придётся платить. Её главное богатство — знание. И умение быть кем угодно, кроме себя."],"facText":["Тайный совет"],"fac":"Тайный совет","role":"«Звёздная Ведьма», маг-отступница"},{"key":"mirra","name":"Мирра","age":"стара — сама не помнит сколько","sex":"женский","extra":[["Известна как","Гадалка из Сарконии"]],"art":"","fac":"Без фракции","role":"Гадалка Сарконии","pics":["mirra-1"],"skills":[["Гадание на картах Таро","высокий уровень","Читает не столько карты, сколько людей: по раскладу подводит человека к тому, что он и сам знает, но боится признать."],["Врачевание души","высокий уровень","Лучший в Сарконии лекарь разума: выслушает, успокоит, вытащит из кошмаров, горя и наваждений."],["Хрустальный шар","высокий уровень","Артефакт, а не ярмарочная стекляшка. Снимает последствия ментальных атак, развеивает иллюзии и гасит чужие голоса в голове."],["Знание людей и земель","высокий уровень","Обошла множество стран и говорит на многих наречиях; видела всякое и мало чему удивляется."]],"bio":["Мирра — старая женщина, которая всю жизнь училась слушать. Она перешагнула множество стран, видела войны, мор и дворцы, и везде находила одно: людям больнее всего не в теле, а в душе. Так она стала той, к кому приходят, когда голова не выдерживает.","Много лет она сидит в Сарконии, в лавке за Торговым рядом. Часто к ней приходят орденцы: паладины и инквизиторы, которым снятся костры и обескровленные. Мирра помогает им справиться с тяжестью службы — гаданием, разговором и своим шаром. Орден её не трогает: она чинит их людей и умеет молчать.","Помощь Мирры не бесплатна — платят все, даже тот, кто зашёл просто поговорить. Бесплатный совет, говорит она, никто не слушает. Её уважают, и в городе она не голодает.","Семьи у Мирры нет: всю себя она отдаёт людям. Иногда берёт учениц с чутьём и учит их слушать, молчать и не врать. Пара молодых гадалок уже покинула её гнёздышко и гадает в других землях."],"home":["Саркония, лавка за Торговым рядом: тяжёлая дверь со знаком глаза, внутри шкафы со свитками, свечи и круглый стол с хрустальным шаром."],"inv":["Колода карт Таро","Хрустальный шар — артефакт, лечащий разум и развеивающий иллюзии"],"money":["Плата за гадания и беседы; живёт небедно"],"facText":["Ни к кому не примыкает, но дружна с Орденом Пылающего Сердца"]}],"callahan":{"name":"Семья Каллахан","meta":"Дом Гнилого Удела","fac":"Без фракции","group":"Гнилой Удел","intro":["Семья Каллахан — это не просто дом, это структура, которая держит Гнилой Удел за горло уже три десятилетия. Официально они занимаются заводством и продажей рыбной продукции: пруды, коптильни, склады, лавки на Храмовой улице. Рыба Каллаханов — единственная, которую в Уделе едят без страха, потому что все знают: если Каллаханы продают, значит, чисто.","Однако за этой витриной скрыта другая правда. Подпольная торговля людьми через судоходные пути, лодочная компания, которая строит суда не только для рыбы, но и для тех, кого перевозят в трюмах без имени и без документов. Каждый работник, от грузчика до капитана, проходит через руки Люсиль лично. Она не доверяет никому, проверяет всех и каждого: знает, кто пьёт, кто болтает, кто боится. Не боится пачкать руки грязной работой даже несмотря на аристократичный вид."],"members":[["Люсиль","52 года · глава","Она давно перестала считать, сколько людей обязаны ей жизнью, а сколько смертью. Не стремится к абсолютной власти — ей достаточно того, что есть: слово, которое весит больше золота, и страх, который весит больше слова. Начинала с того, что хотела просто прокормить себя, потом сыновей, и уже после — весь город. Теперь она контролирует еду, и это даёт ей контроль над всем остальным."],["Патрик","34 года · старший сын","Много лет назад уехал в Тенеград; Удел для него — редкие короткие письма, пахнущие рыбой и материнским почерком. Хирург. В Совете Здравия числится врачом, подпольно изучает скверну: режет трупы, записывает, сравнивает, ищет. Тёплые отношения с матерью и тяжёлые с братом."],["Дуайт","26 лет · младший сын","Ведёт свою оппозиционную компанию против власти Гнилого Удела и считает себя куда лучшим кандидатом. Его люди раздают листовки и говорят о свободе торговли, открытом океане и о том, что Орден душит город, а он, Дуайт Каллахан, освободит его."]]},"scripts":[{"id":"dogmat","tab":"Догмат Ордена","kind":"Орден Пылающего Сердца","name":"Догмат Ордена","b":[["h","ГЛАВА III. О ВОЗГОРАНИИ ДУХА И О ПОРЯДКЕ СЛУЖБЫ"],["n","3:1","Служба наша не есть праздное словоизлияние. Храм — это горнило, где куется воля. Соберитесь пред ликом негасимого светильника, и да не будет между вами шепота, ибо шепот есть семя лжи."],["n","3:2","Обращаясь к пламени, жрец не просит. Жрец возвещает. Ибо Огонь не нуждается в просьбах, Он ждет действий. Жрец есть уста огня, и когда он взывает к Отцу, пламя вздымается в ответ, подтверждая истинность слов. Если пламя колеблется — жрец солгал, и да будет он испытан болью. Если пламя рвется вверх — слова его угодны, и да пребудет он в мире до следующего рассвета."],["n","3:3","Верховный Инквизитор суть пламенный столп, что видит дальше всех. Он не бог, но он — тот, кто не сгорел в объятиях силы. Склоняйте головы пред его мудростью, ибо он первым познал, что Огнем нельзя повелевать, Ему можно лишь покоряться. Его слово — как искра, что зажигает костер нашей веры."],["h","ГЛАВА VII. О ПРИРОДЕ ПЛАМЕНИ И О ТЕХ, КТО ДЕРЗАЕТ"],["n","7:1","Истинно говорю вам: Огонь не имеет начала, как не имеет конца. Он был с древними людьми, когда те еще не ведали речи, и он останется, когда от речи останется лишь пепел. Огонь не дарует знания о том, откуда пришел человек, ибо прошлое — лишь тлен. Огонь дарует знание того, куда должен идти человек, ибо будущее выжигается в камне его силой."],["n","7:2","Огонь есть Дар и Кара в одном лике. Как отец, он согревает плоть, позволяя жить среди холода. Как судия, он испепеляет плоть, позволяя духу очиститься. Нет скверны, которую бы он не выжег; нет лжи, которую бы он не обратил в сажу. Посему всякий храм наш обращен к пламени, и всякая служба есть не мольба, но беседа с силой, что старше всех богов."],["n","7:3","Знайте же: овладеть Огнем невозможно. Сия истина есть краеугольный камень нашего братства. Тот, кто мнит себя повелителем пламени, уже объят гордыней, а гордыня есть пища для скверны. Именно поэтому мы отринули магов огня, ибо их ремесло — ложь. Пламя, рожденное из их пальцев, не есть дитя нашего Отца, но выродок, порожденный злом, дабы обмануть неразумных. Их сила — не сила природы, но извращение, шепот бездны, принявший облик света. Убей мага огня, ибо, умертвив его, ты не гасишь истинный Огонь, но вырываешь гнилой зуб из пасти мира."],["n","7:4","Мы, сыны Пылающего Сердца, живем в бдении. Подозревай каждого, ибо скверна многолика. Она может говорить голосом друга и смотреть глазами младенца. Лишь пламя, коснувшись плоти, отличает чистое от гнилого. Посему наказание наше всегда есть боль и сила. Боль очищает, сила утверждает, а огонь завершает круг. Не жалей плоти, ибо плоть слаба, но жалей дух, ибо огонь дарует ему вечность."],["n","7:6","И да будет проклят всякий, кто скажет, что мы жестоки. Мы — милосердны, ибо даруем скверне быстрый конец, а чистым — очищение. Ибо сказано: где прошел Огонь, там воцаряется покой. Да воспылают ваши сердца неистовой верой, и да сгорит всякая тень, что осмелится упасть на ваш путь."],["h","ГЛАВА XII. ПЕРЕЧЕНЬ СМЕРТНЫХ ПРЕСТУПЛЕНИЙ ПРОТИВ ПРИРОДЫ ПЛАМЕНИ"],["n","12:1","Знайте, братья, что есть дела, оскверняющие свет, и за каждое из них воздается равной мерой — испепелением. Не прощайте, ибо милость к греху есть милость к скверне, а скверна заразительна."],["p","Грех первый: Утаивание Истины. Если брат ваш видел тень, но промолчал о ней, или укрыл сомневающегося от ока Инквизиции, да будет он предан очищению через удушливый дым. Ибо ложь есть холод, а холод — враг пламени."],["p","Грех второй: Прикосновение к Воде без нужды. Вода есть враг огня, и кто омывает себя ради удовольствия, а не ради избавления от грязи, тот оскорбляет Отца. Наказание — семь ударов раскаленным прутом по стопам, чтобы помнил, куда ступает."],["p","Грех третий: Жалость к Магу. Тот, кто видел мага огня и не донес на него, или, хуже того, встал на его защиту, есть предатель. Маг — порождение скверны, его пламя — гниль, его дыхание — яд. Убить мага — богоугодное дело. Пощадить мага — значит обречь себя на вечный холод. Кара за сие — сожжение заживо в медленном пламени, дабы грешник успел осознать глубину своего падения."],["p","Грех четвертый: Гордыня Овладения. Если кто из вас возомнит, что постиг природу Огня и может управлять им, да будет он проклят как нечисть. Огонь нельзя заковать в цепи, Его нельзя приручить. Тот, кто пытается это сделать, уже не человек, он одержимый. Ему нет места среди живых. Кара — раздробление костей и последующее низвержение в угольную яму."],["p","Грех пятый: Затухание Сердца. Если брат избегает служения, если он отворачивается от храма и не радуется треску поленьев, он поражен духом тлена. Ему дается три дня на покаяние. Если же покаяние лживо — да будет отлучен от пищи и воды до тех пор, пока жар в его груди не угаснет вовсе, ибо мертвый духом не достоин тела."],["h","ГЛАВА XIX. О ПОНИМАНИИ СКВЕРНЫ И ИНОРОДНЫХ"],["n","19:1","Мир велик, и скверна принимает тысячи обличий. Она может таиться в речах философов, в книгах, что не освящены копотью, и в глазах чужестранцев."],["n","19:2","Запомните: подозрение есть добродетель. Всякий незнакомец — враг, пока пламя не докажет обратное. Брат, который не подозревает, — глупец, а глупость есть удобная почва для зла. Спрашивайте каждого, сжигайте сомнения в горниле допроса, ибо лучше сжечь десятерых невиновных, чем пропустить одного зараженного. Таков закон сурового милосердия."],["n","19:3","Древние люди оставили нам не знания, но заветы. Они жили у костров и умирали в пепле. Мы не ищем ответов о прошлом, ибо это отвлекает от настоящего. Настоящее же требует очищения. Очищайте каждый дом, каждую улицу, каждую мысль, пока мир не засияет чистым, ровным, обжигающим светом."],["n","19:4","И помните: боль — это язык, которым Огонь говорит с душой. Не бойтесь боли, бойтесь отсутствия боли, ибо это значит, что Огонь отвернулся от вас. Да будут руки ваши тверды, а сердца горячи."],["h","ГЛАВА XXIV. О СВЯЩЕННОДЕЙСТВИЯХ И МОЛИТВЕННОМ ЧИНЕ"],["n","24:1","Вера без ритуала мертва, как угли без дыхания. Ритуал есть мост между немощной плотью и всепожирающей волей Огня. Всякое действие наше должно быть освящено пламенем, всякое слово — проверено жаром. Посему запомните чин действий и слова, что даны нам Первыми Жрецами, дабы не погас свет в сердцах наших."],["h","О РИТУАЛЕ УТРЕННЕГО ВОЗЖИГАНИЯ"],["n","24:2","Едва первые лучи солнца коснутся земли, брат обязан возжечь малый свет в своем жилище. Сие есть не просьба о тепле, но приветствие Отцу."],["n","24:3","Брат становится на колени перед пламенем, касаясь лбом холодного камня пола, дабы ощутить контраст между мертвым и живым. Затем он произносит Первую Молитву — «Зов Пробуждения»:"],["p","«Отец мой, чье дыхание есть жар, а голос — треск поленьев, внемли мне, ничтожному. Я возжигаю свет, который есть продолжение Твоей воли во тьме моего тела. Прости меня за холод в моей крови и за тени, что гнездятся в моих мыслях. Сделай меня таким, как этот уголь: черным снаружи, но алым внутри. Пусть моя рука не дрогнет перед скверной, а глаз не обманет пламя. Направь меня в этот день, чтобы я не гасил, а раздувал. Да будет так, пока я не превращусь в пепел и не вернусь к Тебе»."],["n","24:4","После слов брат трижды касается правой рукой пламени, но не гасит его, а лишь проводит сквозь жар, дабы запечатлеть боль как напоминание о смертности. Затем он задувает светильник, оставляя лишь тлеющий фитиль, ибо настоящая служба еще впереди."],["h","О ВЕЧЕРНЕМ ОЧИЩЕНИИ И ИСПОВЕДИ ПЕРЕД ОГНЕМ"],["n","24:5","С заходом солнца, когда тьма сгущается и скверна выползает из своих нор, брат обязан явиться в храм для участия в ритуале Совместного Горения. Жрец зажигает большое пламя в центре зала, и все присутствующие садятся вокруг, образуя круг. Считается, что круг не дает злу вырваться наружу, а пламя в центре вытягивает из душ грехи."],["n","24:6","Каждый брат по очереди бросает в огонь щепотку сухой травы (символ своих дневных сомнений) и произносит Вторую Молитву — «Покаяние в Угасании»:"],["p","«Огонь, судия мой и свидетель, я стою пред Тобой нагой душой. Я утаил сегодня одну тень и не рассказал о ней братьям — прости меня, если во тьме той нет зла, и сожги меня, если зло там есть. Я испугался боли и отступил от долга — проверь мой страх, и если он от малодушия, испепели его во мне. Я думал о магии огня с сомнением, а не с отвращением — очисти мой разум от этой дряни. Прими эту траву как мою слабость и обрати ее в дым. Пусть дым уходит в небо, а я останусь чистым, как перегоревшие угли. Если я солгал сейчас, пусть пламя лизнет мои пальцы и скажет мне правду»."],["n","24:7","После молитвы брат протягивает раскрытые ладони к огню на расстояние, которое он может вытерпеть без вреда. Жрец наблюдает за его лицом: если брат отдергивает руки слишком рано, это признак трусости; если держит слишком долго, не чувствуя боли, это признак одержимости (ибо только бесчувственный или маг не боится жара). Идеальное время — пока жар не вызовет первые слезы. Слезы считаются доказательством очищения."],["h","О РИТУАЛЕ ПРИНЯТИЯ В ОРДЕН (ПОСВЯЩЕНИЕ) ЖРЕЦОМ"],["n","24:8","Тот, кто желает стать частью Пылающего Сердца, не приходит с миром. Он приходит с повинной. Посвящение длится девять дней, и каждый день неофита подвергают «испытанию расстоянием» — он должен стоять у горящей стены, с каждым днем приближаясь к ней на один шаг."],["n","24:9","В последний день посвящаемый обязан коснуться раскаленного докрасна клейма в виде сердца, выжженного в камне. Если он делает это без крика, его принимают, ибо он доказал, что его вера крепче страха. Если он кричит или отдергивает руку — его изгоняют, ибо он еще слаб для нашего братства. Жрец говорит при этом:"],["p","«Смотри, неофит: сегодня ты коснулся символа. Завтра ты станешь самим символом. Помни, что Огонь не терпит полумер, как не терпит их наше сердце. Отныне ты — подозреваемый среди подозреваемых, брат среди братьев. Доверяй лишь тому, что горит, и сжигай все, что не горит. Да будет так»."]]},{"id":"orden","tab":"Орден: кто и что","kind":"Орден Пылающего Сердца","name":"Кто они, во что верят","b":[["h","КТО ОНИ?"],["p","Название: Орден Пылающего Сердца (неофициально — «Огненные», «Жрецы углей»). Тип: Религиозно-политическая секта с жесткой иерархией."],["p","Статус в мире: Влиятельная сила, приближенная к императорскому двору. Являются официальной государственной религией, их слово многое значит. Их боятся, к ним обращаются за \"очищением\", их используют как карательный инструмент против магов. Численность: Умеренная, но преданная."],["h","2. ВО ЧТО ОНИ ВЕРЯТ?"],["p","Главный постулат: Огонь — это и Дар, и Кара. Он единственное, что способно вычистить скверну из мира. Он давал древним людям выживать и он же уничтожает всё недостойное жизни."],["p","О происхождении: Орден не заморачивается вопросом \"откуда взялся человек\". У них нет мифа о творении. Они говорят: люди произошли от древних людей, а Огонь был всегда. Огонь старше любых богов, старше любых империй."],["p","О власти: Они чтут Императора и Верховного Инквизитора, но не как богов, а как тех, кто сумел идти с ним рука об руку с огнем. Император — не священная фигура, но признанный мудрец, который понял природу пламени лучше других. К нему прислушиваются, ему подчиняются, но не молятся ему."],["p","Ключевая идея: Огнем нельзя овладеть. Его нельзя приручить, заковать в цепи или направить по своей воле. Огонь — высшая сила, которой можно лишь подчиниться и следовать ее законам."],["h","3. КАК ОНИ СМОТРЯТ НА МАГОВ ОГНЯ?"],["s","Маги огня — это зло"],["p","Огнем нельзя управлять. Они владеют лишь пародией на истинный огонь."],["s","Их магия — от скверны"],["p","Если Огнем нельзя овладеть, значит тот огонь, которым повелевает маг, — ненастоящий. Это подделка, порождение зла, скверны, тьмы, которая приняла облик пламени."],["s","Убить мага — не грех, а долг"],["p","Убивая мага, ты не гасишь истинный Огонь. Ты уничтожаешь пародию на Него. Это священное деяние."],["s","Раньше маги были в ордене"],["p","Исторически орден принимал магов огня, но потом переосмыслил свою доктрину и объявил их нос
