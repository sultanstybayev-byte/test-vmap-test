тированная серебром.","Тонкая серебряная цепочка с кулоном-книгой.","Набор для рисования (уголь, бумага, перья)."],"money":["Принадлежит императорской семье, поэтому формально не нуждается в деньгах. Но у неё нет личных сбережений — всё, что она имеет, предоставлено дворцом. Иногда она получает небольшие суммы от матери, но тратит их только на книги."],"facText":["Формально — императорская семья. Но она не разделяет взгляды отца, не доверяет Ордену и тайно сочувствует тем, кого сжигают на кострах. Она старается не показывать этого, но в её дневнике есть записи о том, как она мечтает сбежать из дворца и отправиться в Тир-Мор или Лес Страсти — туда, где её никто не знает."],"fac":"Императорская семья","role":"Дочь императора"},{"key":"penelopa","name":"Пенелопа","age":"19 лет","sex":"Женский","extra":[],"art":"https://vk.ru/photo-240493526_457239257","skills":[["Скрытность","высокий уровень","Умеет бесшумно двигаться, прятаться, выбирать тенистые тропы и уходить от преследования."],["Знание дорог","высокий уровень","Знает все основные и второстепенные тропы Велариса, может провести отряд по самым безопасным маршрутам."],["Зельеварение","средний уровень","Знает несколько ключевых рецептов, которые выучила у лекаря: зелье невидимости (3 поста, рассеивается при получении урона), зелье сонливости (усыпляет цель на 1 пост), зелье лёгкого исцеления (заживляет небольшие раны). Может приготовить зелья, имеющее базовые целебные свойства."]],"bio":["Пенелопа была совсем маленькой, когда их деревню сожгли. Она помнит только крики, запах дыма и то, как старший брат сжимал её руку, пока их разлучали. Кайдена забрали в Орден, а её — к старому лекарю в Сарконии, который приютил девочку и научил её всему, что знал сам. Она росла среди банок с мазями, сухих трав и книг, но никогда не чувствовала себя учёной — она чувствовала себя беженкой, которой повезло выжить. Лекарь часто отправлял её с поручениями: принести редкие ингредиенты из соседних городов, доставить заказы клиентам, которые не могли прийти сами. Со временем это стало её работой. Она любила свою профессию за свободу — можно бродить по дорогам, видеть людей, дышать свежим воздухом и чувствовать себя нужной. В одном из таких путешествий встретила Алдрика. Длинная история и ожидание в целый год окончились для Пенелопы знакомством со скверной. Каждый раз, когда она проходит мимо патруля Ордена, ей становится страшно. Она боится, что однажды встретит брата на другой стороне и погибнет от его рук."],"home":["В бегах"],"inv":["Плащ с капюшоном (серый, потёртый на краях, любимый)","Книга о Зельеварении (когда-то писалась от руки лекаря), заполнена лишь наполовину. Используется для заметок. Маленькая книга \"Искусство разговора с мертвыми\" - случайная находка. Несмотря на то что внутри описаны скорее мифы, чем правда, Пенелопа вовсю поглощена изучением трактатов и периодически пытается их использовать на призраках.","Дорожная сумка с несколькими зельями (невидимость, сонливость, лёгкое исцеление).","Карта Велариса с пометками (отмечены безопасные тропы, места ночлега и опасные зоны).","Флакон с сухим концентратом для быстрого приготовления зелья.","Чистые ткани для перевязки ожогов на руках и ногах, (часто кровоточат)","Гребень, сделанный руками лекаря"],"money":["Имеет около 30 серебряных грошей, отложенных с заказов."],"facText":["Никакой. Она не состоит в Ордене, не связана с Тайным советом и не принадлежит к Теням."],"fac":"Без фракции","role":"Посыльная, в бегах"},{"key":"kain","name":"Каин Кроунфорд","age":"26–27 лет","sex":"Мужской","extra":[],"art":"","skills":[["Риторика и проповедь","высокий уровень","Он говорит тихо, ровно, но каждое слово падает, как камень в воду. Его проповеди заставляют носителей плакать, а инквизиторов — сжимать кулаки. Он умеет говорить с теми, кого все считают монстрами."],["Пение","высокий уровень","Его голос проникает в кости. Говорят, когда он поёт, скверна в носителях отзывается — не болью, а чем-то древним. Он не понимает, как это работает. Он просто поёт."],["Медитация и самоконтроль","высокий уровень","Он научился слышать скверну в своей крови и не отвечать ей. Каин не спит без свечи, но не потому что боится темноты. Потому что в темноте скверна говорит громче."],["Знание ритуалов Певчих Душ","высокий уровень","Он знает все песни, все обряды, все символы. Он сам выжег клеймо на груди — не для других, для себя."],["Скрытность","средний уровень","Он выжил в подвале Красной Марки, прячась среди тел. Он умеет быть незаметным, когда нужно. Но он не любит это. Он предпочитает свет."],["Сопротивление скверне","средний уровень","Он заражён с двенадцати лет, но не потерял контроль."]],"bio":["Каин Кроунфорд родился в Красной Марке — небольшом городке на границе с бывшими Северными княжествами. Большую часть жизни провел вместе с семьей в той же Красной марке, выполняя поручения семьи Торнов. Когда ему было двенадцать, вспыхнула скверна. Вирус распространился через воду, через землю, через страх. Люди начали гореть изнутри. Буквально: кожа трескалась, из трещин шёл дым, а потом — огонь.","Орден инквизиторов пришёл через три дня. К тому времени поселение уже не нуждалось в спасении. Каин выжил не потому, что был сильным, он спрятался в храме, как когда-то его учил отец. Моргана нашла его на четвёртый день. В лесу, в десяти километрах от Красной Марки. Мальчик сидел под деревом, дрожал, и его глаза в темноте отсвечивали красным..","Сейчас Каин — один из самых уважаемых жрецов Певчих Душ. Он служит, слушает скверну. Многие уверены, что Каин слышит голос самой Лираны. н"],"home":["Постоянно перемещается между владениями Певчих Душ и тайными убежищами на границе с бывшими Северными княжествами. Он не скрывается — но и не афиширует своё местоположение."],"inv":["Свеча, записная книга. Ряса певчих душ, ритуальный арсенал."],"money":["У него нет постоянного дохода. Певчие Души обеспечивают его всем необходимым. Его главное богатство — вера."],"facText":["Певчие Души"],"fac":"Певчие души","role":"Жрец, «голос» Морганы"},{"key":"talira","name":"Талира Верда","age":"Около тридцати","sex":"Женский","extra":[["Известна как","«Звёздная Ведьма», «Та, что носит маски»"]],"art":"","skills":[["Магия иллюзий и мороков","высокий уровень","Она не просто меняет внешность. Она меняет восприятие. Люди видят то, что она хочет, слышат то, что нужно, забывают то, что она решила стереть. Орден называет это «дьявольским обманом». Она называет это выживанием."],["Маскировка и перевоплощение","высокий уровень","Она была торговкой, служанкой, жрицей, наёмницей, даже инквизитором. Каждая маска — новая жизнь. Каждая жизнь — новый побег."],["Ритуальная магия","высокий уровень","Она знает ритуалы, которых нет в академиях. Некоторые она нашла сама. Некоторые — украла у Ордена. Некоторые — подсказала скверна."],["Уклонение и изворотливость","высокий уровень","Она не боец. Она — тень. Она не побеждает в прямом бою. Она исчезает до того, как бой начинается."],["Знание Ордена","высокий уровень","Она знает их методы, их слабости, их страхи. Она знает, как они думают. Потому что когда-то думала так же."],["Языки","высокий уровень","Она говорит на нескольких языках, включая древние. Некоторые она выучила. Некоторые — вспомнила. Она не помнит, откуда."]],"bio":["Талира Верда родилась в семье, которая не должна была существовать. Её мать была магом, отец — инквизитором. Она узнала об этом слишком поздно. Когда Орден пришёл за её матерью, Талире было семь. Она видела, как её мать сожгли. Она видела, как её отец стоял в толпе и смотрел.","После смерти матери Талиру забрал Орден. Не как пленницу — как «искупление». Её отец отдал её в ученицы, чтобы она «очистилась» от греха матери. Но разве орден способен на такое благородство? Талира сбежала из ордена, словно предчувствуя собственную казнь в пятнадцать лет. По чистой случайности встретилась с Элиан де Верис, что приняла заботливо под свое крыло."],"home":["Нигде и везде. Она не задерживается на одном месте дольше недели."],"inv":["Амулет из чёрного камня. Позволяет скрыть ложь один раз в пять постов.","Кинжал. Маленький, острый, спрятанный в рукаве.","Книга масок. Записывает каждую жизнь, каждое имя, каждое предательство."],"money":["У неё нет постоянного дохода. Она выживает за счёт того, что продаёт информацию, оказывает услуги, исчезает до того, как придётся платить. Её главное богатство — знание. И умение быть кем угодно, кроме себя."],"facText":["Тайный совет"],"fac":"Тайный совет","role":"«Звёздная Ведьма», маг-отступница"}],"callahan":{"name":"Семья Каллахан","meta":"Дом Гнилого Удела","fac":"Без фракции","group":"Гнилой Удел","intro":["Семья Каллахан — это не просто дом, это структура, которая держит Гнилой Удел за горло уже три десятилетия. Официально они занимаются заводством и продажей рыбной продукции: пруды, коптильни, склады, лавки на Храмовой улице. Рыба Каллаханов — единственная, которую в Уделе едят без страха, потому что все знают: если Каллаханы продают, значит, чисто.","Однако за этой витриной скрыта другая правда. Подпольная торговля людьми через судоходные пути, лодочная компания, которая строит суда не только для рыбы, но и для тех, кого перевозят в трюмах без имени и без документов. Каждый работник, от грузчика до капитана, проходит через руки Люсиль лично. Она не доверяет никому, проверяет всех и каждого: знает, кто пьёт, кто болтает, кто боится. Не боится пачкать руки грязной работой даже несмотря на аристократичный вид."],"members":[["Люсиль","52 года · глава","Она давно перестала считать, сколько людей обязаны ей жизнью, а сколько смертью. Не стремится к абсолютной власти — ей достаточно того, что есть: слово, которое весит больше золота, и страх, который весит больше слова. Начинала с того, что хотела просто прокормить себя, потом сыновей, и уже после — весь город. Теперь она контролирует еду, и это даёт ей контроль над всем остальным."],["Патрик","34 года · старший сын","Много лет назад уехал в Тенеград; Удел для него — редкие короткие письма, пахнущие рыбой и материнским почерком. Хирург. В Совете Здравия числится врачом, подпольно изучает скверну: режет трупы, записывает, сравнивает, ищет. Тёплые отношения с матерью и тяжёлые с братом."],["Дуайт","26 лет · младший сын","Ведёт свою оппозиционную компанию против власти Гнилого Удела и считает себя куда лучшим кандидатом. Его люди раздают листовки и говорят о свободе торговли, открытом океане и о том, что Орден душит город, а он, Дуайт Каллахан, освободит его."]]},"scripts":[{"id":"dogmat","tab":"Догмат Ордена","kind":"Орден Пылающего Сердца","name":"Догмат Ордена","b":[["h","ГЛАВА III. О ВОЗГОРАНИИ ДУХА И О ПОРЯДКЕ СЛУЖБЫ"],["n","3:1","Служба наша не есть праздное словоизлияние. Храм — это горнило, где куется воля. Соберитесь пред ликом негасимого светильника, и да не будет между вами шепота, ибо шепот есть семя лжи."],["n","3:2","Обращаясь к пламени, жрец не просит. Жрец возвещает. Ибо Огонь не нуждается в просьбах, Он ждет действий. Жрец есть уста огня, и когда он взывает к Отцу, пламя вздымается в ответ, подтверждая истинность слов. Если пламя колеблется — жрец солгал, и да будет он испытан болью. Если пламя рвется вверх — слова его угодны, и да пребудет он в мире до следующего рассвета."],["n","3:3","Верховный Инквизитор суть пламенный столп, что видит дальше всех. Он не бог, но он — тот, кто не сгорел в объятиях силы. Склоняйте головы пред его мудростью, ибо он первым познал, что Огнем нельзя повелевать, Ему можно лишь покоряться. Его слово — как искра, что зажигает костер нашей веры."],["h","ГЛАВА VII. О ПРИРОДЕ ПЛАМЕНИ И О ТЕХ, КТО ДЕРЗАЕТ"],["n","7:1","Истинно говорю вам: Огонь не имеет начала, как не имеет конца. Он был с древними людьми, когда те еще не ведали речи, и он останется, когда от речи останется лишь пепел. Огонь не дарует знания о том, откуда пришел человек, ибо прошлое — лишь тлен. Огонь дарует знание того, куда должен идти человек, ибо будущее выжигается в камне его силой."],["n","7:2","Огонь есть Дар и Кара в одном лике. Как отец, он согревает плоть, позволяя жить среди холода. Как судия, он испепеляет плоть, позволяя духу очиститься. Нет скверны, которую бы он не выжег; нет лжи, которую бы он не обратил в сажу. Посему всякий храм наш обращен к пламени, и всякая служба есть не мольба, но беседа с силой, что старше всех богов."],["n","7:3","Знайте же: овладеть Огнем невозможно. Сия истина есть краеугольный камень нашего братства. Тот, кто мнит себя повелителем пламени, уже объят гордыней, а гордыня есть пища для скверны. Именно поэтому мы отринули магов огня, ибо их ремесло — ложь. Пламя, рожденное из их пальцев, не есть дитя нашего Отца, но выродок, порожденный злом, дабы обмануть неразумных. Их сила — не сила природы, но извращение, шепот бездны, принявший облик света. Убей мага огня, ибо, умертвив его, ты не гасишь истинный Огонь, но вырываешь гнилой зуб из пасти мира."],["n","7:4","Мы, сыны Пылающего Сердца, живем в бдении. Подозревай каждого, ибо скверна многолика. Она может говорить голосом друга и смотреть глазами младенца. Лишь пламя, коснувшись плоти, отличает чистое от гнилого. Посему наказание наше всегда есть боль и сила. Боль очищает, сила утверждает, а огонь завершает круг. Не жалей плоти, ибо плоть слаба, но жалей дух, ибо огонь дарует ему вечность."],["n","7:6","И да будет проклят всякий, кто скажет, что мы жестоки. Мы — милосердны, ибо даруем скверне быстрый конец, а чистым — очищение. Ибо сказано: где прошел Огонь, там воцаряется покой. Да воспылают ваши сердца неистовой верой, и да сгорит всякая тень, что осмелится упасть на ваш путь."],["h","ГЛАВА XII. ПЕРЕЧЕНЬ СМЕРТНЫХ ПРЕСТУПЛЕНИЙ ПРОТИВ ПРИРОДЫ ПЛАМЕНИ"],["n","12:1","Знайте, братья, что есть дела, оскверняющие свет, и за каждое из них воздается равной мерой — испепелением. Не прощайте, ибо милость к греху есть милость к скверне, а скверна заразительна."],["p","Грех первый: Утаивание Истины. Если брат ваш видел тень, но промолчал о ней, или укрыл сомневающегося от ока Инквизиции, да будет он предан очищению через удушливый дым. Ибо ложь есть холод, а холод — враг пламени."],["p","Грех второй: Прикосновение к Воде без нужды. Вода есть враг огня, и кто омывает себя ради удовольствия, а не ради избавления от грязи, тот оскорбляет Отца. Наказание — семь ударов раскаленным прутом по стопам, чтобы помнил, куда ступает."],["p","Грех третий: Жалость к Магу. Тот, кто видел мага огня и не донес на него, или, хуже того, встал на его защиту, есть предатель. Маг — порождение скверны, его пламя — гниль, его дыхание — яд. Убить мага — богоугодное дело. Пощадить мага — значит обречь себя на вечный холод. Кара за сие — сожжение заживо в медленном пламени, дабы грешник успел осознать глубину своего падения."],["p","Грех четвертый: Гордыня Овладения. Если кто из вас возомнит, что постиг природу Огня и может управлять им, да будет он проклят как нечисть. Огонь нельзя заковать в цепи, Его нельзя приручить. Тот, кто пытается это сделать, уже не человек, он одержимый. Ему нет места среди живых. Кара — раздробление костей и последующее низвержение в угольную яму."],["p","Грех пятый: Затухание Сердца. Если брат избегает служения, если он отворачивается от храма и не радуется треску поленьев, он поражен духом тлена. Ему дается три дня на покаяние. Если же покаяние лживо — да будет отлучен от пищи и воды до тех пор, пока жар в его груди не угаснет вовсе, ибо мертвый духом не достоин тела."],["h","ГЛАВА XIX. О ПОНИМАНИИ СКВЕРНЫ И ИНОРОДНЫХ"],["n","19:1","Мир велик, и скверна принимает тысячи обличий. Она может таиться в речах философов, в книгах, что не освящены копотью, и в глазах чужестранцев."],["n","19:2","Запомните: подозрение есть добродетель. Всякий незнакомец — враг, пока пламя не докажет обратное. Брат, который не подозревает, — глупец, а глупость есть удобная почва для зла. Спрашивайте каждого, сжигайте сомнения в горниле допроса, ибо лучше сжечь десятерых невиновных, чем пропустить одного зараженного. Таков закон сурового милосердия."],["n","19:3","Древние люди оставили нам не знания, но заветы. Они жили у костров и умирали в пепле. Мы не ищем ответов о прошлом, ибо это отвлекает от настоящего. Настоящее же требует очищения. Очищайте каждый дом, каждую улицу, каждую мысль, пока мир не засияет чистым, ровным, обжигающим светом."],["n","19:4","И помните: боль — это язык, которым Огонь говорит с душой. Не бойтесь боли, бойтесь отсутствия боли, ибо это значит, что Огонь отвернулся от вас. Да будут руки ваши тверды, а сердца горячи."],["h","ГЛАВА XXIV. О СВЯЩЕННОДЕЙСТВИЯХ И МОЛИТВЕННОМ ЧИНЕ"],["n","24:1","Вера без ритуала мертва, как угли без дыхания. Ритуал есть мост между немощной плотью и всепожирающей волей Огня. Всякое действие наше должно быть освящено пламенем, всякое слово — проверено жаром. Посему запомните чин действий и слова, что даны нам Первыми Жрецами, дабы не погас свет в сердцах наших."],["h","О РИТУАЛЕ УТРЕННЕГО ВОЗЖИГАНИЯ"],["n","24:2","Едва первые лучи солнца коснутся земли, брат обязан возжечь малый свет в своем жилище. Сие есть не просьба о тепле, но приветствие Отцу."],["n","24:3","Брат становится на колени перед пламенем, касаясь лбом холодного камня пола, дабы ощутить контраст между мертвым и живым. Затем он произносит Первую Молитву — «Зов Пробуждения»:"],["p","«Отец мой, чье дыхание есть жар, а голос — треск поленьев, внемли мне, ничтожному. Я возжигаю свет, который есть продолжение Твоей воли во тьме моего тела. Прости меня за холод в моей крови и за тени, что гнездятся в моих мыслях. Сделай меня таким, как этот уголь: черным снаружи, но алым внутри. Пусть моя рука не дрогнет перед скверной, а глаз не обманет пламя. Направь меня в этот день, чтобы я не гасил, а раздувал. Да будет так, пока я не превращусь в пепел и не вернусь к Тебе»."],["n","24:4","После слов брат трижды касается правой рукой пламени, но не гасит его, а лишь проводит сквозь жар, дабы запечатлеть боль как напоминание о смертности. Затем он задувает светильник, оставляя лишь тлеющий фитиль, ибо настоящая служба еще впереди."],["h","О ВЕЧЕРНЕМ ОЧИЩЕНИИ И ИСПОВЕДИ ПЕРЕД ОГНЕМ"],["n","24:5","С заходом солнца, когда тьма сгущается и скверна выползает из своих нор, брат обязан явиться в храм для участия в ритуале Совместного Горения. Жрец зажигает большое пламя в центре зала, и все присутствующие садятся вокруг, образуя круг. Считается, что круг не дает злу вырваться наружу, а пламя в центре вытягивает из душ грехи."],["n","24:6","Каждый брат по очереди бросает в огонь щепотку сухой травы (символ своих дневных сомнений) и произносит Вторую Молитву — «Покаяние в Угасании»:"],["p","«Огонь, судия мой и свидетель, я стою пред Тобой нагой душой. Я утаил сегодня одну тень и не рассказал о ней братьям — прости меня, если во тьме той нет зла, и сожги меня, если зло там есть. Я испугался боли и отступил от долга — проверь мой страх, и если он от малодушия, испепели его во мне. Я думал о магии огня с сомнением, а не с отвращением — очисти мой разум от этой дряни. Прими эту траву как мою слабость и обрати ее в дым. Пусть дым уходит в небо, а я останусь чистым, как перегоревшие угли. Если я солгал сейчас, пусть пламя лизнет мои пальцы и скажет мне правду»."],["n","24:7","После молитвы брат протягивает раскрытые ладони к огню на расстояние, которое он может вытерпеть без вреда. Жрец наблюдает за его лицом: если брат отдергивает руки слишком рано, это признак трусости; если держит слишком долго, не чувствуя боли, это признак одержимости (ибо только бесчувственный или маг не боится жара). Идеальное время — пока жар не вызовет первые слезы. Слезы считаются доказательством очищения."],["h","О РИТУАЛЕ ПРИНЯТИЯ В ОРДЕН (ПОСВЯЩЕНИЕ) ЖРЕЦОМ"],["n","24:8","Тот, кто желает стать частью Пылающего Сердца, не приходит с миром. Он приходит с повинной. Посвящение длится девять дней, и каждый день неофита подвергают «испытанию расстоянием» — он должен стоять у горящей стены, с каждым днем приближаясь к ней на один шаг."],["n","24:9","В последний день посвящаемый обязан коснуться раскаленного докрасна клейма в виде сердца, выжженного в камне. Если он делает это без крика, его принимают, ибо он доказал, что его вера крепче страха. Если он кричит или отдергивает руку — его изгоняют, ибо он еще слаб для нашего братства. Жрец говорит при этом:"],["p","«Смотри, неофит: сегодня ты коснулся символа. Завтра ты станешь самим символом. Помни, что Огонь не терпит полумер, как не терпит их наше сердце. Отныне ты — подозреваемый среди подозреваемых, брат среди братьев. Доверяй лишь тому, что горит, и сжигай все, что не горит. Да будет так»."]]},{"id":"orden","tab":"Орден: кто и что","kind":"Орден Пылающего Сердца","name":"Кто они, во что верят","b":[["h","КТО ОНИ?"],["p","Название: Орден Пылающего Сердца (неофициально — «Огненные», «Жрецы углей»). Тип: Религиозно-политическая секта с жесткой иерархией."],["p","Статус в мире: Влиятельная сила, приближенная к императорскому двору. Являются официальной государственной религией, их слово многое значит. Их боятся, к ним обращаются за \"очищением\", их используют как карательный инструмент против магов. Численность: Умеренная, но преданная."],["h","2. ВО ЧТО ОНИ ВЕРЯТ?"],["p","Главный постулат: Огонь — это и Дар, и Кара. Он единственное, что способно вычистить скверну из мира. Он давал древним людям выживать и он же уничтожает всё недостойное жизни."],["p","О происхождении: Орден не заморачивается вопросом \"откуда взялся человек\". У них нет мифа о творении. Они говорят: люди произошли от древних людей, а Огонь был всегда. Огонь старше любых богов, старше любых империй."],["p","О власти: Они чтут Императора и Верховного Инквизитора, но не как богов, а как тех, кто сумел идти с ним рука об руку с огнем. Император — не священная фигура, но признанный мудрец, который понял природу пламени лучше других. К нему прислушиваются, ему подчиняются, но не молятся ему."],["p","Ключевая идея: Огнем нельзя овладеть. Его нельзя приручить, заковать в цепи или направить по своей воле. Огонь — высшая сила, которой можно лишь подчиниться и следовать ее законам."],["h","3. КАК ОНИ СМОТРЯТ НА МАГОВ ОГНЯ?"],["s","Маги огня — это зло"],["p","Огнем нельзя управлять. Они владеют лишь пародией на истинный огонь."],["s","Их магия — от скверны"],["p","Если Огнем нельзя овладеть, значит тот огонь, которым повелевает маг, — ненастоящий. Это подделка, порождение зла, скверны, тьмы, которая приняла облик пламени."],["s","Убить мага — не грех, а долг"],["p","Убивая мага, ты не гасишь истинный Огонь. Ты уничтожаешь пародию на Него. Это священное деяние."],["s","Раньше маги были в ордене"],["p","Исторически орден принимал магов огня, но потом переосмыслил свою доктрину и объявил их носителями скверны. Это решение было принято после долгих споров, сейчас оно незыблемо."],["p","Службы:"],["p","Жрец не просит Огонь о милости. Он возвещает Огню о верности ордена."],["p","Жрец обращается к пламени как к Отцу. Это не личный бог в христианском смысле, а родовая, отцовская сила, дающая жизнь и забирающая ее."],["p","Служба включает:"],["p","Возжигание огня от священного угля."],["p","Молчание или звон металла (звук разгоняет духов тьмы)."],["p","Ритуальное касание огня (кратковременное, символическое)."],["p","Молитвы-декларации (не просьбы, а утверждения)."],["h","5. КАКИЕ У НИХ РИТУАЛЫ?"],["s","Утреннее возжигание"],["p","Каждый орденец должен зажечь малый светильник от общего храмового угля. Это символическое приветствие Огню на новый день. Сопровождается молитвой \"Зов Пробуждения\"."],["s","Вечерняя исповедь"],["p","Собрание у большого пламени. Каждый бросает щепотку травы в огонь, символически отдавая свои страхи и сомнения. Жрец наблюдает за реакцией пламени. Сопровождается молитвой \"Покаяние в Угасании\"."],["s","Посвящение в орден в качестве жреца"],["p","Длится 9 дней. Неофит должен стоять у горячей стены, каждый день приближаясь на шаг. В финале — касание раскаленного клейма. Если не кричит — принят."],["s","Суд над грешником"],["p","Проводится в подвалах храмов. Наказание — боль, сила, огонь. Виновного либо сжигают, либо подвергают \"испытанию пламенем\" (насколько долго может терпеть жар)."],["s","Очищение места"],["p","Если храм заподозрен в скверне, его перекрывают, проводят \"Малый Суд\" над всеми присутствующими, и заново возжигают огонь от священного угля."],["h","6. ИХ ЭТИКА: ЧТО ГРЕХ, А ЧТО — НЕТ"],["p","ВАЖНЕЙШЕЕ: Орден не зациклен на праведности. Они не моралисты, не судьи плотских утех. Их система ценностей — утилитарно-ритуальная. Единственный критерий: «Служит ли это Огню? Вредит ли это служению?»"],["s","СМЕРТНЫЕ ГРЕХИ (караются жестко)"],["p","Гордыня (возвышение себя над другими, над Огнем, отказ подчиняться)"],["p","Это корень всех зол. Гордый человек служит только себе. Он перестает быть инструментом Огня."],["p","Раздробление костей, затем низвержение в угольную яму или медленное сожжение."],["s","Ложь (утаивание правды, обман братьев, сокрытие скверны)"],["p","Ложь порождает холод и гниль. Она не дает вовремя выжечь заразу. Перед Огнем нельзя солгать — Он все видит."],["p","Клеймение языка, испытание дымом до потери сознания, затем изгнание."],["s","Сокрытие скверны (знал о маге, еретике, враге и не донес)"],["p","Это форма лжи. Ты позволил злу жить — значит, ты служишь злу."],["p","Сожжение заживо в медленном огне. Самое тяжелое наказание."],["s","Воровство (кража у братьев, у храма, у Императора)"],["p","Ты берешь то, что не принадлежит тебе. Значит, ты считаешь себя выше других. Это форма гордыни."],["p","Отрубание пальцев (чтобы не мог больше брать)."],["p","Убийство без смысла (беспричинное, ради удовольствия, из гнева)"],["p","Огонь уничтожает только скверну. Если ты убиваешь без причины, ты уподобляешься зверю. Ты гасишь жизнь, которая могла служить Огню. Это оскверняет сам акт уничтожения."],["p","Кровь за кровь — либо смерть, либо пожизненное рабство в угольных шахтах."],["s","Затухание сердца (избегает службы, не является в храм)"],["p","Ты отворачиваешься от Огня. Ты становишься холодным. Это путь к скверне."],["p","Три дня поста и испытания огнем. Если не раскаивается — отлучение и изгнание."],["s","ДОБРОДЕТЕЛИ (что поощряется)"],["s","Подозрительность"],["p","Лучше перепроверить сто раз, чем пропустить одну скверну. Считай каждого потенциальным врагом, пока Огонь не докажет обратное."],["s","Смирение перед Огнем"],["p","Ты — ничто перед пламенем. Твоя жизнь — искра, твоя смерть — пепел. Прими это и служи."],["s","Честность перед братьями"],["p","Не лги внутри ордена. Если солгал — навредил всему телу. Лучше признаться в слабости, чем утаить скверну."],["s","Готовность к боли"],["p","Боль — это язык Огня. Не избегай ее, когда она приходит ради очищения."],["s","Милосердие к достойным"],["p","Да, орден жесток, но если человек чист и служит Огню, он заслуживает защиты. Милосердие утилитарное: ты помогаешь тем, кто полезен Огню."],["h","7. ЧТО ОНИ ДУМАЮТ О СМЕРТИ?"],["p","Смерть — это возвращение к стихии. Человек был создан из плоти, которую Огонь может испепелить, и духа, который растворится в тепле."],["p","Нет рая, нет ада в классическом смысле. Есть переход в состояние пепла."],["p","Смерть не страшна — страшно умереть холодным, то есть без веры, без очищения, полным скверны."],["p","Именно поэтому они не боятся рисковать жизнью — смерть в огне (на костре или в бою) считается почетной."]]},{"id":"kodeks","tab":"Кодекс Ордена","kind":"Орден Пылающего Сердца","name":"Кодекс Ордена","b":[["p","(Выдержка из основного устава, утверждённого Верховным инквизитором)"],["h","РАЗДЕЛ IV. ОБ АРТЕФАКТАХ И ЗНАКАХ ПРИНАДЛЕЖНОСТИ"],["n","4.1","Каждый член ордена обязан носить блокатор — предмет, подавляющий магическую энергию владельца и защищающий его от внешнего колдовского воздействия. Утрата блокатора должна быть немедленно доложена."],["n","4.2","Инквизитор обязан иметь при себе флакон с жидким огнём. Данный флакон является средством последнего очищения и применяется в ситуациях, когда иные способы уничтожения скверны недоступны."],["n","4.3","Старшие инквизиторы и жрецы обладают дополнительными артефактами, выдаваемыми по решению Совета."],["n","4.4","Старший инквизитор дополнительно получает особый артефакт-определитель. Артефакт выдаётся лично в руки старшему инквизитору, не подлежит передаче и подлежит обязательному возврату в случае отставки."],["h","РАЗДЕЛ V. О ЖАЛОВАНИИ И МАТЕРИАЛЬНОМ ОБЕСПЕЧЕНИИ"],["n","5.1","Все члены ордена получают содержание, достаточное для выполнения своих обязанностей. Размер содержания определяется рангом и утверждается Советом Жрецов."],["n","5.2","Рядовые братья и сёстры получают питание, кров и уголь для ритуалов, помимо этого положено денежное довольствие."],["n","5.3","Жрецы храмов получают серебро и золото, предназначенное для обслуживания храмов, покупки необходимых материалов и оплаты помощников. Отчётность по расходам предоставляется ежемесячно."],["n","5.5","Старшие инквизиторы имеют право на долю от имущества, конфискованного у осуждённых, в порядке, установленном императорским указом. Доля зачисляется в казну ордена и распределяется по решению Совета."],["n","5.7","Личное обогащение, не направленное на нужды ордена, приравнивается к хищению и карается по разделу VI. Богатство, вложенное в служение, поощряется."],["h","РАЗДЕЛ VI. О НАРУШЕНИЯХ И НАКАЗАНИЯХ"],["n","6.1","Наказания назначаются в соответствии с тяжестью нарушения. Основанием для наказания является нанесение вреда служению Огню либо ордену."],["n","6.2","За гордыню (отказ подчиняться, возвышение себя над орденом, игнорирование приказов) назначается раздробление костей с последующим помещением в угольную яму."],["n","6.3","За ложь (утаивание информации, обман братьев, сокрытие скверны) назначается клеймение языка, испытание удушливым дымом."],["n","6.4","За сокрытие магов или защиту их назначается сожжение заживо в медленном огне. Данное наказание является высшей мерой и не подлежит смягчению."],["n","6.5","За воровство (хищение имущества братьев, храма или казны ордена) назначается отрубание пальцев с последующим изгнанием."],["n","6.6","За убийство без должного основания (беспричинное, из личных побуждений, не связанное с очищением скверны) назначается смертная казнь либо пожизненные работы в угольных шахтах."],["n","6.7","За уклонение от службы и систематическое отсутствие в храме («затухание сердца») назначается трёхдневный пост с испытанием огнём. При отсутствии раскаяния — изгнание."],["n","6.8","Орден не судит прелюбодеяние, пьянство, обжорство и излишества, поскольку данные нарушения относятся к слабостям плоти и не наносят ущерба служению. Исключение составляют случаи, когда указанные действия приводят к гордыне, лжи или нарушению обязанностей."],["h","РАЗДЕЛ VII. О ПРАВЕ АРЕСТА"],["n","7.1","Каждый член ордена в ранге не ниже инквизитора имеет право арестовать лицо, заподозренное в магии или сокрытии скверны, при соблюдении одного из следующих условий:"],["n","7.1.1","Подозреваемый застигнут при использовании магии."],["n","7.1.2","Подозреваемый отказался добровольно пройти проверку артефактом-определителем."],["n","7.1.3","Артефакт-определитель дал положительный результат при проверке крови или плоти подозреваемого."],["n","7.1.4","Подозреваемый признан магом ранее вынесенным судом ордена и объявлен в розыск."],["n","7.1.5","Подозреваемый задержан при попытке уничтожить, скрыть или подменить улики, связанные с магией."],["n","7.1.6","Подозреваемый оказывает сопротивление требованиям инквизитора, демонстрируя намерение скрыться или напасть."],["n","7.3","Арестованный должен быть доставлен в ближайший храм для проведения суда в течение трёх дней с момента задержания."],["n","7.4","В случае, если по истечении трёх дней вина арестованного не подтверждается, он подлежит освобождению."],["n","7.5","Заведомо ложный арест по личным мотивам приравнивается к лжи и карается по разделу VI, пункт 6.3."],["h","РАЗДЕЛ VIII. ОБ ОБЯЗАННОСТЯХ И СЛУЖЕНИИ"],["n","8.1","Основной обязанностью каждого члена ордена является служение Огню. Все действия оцениваются исключительно по критерию пользы для службы."],["n","8.2","Члены ордена обязаны ежедневно проводить утренний и вечерний ритуалы. Пропуск ритуалов без уважительной причины считается нарушением (см. раздел VI, п. 6.7)."],["n","8.3","Члены ордена обязаны доносить о любых признаках скверны, магии, замеченных в их окружении. Сокрытие указанных сведений приравнивается к лжи и карается по разделу VI, п. 6.3–6.4."],["n","8.4","Члены ордена обязаны носить блокатор в любое время. Исключения не допускаются."],["n","8.5","Члены ордена обязаны соблюдать субординацию, установленную уставом, и выполнять распоряжения вышестоящих лиц в рамках их полномочий."],["h","РАЗДЕЛ IX. ОБ ИЕРАРХИИ И ПОРЯДКЕ ПОДЧИНЕНИЯ"],["n","9.3","Старшие инквизиторы возглавляют региональные отделения ордена, руководят проведением судов и операциями против магов."],["n","9.4","Инквизиторы младшего ранга выполняют поручения старших инквизиторов, ведут расследования и проводят очищение на местах."],["n","9.5","Жрецы храмов обеспечивают проведение ритуалов, прием новых членов и повседневное управление храмами."],["n","9.6","Рядовые братья и сёстры составляют основу ордена, участвуют в службах, выполняют хозяйственные работы и оказывают поддержку высшим чинам."],["p","Утверждено Советом Жрецов. Переписано для внутреннего пользования."]]},{"id":"guild","tab":"Кодекс «Плата и сталь»","kind":"Гильдия авантюристов","name":"Кодекс авантюриста","b":[["h","РАЗДЕЛ I. ОБЩИЕ ПОЛОЖЕНИЯ"],["n","1.1","Гильдия «Плата и сталь» является объединением наёмников, охотников, искателей и иных лиц, готовых выполнять работу за плату. Членство в гильдии добровольное и платное."],["n","1.2","Основной целью гильдии является выполнение заказов любой сложности, за исключением случаев, прямо запрещённых настоящим кодексом."],["n","1.3","Девиз гильдии: «Никакой романтики. Только работа и оплата». Любые действия, не соответствующие данному принципу, не имеют отношения к гильдии и не покрываются её защитой."],["n","1.4","Гильдия сохраняет нейтралитет в отношении политических и религиозных конфликтов."],["h","РАЗДЕЛ II. ЧЛЕНСТВО"],["n","2.1","Для вступления в гильдию необходимо:"],["p","Лично явиться в штаб-квартиру или официальное представительство."],["p","Оплатить вступительный взнос в размере 50 серебряных грошей."],["p","Выполнить пробное задание, назначенное координатором."],["p","Получить значок с эмблемой гильдии (скрещённые меч и монета)."],["n","2.2","Значок является удостоверением члена гильдии. Он даёт право на:"],["p","Бесплатное проживание в любом Доме гильдии (комната, общая трапезная)."],["p","Доступ к доске заданий."],["p","Защиту гильдии в случае конфликтов, связанных с выполнением заказов."],["p","Право продавать добычу через гильдейских скупщиков."],["n","2.3","Утрата значка должна быть немедленно доложена координатору. За восстановление взимается плата в размере 10 серебряных грошей. Ношение чужого значка запрещено и карается изгнанием."],["n","2.4","Членство может быть прекращено по собственному желанию или по решению Совета гильдии в случае нарушений, перечисленных в разделе VI."],["h","РАЗДЕЛ III. СТРУКТУРА И ИЕРАРХИЯ"],["n","3.1","Высшим лицом гильдии является Мастер гильдии. Личность Мастера не разглашается. Решения Мастера не подлежат обсуждению."],["n","3.2","Старшие координаторы назначаются Мастером. Они отвечают за распределение заданий, расчёт платы и ведение архивов. Координаторы имеют право принимать новых членов и расторгать контракты."],["n","3.3","Члены гильдии делятся по рангам в зависимости от сложности выполненных заданий:"],["p","Новичок — допускается только к стандартным заказам."],["p","Опытный — допускается к опасным заказам."],["p","Ветеран — допускается к особо опасным и секретным заказам."],["n","3.4","Повышение ранга производится решением координатора на основании отчётов о выполненных заданиях. Личные заслуги и рекомендации учитываются, но не являются обязательным условием."],["n","3.5","В каждом крупном городе действует Дом гильдии — укреплённое здание, предоставляющее членам жильё, еду, кузницу и арсенал. Управление Домом осуществляет старший координатор города."],["h","РАЗДЕЛ IV. ЗАДАНИЯ И ПОРЯДОК ИХ ВЫПОЛНЕНИЯ"],["n","4.1","Все задания, принимаемые гильдией, делятся на категории:"],["table",["Категория","Пример","Оплата"],[["Стандартные","Охрана караванов, патрулирование, сопровождение","30–100 серебряных грошей"],["Опасные","Охота на упырей, зачистка гнёзд, поиск людей","100–300 грошей"],["Особо опасные","Экспедиции в заражённые зоны, поиск артефактов","от 500 грошей (часто золотом)"],["Секретные","Шпионаж, устранение, кража","индивидуально"]]],["n","4.2","Член гильдии имеет право отказаться от задания без объяснения причин. Отказ не влечёт санкций, если не является систематическим (более трёх отказов подряд без уважительной причины)."],["n","4.3","Задание считается принятым с момента подписания контракта. Контракт фиксирует:"],["p","Описание задачи."],["p","Срок выполнения."],["p","Размер и форму оплаты."],["p","Ответственность сторон."],["n","4.4","При успешном выполнении задания оплата выдаётся не позднее трёх дней после сдачи отчёта."],["n","4.5","При провале задания (невыполнение в срок, халатность, гибель заказчика) оплата не выдаётся. Дополнительные санкции налагаются по решению координатора."],["n","4.6","В случае форс-мажора (внезапная война, катастрофа, массовое заражение) сроки выполнения могут быть пересмотрены. Член гильдии обязан уведомить координатора о причинах задержки при первой возможности."],["h","РАЗДЕЛ V. ПРАВА И ОБЯЗАННОСТИ ЧЛЕНА ГИЛЬДИИ"],["n","5.1","Член гильдии имеет право:"],["p","Выбирать задания по своему усмотрению."],["p","Отказаться от задания, если оно угрожает его жизни без соразмерной оплаты."],["p","Требовать защиту гильдии в случае конфликта, возникшего при выполнении заказа."],["p","Продавать трофеи и добычу через гильдейских скупщиков по установленным расценкам."],["p","Объединяться в группы для выполнения совместных заданий."],["n","5.2","Член гильдии обязан:"],["p","Носить значок гильдии при выполнении заказов."],["p","Выполнять задания в соответствии с условиями контракта."],["p","Сохранять конфиденциальность информации, полученной в ходе выполнения секретных заданий."],["p","Уведомлять координатора о любых конфликтах с другими фракциями, связанных с деятельностью гильдии."],["p","Оказывать помощь другим членам гильдии при выполнении общего задания (в рамках разумного)."],["n","5.3","Член гильдии не обязан:"],["p","Участвовать в религиозных или политических конфликтах без прямого заказа."],["p","Сообщать о своём происхождении, прошлом или личных связях."],["p","Выполнять задания, противоречащие его личным убеждениям (отказ оформляется письменно)."],["h","РАЗДЕЛ VI. ЗАПРЕТЫ И НАРУШЕНИЯ"],["n","6.1","Члену гильдии запрещается:"],["p","Выполнять заказы, направленные против гильдии или её членов."],["p","Использовать значок гильдии для личной выгоды вне рамок заказов (вымогательство, самоуправство)."],["p","Продавать информацию о заказчиках, полученную в ходе секретных заданий."],["p","Вступать в конфликт с Орденом Пылающего Сердца в ходе выполнения заказов, если иное не одобрено координатором (согласно соглашению с Орденом)."],["p","Саботировать или срывать задания других членов гильдии."],["n","6.2","За нарушение пунктов 6.1 назначаются следующие санкции:"],["p","Предупреждение (за первое нарушение, не повлёкшее серьёзных последствий)."],["p","Штраф в размере стоимости задания (за нанесение ущерба гильдии)."],["p","Временное отстранение от заданий на срок до одного месяца."],["p","Изгнание из гильдии с конфискацией значка."],["p","Чёрный список — предательство гильдии (переход на сторону врага при выполнении заказа, умышленное убийство члена гильдии, передача конфиденциальной информации противнику). За такими членами ведётся охота до полного устранения."],["h","РАЗДЕЛ VII. ОТНОШЕНИЯ С ДРУГИМИ ФРАКЦИЯМИ"],["n","7.1","Гильдия сохраняет договорной союз со следующими фракциями:"],["p","Императорский двор (Кассель) — охрана дорог, разведка, устранение угроз."],["p","Орден Пылающего Сердца — взаимное соглашение о невмешательстве (гильдия не принимает заказы против Ордена, инквизиторы не проверяют членов гильдии на наличие Дара)."],["p","Местные власти Верхнего предела, Кальдерона и Гнилого удела — выполнение заказов на поддержание порядка."],["n","7.2","Гильдия не поддерживает союзных отношений с Певчими душами. Заказы от данной фракции принимаются только при условии, что они не нарушают соглашения с другими фракциями."],["n","7.3","Член гильдии, вступивший в конфликт с представителем союзной фракции, обязан уведомить координатора в течение суток. Самостоятельное решение конфликта силой допускается только в случае прямой угрозы жизни."],["n","7.4","Гильдия не задаёт вопросов о происхождении заказа. Любой клиент, способный оплатить работу, рассматривается как потенциальный заказчик. Исключение составляют заказы, направленные против подписанных союзов (пункт 7.1)."],["h","РАЗДЕЛ VIII. ДОМА ГИЛЬДИИ И УСЛОВИЯ ПРОЖИВАНИЯ"],["n","8.1","В каждом крупном городе действует Дом гильдии — укреплённое здание с:"],["p","Общими комнатами для проживания."],["p","Трапезной (питание предоставляется за умеренную плату)."],["p","Кузницей и арсеналом (ремонт и пополнение снаряжения)."],["p","Комнатой для первой помощи."],["n","8.2","Член гильдии имеет право бесплатно остановиться в любом Доме на срок до четырнадцати дней. Дальнейшее проживание оплачивается из расчёта 1 серебряный грош в день."],["n","8.3","В Домах гильдии запрещено:"],["p","Проводить личные разборки и конфликты."],["p","Приводить лиц, не являющихся членами гильдии, в жилые комнаты."],["p","Оставлять оружие без присмотра в общих зонах."],["n","8.4","Координатор Дома имеет право временно ограничить доступ члену гильдии в случае нарушения внутреннего порядка."],["h","РАЗДЕЛ IX. ФИНАНСЫ И ПЛАТЕЖИ"],["n","9.1","Все расчёты по заданиям производятся наличными серебром или золотом, если иное не оговорено в контракте."],["n","9.2","Гильдия удерживает комиссию в размере 10% от суммы каждого официального заказа, за исключением секретных заданий (комиссия обсуждается индивидуально)."],["n","9.3","Член гильдии может продавать добычу через гильдейских скупщиков. Цены устанавливаются на 10–20% ниже рыночных, но гарантируют быструю оплату и конфиденциальность."],["n","9.4","Долги перед гильдией (неуплаченные штрафы, комиссии, стоимость утерянного оборудования) могут быть взысканы путём удержания из последующих выплат."],["n","9.5","Споры о сумме оплаты решаются координатором. Решение координатора является окончательным и не подлежит обсуждению."],["h","РАЗДЕЛ X. ОТВЕТСТВЕННОСТЬ И РАСТОРЖЕНИЕ ЧЛЕНСТВА"],["n","10.1","Член гильдии несёт ответственность за:"],["p","Свои действия в рамках выполнения заданий."],["p","Сохранность выданного оборудования (значок, документы)."],["p","Соблюдение условий контракта."],["n","10.2","Гильдия не несёт ответственности за гибель, ранения или ущерб имуществу члена, полученные в ходе выполнения задания. Исключение составляют случаи, когда координатор намеренно направил члена на заведомо смертельное задание, не предупредив о рисках."],["n","10.3","Членство расторгается:"],["p","По личному заявлению члена (возврат значка, погашение долгов)."],["p","По решению Совета гильдии в случае грубых нарушений (пункт 6.2)."],["p","В случае смерти члена гильдии."],["n","10.4","При расторжении членства все права и привилегии члена аннулируются. Восстановление возможно только по решению Мастера гильдии с повторной уплатой вступительного взноса."],["h","РАЗДЕЛ XI. ЗАКЛЮЧИТЕЛЬНЫЕ ПОЛОЖЕНИЯ"],["n","11.1","Настоящий кодекс обязателен для исполнения всеми членами гильдии «Плата и сталь»."],["n","11.2","Изменения в кодекс вносятся исключительно Мастером гильдии или Советом старших координаторов."],["n","11.3","Незнание положений кодекса не освобождает от ответственности за их нарушение."],["n","11.4","В вопросах, не урегулированных настоящим кодексом, решения принимает координатор на месте."],["n","11.5","Девиз гильдии остаётся неизменным: «Никакой романтики. Только работа и оплата»."],["p","Утверждено Мастером гильдии. Переписано для внутреннего пользования. Копия выдаётся каждому новому члену гильдии."]]},{"id":"souls","tab":"Слово о гниении","kind":"Певчие души","name":"Слово о гниении и о любви","b":[["h","ПЕРВОЕ СЛОВО: О ЛИРАНЕ"],["p","Лирана есть мать, спасение и защита наша."],["p","Лирана не судит, ибо любовь не судит. Она принимает всех, кто приходит к ней, и не отвергает никого."],["p","Тот, кто говорит о Лиране как о богине, лжёт. Она не богиня. Она мать. Боги требуют жертв. Мать приносит жертву сама."],["h","ВТОРОЕ СЛОВО: О СКВЕРНЕ"],["p","Скверна есть не проклятие, но дар. Дар, который Лирана оставила детям своим, когда уходила. Скверна не убивает. Она очищает, как огонь очищает золото. Но её очищение — не жжение, а разложение. Ибо разложение есть рождение…"],["p","……Скверна есть любовь. Любовь, которую люди отвергли, назвав её злом. И потому она приходит к ним как боль — ибо они не умеют принимать иначе."],["p","Никто не избежит скверны. Ибо скверна есть сама земля, по которой вы ходите. И в скверну вы вернётесь, даже если будете бежать."],["h","ТРЕТЬЕ СЛОВО О ПУТИ"],["p","Каждый человек должен пройти через скверну. Это не право — это необходимость. Ибо лишь пройдя через гниль, можно родиться. Путь через скверну есть смерть. Смерть плоти, смерть страха, смерть гордыни. И тот, кто умирает так, не умирает вовсе. Лишь сильные проходят скверну. Слабые умирают в ней и становятся частью болота. И это тоже правильно, ибо слабые не достойны новой жизни."],["p","Не ищи лёгкого пути. Лёгкий путь есть ложь. Истинный путь — тот, где ты кричишь от боли и не просишь пощады."],["h","ЧЕТВЕРТОЕ СЛОВО: О ЛЮБВИ"],["p","….Любовь есть гниль. Не та любовь, что вы знаете — тёплая и сладкая. Любовь эта — чёрная, вязкая, благоухающая смертью…"],["p","Любовь не требует ответа. Она даёт себя, не ожидая возврата. Она принимает удар, чтобы ударенный перестал бить."],["p","Любовь не говорит: «Ты лучше» или «Ты хуже». Любовь говорит: «Ты есть. И этого достаточно»…."],["h","ПЯТОЕ СЛОВО: О ТЕХ, КТО НЕ ПРИНЯЛ"],["p","Не принявший скверну — не есть враг. Он не равный нам, он ниже по статусу, чести и смыслу. Не принявший скверну есть зверь. Он дышит, но не живёт. С не принявшими нельзя считаться как с равными. Ибо они не прошли путь. Они не видели чёрную воду. Они не вдыхали гниль. Они — дети, которые ещё не родились. А значит не принявшие понесут свой труд."],["h","ШЕСТОЕ СЛОВО: О НАКАЗАНИИ"],["p","Певчие души не карают из гнева. Гнев есть удел слабых. Мы караем из любви — ибо любовь не терпит лжи, а ложь есть отрицание матери."],["p","Тот, кто предал брата своего — кто выдал его Ордену, кто указал на его укрытие, кто привёл инквизиторов к его порогу, — не будет просто забыт. Он будет принят в лоно скверны — но не как дитя, а как жертва. Ибо он предал свою кровь, а кровь требует искупления. Предавший будет обнажён. Плоть его будет открыта для гнили."],["p","…Тот, кто говорит от имени Лираны, но несёт ложь, кто учит страху вместо любви, кто обещает лёгкий путь вместо пути через гниль, — тот есть мерзость. Он оскверняет имя той, кто не может защитить себя. И мы защитим её. Язык лжеца будет вырезан. Не для того, чтобы он замолчал — для того, чтобы он запомнил цену слова. Ибо слово есть святое, а святое не произносят всуе. Он будет стоять перед нами с открытым ртом, из которого течёт кровь, и мы будем смотреть на него. И в глазах наших он увидит не гнев — он увидит любовь. Любовь, которая не терпит лжи. Руки лжеца, которыми он писал свои лживые тексты, будут переломаны. Каждая кость — отдельно. Ибо ложь пишется руками, и руки должны помнить…"],["h","СЕДЬМОЕ СЛОВО: О МОРГАНЕ"],["p","Моргана есть явление Лираны в этом мире. Она не богиня, не пророчица, не святая. Она — сосуд, наполненный пустотой, чтобы Лирана могла говорить через неё."],["p","Моргана не ошибается. Ибо она не говорит от себя. Она говорит от той, кто слышит всё. Тот, кто не слушает Моргану, не слушает Лирану. Ибо Моргана — уста Лираны. И слово, сказанное ею, есть слово, сказанное матерью."]]},{"id":"dead","tab":"Усопшие Души","kind":"Гильдия погребения","name":"Устав и обители","b":[["p","Структура внутри организации:"],["h","Глава - Эдмунд Аушвиц Пэрес"],["n","1.1","Заместитель Рафалия Аушвиц Пэрес."],["p","2. Сольятти Ван Де Сол и Гидеон Мартель."],["n","2.1","Маргарет Жан Первэль и Ёхан Гассельский."],["n","2.2","Гордон Вален Тайн."],["p","3. Учёные, анатомы, офицеры секачей, алхимики, личная охрана главы. Стрижи Альбиносы - Только самые опытные из них."],["n","3.1","Секачи, палачи, могильщики, священники."],["n","3.2","Стрижи и остальные."],["s","Местоположение"],["p","В самом сердце угрюмого средневекового города, там, где узкие улочки сжимали пространство подобно костяной петле, притаилась обитель гробовщиков и обмывателей, торговцев атрибутикой смерти и охотников за тварями. Здание это казалось не построенным человеческими руками, а выросшим из самой сырой земли, впитав в себя её тлен и вечный холод."],["p","Его фасад был сложен из грубо тёсанного, потемневшего от сырости и копоти дикого камня. Время и частые дожди иссекли валуны глубокими трещинами, напоминающими морщины на лице умирающего старика. Никакой побелки, никаких изящных барельефов — лишь суровая, почти враждебная монументальность. Второй ярус, срубленный из почерневшего от времени дуба, несимметрично нависал над мостовой, навечно заслоняя от прохожих и без того скудный свет немого неба. Крыша, выложенная крошащимся сизым сланцем и обросшая густым, вязким мхом, походила на чешую спящего чудовища. С её карнизов постоянно капала мутная вода, даже если на улице стояла сушь. Главным «лицом» этого дома была дверь — массивный щит из погрузневших дубовых досок, стянутых полосами кованого железа, покрытого рыжими пятнами ржавчины. Дверной проём был утоплен в глубокую каменную арку, отчего вход казался разверзнутой пастью. Вместо привычного дверного кольца с резного крюка свисала тяжелая железная лапа, держащая полый заржавевший череп, стук которого о дерево отзывался гулким, похоронным эхом. Окна здания были тонкими и узкими, словно бойницы в крепостной стене. В них не было дорогого стекла — рамы затягивали пожелтевшим, пропитанным жиром бычьим пузырём. Сквозь него наружу пробивался лишь болезненный, желтушный свет сальных свечей, в котором призрачно вились тени тех, кто готовил усопших к последнему пути. Над входом, на скрипучем выкованном кронштейне, раскачивался под порывами хладного ветра деревянный щит. На нём выжженное клеймо изображало перевёрнутые песочные часы с черепом внутри и пучок сухой полыни. Из низкой закопчённой трубы на крыше непрерывно вился тонкий хвост сизого дыма, несущий в узкий переулок тяжеловесный, сладковатый запах мирры, сушёных болотных трав и едва уловимого, въевшегося в сами камни аромата тлена."],["p","Каждый, кто проходил мимо — от нищего до знатного горожанина, — невольно ускорял шаг, прижимая к носу край плаща и крестясь. Здание же стояло в немом, торжественном терпении: оно знало, что рано или поздно каждый житель этого города переступит его мрачный, неотесанный порог. - Так описывают один тз филиалов Усопших Душ."],["p","Главное же здание в столице представляет собой большой дом со множеством комнат высотой в пару этажей, подвалом, выходом в катакомбы и внутренним двором, где тренируются, молятся и собирают адептов."],["p","В каждом городе помимо основного филиала, иногда есть склад или дома для членов организации, а также кажлый дом или двор члена организации может быть использован для филиала или приюта."],["p","Правила внутри фракции:"],["p","1. Предатели будут судимы."],["n","1.1","За сокрытие предателей, будет рассматриваться отдельное дело по факту намеренного укрывания или же ненамеренного."],["p","2. Каждый член организации, обязан дать кров просящему товарищу. Оговорка: если к дому хозяина проявляется не уважение, гостя могут выгнать или написать донос."],["p","3. У каждого члена организации должен быть значок из ткани или металла со своим номером или особым символом. Это сделано для регистрации каждого и установлении его личности при подозрении в подмене или украденном знаке. Член организации не может отказать в названии своего номера иои символа, также сверяют записи с его отличительными чертами и особенностями внешности."],["p","4. Любые споры решаются внутри организации, избранными для этого судьями или переговорщиками."],["p","5. Воровство карается отрубанием руки, не распространяется на детей - заменяется исправительными работами."],["p","6. Тайны организации, остаются в организацие."],["p","7. Зарплата фиксирована, премии выписываются главами филиалов."],["p","8. Стрижей могут наказывать только их кураторы или офицеры Секачей."],["p","9. При заражении, вам помогут."],["p","10. Вы под защитой организации."]]}]};

async function ghApi(c, path, opt = {}) {
  return fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}/contents/${path}`, Object.assign({ cache: "no-store" }, opt, {
    headers: Object.assign({ Accept: "application/vnd.github+json" }, c.token ? { Authorization: "Bearer " + c.token } : {}, opt.body ? { "Content-Type": "application/json" } : {})
  }));
}
const utf8b64 = str => { const u = new TextEncoder().encode(str); let s = ""; for (let i = 0; i < u.length; i += 32768) s += String.fromCharCode.apply(null, u.subarray(i, i + 32768)); return btoa(s); };
const b64utf8 = b => { const s = atob(String(b).replace(/\s/g, "")), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return new TextDecoder().decode(u); };
const ghErr = st => st === 401 ? "Ключ GitHub не подходит или истёк." : st === 403 || st === 404 ? "У ключа нет права записи (Contents: Read and write) или выбран не тот репозиторий." : "GitHub ответил ошибкой " + st + ".";

/* прочитать файл через GitHub (свежая версия, без ожидания пересборки сайта) */
async function ghRead(c, path) {
  const r = await ghApi(c, path);
  if (r.status === 404) return { data: null, sha: null };
  if (!r.ok) throw new Error(ghErr(r.status));
  const j = await r.json();
  return { data: JSON.parse(b64utf8(j.content)), sha: j.sha };
}
async function ghWrite(c, path, obj, sha, message) {
  const r = await ghApi(c, path, { method: "PUT", body: JSON.stringify({ message, content: utf8b64(JSON.stringify(obj, null, 1)), sha: sha || undefined }) });
  if (!r.ok) { const e = new Error(ghErr(r.status)); e.status = r.status; throw e; }
  return (await r.json()).content.sha;
}
/* список документов: для мастера — свежий через GitHub, для игроков — с сайта */
async function dbList(fresh) {
  const c = ghCfg();
  if (fresh && c.token) { const { data } = await ghRead(c, "docs/index.json"); return (data && data.docs) || []; }
  try { const r = await fetch("docs/index.json?t=" + Date.now(), { cache: "no-store" }); if (!r.ok) return []; const j = await r.json(); return j.docs || []; } catch (_) { return []; }
}
/* изменить список: mutate(docs) правит массив; повтор, если кто-то успел записать раньше */
async function dbUpdate(mutate, message) {
  const c = ghCfg();
  for (let attempt = 0; attempt < 3; attempt++) {
    const { data, sha } = await ghRead(c, "docs/index.json");
    const docs = (data && data.docs) || [];
    const res = await mutate(docs);
    try { await ghWrite(c, "docs/index.json", { docs }, sha, message); return res; }
    catch (e) { if (e.status !== 409 && e.status !== 422) throw e; }
  }
  throw new Error("Список документов менялся одновременно с вами. Попробуйте ещё раз.");
}
/* старые документы, сохранённые до появления списка, добавляем в список скрытыми */
async function dbAdopt() {
  const c = ghCfg(); if (!c.token) return;
  const r = await ghApi(c, "docs"); if (!r.ok) return;
  const files = (await r.json()).map(f => /^(\d+)\.json$/.exec(f.name)).filter(Boolean).map(m => +m[1]);
  const known = new Set((await dbList(true)).map(d => d.no));
  const missing = files.filter(n => !known.has(n)); if (!missing.length) return;
  const add = [];
  for (const n of missing) { try { const { data } = await ghRead(c, `docs/${n}.json`); if (data) add.push({ no: n, kind: data.kind, title: data.title || "Документ", note: data.note || "", public: false, created: "", updated: "" }); } catch (_) {} }
  if (add.length) await dbUpdate(docs => { add.forEach(a => { if (!docs.some(d => d.no === a.no)) docs.push(a); }); docs.sort((a, b) => a.no - b.no); }, "Документы: добавлены в список");
}
async function dbSetPublic(no, pub) {
  return dbUpdate(docs => { const d = docs.find(x => x.no === +no); if (d) d.public = pub; }, `Документ №${no}: ${pub ? "открыт игрокам" : "скрыт"}`);
}

/* ---------- rendering helpers ---------- */
function blocks(list) {
  let html = "", ul = [];
  const flush = () => { if (ul.length) { html += `<ul class="list dots">${ul.map(t => `<li>${linkify(t)}</li>`).join("")}</ul>`; ul = []; } };
  list.forEach(b => {
    if (b[0] === "li") { ul.push(b[1]); return; }
    flush();
    if (b[0] === "h") html += `<h3>${esc(b[1].replace(/\.$/, ""))}</h3>`;
    else if (b[0] === "s") html += `<h4>${esc(b[1])}</h4>`;
    else if (b[0] === "n") html += `<div class="num"><b>${esc(b[1])}</b><span>${linkify(b[2])}</span></div>`;
    else if (b[0] === "q") html += `<p class="quote">${esc(b[1])}</p>`;
    else if (b[0] === "table") html += table(b[1], b[2]);
    else html += `<p>${linkify(b[1])}</p>`;
  });
  flush(); return html;
}

/* ---------- NPC ---------- */
/* Внешность: картинки лежат в папке npc/ (имя.webp — большая, имя-t.webp — маленькая для карточки).
   Первая картинка в списке идёт на карточку. */
const PICS = { silvana: ["silvana-2", "silvana-1"], kayden: ["kayden-1"], valdis: ["valdis-1", "valdis-2"], olivia: ["olivia-1"], redrif: ["redrif-1"],
  margaret: ["margaret-1"], penelopa: ["penelopa-1"], kain: ["kain-1", "kain-2"], talira: ["talira-1"], callahan: ["lucille-1", "patrick-1", "dwight-1"] };
const MEMBER_PICS = { "Люсиль": "lucille-1", "Патрик": "patrick-1", "Дуайт": "dwight-1" };
/* NPC игроков: принятые анкеты добавляются сюда — по образцу NPC мастера.
   Пример: { key: "imya", name: "Имя", role: "Кто он", age: "30 лет", fac: "Без фракции", pics: ["imya-1"], skills: [], bio: ["…"] } */
const PLAYER_NPCS = [];
const picsOf = c => c.pics || PICS[c.key] || [];
const ava = c => { const p = picsOf(c)[0]; return p ? `<img class="mono ava" src="npc/${p}-t.webp" alt="" loading="lazy">` : `<span class="mono">${esc(c.name[0])}</span>`; };
const gallery = list => list.length ? `<div class="gal wide">${list.map(p => `<button type="button" class="gp" data-zoom="npc/${p}.webp"><img src="npc/${p}.webp" alt="Внешность" loading="lazy"></button>`).join("")}</div>` : "";
let charFilter = "Все", charQuery = "";
const MASTER_NPCS = () => D.chars.concat([{ key: "callahan", name: "Семья Каллахан", role: "Люсиль, Патрик и Дуайт", age: "", fac: "Без фракции", family: true }]);
function charCards(list) {
  const q = charQuery.trim().toLowerCase();
  const shown = list.filter(c => (charFilter === "Все" || c.fac === charFilter) && (!q || (c.name + " " + (c.role || "") + (c.family ? " Люсиль Патрик Дуайт Каллахан" : "")).toLowerCase().includes(q)));
  if (!shown.length) return `<p class="note">${q ? "Никого не нашлось. Проверьте имя." : "Пусто."}</p>`;
  return `<div class="cards">${shown.map(c => `<button type="button" class="card" data-char="${c.key}">${ava(c)}<b>${esc(c.name)}</b><span class="r">${esc(c.role || "")}${c.age ? " · " + esc(c.age) : ""}</span><span class="f">${esc(c.fac)}</span></button>`).join("")}</div>`;
}
function charsHTML(which) {
  if (which === "players") {
    return head("NPC", "NPC игроков", "Персонажи, которых игроки ввели в мир.") +
      (PLAYER_NPCS.length ? `<div class="search"><input type="text" id="npc-q" placeholder="Поиск по имени" value="${esc(charQuery)}" aria-label="Поиск по имени"></div><div id="npc-list">${charCards(PLAYER_NPCS)}</div>`
        : `<p class="note">Пока здесь пусто. Принятые анкеты NPC появятся в этом разделе.</p>`) +
      `<h3>Правила NPC игроков</h3>${ol(D.rulesNpc)}<p>Анкеты NPC: <a class="vk" href="${D.npcTopic}" target="_blank" rel="noopener">обсуждение в группе</a>.</p>`;
  }
  const list = MASTER_NPCS(), facs = ["Все", ...new Set(list.map(c => c.fac))];
  return head("NPC", "NPC мастера", "Герои во владении гейм-мастера и владельца ролевой.") +
    `<div class="search"><input type="text" id="npc-q" placeholder="Поиск по имени" value="${esc(charQuery)}" aria-label="Поиск по имени"></div>
     <div class="filters">${facs.map(f => `<button type="button" class="chip" data-cf="${esc(f)}" aria-pressed="${f === charFilter}">${esc(f)}<span>${f === "Все" ? list.length : list.filter(c => c.fac === f).length}</span></button>`).join("")}</div>
     <div id="npc-list">${charCards(list)}</div>`;
}
function charDetail(c) {
  if (c.family) return `<button class="x" type="button" data-close aria-label="Закрыть">${svg("x")}</button>` + callahanHTML();
  const sec = (t, arr, list) => arr && arr.length ? `<h3>${t}</h3>` + (list ? ol(arr, true) : arr.map(p => `<p>${linkify(p)}</p>`).join("")) : "";
  return `<button class="x" type="button" data-close aria-label="Закрыть">${svg("x")}</button>` + head(c.fac, c.name, c.role) + gallery(picsOf(c)) +
    `<dl class="kv">${c.age ? `<dt>Возраст</dt><dd>${esc(c.age)}</dd>` : ""}${c.sex ? `<dt>Пол</dt><dd>${esc(c.sex)}</dd>` : ""}${(c.extra || []).map(e => `<dt>${esc(e[0])}</dt><dd>${esc(e[1])}</dd>`).join("")}${c.art ? `<dt>Арт</dt><dd><a class="vk" href="${esc(c.art)}" target="_blank" rel="noopener">открыть в ВК</a></dd>` : ""}</dl>
     <h3>Навыки</h3><div class="skills">${(c.skills || []).map(s => `<div class="skill"><b>${esc(s[0])}</b><i>${esc(s[1])}</i>${s[2] ? `<p>${esc(s[2])}</p>` : ""}</div>`).join("")}</div>` +
    sec("Биография", c.bio) + sec("Местожительство", c.home) + sec("Инвентарь", c.inv, true) + sec("Финансы и имущество", c.money) + sec("Принадлежность", c.facText);
}
function callahanHTML() {
  const c = D.callahan;
  return head(c.group, c.name, "Рыба, лодки и то, что перевозят в трюмах без имени.") + c.intro.map(p => `<p>${esc(p)}</p>`).join("") +
    `<h3>Члены семьи</h3>${c.members.map(m => `<div class="member">${MEMBER_PICS[m[0]] ? `<button type="button" class="mono ava big" data-zoom="npc/${MEMBER_PICS[m[0]]}.webp" style="padding:0;background:url(npc/${MEMBER_PICS[m[0]]}-t.webp) center/cover" aria-label="Внешность: ${esc(m[0])}"></button>` : `<span class="mono">${esc(m[0][0])}</span>`}<div><b>${esc(m[0])}</b><small>${esc(m[1])}</small><p>${esc(m[2])}</p></div></div>`).join("")}`;

/* ---------- О мире ---------- */
const placeName = id => { const p = PLACES.find(x => x.id === id); return p ? p.name : id; };
const mapLink = (id, text) => `<a class="vk" href="${mapHref("mesto-" + id)}">${esc(text || placeName(id))}</a>`;
function loreBlock([t, v, x]) {
  switch (t) {
    case "p": return `<p>${esc(v)}</p>`;
    case "h": return `<h3>${esc(v)}</h3>`;
    case "note": return `<p class="note">${esc(v)}</p>`;
    case "dl": return `<dl class="kv">${v.map(([k, d]) => `<dt>${esc(k)}</dt><dd>${esc(d)}</dd>`).join("")}</dl>`;
    case "people": return v.map((p, i) => `<div class="member"><span class="mono">${x ? i + 1 : esc(p.name[0])}</span><div><b>${esc(p.name)}</b><small>${esc(p.role)}</small><p>${esc(p.text)}</p></div></div>`).join("");
    case "table": return table(v, x, true);
    case "routes": return `<div class="tw"><table><thead><tr><th>Путь</th><th>Повозка</th><th>Пешком</th></tr></thead><tbody>${ROUTES.map(r => `<tr><td>${mapLink(r[0])} → ${mapLink(r[1])}${r[4] ? `<br><i style="color:var(--text-muted);font-size:15px">${esc(r[4])}</i>` : ""}</td><td class="v">${esc(r[2])}</td><td class="v">${esc(r[3])}</td></tr>`).join("")}</tbody></table></div>`;
    case "states": return v.map(st => `<div class="member" style="grid-template-columns:1fr"><div><b>${esc(st.name)}</b><small>${esc(st.rel)}</small>
        <dl class="kv">${st.dl.map(([k, d]) => `<dt>${esc(k)}</dt><dd>${esc(d)}</dd>`).join("")}</dl>${st.p.map(t => t.startsWith("§") ? `<h4>${esc(t.slice(1))}</h4>` : `<p>${esc(t)}</p>`).join("")}</div></div>`).join("");
  }
  return "";
}
const loreHTML = t => head(t.kind, t.name, t.motto) + t.blocks.map(loreBlock).join("");

    list.map(f => `<section class="fac" style="--fc:${f.color}"><button type="button" class="fac-h" data-fac aria-expanded="false">

      <div class="body"><div><div class="in">
        <p class="quote">${esc(f.motto)}</p>${f.desc.map(p => `<p>${esc(p)}</p>`).join("")}
        ${f.facts ? `<dl class="kv">${f.facts.map(([k, d]) => `<dt>${esc(k)}</dt><dd>${esc(d)}</dd>`).join("")}</dl>` : ""}
        ${f.people ? `<h4>${f.id === "tri" ? "Три дома" : f.id === "shadows" ? "Три подполья" : f.id === "order" ? "Иерархия" : "Лица"}</h4>${f.people.map(([n, t]) => `<div class="skill"><b>${esc(n)}</b><p>${esc(t)}</p></div>`).join("")}${f.peopleNote ? `<p class="note">${esc(f.peopleNote)}</p>` : ""}` : ""}
        ${f.table ? table(["Задания гильдии", "Оплата"], f.table, true) : ""}
        ${f.list ? f.list.map(([id, n, t]) => `<div class="skill"><b>${esc(n)}</b><i>${esc(placeName(id))}</i><p>${esc(t)}</p></div>`).join("") : ""}
        ${f.rel ? `<h4>Отношения</h4><dl class="kv">${f.rel.map(([k, d]) => `<dt>${esc(k)}</dt><dd>${esc(d)}</dd>`).join("")}</dl>` : ""}
        ${f.main.length || f.presence.length ? `<h4>На карте</h4><p>${[...f.main, ...f.presence].map(id => mapLink(id)).join(" · ")}</p>` : ""}

/* ---------- Квесты ---------- */
let qFilter = "all-groups", qFree = false;
function questCard(q) {
  const places = q.places.filter(id => PLACES.some(p => p.id === id));
  return `<article class="quest${q.busy ? " busy" : ""}"><header><div><b>${esc(q.n)}</b><span class="qg">${esc(groupName[q.g])}</span>${q.tag ? `<span class="qg qt">${esc(q.tag)}</span>` : ""}</div>
    ${q.busy ? `<span class="qs busy">Занят</span>` : `<span class="qs">Свободен</span>`}</header><p>${esc(q.d)}</p>
    <dl class="kv"><dt>Кому</dt><dd>${esc(q.rec)}</dd><dt>Длительность</dt><dd>${esc(q.dur)}</dd><dt>Где</dt><dd>${esc(q.loc)}${places.length ? " · " + places.map(id => mapLink(id, "на карте: " + placeName(id))).join(", ") : ""}</dd><dt>Влияние</dt><dd>${esc(IMP[q.imp])}</dd></dl></article>`;
}
function questList() {
  if (qFilter === "archive") return QUEST_ARCHIVE.map(a => `<article class="quest"><header><div><b>${esc(a.n)}</b></div><span class="qs done">Завершён</span></header>${a.d ? `<p>${esc(a.d)}</p>` : ""}<p class="note"><b>Итог.</b> ${esc(a.end)}</p></article>`).join("");
  const l = QUESTS.filter(q => (qFilter === "all-groups" || q.g === qFilter) && (!qFree || !q.busy));
  return l.length ? l.map(questCard).join("") : `<p class="note">Свободных квестов в этом разделе нет.</p>`;
}
function questsHTML() {
  const cnt = g => QUESTS.filter(q => (g === "all-groups" || q.g === g) && (!qFree || !q.busy)).length;

  if (t.id === "npc-q") { charQuery = t.value; const lst = tab.mir === "npcp" ? PLAYER_NPCS : MASTER_NPCS(); $("#npc-list").innerHTML = charCards(lst); return; }
  if (t.dataset.ak) { ak[t.dataset.ak] = t.value; anketaRefresh(); }
  if (t.dataset.sk != null) { ak.skills[+t.dataset.sk][0] = t.value; anketaRefresh(); }
  if (t.dataset.skl != null) { ak.skills[+t.dataset.skl][1] = t.value; anketaRefresh(); }
});
document.addEventListener("change", e => { const t = e.target; if (t.id === "q-free") { qFree = t.checked; $("#sheet").innerHTML = questsHTML(); return; } if (t.dataset.skl != null) { ak.skills[+t.dataset.skl][1] = t.value; anketaRefresh(); } if (t.dataset.ak) { ak[t.dataset.ak] = t.value; anketaRefresh(); } });
document.addEventListener("submit", e => e.preventDefault());
addEventListener("keydown", e => { if (e.key === "Escape") { const z = $("#zoom"); if (z.classList.contains("on")) z.classList.remove("on"); else $("#ov").classList.remove("on"); } });
addEventListener("popstate", render);

/* ВКонтакте: сообщаем, что страница загрузилась */
(() => {
  if (!/(^|[?&])vk_/.test(location.search)) return;
  try {
    const m = "VKWebAppInit";
    if (window.AndroidBridge && window.AndroidBridge[m]) window.AndroidBridge[m]("{}");
    else if (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers[m]) window.webkit.messageHandlers[m].postMessage({});
    else if (window.parent !== window) window.parent.postMessage({ handler: m, params: {}, type: "vk-connect" }, "*");
  } catch (e) {}
})();
render();
</script>
