<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Атлас земель</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Cormorant+SC:wght@600;700&display=swap">
<style>
/* Layout: full-bleed map camera; game menu floats over the cloud bank on the left; parchment dossier slides in from the right (bottom sheet on phones). Single deliberate look: dark leather + gold + parchment. */
:root {
  --ink: #17110b;          /* frame / letterbox */
  --leather: #2a1d12;      /* menu buttons */
  --leather-hi: #3a2817;
  --gold: #c9a25a;         /* trims, accents */
  --gold-hi: #f0d696;
  --parchment: #ecdcb6;    /* dossier */
  --parchment-deep: #d6bd8c;
  --text-ink: #34230f;
  --text-muted: #6f5532;
  --blood: #8e2f1c;        /* danger */
  --shadow: rgba(10, 6, 2, .55);
  --font-display: "Cormorant SC", "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-body: "Cormorant Garamond", Georgia, "Times New Roman", serif;
  --ease: cubic-bezier(.22, .8, .24, 1);
  --panel-w: min(430px, 100vw);
  color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; }
body { touch-action: none; -webkit-user-select: none; user-select: none; }
.sheet, #flyout { touch-action: pan-y; -webkit-user-select: text; user-select: text; }
body { background: var(--ink); color: var(--parchment); font-family: var(--font-body); font-size: 17px; -webkit-font-smoothing: antialiased; }

/* ---------- Map camera ---------- */
#stage { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab; background: #cdb586; outline: none; }
#stage.dragging { cursor: grabbing; }
#map { position: absolute; left: 0; top: 0; width: 2576px; height: 1635px; transform-origin: 0 0; opacity: 0; transition: opacity 1.1s var(--ease); }
#map.ready { opacity: 1; }
#map img { display: block; width: 100%; height: 100%; max-width: none; user-select: none; -webkit-user-drag: none; pointer-events: none; }
.vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 60% 50%, transparent 55%, rgba(23,17,11,.55) 100%); }

/* Hotspots live in map coordinates (percent of the image) */
.spot { position: absolute; padding: 0; border: 0; background: transparent; cursor: pointer; border-radius: 22%; -webkit-tap-highlight-color: transparent; }
.spot::before { content: ""; position: absolute; inset: -14%; border-radius: 50%; background: radial-gradient(closest-side, rgba(255, 228, 160, .55), rgba(255, 210, 120, .18) 60%, transparent 100%); opacity: 0; transform: scale(.85); transition: opacity .45s var(--ease), transform .6s var(--ease); pointer-events: none; mix-blend-mode: screen; }
.spot::after { content: ""; position: absolute; inset: -2%; border-radius: 26%; border: 3px solid rgba(240, 214, 150, 0); transition: border-color .4s var(--ease), inset .5s var(--ease); pointer-events: none; }
.spot:hover::before, .spot:focus-visible::before { opacity: 1; transform: scale(1); }
.spot:hover::after, .spot:focus-visible::after { border-color: rgba(240, 214, 150, .55); inset: -6%; }
.spot.active::before { opacity: 1; transform: scale(1.05); animation: breathe 2.6s ease-in-out infinite; }
.spot.active::after { border-color: var(--gold-hi); inset: -6%; box-shadow: 0 0 22px rgba(240, 214, 150, .5); }
.spot:focus { outline: none; }
#map.show-regions .spot.region::before { opacity: .9; transform: scale(1); background: radial-gradient(closest-side, rgba(170, 60, 30, .5), rgba(170, 60, 30, .15) 60%, transparent); mix-blend-mode: multiply; animation: breathe 3s ease-in-out infinite; }
#map.show-regions .spot.region::after { border-color: rgba(142, 47, 28, .7); border-style: dashed; inset: -8%; }
@keyframes breathe { 50% { transform: scale(1.14); opacity: .75; } }

/* Neighbour arrows (map space) */
#arrows { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
#arrows .draw { transition: stroke-dashoffset 1.4s var(--ease); }
#arrows .arrow.on .draw { stroke-dashoffset: 0 !important; }
#arrows .line { stroke: #3a2614; stroke-width: 6; stroke-dasharray: 22 14; stroke-linecap: round; opacity: .62; }
#arrows .halo { stroke: rgba(236, 220, 182, .55); stroke-width: 16; stroke-linecap: round; }
#arrows .head { stroke: #3a2614; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transition: opacity .5s ease; }
#arrows text { font: 700 46px var(--font-display); letter-spacing: 4px; fill: #3a2614; stroke: rgba(236, 220, 182, .8); stroke-width: 10px; paint-order: stroke; opacity: 0; transform: translateY(8px); transition: opacity .7s ease, transform .9s var(--ease); }
#arrows .arrow.on .head { opacity: .65; transition-delay: 1.05s; }
#arrows .arrow.on text { opacity: .75; transform: none; transition-delay: .9s; }

/* Hover tooltip (screen space) */
#tip { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; padding: 5px 12px 6px; border-radius: 3px; background: var(--leather); border: 1px solid var(--gold); color: var(--gold-hi); font: 600 15px/1.2 var(--font-body); letter-spacing: .02em; white-space: nowrap; box-shadow: 0 6px 18px var(--shadow); opacity: 0; transform: translate(-50%, calc(-100% - 4px)); transition: opacity .25s var(--ease), transform .35s var(--ease); }
#tip.on { opacity: 1; transform: translate(-50%, calc(-100% - 12px)); }
#tip small { color: var(--parchment-deep); font-weight: 500; }

/* ---------- Left game menu ---------- */
#menu { position: fixed; z-index: 20; left: max(18px, calc(env(safe-area-inset-left, 0px) + 12px)); top: max(18px, calc(env(safe-area-inset-top, 0px) + 12px)); bottom: max(18px, calc(env(safe-area-inset-bottom, 0px) + 12px)); display: flex; flex-direction: column; gap: 10px; width: 280px; pointer-events: none; }
#menu > * { pointer-events: auto; }
.crest { padding: 14px 16px 12px; text-align: center; background: linear-gradient(180deg, var(--leather-hi), var(--leather)); border: 1px solid var(--gold); border-radius: 4px; box-shadow: inset 0 0 0 3px var(--leather), inset 0 0 0 4px rgba(201, 162, 90, .45), 0 10px 26px var(--shadow); opacity: 0; transform: translateX(-24px); animation: slideIn .8s var(--ease) .15s forwards; }
.crest { display: flex; align-items: center; gap: 12px; text-align: left; }
.crest-t { flex: 1; min-width: 0; }
.clock { flex: none; display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 66px; padding-left: 11px; border-left: 1px solid rgba(201, 162, 90, .35); text-align: center; }
.sky { width: 26px; height: 26px; fill: none; stroke: var(--gold-hi); stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; filter: drop-shadow(0 0 6px rgba(240, 214, 150, .35)); }
.sky .rays { transform-origin: 12px 12px; animation: spin 60s linear infinite; }
.clock.night .sky { stroke: var(--parchment-deep); filter: drop-shadow(0 0 6px rgba(214, 189, 140, .3)); }
.sky .star { animation: twinkle 3.5s ease-in-out infinite; }
.season { font: 700 11px/1 var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.date { font: italic 600 14px/1.1 var(--font-body); color: var(--parchment); white-space: nowrap; }
.date-short { display: none; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes twinkle { 50% { opacity: .2; } }
.crest h1 { margin: 0; font: 700 22px/1 var(--font-display); color: var(--gold-hi); letter-spacing: .03em; white-space: nowrap; }
.crest p { margin: 6px 0 0; font: italic 500 14px/1.2 var(--font-body); color: var(--parchment-deep); }
.mbtn { --i: 0; position: relative; display: flex; align-items: center; gap: 12px; width: 100%; padding: 11px 14px; border: 1px solid rgba(201, 162, 90, .75); border-radius: 4px; background: linear-gradient(180deg, var(--leather-hi), var(--leather)); color: var(--parchment); font: 700 18px/1 var(--font-display); letter-spacing: .05em; text-align: left; cursor: pointer; box-shadow: inset 0 0 0 3px var(--leather), inset 0 0 0 4px rgba(201, 162, 90, .25), 0 6px 16px var(--shadow); opacity: 0; transform: translateX(-24px); animation: slideIn .7s var(--ease) calc(.3s + var(--i) * .07s) forwards; transition: color .3s var(--ease), box-shadow .35s var(--ease), translate .35s var(--ease), border-color .3s; }
.mbtn svg { flex: none; width: 22px; height: 22px; stroke: var(--gold); fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; transition: stroke .3s, transform .45s var(--ease); }
.mbtn:hover, .mbtn:focus-visible { color: var(--gold-hi); border-color: var(--gold-hi); translate: 5px 0; box-shadow: inset 0 0 0 3px var(--leather), inset 0 0 0 4px rgba(240, 214, 150, .6), 0 0 22px rgba(240, 214, 150, .22), 0 8px 18px var(--shadow); outline: none; }
.mbtn:hover svg, .mbtn:focus-visible svg { stroke: var(--gold-hi); transform: rotate(-8deg) scale(1.08); }
.mbtn[aria-pressed="true"], .mbtn[aria-expanded="true"] { color: #2a1a0c; border-color: var(--gold-hi); background: linear-gradient(180deg, #f1d79a, #c99a4e); box-shadow: inset 0 0 0 3px rgba(255, 240, 200, .35), inset 0 0 0 4px rgba(90, 55, 20, .55), 0 0 18px rgba(240, 214, 150, .45), 0 6px 16px var(--shadow); }
.mbtn[aria-pressed="true"] svg, .mbtn[aria-expanded="true"] svg { stroke: #3a2210; }
.mbtn[aria-pressed="true"]:hover, .mbtn[aria-expanded="true"]:hover, .mbtn[aria-pressed="true"]:focus-visible, .mbtn[aria-expanded="true"]:focus-visible { color: #2a1a0c; }
.mbtn[aria-pressed="true"]:hover svg, .mbtn[aria-expanded="true"]:hover svg { stroke: #3a2210; }
.mbtn[aria-pressed="true"]::after, .mbtn[aria-expanded="true"]::after { content: ""; position: absolute; right: 12px; top: 50%; width: 7px; height: 7px; margin-top: -3.5px; background: #8e2f1c; transform: rotate(45deg); box-shadow: 0 0 6px rgba(142, 47, 28, .6); }
.mbtn:active { translate: 5px 1px; }
.zoombar { margin-top: auto; display: flex; gap: 8px; }
.zoombar .mbtn { justify-content: center; padding: 10px 0; flex: 1; font-size: 22px; }
.zoombar .mbtn svg { width: 20px; height: 20px; }
@keyframes slideIn { to { opacity: 1; transform: none; } }

/* Folding the menu into an icon rail: only widths and opacity animate, nothing re-wraps */
#menu { transition: width .55s var(--ease); }
.mbtn { overflow: hidden; }
.mbtn .t { white-space: nowrap; transition: opacity .35s var(--ease), transform .5s var(--ease); }
.crest { position: relative; overflow: hidden; gap: 0; height: 88px; padding: 0 16px; transition: none; }
.crest-t { flex: none; width: 148px; margin-right: 12px; overflow: hidden; white-space: nowrap; transition: width .55s var(--ease), margin .55s var(--ease), opacity .3s var(--ease); }
.crest-t p { white-space: nowrap; }
.clock { flex: none; display: grid; grid-template-rows: 26px 12px 15px; grid-template-columns: minmax(0, 1fr); justify-items: center; align-content: center; row-gap: 3px; width: 86px; min-width: 0; overflow: hidden; white-space: nowrap; transition: width .55s var(--ease), padding .55s var(--ease), border-color .4s; }
.clock > * { grid-column: 1; }
.clock .sky { grid-row: 1; } .clock .season { grid-row: 2; align-self: center; } .clock .date { grid-row: 3; align-self: center; }
.clock .season, .clock .date { transition: opacity .3s var(--ease); }
.zoombar { flex-direction: column; align-items: flex-start; }
.zoombar { gap: 8px; }
#menu .zoombar .mbtn { flex: none; width: 60px; height: 44px; padding: 0; justify-content: center; translate: 0 0; }
#menu .zoombar .mbtn svg { transform: none; }
#b-fold { position: absolute; z-index: 2; top: 34px; right: -15px; width: 22px; height: 46px; display: grid; place-items: center; padding: 0; border: 1px solid var(--gold); border-left: 0; border-radius: 0 6px 6px 0; background: linear-gradient(90deg, var(--leather), var(--leather-hi)); cursor: pointer; box-shadow: 4px 4px 12px var(--shadow); opacity: 0; animation: slideIn .7s var(--ease) .8s forwards; transition: background .25s; }
#b-fold svg { width: 14px; height: 14px; fill: none; stroke: var(--gold-hi); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; transition: transform .55s var(--ease); }
#b-fold:hover, #b-fold:focus-visible { background: var(--leather-hi); outline: none; }
body.fold:not(.peek) #menu { width: 60px; }
body.fold:not(.peek) .mbtn { padding-left: 18px; }
body.fold:not(.peek) .mbtn .t { opacity: 0; transform: translateX(-12px); }
body.fold:not(.peek) .mbtn::after { opacity: 0; }
body.fold:not(.peek) .mbtn:hover, body.fold:not(.peek) .mbtn:focus-visible { translate: 0 0; }
body.fold:not(.peek) .crest-t { width: 0; margin-right: 0; opacity: 0; }
body.fold:not(.peek) .clock { width: 26px; padding-left: 0; border-color: transparent; }
body.fold:not(.peek) .clock .season, body.fold:not(.peek) .clock .date { opacity: 0; }
.mini { grid-row: 2 / 4; align-self: center; display: flex; flex-direction: column; align-items: center; opacity: 0; transition: opacity .3s var(--ease); pointer-events: none; }
.mini-d { font: 700 19px/1 var(--font-display); color: var(--gold-hi); }
.mini-m { margin-top: 2px; font: 700 10px/1 var(--font-display); letter-spacing: .12em; text-transform: uppercase; color: var(--gold); }
body.fold:not(.peek) .mini { opacity: 1; transition-delay: .2s; }
body.fold #b-fold svg { transform: rotate(180deg); }
body.fold:not(.peek) #flyout { left: calc(max(18px, calc(env(safe-area-inset-left, 0px) + 12px)) + 74px); }

/* Flyout next to the menu */
#flyout { position: fixed; z-index: 19; left: calc(max(18px, calc(env(safe-area-inset-left, 0px) + 12px)) + 292px); top: max(18px, calc(env(safe-area-inset-top, 0px) + 12px)); width: 290px; max-height: calc(100% - 36px - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); overflow: auto; padding: 18px 18px 20px; color: var(--text-ink); background-color: var(--parchment); background-image: var(--grain), radial-gradient(ellipse at 30% 0%, rgba(255,255,255,.35), transparent 60%), linear-gradient(180deg, var(--parchment), var(--parchment-deep)); border: 1px solid var(--gold); border-radius: 4px; box-shadow: inset 0 0 0 4px var(--parchment), inset 0 0 0 5px rgba(111, 85, 50, .35), 0 16px 40px var(--shadow); opacity: 0; visibility: hidden; transform: translateX(-16px) scale(.98); transform-origin: left top; transition: opacity .4s var(--ease), transform .5s var(--ease), visibility 0s .5s; }
#flyout.open { opacity: 1; visibility: visible; transform: none; transition: opacity .4s var(--ease), transform .5s var(--ease), visibility 0s; }
#flyout h2 { margin: 0 0 4px; font: 700 22px/1.1 var(--font-display); color: var(--text-ink); letter-spacing: .04em; }
#flyout h3 { margin: 16px 0 6px; font: 700 13px/1 var(--font-display); letter-spacing: .14em; color: var(--text-muted); text-transform: uppercase; }
#flyout p { margin: 6px 0; font-size: 16px; line-height: 1.45; }
.list { display: flex; flex-direction: column; gap: 2px; margin: 0; padding: 0; list-style: none; }
.list button { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; width: 100%; padding: 7px 8px; border: 0; border-radius: 3px; background: transparent; color: var(--text-ink); font: 600 17px/1.15 var(--font-body); text-align: left; cursor: pointer; transition: background .25s, padding .3s var(--ease), color .25s; }
.list button span { font-size: 13px; font-weight: 500; color: var(--text-muted); white-space: nowrap; }
.list button:hover, .list button:focus-visible { background: rgba(111, 85, 50, .14); padding-left: 14px; outline: none; }
.list button.current { color: var(--blood); }
.keys { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; margin: 10px 0 0; font-size: 16px; }
.keys dt { font-weight: 700; color: var(--text-muted); }
.keys dd { margin: 0; }

/* ---------- Dossier panel ---------- */
#panel { position: fixed; z-index: 25; top: 0; right: 0; bottom: 0; width: var(--panel-w); padding: max(14px, env(safe-area-inset-top, 0px)) max(14px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) 0; transform: translateX(105%); transition: transform .7s var(--ease); pointer-events: none; }
#panel.open { transform: none; pointer-events: auto; }
.sheet { position: relative; height: 100%; display: flex; flex-direction: column; overflow: hidden; color: var(--text-ink); background-color: var(--parchment); background-image: var(--grain), radial-gradient(ellipse at 20% 0%, rgba(255,255,255,.4), transparent 55%), radial-gradient(ellipse at 100% 100%, rgba(120, 80, 30, .22), transparent 60%), linear-gradient(180deg, var(--parchment), var(--parchment-deep)); border: 1px solid var(--gold); border-radius: 5px; box-shadow: inset 0 0 0 5px var(--parchment), inset 0 0 0 6px rgba(111, 85, 50, .4), -18px 0 50px var(--shadow); }
.grab { display: none; }
.scroll { flex: 1; overflow-y: auto; overscroll-behavior: contain; scrollbar-width: thin; scrollbar-color: var(--parchment-deep) transparent; }
.hero { position: relative; height: 210px; margin: 10px 10px 0; border-radius: 3px; background: #cdb586 no-repeat; box-shadow: inset 0 0 0 1px rgba(52, 35, 15, .5), inset 0 -60px 50px -30px rgba(52, 35, 15, .45); transition: background-position .9s var(--ease), background-size .9s var(--ease); overflow: hidden; }
.hero::after { content: ""; position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 45%, rgba(40, 25, 10, .45)); pointer-events: none; }
.close { position: absolute; z-index: 5; top: 18px; right: 18px; width: 40px; height: 40px; display: grid; place-items: center; border: 1px solid var(--gold); border-radius: 50%; background: var(--leather); cursor: pointer; box-shadow: 0 4px 12px var(--shadow); transition: transform .4s var(--ease), background .3s; }
.close svg { width: 18px; height: 18px; stroke: var(--gold-hi); stroke-width: 2; fill: none; stroke-linecap: round; }
.close:hover, .close:focus-visible { transform: rotate(90deg); background: var(--leather-hi); outline: none; }
.content { padding: 18px 26px 22px; }
.content > * { animation: rise .6s var(--ease) both; animation-delay: calc(var(--d, 0) * 60ms + 120ms); }
.swap .content > * { animation: none; opacity: 0; transform: translateY(6px); transition: opacity .18s, transform .18s; }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
.kind { margin: 0; font: 700 12.5px/1 var(--font-display); letter-spacing: .18em; text-transform: uppercase; color: var(--blood); }
.content h2 { margin: 8px 0 4px; font: 700 34px/1.02 var(--font-display); letter-spacing: .02em; text-wrap: balance; }
.motto { margin: 0 0 14px; font: italic 500 18px/1.3 var(--font-body); color: var(--text-muted); }
.rule { height: 12px; margin: 4px 0 14px; background: radial-gradient(circle, var(--text-muted) 2.5px, transparent 3px) center / 12px 12px no-repeat, linear-gradient(var(--text-muted), var(--text-muted)) left center / calc(50% - 12px) 1px no-repeat, linear-gradient(var(--text-muted), var(--text-muted)) right center / calc(50% - 12px) 1px no-repeat; opacity: .6; }
.desc p { margin: 0 0 10px; font-size: 18px; line-height: 1.5; max-width: 62ch; }
.desc p:first-child::first-letter { float: left; margin: 4px 8px 0 0; font: 700 50px/.8 var(--font-display); color: var(--blood); }
.stats { display: grid; grid-template-columns: auto 1fr; gap: 7px 14px; margin: 16px 0 6px; padding: 14px 0; border-top: 1px solid rgba(111, 85, 50, .35); border-bottom: 1px solid rgba(111, 85, 50, .35); font-size: 16.5px; }
.stats dt { font: 700 13px/1.55 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); }
.stats dd { margin: 0; font-weight: 600; font-variant-numeric: tabular-nums; min-width: 0; }
.danger { display: flex; align-items: center; gap: 10px; margin: 14px 0 4px; }
.danger .lbl { font: 700 13px/1 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); }
.pips { display: flex; gap: 5px; }
.pips i { width: 11px; height: 11px; transform: rotate(45deg) scale(.6); border: 1.5px solid var(--blood); opacity: .45; transition: transform .5s var(--ease), background .4s, opacity .4s; transition-delay: calc(var(--n) * 70ms + 300ms); }
.pips i.on { background: var(--blood); opacity: 1; transform: rotate(45deg) scale(1); }
.danger .word { font-weight: 700; color: var(--blood); font-size: 16px; }
.content h3 { display: flex; align-items: center; gap: 10px; margin: 26px 0 10px; font: 700 15.5px/1.1 var(--font-display); letter-spacing: .13em; text-transform: uppercase; color: var(--text-ink); }
.content h3::before { content: ""; flex: none; width: 7px; height: 7px; background: var(--blood); transform: rotate(45deg); }
.content h3::after { content: ""; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(111, 85, 50, .6), rgba(111, 85, 50, 0)); }
.links { display: flex; flex-wrap: wrap; gap: 7px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px 7px; border: 1px solid rgba(111, 85, 50, .55); border-radius: 999px; background: rgba(255, 248, 228, .4); color: var(--text-ink); font: 600 15.5px/1 var(--font-body); cursor: pointer; transition: background .25s, border-color .25s, transform .3s var(--ease); }
.chip::before { content: ""; width: 6px; height: 6px; transform: rotate(45deg); background: var(--gold); }
.chip:hover, .chip:focus-visible { background: var(--leather); color: var(--gold-hi); border-color: var(--gold); transform: translateY(-2px); outline: none; }
.pager { display: flex; gap: 8px; padding: 12px 14px 14px; border-top: 1px solid rgba(111, 85, 50, .3); }
.pager button { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 0; padding: 10px 8px; border: 1px solid var(--gold); border-radius: 3px; background: var(--leather); color: var(--parchment); font: 700 15px/1 var(--font-display); letter-spacing: .06em; cursor: pointer; transition: color .25s, background .25s; }
.pager button span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  background: radial-gradient(circle, rgba(255, 214, 140, .62) 0, rgba(255, 170, 70, .3) 22%, rgba(255, 140, 40, .08) 48%, transparent 68%);

.qtoggle { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; font: 600 15.5px var(--font-body); color: var(--text-ink); cursor: pointer; }
.qtoggle input { width: 17px; height: 17px; accent-color: #8e2f1c; }
#qlist-wrap { margin-top: 14px; transition: opacity .16s ease; }
.qlist { display: flex; flex-direction: column; gap: 10px; }
.quest { padding: 13px 15px 12px; border: 1px solid rgba(111, 85, 50, .32); border-radius: 4px; background: rgba(255, 248, 228, .42); transition: box-shadow .5s, background .5s; }
.quest.busy { background: rgba(120, 95, 60, .1); }
.quest.busy header b, .quest.busy > p { opacity: .72; }
.quest.flash { box-shadow: 0 0 0 3px #8e2f1c, 0 6px 22px rgba(142, 47, 28, .3); background: rgba(255, 248, 228, .8); }
.quest header { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.quest header > div { min-width: 0; }
.quest header b { display: block; font: 700 21px/1.12 var(--font-display); }
.qg { display: inline-block; margin: 5px 6px 0 0; padding: 2px 8px 3px; border-radius: 3px; background: rgba(111, 85, 50, .14); font-size: 13px; font-weight: 700; color: var(--text-muted); }
.qtag { background: rgba(142, 47, 28, .12); color: #8e2f1c; }
.qbusy, .qfree, .qdone { flex: none; display: inline-flex; align-items: center; gap: 5px; padding: 4px 9px 5px; border-radius: 999px; font: 700 13px/1 var(--font-body); white-space: nowrap; }
.qbusy { background: #8e2f1c; color: #f6e7c2; }
.qbusy svg { width: 13px; height: 13px; fill: none; stroke: currentColor; stroke-width: 2.2; }
.qfree { border: 1px solid #4f6a3a; color: #3f5a2c; }
.qdone { background: var(--leather); color: var(--gold-hi); }
.quest > p { margin: 9px 0 0; font-size: 17px; line-height: 1.48; }
.qend { padding: 8px 11px; border-left: 2px solid var(--gold); background: rgba(255, 248, 228, .45); }
.qend span { font-weight: 700; color: #8e2f1c; }
.qm { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 10px 0 0; font-size: 15.5px; }
.qm dt { font: 700 12px/1.6 var(--font-display); letter-spacing: .1em; text-transform: uppercase; color: var(--text-muted); }
.qm dd { margin: 0; min-width: 0; }
.qfoot { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 6px 10px; margin-top: 6px; }
.qfoot .meter { margin: 6px 0 0; }
.qmap { display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px; border: 1px solid rgba(111, 85, 50, .5); border-radius: 999px; background: transparent; color: var(--text-ink); font: 600 14.5px/1 var(--font-body); cursor: pointer; transition: background .25s, color .25s; }
.qmap svg { width: 16px; height: 16px; fill: none; stroke: #8e2f1c; stroke-width: 1.8; }
.qmap:hover, .qmap:focus-visible { background: var(--leather); color: var(--gold-hi); outline: none; }
.qmap:hover svg { stroke: var(--gold-hi); }
.qrow.busy .to { opacity: .65; }
.qrow.busy .tm { color: var(--text-muted); }

/* Shorter screens: tighter menu */
@media (min-width: 761px) and (max-height: 780px) {
  #menu { gap: 7px; }
  .mbtn { padding-top: 9px; padding-bottom: 9px; }
  #menu .zoombar .mbtn { height: 40px; }
}
@media (min-width: 761px) and (max-height: 660px) { .zoombar { display: none !important; } }

@media (max-width: 760px) {
  .lore-more { display: none !important; }
  .zoombar { display: flex !important; position: fixed; left: max(12px, env(safe-area-inset-left, 0px)); bottom: max(14px, env(safe-area-inset-bottom, 0px)); margin: 0; z-index: 20; }
  #b-zin, #b-zout { display: none !important; }
  #menu .zoombar .nightsw { width: 52px; height: 36px; }
  .quest header b { font-size: 19px; }
}

/* ---------- Phones / narrow ---------- */
@media (max-width: 760px) {
  #menu { flex-direction: row; gap: 8px; width: auto; bottom: auto; right: max(12px, env(safe-area-inset-right, 0px)); left: max(12px, env(safe-area-inset-left, 0px)); top: max(12px, env(safe-area-inset-top, 0px)); }
  .zoombar { display: none; }
  #b-fold { display: none; }
  body.fold #menu, body.fold.peek #menu { width: auto; }
  #menu { gap: 6px; }
  .crest { order: 9; margin-left: auto; padding: 0 10px; height: 42px; animation-delay: .5s; }
  .crest-t { display: none; }
  .clock { display: grid; grid-template-columns: auto auto; align-items: center; column-gap: 7px; row-gap: 2px; min-width: 0; padding: 0; border: 0; text-align: left; }
  .clock .sky { grid-row: span 2; width: 20px; height: 20px; }
  .clock .season { font-size: 9.5px; align-self: end; }
  .clock .date { font-size: 13px; align-self: start; }
  .date-full { display: none; }
  .mini { display: none; }
  .date-short { display: inline; }
  #panel.wide { width: auto; }
  .tabs { margin-top: 0; }
  .tab { font-size: 14px; }
  .zoombar .mbtn { width: 42px; }
  .crest-t, .clock { width: auto; }
  .crest { height: 42px; }
  .clock { grid-template-rows: auto auto; grid-template-columns: auto auto; width: auto; row-gap: 2px; }
  .clock .sky { grid-row: 1 / 3; grid-column: 1; } .clock .season, .clock .date { grid-column: 2; grid-row: auto; justify-self: start; }
  .mbtn { width: 42px; height: 42px; padding: 0; justify-content: center; transform: translateY(-16px); }
  .mbtn:hover, .mbtn:focus-visible, .mbtn:active { translate: 0 0; }
  .mbtn .t { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .mbtn[aria-pressed="true"]::after, .mbtn[aria-expanded="true"]::after { right: auto; left: 50%; top: auto; bottom: -5px; margin: 0 0 0 -3.5px; }
  #flyout { left: max(12px, env(safe-area-inset-left, 0px)); right: max(12px, env(safe-area-inset-right, 0px)); top: calc(max(12px, env(safe-area-inset-top, 0px)) + 54px); width: auto; max-height: 62%; transform: translateY(-12px) scale(.98); transform-origin: top center; }
  #tip { display: none; }
  #panel { top: auto; left: 0; width: auto; height: min(66%, 620px); padding: 0 max(6px, env(safe-area-inset-right, 0px)) 0 max(6px, env(safe-area-inset-left, 0px)); transform: translateY(105%); }
  .sheet { border-bottom: 0; border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px); box-shadow: inset 0 0 0 5px var(--parchment), inset 0 0 0 6px rgba(111, 85, 50, .4), 0 -14px 40px var(--shadow); }
  .grab { display: block; flex: none; height: 26px; touch-action: none; cursor: grab; position: relative; }
  .grab::after { content: ""; position: absolute; left: 50%; top: 11px; width: 46px; height: 5px; margin-left: -23px; border-radius: 3px; background: var(--text-muted); opacity: .55; }
  .hero { height: 120px; margin-top: 0; touch-action: none; }
  .content { padding: 14px 18px 18px; }
  .content h2 { font-size: 28px; }
  .desc p { font-size: 17px; }
  .close { top: 30px; right: 16px; width: 36px; height: 36px; }
  .pager { padding: 10px 10px 12px; }
  .pager button { font-size: 14px; padding: 11px 6px; }
}
@media (max-width: 760px) and (max-height: 520px) {
  #panel { height: 86%; }
  .hero { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; transition-duration: .01ms !important; transition-delay: 0s !important; }
}

<body>
<div id="stage" tabindex="0" aria-label="Карта. Перетаскивайте для перемещения, колесо или щипок для масштаба.">
  <div id="map">
    <img alt="Карта земель" width="2576" height="1635" draggable="false" decoding="async">
    <svg id="arrows" aria-hidden="true"></svg>
  </div>
</div>
<div class="vignette"></div>
<div id="tip" role="tooltip"></div>

<nav id="menu" aria-label="Меню карты">
  <button id="b-fold" type="button" aria-label="Свернуть меню" aria-expanded="true"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
  <div class="crest">

    <div class="clock" id="clock" role="img"><svg class="sky" viewBox="0 0 24 24"></svg><span class="mini"><b class="mini-d"></b><span class="mini-m"></span></span><span class="season"></span><span class="date"><span class="date-full"></span><span class="date-short"></span></span></div>
  </div>
  <button class="mbtn" style="--i:0" id="b-places" type="button" aria-expanded="false" aria-controls="flyout">
    <svg viewBox="0 0 24 24"><path d="M4 20V9l4-3 4 3v11M12 20V5l4-2 4 2v15M2 20h20"/><path d="M7 13h2M15 9h2M15 13h2"/></svg><span class="t">Места</span></button>
  <button class="mbtn" style="--i:2" id="b-power" type="button" aria-pressed="false">
    <svg viewBox="0 0 24 24"><path d="M6 21V3M6 4h11l-2.5 4L17 12H6"/></svg><span class="t">Власть</span></button>
  <button class="mbtn" style="--i:3" id="b-quests" type="button" aria-pressed="false">

  <button class="mbtn lore-main" style="--i:4" data-lore="mir" type="button" aria-pressed="false">

  <div class="zoombar">
    <button class="mbtn nightsw" style="--i:4" id="b-night" type="button" aria-pressed="true" aria-label="Ночь на карте" title="Ночь на карте: включена"><span class="sw"><span class="knob"><svg viewBox="0 0 24 24"><path d="M15.8 3.6a8.6 8.6 0 1 0 4.6 14.6A7.2 7.2 0 0 1 15.8 3.6z"/></svg></span></span></button>

<script>
/* =====================================================================
   ДАННЫЕ КАРТЫ ИМПЕРИИ ВЕЛАРИС
   spots: зоны клика [x, y, ширина, высота] в % от картинки (их может быть несколько)
   f:     точка, на которую наводится камера [x, y] в %
   g:     группа в списке — city | land
   kind, motto, desc можно оставить пустыми — карточка покажет заглушку
   order: присутствие Ордена [0–4, подпись]
   ===================================================================== */
const BASE_NOTE = "В каждом городе есть таверна, лекарь, рыночная улочка, жилой квартал и другие обычные места. Они не прописаны отдельно: если понадобится, мастер игры опишет нужное здание или пришлёт фото или арт.";

const PLACES = [
  { id: "verkhniy-predel", name: "Верхний Предел", kind: "Столица империи", g: "city",
    spots: [[47.25, 14.2, 11, 8.8]], f: [53, 17.7],
    motto: "Город власти и смерти, где выживают только сильные или хитрые.",
    desc: ["Столица империи, раскинувшаяся на скале и защищённая тремя кольцами стен. В центре возвышается Императорский дворец из белого камня, а внизу, у подножия, кипит жизнь Нижнего предела — самого опасного района города.",
           "Главная площадь, Костровая, ежедневно принимает казни магов, а воздух пропитан дымом и страхом. Орден здесь всемогущ, и каждый шаг отслеживается доносчиками."],
    facts: [["Власть", "Император Кассель, фактически — дом Лимерия"], ["Главное", "Императорский дворец, Костровая площадь, Нижний предел"]],
    order: [4, "всемогущ"],
    rule: "Формально власть принадлежит Императору Касселю и его приближённым. Реальным управлением городом занимается дом Лимерия — старая аристократическая семья, которая сохранила влияние благодаря связям при дворе. Они следят за порядком, налогами и лояльностью знати, но каждый их шаг контролируется людьми Императора. Столица — это город, где никто не правит по-настоящему, потому что за каждым стоит кто-то более могущественный." },

  { id: "gniloy-udel", name: "Гнилой Удел", kind: "Единственный порт империи", g: "city",
    spots: [[40.75, 29.2, 9.25, 7.9]], f: [45.5, 32.3],
    motto: "Город, где можно купить всё, кроме безопасности.",
    desc: ["Единственный порт империи, построенный на сваях среди болот, где вместо улиц — каналы, а вместо колёс — лодки. Город воняет рыбой, гнилью и отчаянием, но именно сюда стекаются товары, слухи и контрабанда из дальних земель.",
           "Орден здесь почти не появляется, а портом правят контрабандисты и скупщики краденого. По ночам из воды выползают обескровленные, утаскивая замешкавшихся, поэтому жители не ходят у воды после заката."],
    facts: [["Власть", "дом Спенсеров, глава — Джорах Спенсер"], ["Опасность", "после заката обескровленные выходят из воды"]],
    order: [1, "почти не появляется"],
    rule: "Городом правит дом Спенсеров. Глава семьи — Джорах Спенсер, старый и уставший человек. Орден готовит нового управленца для города, но пока не торопится — Спенсеры надёжно удерживают власть, а их связи с инквизицией крепки. Гнилой удел остаётся важным портом, и Орден не хочет терять контроль над ним." },

  { id: "tenegrad", name: "Тенеград", kind: "Город в тумане", g: "city",
    spots: [[41.5, 56.3, 9.5, 9.1]], f: [46.5, 59.9],
    motto: "Город-призрак, медленно умирающий в собственной дымке.",
    desc: ["Город, погружённый в серый туман, который поднимается от реки и не рассеивается даже днём. Половина кварталов стоит пустыми, а те, кто остался, прячутся в домах, боясь того, что может скрываться в дымке.",
           "Туман приносит видения — путники видят мёртвых родственников, которые манят их в глубину, и многие не возвращаются. Торговля здесь идёт только ночью, а монету здесь ценят больше, чем жизнь.",
           "Скверна начала своё распространение именно здесь."],
    facts: [["Власть", "семья Верн, с согласия Императора"], ["Союзники", "«Тихая длань»"], ["Торговля", "только ночью"]],
    order: [1, "почти не присутствует"],
    rule: "В городе шум. Власть перешла к семье Верн с согласия самого Императора — слишком много негативной активности, которую старые правители не могли сдержать. Семья Верн активно сотрудничает с «Тихой дланью», и их влияние растёт. Орден здесь почти не присутствует — слишком много старожилов, которые помнят времена до прихода Касселя и не терпят чужаков. Тенеград становится всё более независимым, и это тревожит Императора." },

  { id: "epira", name: "Эпира", kind: "Город знаний", g: "city",
    spots: [[66.25, 32.7, 5.75, 8.3]], f: [69.25, 35.9],
    motto: "Город тех, кто ищет правду, даже если за это сжигают.",
    desc: ["Город знаний, где сохранились старейшие университеты и библиотеки империи, а учёные продолжают искать ответы на вопросы о скверне. Главная библиотека — башня в восемь ярусов, где на верхних этажах хранятся запрещённые Орденом книги, доступ к которым закрыт для всех, кроме избранных.",
           "Здесь лечат скверну травами и молитвами, а под городом, по слухам, находятся подземные хранилища с записями о первых днях эпидемии. Эпира тиха и сосредоточена, здесь не шумят и не кричат — потому что каждый может оказаться доносчиком."],
    facts: [["Власть", "Совет мудрецов — пять старейшин"], ["В совете", "Кассандра Валенстер, 25 лет"], ["Порядок", "главный инквизитор Корвин и его спецотряд"], ["Главное", "библиотека-башня в восемь ярусов"]],
    order: [2, "следит за порядком"],
    rule: "Городом правит Совет мудрецов — пять старейшин, которые управляли Эпирой ещё до прихода Касселя. Шестого члена никогда не было, и традиции здесь чтят. Однако среди них выделяется Кассандра Валенстер — 25-летняя девушка, самая молодая представительница совета. Ей доверена проверка характеристик артефактов, которые создаются в Эпире. Остальные члены совета — возрастные люди, и их власть держится на знаниях и уважении, а не на силе. В городе также присутствует главный инквизитор Корвин со своим спецотрядом, но его роль в Эпире скорее правоохранительная — он следит за порядком, а не за магами." },

  { id: "torgovyy-forpost", name: "Торговый Форпост", kind: "Город на перекрёстке", g: "city",
    spots: [[70, 38.6, 12.25, 7.5]], f: [76, 41.4],
    motto: "Единственное место, где можно исчезнуть в толпе, если тебя ищут.",
    desc: ["Торговый форпост — город на перекрёстке дорог, где встречаются купцы, авантюристы и беглецы со всех концов Велариса. Здесь нет ни дворцов, ни университетов — только рынок, где можно купить и продать что угодно, и никто не задаёт лишних вопросов.",
           "Город живёт торговлей, и его главная достопримечательность — таверна «Три факела», где собираются наёмники, ищут работу и продают информацию. В Ночном ряду после заката торгуют запрещёнными товарами, а под городом, по слухам, есть сеть подземных ходов, ведущих в другие города.",

const pts = new Map();

  if (pts.size === 2) hadPinch = true;
  if (pts.size === 1) { start = { x: e.clientX, y: e.clientY, tx: tgt.x, ty: tgt.y, id: e.pointerId }; samples = []; }
  if (pts.size === 2) {

    desc: ["Для народа «Усопшие Души» берут на себя всё, что связано со смертью: похороны по любым обрядам, отпевания, бальзамирование. В их лавках можно купить всё — от гробовых гвоздей, похоронных свечей и горючих масел до обезболивающих трав, амулетов и украшений из костей казнённых преступников. В филиалах работают опытные палачи и костоправы.",

function fitPlaces(ids, extra = 0) {
  const pts = ids.filter(id => byId[id]).map(id => byId[id].f);
  if (!pts.length) return;
  const xs = pts.map(p => p[0] / 100 * W), ys = pts.map(p => p[1] / 100 * H);
  const x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
  const panelOpen = panel.classList.contains("open"), narrow = isNarrow();
  const barH = 0;
  const left = narrow ? 0 : menuEdge(), right = panelOpen && !narrow ? panel.offsetWidth + 10 : 0;
  const top = narrow ? 64 : 0, bottom = Math.max(narrow && panelOpen ? panel.offsetHeight : 0, barH);
  const aw = Math.max(120, innerWidth - left - right), ah = Math.max(120, innerHeight - top - bottom);
  const padX = 300 + extra, padY = 260 + extra;
  const s = clamp(Math.min(aw / (x1 - x0 + padX), ah / (y1 - y0 + padY)), minS(), maxS() * .6);
  tgt.s = s; tgt.x = left + aw / 2 - (x0 + x1) / 2 * s; tgt.y = top + ah / 2 - (y0 + y1) / 2 * s;
  ease = .075; go();
}

    `<div class="qcontact"><a class="qbtn" href="${QUEST_CONTACT.url}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16v11H8l-4 4z"/></svg>Написать Моргане</a><span class="qurl">${esc(QUEST_CONTACT.url.replace("https://", ""))}</span></div>`,
    `<div class="rule"></div>`,
    `<div class="qfilters" role="tablist">${[["all-groups", "Все"], ...QUEST_GROUPS].map(([g, n]) => `<button type="button" class="qf" data-qf="${g}" aria-pressed="${questFilter === g}">${esc(n)}<span>${count(g)}</span></button>`).join("")}<button type="button" class="qf" data-qf="archive" aria-pressed="${questFilter === "archive"}">Архив<span>${QUEST_ARCHIVE.length}</span></button></div>
     <label class="qtoggle"><input type="checkbox" id="q-free" ${questFree ? "checked" : ""}> Только свободные</label>`,
    `<div id="qlist-wrap">${questsListHTML()}</div>`
  ]);
}
function refreshQuestList() {
  const wrap = $("#qlist-wrap"); if (!wrap) return;
  content.querySelectorAll("[data-qf]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.qf === questFilter)));
  wrap.style.opacity = 0;
  setTimeout(() => {
    wrap.innerHTML = questsListHTML(); wrap.style.opacity = 1;
    requestAnimationFrame(() => requestAnimationFrame(() => wrap.querySelectorAll('.pips i[data-on="1"]').forEach(i => i.classList.add("on"))));
  }, 160);
}
function showQuests(focusId) {
  current = null; lore = null; view = "quests"; closeFly(); hideTip();
  if (focusId) { questFilter = "all-groups"; questFree = false; }
  panel.classList.add("wide"); tabs.hidden = true; markUI();
  swapTo(questsHTML(), [58, 50, 1]);
  $(".pager").hidden = true;
  requestAnimationFrame(() => lookAt(62, 50, homeS(), true));
  setHash("kvesty");
  if (focusId) setTimeout(() => {
    const el = document.getElementById(focusId); if (!el) return;
    el.scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" });
    el.classList.add("flash"); setTimeout(() => el.classList.remove("flash"), 2200);
  }, 520);
}
function questBlock(p) {
  const qs = QUESTS.filter(q => q.places.includes(p.id));
  if (!qs.length) return "";
  return `<h3>Квесты здесь</h3><div class="routes">${qs.map(q => `<button class="route qrow${q.busy ? " busy" : ""}" type="button" data-quest="${q.id}"><span class="to">${esc(q.n)}</span><span class="tm">${q.busy ? "занят" : "свободен"}</span><span class="rn">${esc(groupName[q.g])} · ${esc(q.loc)}</span></button>`).join("")}</div>`;
}
function pingPlaces(ids) {
  ids = ids.filter(id => byId[id]);
  if (!ids.length) return;
  if (ids.length === 1) {
    const p = byId[ids[0]];
    const availW = isNarrow() ? innerWidth : innerWidth - panel.offsetWidth - menuEdge();
    lookAt(p.f[0], p.f[1], Math.max(minS() * 1.15, availW / (W * .42)), true);
  } else fitPlaces(ids);
  document.querySelectorAll(".spot").forEach(s => {
    if (!ids.includes(s.dataset.id)) return;
    s.classList.remove("ping"); void s.offsetWidth; s.classList.add("ping");
    setTimeout(() => s.classList.remove("ping"), 3200);
  });
}

/* Panel clicks for the new views (runs before the generic handler) */
panel.addEventListener("click", e => {
  const ft = e.target.closest("[data-fac-toggle]");
  if (ft) { e.stopImmediatePropagation(); const id = ft.dataset.facToggle, sec = content.querySelector(`.fac[data-fac="${id}"]`); highlightFaction(sec && sec.classList.contains("open") ? null : id); return; }
  const fg = e.target.closest("[data-fac-go]");
  if (fg) { e.stopImmediatePropagation(); showPower(); setTimeout(() => { highlightFaction(fg.dataset.facGo); const s = content.querySelector(`.fac[data-fac="${fg.dataset.facGo}"]`); s && s.scrollIntoView({ behavior: "smooth", block: "start" }); }, 420); return; }
  const lg = e.target.closest("[data-lore-go]"); if (lg) { e.stopImmediatePropagation(); showLore(lg.dataset.loreGo); return; }
  const qf = e.target.closest("[data-qf]"); if (qf) { e.stopImmediatePropagation(); questFilter = qf.dataset.qf; refreshQuestList(); return; }
  const pg = e.target.closest("[data-ping]"); if (pg) { e.stopImmediatePropagation(); pingPlaces(pg.dataset.ping.split(" ")); return; }
  const qr = e.target.closest("[data-quest]"); if (qr) { e.stopImmediatePropagation(); showQuests(qr.dataset.quest); return; }
}, true);
panel.addEventListener("change", e => {
  if (e.target.id === "q-free") {
    questFree = e.target.checked;
    content.querySelectorAll("[data-qf]").forEach(b => {
      const g = b.dataset.qf; if (g === "archive") return;
      b.querySelector("span").textContent = QUESTS.filter(q => (g === "all-groups" || q.g === g) && (!questFree || !q.busy)).length;
    });
    refreshQuestList();
  }
});

  const [cx, cy] = visibleCenter(), fog = /fog|туман/i.test(key);
  const base = from ? JSON.parse(JSON.stringify(from.cfg)) : { box: { w: .18, h: .14 }, size: fog ? .13 : .11, speed: fog ? .8 : 1, opacity: fog ? .65 : undefined };
  const b = base.box, c = { src: key, kind: from ? (from.fog ? "fog" : "cloud") : (fog ? "fog" : "cloud"), size: base.size, speed: base.speed, opacity: base.opacity, flip: base.flip,
    box: from ? { x: clamp(b.x + .02, 0, 1 - b.w), y: clamp(b.y + .02, 0, 1 - b.h), w: b.w, h: b.h } : { x: clamp(cx - b.w / 2, 0, 1 - b.w), y: clamp(cy - b.h / 2, 0, 1 - b.h), w: b.w, h: b.h },
    seed: Math.floor(Math.random() * 1e6) };
  Object.keys(c).forEach(k => c[k] === undefined && delete c[k]);
  const it = addSkyItem(c); edSelect(it); saveDraft(); edStatus();
}

edPanel.addEventListener("click", e => {
  const t = e.target.closest("button"); if (!t) return;
  if (t.id === "se-exit") { try { history.replaceState(null, "", location.pathname + location.search); } catch (_) {} setEditor(false); return; }
  if (t.dataset.add) return edAdd(t.dataset.add);
  if (t.dataset.kind && edSel) { if ((t.dataset.kind === "fog") !== edSel.fog) { const n = edReplace(edSel, { kind: t.dataset.kind }); edSelect(n); saveDraft(); } return; }
  const act = t.dataset.act;
  if (act && edSel) {
    if (act === "flip") { edSel.cfg.flip = !edSel.cfg.flip; t.setAttribute("aria-pressed", String(edSel.cfg.flip)); }
    if (act === "seed") { edSelect(edReplace(edSel, { seed: Math.floor(Math.random() * 1e6) })); }
    if (act === "dup") { edAdd(edSel.key, edSel); return; }
    if (act === "del") { sky.remove(edSel); edSel = null; edRenderBoxes(); edRenderSel(); edStatus(); }
    saveDraft(); return;
  }
  if (t.id === "se-copy") {
    const txt = skyConfigText(), ta = document.getElementById("se-out"); ta.value = txt;
    const fail = () => { ta.focus(); ta.select(); edToast("Выделил настройки — нажмите Ctrl+C."); };
    try { navigator.clipboard.writeText(txt).then(() => edToast("Настройки скопированы."), fail); } catch (_) { fail(); }
    return;
  }
  if (t.id === "se-reset") {
    if (t.dataset.armed !== "1") { t.dataset.armed = "1"; t.textContent = "Точно? Нажмите ещё раз"; setTimeout(() => { t.dataset.armed = ""; t.textContent = "Вернуть опубликованные облака"; }, 3500); return; }
    try { localStorage.removeItem(SKY_KEY); } catch (_) {}
    skyDraftOn = false; loadSky(SKY_CONFIG); edSel = null; edPalette(); edRenderBoxes(); edRenderSel(); edStatus(); saveDraftText();
    t.dataset.armed = ""; t.textContent = "Вернуть опубликованные облака"; edToast("Вернул облака, как на сайте сейчас.");
    return;
  }
  if (t.id === "se-dl") downloadIndex();
});
function saveDraftText() { const ta = document.getElementById("se-out"); if (ta) ta.value = skyConfigText(); }
edPanel.addEventListener("input", e => {
  if (!edSel) return;
  const v = parseFloat(e.target.value), out = e.target.parentElement.querySelector("output");
  if (e.target.id === "se-size") { edSel.cfg.size = v; sky._size(edSel); out.textContent = Math.round(v * 100) + "%"; }
  if (e.target.id === "se-speed") { edSel.cfg.speed = v; out.textContent = v.toFixed(1); }
  if (e.target.id === "se-op") { edSel.cfg.opacity = v; out.textContent = Math.round(v * 100) + "%"; }
  saveDraft();
});
edPanel.addEventListener("change", e => {
  if (e.target.id === "se-boxes") { edBoxes = e.target.checked; edLayer.classList.toggle("nob", !edBoxes); }
  if (e.target.id === "se-pause") { e.target.checked ? sky.pause() : sky.play(); }
  if (e.target.id === "se-file") {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    if (f.size > 1.5e6) { edToast("Картинка больше 1,5 МБ — уменьшите её, чтобы карта не тормозила."); return; }
    const rd = new FileReader();
    rd.onload = () => { const key = "custom/" + f.name.replace(/[^\wа-яё.\-]+/gi, "_"); SKY_IMAGES[key] = rd.result; edPalette(); edAdd(key); edToast("Картинка добавлена на карту и в список."); };
    rd.readAsDataURL(f); e.target.value = "";
  }
});

/* Dragging boxes (map space) */
let edDrag = null;
edLayer.addEventListener("pointerdown", e => {
  const box = e.target.closest(".sbox"); if (!box) return;
  e.stopPropagation(); e.preventDefault();
  const it = sky.items[+box.dataset.i]; if (!it) return;
  if (it !== edSel) edSelect(it);
  const b = it.cfg.box;
  edDrag = { it, resize: !!e.target.dataset.h, x0: e.clientX, y0: e.clientY, b0: Object.assign({}, b), id: e.pointerId };
}, true);
addEventListener("pointermove", e => {
  if (!edDrag || e.pointerId !== edDrag.id) return;
  const dx = (e.clientX - edDrag.x0) / cur.s / W, dy = (e.clientY - edDrag.y0) / cur.s / H, b = edDrag.it.cfg.box, b0 = edDrag.b0;
  if (edDrag.resize) { b.w = clamp(b0.w + dx, .02, 1.05 - b0.x); b.h = clamp(b0.h + dy, .02, 1.05 - b0.y); }
  else { b.x = clamp(b0.x + dx, -.05, 1.05 - b0.w); b.y = clamp(b0.y + dy, -.05, 1.05 - b0.h); }
  const el = edLayer.querySelector(".sbox.sel");
  if (el) Object.assign(el.style, { left: b.x * 100 + "%", top: b.y * 100 + "%", width: b.w * 100 + "%", height: b.h * 100 + "%" });
});
const edEnd = () => { if (edDrag) { edDrag = null; saveDraft(); } };
addEventListener("pointerup", edEnd); addEventListener("pointercancel", edEnd);
addEventListener("keydown", e => {
  if (!edOn || !edSel || /input|textarea/i.test(document.activeElement.tagName)) return;
  if (e.key === "Delete" || e.key === "Backspace") { sky.remove(edSel); edSel = null; edRenderBoxes(); edRenderSel(); edStatus(); saveDraft(); e.preventDefault(); }
});

async function downloadIndex() {
  try {
    if (window.top !== window.self) throw 0;   /* в превью и внутри ВК скачивание запрещено — только на самом сайте */
    const r = await fetch(location.pathname, { cache: "no-store" });
    if (!r.ok) throw 0;
    let html = await r.text();
    if (!html.includes("/*SKY_CONFIG_START*/")) throw 0;
    const used = new Set(sky.items.map(it => it.key)), imgs = {};
    Object.keys(SKY_IMAGES).forEach(k => { if (!k.startsWith("custom/") || used.has(k)) imgs[k] = SKY_IMAGES[k]; });
    html = html.replace(/\/\*SKY_CONFIG_START\*\/[\s\S]*?\/\*SKY_CONFIG_END\*\//, () => "/*SKY_CONFIG_START*/" + skyConfigText() + "/*SKY_CONFIG_END*/")
               .replace(/\/\*SKY_IMAGES_START\*\/[\s\S]*?\/\*SKY_IMAGES_END\*\//, () => "/*SKY_IMAGES_START*/" + JSON.stringify(imgs) + "/*SKY_IMAGES_END*/");
    const url = URL.createObjectURL(new Blob([html], { type: "text/html" }));
    const a = document.createElement("a"); a.href = url; a.download = "index.html"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    edToast("Готово: index.html скачан. Загрузите его на GitHub вместо старого.");
  } catch (e) {
    saveDraftText();
    edToast("Здесь скачать нельзя — это работает на сайте карты. Или нажмите «Скопировать настройки» и пришлите их.");
  }
}

function setEditor(on) {
  if (on && isNarrow()) { edToast("Редактор удобнее открыть на компьютере."); }
  edOn = on; edLayer.hidden = !on; edPanel.hidden = !on;
  document.body.classList.toggle("sky-editing", on);
  if (on) { closeFly(); if (panel.classList.contains("open")) closePanel(); fold(true); edPalette(); edRenderBoxes(); edRenderSel(); edStatus(); saveDraftText(); }
  else { sky.play(); edSel = null; }
}
const edCheckHash = () => setEditor(location.hash === "#redaktor");
addEventListener("hashchange", edCheckHash);
if (location.hash === "#redaktor") setTimeout(edCheckHash, 400);

let nightEnabled = true;
try { nightEnabled = localStorage.getItem("atlas-night") !== "off"; } catch (e) {}
const isNightNow = () => { const h = new Date().getHours(); return h < 6 || h >= 19; };
function applyNight() {
  const realNight = isNightNow(), night = nightEnabled && realNight;
  document.body.classList.toggle("night", night);
  const el = $("#clock");
  el.querySelector(".sky").innerHTML = realNight ? MOON : SUN;
  el.classList.toggle("night", realNight);
  const b = $("#b-night");
  b.setAttribute("aria-pressed", String(nightEnabled));
  b.title = nightEnabled ? "Ночь на карте: включена (с 19:00 до 6:00)" : "Ночь на карте: выключена";
}
$("#b-night").addEventListener("click", () => {
  nightEnabled = !nightEnabled;
  try { localStorage.setItem("atlas-night", nightEnabled ? "on" : "off"); } catch (e) {}
  applyNight();
});
applyNight(); setInterval(applyNight, 60000);

/* ---------- Menu buttons ---------- */
$("#b-power").addEventListener("click", () => {
  if (view === "power") closePanel();
  else showPower();
});
$("#b-quests").addEventListener("click", () => { if (view === "quests") closePanel(); else showQuests(); });

/* ---------- Intro ---------- */
function boot() {
  const fx = isNarrow() ? 66 : 58;
  tgt.s = homeS() * 1.12; tgt.x = innerWidth / 2 - fx / 100 * W * tgt.s; tgt.y = innerHeight / 2 - .5 * H * tgt.s;
  bound(tgt); Object.assign(cur, tgt); apply();
  map.classList.add("ready");
  const id = decodeURIComponent(location.hash.slice(1));
  setTimeout(() => byId[id] ? select(id) : loreById[id] ? showLore(id) : id === "kvesty" ? showQuests() : id === "vlast" ? showPower() : overview(), 250);
}
const img = map.querySelector("img");
if (touchDevice) map.style.willChange = "transform";
img.addEventListener("load", () => { hero.style.backgroundImage = `url("${img.currentSrc || img.src}")`; boot(); }, { once: true });
img.addEventListener("error", () => { if (!/\/map\.jpg(\?|$)/.test(img.src)) img.src = "map.jpg?v=" + MAP_VERSION; });
img.src = MAP_SRC;
</script>
