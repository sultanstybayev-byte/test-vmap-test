<style>:root{--gold:#c9a25a;--gold-hi:#f0d696;--ink:#efe3c8}*{box-sizing:border-box}html,body{margin:0;height:100%;background:#050304;color:var(--ink);overflow:hidden;font:500 20px/1.4 "Cormorant Garamond",Georgia,serif;-webkit-user-select:none;user-select:none}button{font:inherit;color:inherit}[hidden]{display:none !important}  :root{--fw:min(92vw,1120px,calc((100vh - 120px) * 1.5));--fh:calc(var(--fw) / 1.5);--ftop:calc(50% - var(--fh) / 2 - 10px)}@media (max-aspect-ratio:1/1){:root{--fw:calc(100vw - 20px);--fh:calc(var(--fw) / 1.33);--ftop:calc(38% - var(--fh) / 2)}}body{background:radial-gradient(ellipse 80% 70% at 50% 45%,#170d09,#050304 75%)}.film{position:fixed;top:var(--ftop);left:calc(50% - var(--fw) / 2);width:var(--fw);height:var(--fh);overflow:hidden;background:#050304;border-radius:2px;box-shadow:0 0 0 1px rgba(201,162,90,.55),0 0 0 5px #0b0705,0 0 0 6px rgba(201,162,90,.28),0 18px 60px rgba(0,0,0,.85),0 0 90px rgba(255,140,60,.07)}.film::after{content:"";position:absolute;inset:7px;z-index:4;pointer-events:none;border:1px solid rgba(240,214,150,.16)}.shot{position:absolute;inset:0;overflow:hidden}.shot .pic{position:absolute;inset:-1%;background:center / cover no-repeat;will-change:transform;transform-origin:var(--fo,50% 50%)} .shot .color{filter:saturate(.92) contrast(1.04) brightness(.95)}@keyframes bloom{to{opacity:1}}.shot.first{opacity:0;animation:fadeIn 2.2s ease forwards}.burn{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}@keyframes fadeOut{to{opacity:0}}.shot.on .pic,.shot.out .pic{animation:kb var(--dur,10s) linear forwards}@keyframes kb{from{transform:scale(var(--s0,1))}to{transform:scale(var(--s1,1.06))}}.fx{position:absolute;inset:0;width:100%;height:100%;z-index:1;pointer-events:none}#fxL{mix-blend-mode:screen}body.paused *,body.paused *::before,body.paused *::after{animation-play-state:paused !important}.grain{position:absolute;inset:-50%;pointer-events:none;opacity:.13;mix-blend-mode:overlay;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>");animation:grain .9s steps(4) infinite}@keyframes grain{25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}.vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 45%,transparent 35%,rgba(5,3,4,.55) 70%,rgba(5,3,4,.95) 100%),linear-gradient(180deg,rgba(5,3,4,.35),transparent 22%,transparent 55%,rgba(5,3,4,.92))}#embers{position:fixed;inset:0;z-index:0;pointer-events:none} .shade{position:absolute;left:0;right:0;bottom:0;height:52%;z-index:2;pointer-events:none;background:linear-gradient(180deg,transparent,rgba(5,3,4,.45) 38%,rgba(5,3,4,.82) 78%,rgba(5,3,4,.9));transition:opacity 1s}body.title .shade{opacity:0}.say{position:absolute;left:50%;bottom:6%;z-index:5;width:calc(100% - 56px);transform:translateX(-50%);text-align:center}.say.big{bottom:42vh}.say.big p{font:700 clamp(28px,4.2vw,54px)/1.25 "Cormorant SC",Georgia,serif;font-style:normal;letter-spacing:.08em;color:#e8c98a;text-shadow:0 0 30px rgba(255,140,60,.5),0 2px 14px #000}.say p{margin:.25em 0;font:italic 500 clamp(21px,calc(var(--fw) * .032),36px)/1.35 "Cormorant Garamond",Georgia,serif;color:#f3e8cf;text-shadow:0 2px 14px #000,0 0 30px rgba(0,0,0,.9);text-wrap:balance}.say .w{display:inline-block;opacity:0;filter:blur(6px);transform:translateY(6px);animation:word .9s ease forwards;animation-delay:var(--d)}@keyframes word{to{opacity:1;filter:blur(0);transform:none}}.say.gone p{animation:sayOut 1s ease forwards}@keyframes sayOut{to{opacity:0;filter:blur(4px)}} .say .firewrap{filter:drop-shadow(0 0 5px rgba(255,140,40,.75)) drop-shadow(0 0 14px rgba(255,90,20,.4))}.say .w.fire{color:#ffc65a;text-shadow:none}@keyframes flame{from{background-position:0 0}to{background-position:0 100%}} .slam{position:absolute;inset:0 0 18% 0;z-index:5;display:grid;place-items:center;pointer-events:none}.slam b{font:700 clamp(38px,8vw,100px)/1 "Cormorant SC",Georgia,serif;letter-spacing:.16em;padding-left:.16em;color:#f6e2b4;text-shadow:0 0 26px rgba(200,30,18,.8),0 0 80px rgba(150,16,8,.6),0 4px 18px #000;opacity:0;transform:scale(1.45);filter:blur(12px);animation:slam .5s cubic-bezier(.15,.9,.3,1.15) forwards}@keyframes slam{55%{opacity:1;filter:blur(0)}to{opacity:1;transform:none;filter:blur(0)}}.slam.gone b{animation:sayOut 1s ease forwards;opacity:1;transform:none;filter:none} .film.shake>.shot,.film.shake>.fx,.film.shake>.slam{animation:shake .55s ease}@keyframes shake{12%{transform:translate(-6px,3px)}26%{transform:translate(5px,-4px)}42%{transform:translate(-3px,2px)}60%{transform:translate(2px,-1px)}80%{transform:translate(-1px,1px)}} .intro{position:absolute;inset:0;z-index:6;display:grid;place-items:center;background:radial-gradient(ellipse 45% 50% at 50% 50%,#130b07,#050304 70%);transition:opacity 1.3s ease}.intro.out{opacity:0}.intro svg{width:min(30%,200px);overflow:visible;stroke:var(--gold-hi);fill:none;stroke-width:1.1;filter:drop-shadow(0 0 6px rgba(240,200,130,.55)) drop-shadow(0 0 22px rgba(255,160,70,.25))}.intro .ln{stroke-dasharray:100;stroke-dashoffset:100;animation:draw 1.6s .2s cubic-bezier(.5,0,.3,1) forwards}.intro .l2{animation-delay:.6s}.intro .l3{animation-delay:1s}.intro .dash{opacity:0;transform-origin:32px 32px;animation:fadeIn 1s 1.1s ease forwards,spin 30s linear infinite;stroke:var(--gold)}.intro .star{fill:rgba(240,200,120,.0);stroke:none;animation:starFill 1.4s 1.5s ease forwards}@keyframes draw{to{stroke-dashoffset:0}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes starFill{to{fill:rgba(240,200,120,.32)}} .titlecard{position:fixed;inset:0;z-index:6;display:grid;place-items:center;text-align:center;pointer-events:none}.titlecard h1{margin:0;font:700 clamp(44px,9vw,120px)/1 "Cormorant SC",Georgia,serif;letter-spacing:.12em;color:var(--gold-hi);text-shadow:0 0 40px rgba(255,170,80,.45),0 4px 30px #000;opacity:0;filter:blur(14px);transform:scale(1.06);animation:title 3.4s ease forwards}.titlecard p{margin:14px 0 0;font:italic 500 clamp(18px,2.2vw,26px)/1.3 "Cormorant Garamond",serif;color:#d8c6a0;opacity:0;animation:fadeIn 2s 2s ease forwards}.titlecard .rule{width:min(420px,70vw);height:12px;margin:20px auto 0;opacity:0;animation:fadeIn 2s 1.6s ease forwards;background:radial-gradient(circle,var(--gold) 2.5px,transparent 3px) center / 12px 12px no-repeat,linear-gradient(var(--gold),var(--gold)) left center / calc(50% - 14px) 1px no-repeat,linear-gradient(var(--gold),var(--gold)) right center / calc(50% - 14px) 1px no-repeat}.titlecard .go{pointer-events:auto;margin-top:34px;opacity:0;animation:fadeIn 1.6s 3.2s ease forwards}@keyframes title{to{opacity:1;filter:blur(0);transform:none}}@keyframes fadeIn{to{opacity:1}} .finbg{position:absolute;inset:-8%;z-index:1;background:center 40% / cover no-repeat;filter:grayscale(.6) sepia(.35) blur(7px) brightness(.42) contrast(1.15);opacity:0;transform:scale(1.04);transition:opacity 3.4s ease,transform 16s linear}body.title .finbg{opacity:1;transform:scale(1)}.film::before{content:"";position:absolute;inset:0;z-index:4;background:#030202;opacity:0;pointer-events:none;transition:opacity 2.8s ease}.film.blackout::before{opacity:1} .btn{display:inline-flex;align-items:center;gap:8px;padding:12px 26px;border:1px solid var(--gold-hi);border-radius:3px;background:linear-gradient(180deg,#f1d79a,#c99a4e);color:#2a1a0c;font:700 19px/1 "Cormorant SC",Georgia,serif;letter-spacing:.08em;cursor:pointer}.btn.ghost{background:rgba(10,6,4,.55);color:var(--gold-hi);border-color:rgba(201,162,90,.6)}.hud{position:fixed;top:12px;right:12px;z-index:8;display:flex;gap:8px;opacity:.45;transition:opacity .3s}.hud:hover,.hud:focus-within{opacity:1}.hud button{padding:7px 12px;border:1px solid rgba(201,162,90,.55);border-radius:3px;background:rgba(10,6,4,.6);color:var(--gold-hi);font:700 13px/1 "Cormorant SC",Georgia,serif;letter-spacing:.08em;cursor:pointer}.hud button[aria-pressed="false"]{color:#8a7a62;text-decoration:line-through}.dots{position:fixed;left:50%;top:calc(var(--ftop) + var(--fh) + 16px);z-index:8;transform:translateX(-50%);display:flex;gap:6px}.dots i{width:6px;height:6px;border-radius:50%;background:rgba(240,214,150,.25);transition:background .4s,transform .4s}.dots i.on{background:var(--gold-hi);transform:scale(1.3)} .start{position:fixed;inset:0;z-index:10;display:grid;place-items:center;text-align:center;background:radial-gradient(ellipse at 50% 60%,#1a0e0a,#050304 70%)}.start .in{padding:20px}.start small{display:block;font:700 14px "Cormorant SC",serif;letter-spacing:.3em;color:var(--gold)}.start h2{margin:10px 0 26px;font:700 clamp(34px,6vw,64px)/1.05 "Cormorant SC",serif;color:var(--gold-hi);letter-spacing:.06em}.start p{margin:0 0 26px;font-style:italic;color:#b9a582}.start .row{display:flex;flex-direction:column;align-items:center;gap:12px;width:min(340px,86vw);margin:0 auto}.start .btn.wide{width:100%;justify-content:center;padding:15px 26px;font-size:21px}.start .btn.sub{padding:9px 22px;font-size:16px;opacity:.85}.mix{width:min(340px,86vw);margin:0 auto 24px;padding:14px 18px 6px;border:1px solid rgba(201,162,90,.35);border-radius:4px;background:rgba(10,6,4,.45);text-align:left}.mix b{display:block;margin-bottom:8px;font:700 13px "Cormorant SC",serif;letter-spacing:.2em;color:var(--gold);text-align:center}.mix label{display:grid;grid-template-columns:82px 1fr 34px;align-items:center;gap:10px;margin-bottom:10px;font-size:17px;color:#d8c6a0}.mix output{font-size:14px;color:#9c8a6c;text-align:right}.mix input[type=range]{width:100%;height:22px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;cursor:pointer}.mix input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:linear-gradient(90deg,var(--gold) var(--p,70%),rgba(201,162,90,.25) var(--p,70%))}.mix input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:rgba(201,162,90,.25)}.mix input[type=range]::-moz-range-progress{height:3px;background:var(--gold)}.mix input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;margin-top:-6.5px;border-radius:50%;border:1px solid var(--gold-hi);background:#2a1a0c;box-shadow:0 0 8px rgba(240,214,150,.4)}.mix input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;border:1px solid var(--gold-hi);background:#2a1a0c}.start .hint{margin-top:22px;font-size:15px;color:#7d6d58}@media (max-aspect-ratio:1/1){ .say{position:fixed;top:calc(var(--ftop) + var(--fh) + 22px);bottom:auto;width:calc(100vw - 28px)}.say p{font-size:22px;line-height:1.4}.shade{display:none}.dots{top:auto;bottom:calc(22px + env(safe-area-inset-bottom,0px))} .hud{top:auto;right:auto;left:50%;bottom:calc(46px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);gap:12px;opacity:.9}.hud button{min-height:44px;padding:12px 22px;font-size:16px;white-space:nowrap}}@media (prefers-reduced-motion:reduce){.shot .pic{animation:none !important}.grain{animation:none}}</style>

<body>
<canvas id="embers"></canvas>
<div class="film" id="film">
  <div class="vig" style="z-index:2"></div>
  <div class="grain" style="z-index:3"></div>
  <div class="finbg" id="finbg"></div>
  <div class="shade"></div>
  <div class="say" id="say"></div>
  <div class="titlecard" id="title" hidden><div><h1>Веларис</h1><div class="rule"></div><p>Тёмное фэнтези · позднее Средневековье</p><button type="button" class="btn go" id="go">Вступить на земли</button></div></div>
</div>
<div class="hud" id="hud" hidden>
  <button type="button" id="snd" aria-pressed="true" title="Музыка и звуки">Звук</button>
  <button type="button" id="skip">Пропустить ›</button>
</div>
<div class="dots" id="dots" hidden></div>
<div class="start" id="start">
  <div class="in">
    <small>Пролог</small>
    <h2>Империя Веларис</h2>
    <div class="mix" id="mix">
      <b>Звук</b>
      <label>Музыка <input type="range" id="volM" min="0" max="100" step="5"><output id="volMo"></output></label>
      <label>Эффекты <input type="range" id="volE" min="0" max="100" step="5"><output id="volEo"></output></label>
    </div>
    <div class="row"><button type="button" class="btn wide" id="play">Смотреть</button><button type="button" class="btn ghost sub" id="nope">Пропустить</button></div>
  </div>
</div>
<script>
/* =====================================================================
   ПРОЛОГ. Кадр = картинка + куда «едет» камера + слова рассказчика.
   x0/y0/s0 → x1/y1/s1 — откуда и куда плывёт камера; mx/my — где проступают чернила.
   ===================================================================== */
const SCENES = [
  { img: "prolog/preacher.webp", fo: "50% 24%", fx: "cathedral",
    say: ["Империю терзают распри.", "Смутное время, как вороньё, клюёт её бока."] },
  { img: "prolog/ghoul.webp", fo: "46% 22%",
    say: ["Скверна превращает людей в голодных тварей.", "Твоя кровь — их единственное желание."] },
  { img: "prolog/leshy.webp", fo: "62% 28%", fx: "fog",
    say: ["Но есть враг страшнее монстров…", { slam: "Инквизиция" }] },
  { img: "prolog/burning.webp", fo: "73% 34%", fx: "blaze", nofx: true,
    say: ["Ордену Пылающего Сердца плевать на монстров.", "Они видят ересь в каждом, кто пережил укус или поклоняется магии."] },
  { img: "prolog/bonfire.webp", fo: "53% 52%", fx: "bonfire", nofx: true, torch: true,
    say: ["Их кодекс прост: *«Огонь очищает»*.", "И они готовы сжечь полмира, чтобы доказать свою правоту."] },
  { img: "prolog/helgrad.webp", fo: "31% 32%", fx: "mist",
    say: ["Веларис — умирающий зверь.", "Он хрипит, истекает кровью на алтарях инквизиции и корчится в агонии от скверны."] },
  { img: "prolog/statue.webp", fo: "45% 28%", fx: "snow",
    say: ["Ты здесь — никто. И в то же время — всё.", "Присоединяйся, чтобы повернуть колесо судьбы Велариса."] }
];
const FIN_BG = "prolog/king.webp";
const $ = s => document.querySelector(s);
const IN_FRAME = (() => { try { return window.self !== window.top; } catch (_) { return true; } })();
const store = (k, v) => { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (_) {} };
let idx = -1, timer = 0, playing = false;
const QS = new URLSearchParams(location.search);
const VK_ID = QS.get("vk_user_id") || "";
const SEEN_KEY = "velaris-prolog-seen" + (VK_ID ? ":" + VK_ID : "");
const SKEY = "velaris-prolog-audio" + (VK_ID ? ":" + VK_ID : "");
const AUD = Object.assign({ m: 70, e: 70, on: true }, (() => { try { return JSON.parse(store(SKEY) || "{}"); } catch (_) { return {}; } })());
let SOUND = AUD.on !== false;
let bridgeP = null;
function vkBridge() {
  if (!VK_ID) return Promise.reject();
  if (bridgeP) return bridgeP;
  bridgeP = new Promise((res, rej) => {
    if (window.vkBridge) return res(window.vkBridge);
    const urls = ["https://unpkg.com/@vkontakte/vk-bridge@2.14.1/dist/browser.min.js", "https://cdn.jsdelivr.net/npm/@vkontakte/vk-bridge@2.14.1/dist/browser.min.js"]; let i = 0;
    const next = () => { if (i >= urls.length) return rej(); const sc = document.createElement("script"); sc.src = urls[i++]; sc.onload = () => window.vkBridge ? res(window.vkBridge) : next(); sc.onerror = next; document.head.appendChild(sc); };
    next();
  }).then(b => { b.send("VKWebAppInit").catch(() => {}); return b; });
  return bridgeP;
}
let vkSeq = 0; const vkWait = {};
addEventListener("message", e => { const d = e.data; if (d && d.velaris === "vkBridgeResult" && vkWait[d.seq]) { const w = vkWait[d.seq]; delete vkWait[d.seq]; d.ok ? w[0](d.res) : w[1](d.error); } });
function vkSend(method, params) {
  if (!VK_ID) return Promise.reject();
  if (!IN_FRAME) return vkBridge().then(b => b.send(method, params));
  return new Promise((res, rej) => { const seq = ++vkSeq; vkWait[seq] = [res, rej]; try { parent.postMessage({ velaris: "vkBridge", seq, method, params }, "*"); } catch (_) { rej(); } setTimeout(() => { if (vkWait[seq]) { delete vkWait[seq]; rej(); } }, 4000); });
}
let saveT = 0;
function saveAudio() {
  AUD.on = SOUND; const j = JSON.stringify(AUD); store(SKEY, j);
  clearTimeout(saveT); saveT = setTimeout(() => vkSend("VKWebAppStorageSet", { key: "prolog_audio", value: j }).catch(() => {}), 600);
}
vkSend("VKWebAppStorageGet", { keys: ["prolog_audio"] }).then(r => {
  const v = r && r.keys && r.keys[0] && r.keys[0].value; if (!v) return;
  Object.assign(AUD, JSON.parse(v)); SOUND = AUD.on !== false; store(SKEY, JSON.stringify(AUD)); syncMix(); applyVol();
}).catch(() => {});

const IMG = {}; SCENES.filter(s => s.img).map(s => s.img).concat(FIN_BG).forEach(src => { const i = new Image(); i.src = src; IMG[src] = i; });

const MUSIC = new Audio("prolog/music.mp3"); MUSIC.loop = true; MUSIC.volume = 0; MUSIC.ok = false; MUSIC.addEventListener("canplaythrough", () => MUSIC.ok = true, { once: true });
const sayText = x => typeof x === "string" ? x.replace(/\*/g, "") : x.slam;
function sceneDur(s) { return Math.max(7000, s.say.map(sayText).join(" ").length * 70 + 3200) + (s.say.some(x => x.slam) ? 3600 : 0); }
function show(i) {
  clearTimeout(timer);
  if (i >= SCENES.length) return finale();
  idx = i; const s = SCENES[i], film = $("#film");
  film.querySelectorAll(".intro").forEach(x => { x.classList.add("out"); setTimeout(() => x.remove(), 1400); });
  const old = film.querySelector(".shot.on");
  if (old) burnAway(old);
  const d = sceneDur(s), el = document.createElement("div");
  el.className = "shot" + (old ? "" : " first"); el.dataset.src = s.img;
  const v = { "--dur": (d + 3200) + "ms", "--fo": s.fo || "50% 50%", "--s0": 1, "--s1": 1.065 };
  Object.entries(v).forEach(([k, x]) => el.style.setProperty(k, x));
  el.innerHTML = s.img ? `<div class="pic color" style="background-image:url('${s.img}')"></div>` : "";
  film.insertBefore(el, film.firstChild);
  requestAnimationFrame(() => el.classList.add("on"));

  $("#say").classList.toggle("big", !s.img);
  sayLines(s.say);
  if (old) boom();
  torch(!!s.torch); FX.set(s.nofx ? null : s.fx); AMB.set(s.fx);
  [...document.querySelectorAll(".dots i")].forEach((d2, k) => d2.classList.toggle("on", k === i));
  later(() => show(i + 1), d);
}
function sayLines(lines) {
  const box = $("#say"), film = $("#film");
  box.classList.add("gone");
  film.querySelectorAll(".slam").forEach(x => { x.classList.add("gone"); setTimeout(() => x.remove(), 1000); });
  const my = idx;
  setTimeout(() => {
    if (idx !== my || idx >= SCENES.length) return; /* кадр уже сменили — старые слова не показываем */
    box.classList.remove("gone");
    let t = 900, slam = null, slamAt = 0, fireAt = -1;
    const html = lines.map(line => {
      if (typeof line !== "string") { slam = line.slam; slamAt = t + 900 + 2000; /* пауза в две секунды перед «Инквизицией» */ return ""; }
      const tok = []; let sp = false;
      line.split("*").forEach((seg, k) => seg.split(/(\s+)/).forEach(w => { if (!w) return; if (/^\s+$/.test(w)) { sp = true; return; } tok.push({ w, fire: k % 2 === 1, sp }); sp = false; }));
      let out = "", inFire = false;
      tok.forEach((o, n) => {
        if (o.fire && !inFire) { out += (o.sp && n ? " " : "") + '<span class="firewrap">'; inFire = true; if (fireAt < 0) fireAt = t; }
        else if (!o.fire && inFire) { out += "</span>"; inFire = false; if (o.sp) out += " "; }

}

function sfxSlam() {
  if (!AC) return; const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(58, t); o.frequency.exponentialRampToValueAtTime(30, t + 2.4);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.9, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + 2.8);
  o.connect(g); g.connect(busE); g.connect(AC.verbE); o.start(t); o.stop(t + 3);
  const s = AC.createBufferSource(), lp = AC.createBiquadFilter(), ng = AC.createGain(); s.buffer = AMB.noise("brown"); lp.type = "lowpass"; lp.frequency.value = 500;
  ng.gain.setValueAtTime(.9, t); ng.gain.exponentialRampToValueAtTime(.001, t + .9); s.connect(lp); lp.connect(ng); ng.connect(busE); ng.connect(AC.verbE); s.start(t, 0, 1);
}
function sfxIgnite() {
  if (!AC) return; const t = AC.currentTime, s = AC.createBufferSource(), bp = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = AMB.noise("pink"); bp.type = "bandpass"; bp.Q.value = .8; bp.frequency.setValueAtTime(280, t); bp.frequency.exponentialRampToValueAtTime(2400, t + .55); bp.frequency.exponentialRampToValueAtTime(900, t + 1.4);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.9, t + .2); g.gain.exponentialRampToValueAtTime(.001, t + 1.6);
  s.connect(bp); bp.connect(g); g.connect(busE); g.connect(AC.verbE); s.start(t, Math.random() * 2, 1.8);
}
function sfxBeat(at, amp) {
  if (!AC) return; const t = AC.currentTime + at, o = AC.createOscillator(), g = AC.createGain();
  o.frequency.setValueAtTime(64, t); o.frequency.exponentialRampToValueAtTime(38, t + .25);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(amp, t + .015); g.gain.exponentialRampToValueAtTime(.001, t + .45);
  o.connect(g); g.connect(busE); g.connect(AC.verbE); o.start(t); o.stop(t + .5);
}

function sfxGong(at) {
  if (!AC) return; const t = AC.currentTime + at, out = AC.createGain(); out.gain.value = .22; out.connect(busE); out.connect(AC.verbE); out.connect(AC.verbE);
  [[1, 1, 7], [2.01, .5, 5], [2.76, .38, 4], [3.98, .22, 3], [5.4, .12, 2]].forEach(([m, am, dec]) => { const o = AC.createOscillator(), g = AC.createGain(); o.frequency.value = 73.4 * m; g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(am, t + .03); g.gain.exponentialRampToValueAtTime(.0008, t + dec); o.connect(g); g.connect(out); o.start(t); o.stop(t + dec + .1); });
}
function intro(next) {
  const el = document.createElement("div"); el.className = "intro";
  el.innerHTML = `<svg viewBox="0 0 64 64" aria-hidden="true">
    <circle class="ln" pathLength="100" cx="32" cy="32" r="29"/>
    <circle class="dash" cx="32" cy="32" r="24" stroke-dasharray="2 4"/>
    <path class="ln l2" pathLength="100" d="M32 8v48M8 32h48"/>
    <path class="star" d="M32 14l5 18-5 18-5-18z"/>
    <path class="ln l3" pathLength="100" d="M32 14l5 18-5 18-5-18z"/>
    <path class="ln l3" pathLength="100" d="M14 32l18-4 18 4-18 4z"/>
  </svg>`;
  $("#film").appendChild(el);
  sfxGong(.9);
  later(() => { el.classList.add("out"); setTimeout(() => el.remove(), 1400); next(); }, 3400);
}
function syncMix() {
  [["volM", "m"], ["volE", "e"]].forEach(([id, k]) => { const el = $("#" + id); el.value = AUD[k]; el.style.setProperty("--p", AUD[k] + "%"); $("#" + id + "o").textContent = AUD[k]; });
  $("#snd").setAttribute("aria-pressed", String(SOUND));
}
[["volM", "m"], ["volE", "e"]].forEach(([id, k]) => {
  $("#" + id).addEventListener("input", e => {
    AUD[k] = +e.target.value; e.target.style.setProperty("--p", AUD[k] + "%"); $("#" + id + "o").textContent = AUD[k];
    if (AUD[k] > 0) SOUND = true; applyVol(true); saveAudio();
  });
});
syncMix();

function start() {
  $("#start").hidden = true; $("#hud").hidden = false;
  $("#dots").hidden = false; $("#dots").innerHTML = SCENES.map(() => "<i></i>").join("");
  playing = true; audioStart(); intro(() => show(0));
}
$("#play").onclick = start;
$("#nope").onclick = leave;
$("#go").onclick = leave;
$("#skip").onclick = e => { e.stopPropagation(); idx < SCENES.length ? finale() : leave(); };
$("#snd").onclick = e => { e.stopPropagation(); SOUND = !SOUND; e.target.setAttribute("aria-pressed", String(SOUND)); applyVol(); saveAudio(); if (!SOUND) MUSIC.pause(); else if (MUSIC.ok) MUSIC.play().catch(() => {}); };
$("#film").addEventListener("click", e => { if (!playing || e.target.closest("button")) return; if (idx < SCENES.length) show(idx + 1); });
addEventListener("keydown", e => {
  if (!playing) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); start(); } return; }
  if (e.key === "Escape") { idx < SCENES.length ? finale() : leave(); }
  if (e.key === " " || e.key === "ArrowRight" || e.key === "Enter") { e.preventDefault(); if (idx < SCENES.length) show(idx + 1); else leave(); }
});
</script>
