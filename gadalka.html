<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шатёр Мирры</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+SC:wght@600;700&family=Marck+Script&display=swap">
<style>
:root {
  --gold: #c9a25a; --gold-hi: #f0d696; --ink: #f3e6c8; --muted: #c8b48e;
  --ease: cubic-bezier(.2,.7,.2,1);
  --fd: "Cormorant SC", "Cormorant Garamond", Georgia, serif;
  --fb: "Cormorant Garamond", Georgia, serif;
  --fh: "Marck Script", "Cormorant Garamond", cursive;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #12070c; color: var(--ink); font: 500 19px/1.4 var(--fb); overflow: hidden; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }

/* ---------- раскладка ---------- */
.app { position: fixed; inset: 0; display: flex; flex-direction: column; }
.scene { position: relative; flex: 1 1 auto; min-height: 46%; overflow: hidden; container-type: size;
  background: radial-gradient(ellipse 70% 90% at 50% 40%, #4a1a26 0%, #2a0d18 55%, #12070c 100%); }
.scene .tent { position: absolute; inset: 0; width: 100%; height: 100%; }
.scene .glow { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse 60% 55% at 72% 78%, rgba(255,170,70,.20), transparent 70%), radial-gradient(ellipse 50% 50% at 24% 80%, rgba(150,120,255,.14), transparent 70%); animation: flick 3.2s infinite; mix-blend-mode: screen; }
@keyframes flick { 0%,100% { opacity: .9 } 20% { opacity: .75 } 45% { opacity: 1 } 70% { opacity: .82 } }
/* стол — на всю ширину, а сцена с гадалкой сидит на нём */
.table { position: absolute; left: -2%; right: -2%; bottom: 0; height: calc(min(100cqh, 96cqw) * .30);
  background: radial-gradient(ellipse 55% 70% at 50% 40%, rgba(255,190,120,.10), transparent 70%), repeating-linear-gradient(100deg, rgba(0,0,0,.08) 0 3px, transparent 3px 9px), linear-gradient(180deg, #5a1424 0%, #3c0c1a 55%, #22060e 100%);
  border-top: 3px solid #b8893f; border-radius: 50% 50% 0 0 / 14px 14px 0 0; box-shadow: 0 -2px 0 #5c3a14, 0 -14px 30px rgba(0,0,0,.45) inset; }
.table::before { content: ""; position: absolute; left: 50%; top: 22%; width: min(70cqw, 560px); height: 70%; transform: translateX(-50%); border: 1px solid rgba(201,162,90,.28); border-radius: 50%; box-shadow: 0 0 0 7px rgba(201,162,90,.06); }
.stage { position: absolute; left: 50%; bottom: 0; height: min(100cqh, 96cqw); aspect-ratio: 1000 / 640; transform: translateX(-50%); pointer-events: none; }
.stage svg { width: 100%; height: 100%; display: block; overflow: visible; }

/* карты на столе */
.slots { position: absolute; left: 0; right: 0; bottom: calc(min(100cqh, 96cqw) * .03); height: calc(min(100cqh, 96cqw) * .23); display: flex; justify-content: center; align-items: center; gap: clamp(6px, 1.6cqw, 18px); z-index: 3; perspective: 900px; }
.slot { position: relative; height: 100%; aspect-ratio: 120 / 200; border-radius: 6px; border: 1px dashed rgba(240,214,150,.28); display: grid; place-items: center; }
.slot > span { position: absolute; bottom: -2px; left: 50%; transform: translate(-50%, 100%); font: 600 11px/1 var(--fd); letter-spacing: .08em; color: rgba(240,214,150,.7); white-space: nowrap; }
.slot.has { border-color: transparent; }
.card { position: absolute; inset: 0; animation: land .6s var(--ease) both; cursor: zoom-in; pointer-events: auto; border: 0; padding: 0; background: none; perspective: 700px; }
.card .fl { position: absolute; inset: 0; display: block; transform-style: preserve-3d; transition: transform .9s var(--ease); }
@keyframes land { from { transform: translateY(-120%) rotate(-14deg) scale(1.3); opacity: 0; } }
.card .b, .card .f { position: absolute; inset: 0; display: block; backface-visibility: hidden; -webkit-backface-visibility: hidden; }
.card svg { filter: drop-shadow(0 4px 6px rgba(0,0,0,.55)); }
.card .f { transform: rotateY(180deg); }
.card.open .fl { transform: rotateY(180deg); }
.card.rev.open .fl { transform: rotateY(180deg) rotateZ(180deg); }
.card.now .f svg { filter: drop-shadow(0 0 10px rgba(255,214,140,.75)) drop-shadow(0 4px 6px rgba(0,0,0,.55)); }
.slots.n5 .slot { height: 88%; }
.slots.n5 .slot > span { white-space: normal; width: 112%; text-align: center; line-height: 1.05; }

.tc-svg { display: block; width: 100%; height: 100%; }
.tb-bg { fill: #3a1430; stroke: #c9a25a; stroke-width: 2; } .tb-fr { fill: none; stroke: rgba(201,162,90,.6); stroke-width: 1.2; }
.tb-or { fill: none; stroke: #c9a25a; stroke-width: 1.4; opacity: .85; }
.tf-bg { fill: #f1e2bf; stroke: #8a6a3a; stroke-width: 2; } .tf-fr { fill: none; stroke: #7a2414; stroke-width: 1.2; }
.tf-num { font: 700 16px "Cormorant SC", Georgia, serif; fill: #7a2414; text-anchor: middle; }
.tf-nm { font: 700 13.5px "Cormorant SC", Georgia, serif; fill: #2a1a0c; text-anchor: middle; letter-spacing: .03em; }
.tf-gl { fill: none; stroke: #3a2210; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; } .tf-ln { stroke: rgba(122,36,20,.5); }

/* ---------- гадалка: живые детали ---------- */
.eye { transform-box: fill-box; transform-origin: center; animation: blink 5.5s infinite; }
.eye.r { animation-delay: .02s; }
@keyframes blink { 0%, 93%, 100% { transform: scaleY(1); } 95.5% { transform: scaleY(.08); } }
.iris { transition: transform .6s var(--ease); }
.look-down .iris { transform: translate(0, 2.6px); }
.look-guest .iris { transform: translate(0, 0); }
.mouth-o { transform-box: fill-box; transform-origin: center; transform: scaleY(0); }
.talk .mouth-o { animation: talk .26s infinite alternate; }
@keyframes talk { from { transform: scaleY(.1); } to { transform: scaleY(1); } }
.flame { transform-box: fill-box; transform-origin: 50% 100%; animation: fl 1.4s infinite ease-in-out; }
.flame.b { animation-duration: 1.9s; animation-delay: -.6s; }
@keyframes fl { 0%,100% { transform: scale(1, 1) rotate(-2deg); } 30% { transform: scale(.92, 1.08) rotate(3deg); } 60% { transform: scale(1.05, .94) rotate(-4deg); } }
.lamp { transform-box: view-box; animation: sway 6s infinite ease-in-out; }
.lamp.r { animation-delay: -3s; }
@keyframes sway { 0%,100% { transform: rotate(1.4deg); } 50% { transform: rotate(-1.4deg); } }
.orb-in { animation: orb 6s infinite ease-in-out; transform-box: fill-box; transform-origin: center; }
@keyframes orb { 0%,100% { opacity: .55; transform: rotate(0) scale(1); } 50% { opacity: 1; transform: rotate(180deg) scale(1.15); } }
.smoke { fill: none; stroke: rgba(230,220,255,.16); stroke-width: 6; stroke-linecap: round; animation: smoke 7s infinite linear; }
.smoke.b { animation-delay: -3.5s; }
@keyframes smoke { 0% { opacity: 0; transform: translateY(20px); } 30% { opacity: 1; } 100% { opacity: 0; transform: translateY(-70px); } }
.breathe { transform-box: fill-box; transform-origin: 50% 100%; animation: br 5s infinite ease-in-out; }
@keyframes br { 0%,100% { transform: scaleY(1); } 50% { transform: scaleY(1.012); } }
.dust { position: absolute; inset: 0; pointer-events: none; }
.dust i { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: rgba(255,226,170,.55); filter: blur(.5px); animation: dust linear infinite; }
@keyframes dust { from { transform: translate(0, 0); opacity: 0; } 15% { opacity: .9; } to { transform: translate(30px, -160px); opacity: 0; } }

/* ---------- диалог ---------- */
.dlg { position: relative; flex: 0 0 auto; z-index: 5; padding: 14px clamp(14px, 4vw, 40px) calc(14px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, #1f0d14, #140810); border-top: 1px solid rgba(201,162,90,.55); box-shadow: 0 -10px 30px rgba(0,0,0,.6); max-height: 56%; display: flex; flex-direction: column; }
.dlg-in { width: 100%; max-width: 900px; margin: 0 auto; display: flex; flex-direction: column; min-height: 0; }
.who { display: flex; align-items: baseline; gap: 10px; margin: 0 0 4px; font: 700 15px/1 var(--fd); letter-spacing: .2em; color: var(--gold); text-transform: uppercase; }
.who small { font: italic 500 14px/1 var(--fb); letter-spacing: 0; color: var(--muted); text-transform: none; }
.echo { min-height: 0; margin: 0 0 4px; font: italic 500 16px/1.3 var(--fb); color: #a99472; }
.echo:empty { display: none; }
.echo::before { content: "— "; }
.line { position: relative; min-height: 3.1em; margin: 0; font: 500 clamp(19px, 2.1vw, 22px)/1.42 var(--fb); color: var(--ink); cursor: pointer; text-wrap: pretty; }
.line .more { display: inline-block; margin-left: 6px; color: var(--gold-hi); animation: bob 1s infinite; }
@keyframes bob { 50% { transform: translateY(3px); } }
.opts { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 8px; margin-top: 12px; overflow-y: auto; min-height: 0; padding: 2px; }
.opt { text-align: left; padding: 10px 14px; border: 1px solid rgba(201,162,90,.45); border-radius: 4px; background: rgba(255,240,210,.04); font: 600 17px/1.25 var(--fb); color: var(--ink); cursor: pointer; transition: background .25s, border-color .25s, transform .25s var(--ease); animation: optin .4s var(--ease) both; animation-delay: calc(var(--i) * 50ms); }
.opt:hover, .opt:focus-visible { background: rgba(240,214,150,.13); border-color: var(--gold-hi); outline: none; transform: translateX(3px); }
.opt.quiet { color: var(--muted); font-style: italic; border-style: dashed; }
.opt.gold { background: linear-gradient(180deg, #f1d79a, #c99a4e); color: #2a1a0c; border-color: var(--gold-hi); font-family: var(--fd); letter-spacing: .04em; text-align: center; }
@keyframes optin { from { opacity: 0; transform: translateY(6px); } }
.name-row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.name-row input { flex: 1 1 200px; min-width: 0; padding: 10px 12px; border: 1px solid rgba(201,162,90,.55); border-radius: 4px; background: rgba(0,0,0,.35); color: var(--ink); font: 600 19px/1.2 var(--fh); }
.name-row input:focus { outline: none; border-color: var(--gold-hi); }
.name-row .opt { flex: 0 0 auto; }

/* веер — тянуть карты */
.fan { position: relative; height: clamp(120px, 20vh, 170px); margin-top: 6px; }
.fan button { position: absolute; left: 50%; bottom: 4px; width: clamp(54px, 9vw, 78px); aspect-ratio: 120 / 200; padding: 0; border: 0; background: none; cursor: pointer; transform-origin: 50% 280%; transform: translateX(-50%) rotate(calc((var(--k) - 10.5) * var(--sp, 3.6deg))); transition: transform .45s var(--ease), opacity .35s; filter: drop-shadow(0 3px 5px rgba(0,0,0,.6)); animation: deal .7s var(--ease) both; animation-delay: calc(var(--k) * 22ms); }
.fan button:hover, .fan button:focus-visible { transform: translateX(-50%) rotate(calc((var(--k) - 10.5) * var(--sp, 3.6deg))) translateY(-14px); outline: none; }
.fan button.taken { opacity: 0; pointer-events: none; transform: translateX(-50%) rotate(calc((var(--k) - 10.5) * var(--sp, 3.6deg))) translateY(-120px); }
@keyframes deal { from { transform: translateX(-50%) rotate(0deg); opacity: 0; } }
@media (max-width: 560px) { .fan { height: 130px; } .fan button { --sp: 2.2deg; width: 58px; bottom: 26px; transform-origin: 50% 240%; } }

/* верхняя полоса */
.top { position: absolute; left: 0; right: 0; top: 0; z-index: 8; display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; pointer-events: none; }
.top button { pointer-events: auto; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid rgba(201,162,90,.5); border-radius: 3px; background: rgba(20,8,14,.6); color: var(--gold-hi); font: 700 14px/1 var(--fd); letter-spacing: .08em; cursor: pointer; backdrop-filter: blur(3px); }
.top button:hover { border-color: var(--gold-hi); }

/* ---------- вход: полог ---------- */
.gate { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; pointer-events: none; }
.flap { position: absolute; top: 0; bottom: 0; width: 51%; pointer-events: auto; transition: transform 1.6s cubic-bezier(.6,.05,.25,1); background: repeating-linear-gradient(90deg, #5a1626 0 34px, #3a0e22 34px 68px, #b8893f 68px 70px, #3a0e22 70px 72px); box-shadow: inset 0 0 120px rgba(0,0,0,.85); }
.flap::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, rgba(0,0,0,.25), transparent 30%, rgba(0,0,0,.35) 60%, transparent); }
.flap.l { left: 0; transform-origin: 0 0; border-right: 2px solid #b8893f; }
.flap.r { right: 0; transform-origin: 100% 0; border-left: 2px solid #b8893f; }
.gate.open .flap.l { transform: translateX(-105%) skewX(-6deg); }
.gate.open .flap.r { transform: translateX(105%) skewX(6deg); }
.gate-c { position: relative; z-index: 2; pointer-events: auto; text-align: center; padding: 26px 30px; max-width: 460px; margin: 16px; border: 1px solid rgba(201,162,90,.6); background: radial-gradient(ellipse at 50% 0, rgba(80,30,44,.96), rgba(18,7,12,.96)); box-shadow: 0 20px 60px rgba(0,0,0,.7); transition: opacity .5s, transform .6s var(--ease); }
.gate.open .gate-c { opacity: 0; transform: scale(.94); pointer-events: none; }
.gate-c svg { width: 70px; height: 70px; stroke: var(--gold); fill: none; stroke-width: 1.4; }
.gate-c h1 { margin: 6px 0 4px; font: 700 34px/1.05 var(--fd); color: var(--gold-hi); letter-spacing: .05em; }
.gate-c p { margin: 0 0 18px; color: var(--muted); font-style: italic; }
.gate-c .opt { display: block; width: 100%; margin-top: 8px; }
.scene, .dlg { transition: transform 2.2s cubic-bezier(.3,.1,.2,1), filter 2s; }
body.outside .scene { transform: scale(1.35) translateY(-8%); filter: blur(3px) brightness(.5); }
body.outside .dlg { transform: translateY(110%); }

/* увеличенная карта */
.zoom { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 20px; background: rgba(8,3,6,.86); cursor: zoom-out; animation: zin .3s both; }
@keyframes zin { from { opacity: 0; } }
.zoom-c { display: flex; gap: 22px; align-items: center; max-width: 760px; flex-wrap: wrap; justify-content: center; }
.zoom-c .z-card { width: min(46vw, 240px); }
.zoom-c .z-card.rev { transform: rotate(180deg); }
.zoom-c .z-t { flex: 1 1 260px; max-width: 420px; }
.zoom-c h2 { margin: 0 0 6px; font: 700 28px/1.1 var(--fd); color: var(--gold-hi); }
.zoom-c h2 small { display: block; font: italic 500 17px/1.2 var(--fb); color: var(--muted); }
.zoom-c p { margin: 0 0 8px; }

.toast { position: fixed; left: 50%; bottom: 24px; z-index: 40; transform: translateX(-50%); padding: 10px 16px; background: #2a1a0c; border: 1px solid var(--gold); border-radius: 4px; color: var(--gold-hi); font: 600 16px/1.3 var(--fb); max-width: 90vw; animation: zin .3s both; }

@media (max-width: 640px) {
  .dlg { max-height: 54%; padding-top: 10px; }
  .opts { grid-template-columns: 1fr; gap: 6px; margin-top: 8px; }
  .opt { padding: 9px 12px; font-size: 16px; }
  .line { font-size: 18px; min-height: 2.9em; }
  .slot > span { font-size: 9.5px; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .2s !important; } }
</style>
</head>
<body class="outside">
<div class="app">
  <div class="scene" id="scene">
    <svg class="tent" viewBox="0 0 1000 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true" id="tent"></svg>
    <div class="table"></div>
    <div class="stage" id="stage" aria-hidden="true"></div>
    <div class="glow"></div>
    <div class="dust" id="dust"></div>
    <div class="slots" id="slots"></div>
    <div class="top"><button type="button" id="leave"><svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 4l-6 6 6 6"/></svg>Выйти из шатра</button><button type="button" id="restart" hidden>Сначала</button></div>
  </div>
  <div class="dlg" id="dlg">
    <div class="dlg-in">
      <p class="who">Мирра <small id="who-s">гадалка</small></p>
      <p class="echo" id="echo"></p>
      <p class="line" id="line" aria-live="polite"></p>
      <div id="ctrl"></div>
    </div>
  </div>
</div>
<div class="gate" id="gate">
  <div class="flap l"></div><div class="flap r"></div>
  <div class="gate-c">
    <svg viewBox="0 0 64 64"><path d="M32 6L8 52h48z"/><path d="M32 6v46M20 52c4-14 8-22 12-30 4 8 8 16 12 30"/><circle cx="32" cy="40" r="4"/><path d="M32 2v4"/></svg>
    <h1>Шатёр Мирры</h1>
    <p>Полог пахнет дымом, полынью и воском. Изнутри доносится тихое бормотание — и шорох карт.</p>
    <button type="button" class="opt gold" id="enter">Откинуть полог и войти</button>
    <button type="button" class="opt quiet" id="nope">Пройти мимо</button>
  </div>
</div>
<script>
/* =====================================================================
   ГАДАЛКА: расклад карт Таро (22 Старших Аркана).
   Колоду тасуют, игрок сам тянет карты из веера, гадалка переворачивает
   их по одной и толкует — прямое и перевёрнутое положение.
   ===================================================================== */
const TAROT = [
  ["0", "Шут", '<path d="M8 52h22l6-10h16"/><circle cx="24" cy="22" r="5"/><path d="M24 27v12l-6 10M24 39l7 8M24 31l9-6M33 25l8-8M41 17l4 2-2 4"/><path d="M46 8l1.5 3 3 .5-2.2 2 .6 3-2.9-1.5-2.9 1.5.6-3-2.2-2 3-.5z"/>',
    "Новое начало, шаг в неизвестность, доверие пути.", "Безрассудство, глупый риск, бегство от выбора."],
  ["I", "Маг", '<path d="M30 8c-4 0-6 3-6 5s2 5 6 5 6-3 6-5-2-5-6-5zM30 8c4 0 6-3 6-5M30 18v16"/><path d="M14 40h32M18 40v10M42 40v10"/><path d="M24 46l2-4h8l2 4M30 34l-8-6M30 34l8-6"/><circle cx="20" cy="48" r="1.5"/><circle cx="40" cy="48" r="1.5"/>',
    "Воля, мастерство, всё нужное уже в руках.", "Обман, фокусы, сила, обращённая во зло."],
  ["II", "Жрица", '<path d="M18 52V14M42 52V14"/><path d="M30 12a9 9 0 1 0 0 0zM24 12a7 7 0 0 1 12 0"/><path d="M22 28h16v18H22z"/><path d="M26 33h8M26 38h8M26 43h5"/>',
    "Тайное знание, интуиция, молчание, которое говорит громче слов.", "Скрытые мотивы, секреты, что обернутся против вас."],
  ["III", "Императрица", '<path d="M18 22l4-8 4 6 4-8 4 8 4-6 4 8z"/><path d="M18 22h24"/><path d="M30 26c-8 6-10 14-6 24h12c4-10 2-18-6-24z"/><path d="M14 52c4-4 8-4 12 0M34 52c4-4 8-4 12 0"/>',
    "Изобилие, забота, рождение нового — дела, людей, урожая.", "Зависимость, удушающая опека, пустота."],
  ["IV", "Император", '<path d="M16 50h28V30H16z"/><path d="M16 30l4-6h20l4 6"/><path d="M22 24l3-8 5 5 5-5 3 8"/><path d="M24 50V38h12v12M30 6v10"/>',
    "Власть, порядок, закон, твёрдая рука.", "Тирания, жёсткость, власть ради власти."],
  ["V", "Иерофант", '<path d="M30 6v44M22 14h16M24 22h12M26 30h8"/><path d="M18 50h24"/><circle cx="30" cy="40" r="4"/>',
    "Традиция, вера, наставник, клятва.", "Догма, слепое послушание, лицемерие служителей."],
  ["VI", "Влюблённые", '<path d="M22 30a6 6 0 1 0 0-.1M38 30a6 6 0 1 0 0-.1"/><path d="M22 36v14M38 36v14M22 42l8-4 8 4"/><path d="M30 8c-3-4-9-2-8 3 1 4 8 8 8 8s7-4 8-8c1-5-5-7-8-3z"/>',
    "Союз, выбор сердцем, притяжение.", "Разлад, неверный выбор, измена."],
  ["VII", "Колесница", '<path d="M14 30h32v12H14z"/><circle cx="20" cy="46" r="5"/><circle cx="40" cy="46" r="5"/><path d="M20 30V18h20v12M24 18l6-8 6 8"/><path d="M12 12l6 4M48 12l-6 4"/>',
    "Победа, движение вперёд, воля, что подчиняет обстоятельства.", "Потеря управления, поражение, спешка."],
  ["VIII", "Сила", '<path d="M18 40c0-10 6-16 12-16s12 6 12 16"/><path d="M22 40c2 6 14 6 16 0"/><circle cx="25" cy="34" r="1.5"/><circle cx="35" cy="34" r="1.5"/><path d="M20 14c3-4 7-4 10 0 3-4 7-4 10 0-3 4-7 4-10 0-3 4-7 4-10 0z"/>',

/* ===================== ШАТЁР (фон) ===================== */
(function tent() {
  let s = `<defs>
    <radialGradient id="lampg"><stop offset="0" stop-color="#ffd890" stop-opacity=".9"/><stop offset=".35" stop-color="#ff9a40" stop-opacity=".35"/><stop offset="1" stop-color="#ff7a20" stop-opacity="0"/></radialGradient>

  </defs><rect width="1000" height="640" fill="#2a0c18"/>`;
  const N = 18;
  for (let i = 0; i < N; i++) {
    const x0 = -700 + i * (2400 / N), x1 = x0 + 2400 / N;
    s += `<path d="M500 -120 L${x0.toFixed(0)} 700 L${x1.toFixed(0)} 700Z" fill="${i % 2 ? "#3d1022" : "#561a2c"}"/>`;

  /* узор-звёзды на ткани */
  for (let i = 0; i < 26; i++) { const x = 40 + tRand(920), y = 30 + tRand(380); s += `<path d="M${x} ${y - 5}l1.4 3.6 3.6 1.4-3.6 1.4-1.4 3.6-1.4-3.6-3.6-1.4 3.6-1.4z" fill="#d9b36a" opacity="${(.15 + tRand(30) / 100).toFixed(2)}"/>`; }

  s += `<path d="M-20 0 Q120 90 260 10 Q380 100 500 18 Q620 100 740 10 Q880 90 1020 0 V-10 H-20Z" fill="#6a1e32"/>
    <path d="M-20 0 Q120 90 260 10 Q380 100 500 18 Q620 100 740 10 Q880 90 1020 0" fill="none" stroke="#c9a25a" stroke-width="3"/>`;
  /* бахрома-кисти */
  for (let x = 0; x <= 1000; x += 22) { const k = (x % 250) / 250, y = 8 + Math.sin(k * Math.PI) * 52 + (x > 500 ? 0 : 0); s += `<path d="M${x} ${y.toFixed(0)}v14" stroke="#c9a25a" stroke-width="2"/><circle cx="${x}" cy="${(y + 16).toFixed(0)}" r="2.6" fill="#e2bf73"/>`; }
  /* сушёные травы */
  [[90, 120], [905, 110], [960, 150]].forEach(([x, y]) => { s += `<g opacity=".8"><path d="M${x} 0V${y}" stroke="#6a4a2a" stroke-width="1.5"/>${[0, 1, 2, 3, 4].map(k => `<path d="M${x} ${y} q${-14 + k * 7} 24 ${-8 + k * 4} 52" stroke="#5f6a3a" stroke-width="3" fill="none" stroke-linecap="round"/>`).join("")}</g>`; });
  /* фонари */
  const lamp = (x, cls) => `<g class="lamp ${cls}" style="transform-origin:${x}px 0px">
    <path d="M${x} 0V150" stroke="#8a6a3a" stroke-width="2"/>
    <circle cx="${x}" cy="195" r="120" fill="url(#lampg)"/>
    <path d="M${x - 22} 160h44l-6 -10h-32z" fill="#7a5a2a"/>
    <path d="M${x - 20} 160 L${x - 26} 214 Q${x} 230 ${x + 26} 214 L${x + 20} 160Z" fill="#ffcf7a" opacity=".85"/>
    <path d="M${x - 20} 160 L${x - 26} 214 M${x} 160 L${x} 226 M${x + 20} 160 L${x + 26} 214" stroke="#6a4a1a" stroke-width="2.4"/>
    <path d="M${x - 26} 214 Q${x} 232 ${x + 26} 214 l-6 10 h-40z" fill="#7a5a2a"/><path d="M${x} 232v12" stroke="#c9a25a" stroke-width="2"/><circle cx="${x}" cy="248" r="4" fill="#c9a25a"/>
  </g>`;
  s += lamp(170, "l") + lamp(830, "r");
  s += `<rect width="1000" height="640" fill="url(#vig)"/>`;
  $("#tent").innerHTML = s;
})();

const M = () => $("#m");
function look(where) { const m = M(); if (!m) return; m.classList.toggle("look-down", where === "down"); }

let G = { n: "", name: "", topic: "", spread: "three", drawn: [], deck: [], visits: 0 };
const fill = t => t.replace(/\{n\}/g, G.name || "путник").replace(/\{t\}/g, MIRRA.topicName[G.topic] || "твоего вопроса");
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
let typing = null;
function type(text) {
  const el = $("#line"); el.textContent = ""; M().classList.add("talk");
  return new Promise(res => {
    let i = 0; const full = fill(text);
    const done = () => { clearInterval(typing); typing = null; el.textContent = full; M().classList.remove("talk"); res(); };
    typing = setInterval(() => { i += 1 + (full[i] === " " ? 1 : 0); el.textContent = full.slice(0, i); if (i >= full.length) done(); }, 24);
    el.onclick = () => { if (typing) done(); };
  });
}
function echo(t) { $("#echo").textContent = t ? fill(t) : ""; }
/* Мирра говорит; ждём касания, чтобы продолжить */
async function say(text, guest) {
  echo(guest || ""); $("#ctrl").innerHTML = ""; await type(text);
  const el = $("#line"); el.insertAdjacentHTML("beforeend", `<span class="more">▾</span>`);
  return new Promise(res => {
    const go = e => { if (e && e.target.closest(".opt,.fan,input")) return; $("#dlg").removeEventListener("click", go); removeEventListener("keydown", key); res(); };
    const key = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
    setTimeout(() => { $("#dlg").addEventListener("click", go); addEventListener("keydown", key); }, 60);
  });
}
/* Мирра говорит и ждёт ответа: opts = [[текст, класс?], …] → индекс */
async function ask(text, opts, guest) {
  echo(guest || ""); $("#ctrl").innerHTML = ""; await type(text);
  return choose(opts);
}
function choose(opts) {
  return new Promise(res => {
    $("#ctrl").innerHTML = `<div class="opts">${opts.map((o, i) => { const [t, c] = Array.isArray(o) ? o : [o, ""]; return `<button type="button" class="opt ${c || ""}" style="--i:${i}" data-o="${i}">${esc(fill(t))}</button>`; }).join("")}</div>`;
    $("#ctrl").onclick = e => { const b = e.target.closest("[data-o]"); if (!b) return; $("#ctrl").onclick = null; res(+b.dataset.o); };
    const f = $("#ctrl .opt"); if (f && matchMedia("(hover: hover)").matches) f.focus({ preventScroll: true });
  });
}
const opTxt = o => Array.isArray(o) ? o[0] : o;

function slotsDraw() {
  const sp = TAROT_SPREADS[G.spread];
  $("#slots").className = "slots n" + sp.pos.length;
  $("#slots").innerHTML = sp.pos.map((p, i) => `<div class="slot" data-slot="${i}"><span>${esc(p)}</span></div>`).join("");
}
function fanDraw() {
  return new Promise(res => {
    const need = TAROT_SPREADS[G.spread].pos.length;
    $("#ctrl").innerHTML = `<div class="fan" id="fan">${G.deck.map((ci, k) => `<button type="button" data-k="${k}" style="--k:${k}" aria-label="Карта рубашкой вверх">${tarotCardSVG(null, true)}</button>`).join("")}</div>`;
    $("#fan").onclick = async e => {
      const b = e.target.closest("[data-k]"); if (!b || b.classList.contains("taken") || G.drawn.length >= need) return;
      b.classList.add("taken");
      const ci = G.deck[+b.dataset.k], rev = tRand(4) === 0, i = G.drawn.length;
      G.drawn.push({ ci, rev });
      const sl = $(`.slot[data-slot="${i}"]`); sl.classList.add("has");
      sl.insertAdjacentHTML("beforeend", `<button type="button" class="card${rev ? " rev" : ""}" data-card="${i}" aria-label="Карта"><span class="fl"><span class="b">${tarotCardSVG(null, true)}</span><span class="f">${tarotCardSVG(TAROT[ci])}</span></span></button>`);
      const left = need - G.drawn.length;
      if (left) { $("#line").textContent = fill(MIRRA.pick[Math.min(G.drawn.length, MIRRA.pick.length - 2)]); }
      else { await wait(500); res(); }
    };
  });
}
function zoomCard(i) {
  const d = G.drawn[i], c = TAROT[d.ci], C = MIRRA_CARDS[d.ci], sp = TAROT_SPREADS[G.spread];
  if (!$(`.card[data-card="${i}"]`).classList.contains("open")) return;

  z.innerHTML = `<div class="zoom-c"><div class="z-card${d.rev ? " rev" : ""}">${tarotCardSVG(c)}</div><div class="z-t"><h2>${esc(c[1])}<small>${esc(sp.pos[i])}${d.rev ? " · перевёрнута" : ""}</small></h2><p>${esc(d.rev ? c[4] : c[3])}</p><p><i>${esc(fill(d.rev ? C.radv : C.adv))}</i></p></div></div>`;
  z.onclick = () => z.remove(); document.body.appendChild(z);
}

      [["Да, это снова я.", ""], ["Я уже не тот, кем был.", ""], ["Ты меня с кем-то путаешь.", "quiet"]]);
    if (i === 1) await say("Никто не тот, кем был, {n}. Именно поэтому карты каждый раз ложатся иначе.");
    if (i === 2) { G.name = ""; store("velaris-mirra-name", null); await say("Путаю? Может быть. Глаза старые. Ну, назовись тогда заново."); await askName(); }
  } else {
    await say(pick(MIRRA.greet));
    await opening();
    await askName();
  }
  await topic();
}
async function opening() {
  const opts = MIRRA.enter.map(x => x[0]).concat(["Сначала скажи, кто ты такая."]);
  const i = await ask("Ну? Зачем пришёл? Не молчи — молчание я и так слышу каждую ночь.", opts);
  if (i === opts.length - 1) {
    await say(SELF[0][1], opts[i]);
    const j = await ask("Ещё что-то хочешь знать о старой Мирре?", [SELF[1][0], SELF[2][0], ["Нет. Давай к делу.", "quiet"]]);
    if (j < 2) await say(SELF[j + 1][1], SELF[j + 1][0]);
    await say("Хватит обо мне. Карты не любят, когда о них забывают.");
  } else await say(MIRRA.enter[i][1], opts[i]);
}
function askName() {
  return new Promise(async res => {
    echo(""); $("#ctrl").innerHTML = ""; await type(MIRRA.askName);
    $("#ctrl").innerHTML = `<div class="name-row"><input id="nm" maxlength="30" placeholder="Ваше имя" autocomplete="off"><button type="button" class="opt gold" id="nm-ok" style="--i:0">Назваться</button><button type="button" class="opt quiet" id="nm-no" style="--i:1">Не называть</button></div>`;
    const ok = async () => { const v = $("#nm").value.trim().replace(/\s+/g, " ").slice(0, 30); if (!v) { $("#nm").focus(); return; } G.name = cap(v); store("velaris-mirra-name", G.name); await say(pick(MIRRA.nameOk), "Меня зовут " + G.name + "."); res(); };
    $("#nm-ok").onclick = ok; $("#nm").onkeydown = e => { if (e.key === "Enter") ok(); };
    $("#nm-no").onclick = async () => { G.name = ""; await say(MIRRA.nameNo, "Имя оставлю при себе."); res(); };
    if (matchMedia("(hover: hover)").matches) $("#nm").focus();
  });
}
async function topic() {
  const keys = Object.keys(MIRRA.topics);
  const i = await ask(MIRRA.askTopic, keys.map(k => MIRRA.topics[k][0]));
  G.topic = keys[i]; await say(MIRRA.topics[G.topic][1], MIRRA.topics[G.topic][0] + ".");
  const sk = Object.keys(TAROT_SPREADS);
  const j = await ask(MIRRA.askSpread, sk.map(k => `${TAROT_SPREADS[k].name} — ${TAROT_SPREADS[k].hint.toLowerCase()}`));
  G.spread = sk[j];
  await reading();
}
async function reading() {
  G.drawn = []; slotsDraw(); look("down");
  const deck = TAROT.map((c, i) => i);
  for (let i = deck.length - 1; i > 0; i--) { const j = tRand(i + 1); [deck[i], deck[j]] = [deck[j], deck[i]]; }
  G.deck = deck;
  await say(pick(MIRRA.shuffle));
  const c = await ask(MIRRA.cut, MIRRA.cutA.map(x => x[0]));
  await say(MIRRA.cutA[c][1], MIRRA.cutA[c][0]);
  echo(""); await type(MIRRA.pick[0]);
  await fanDraw();
  $("#ctrl").innerHTML = "";
  const sp = TAROT_SPREADS[G.spread];
  for (let i = 0; i < G.drawn.length; i++) await cardTalk(i, sp.pos[i]);
  look("guest");
  await finale();
}
async function cardTalk(i, pos) {
  const d = G.drawn[i], c = TAROT[d.ci], C = MIRRA_CARDS[d.ci];
  document.querySelectorAll(".card.now").forEach(x => x.classList.remove("now"));
  const el = $(`.card[data-card="${i}"]`); el.classList.add("open", "now"); look("down");
  await wait(650);
  await say(pick(MIRRA.reveal).replace("{p}", pos) + " " + (POS_LEAD[pos] || ""));
  if (d.rev) await say(pick(MIRRA.rev));
  await say(pick(d.rev ? C.rsay : C.say) + " " + pick(TOPIC_TAIL[G.topic]));
  look("guest");
  /* её вопрос гостю */
  const opts = C.a.map(x => x[0]).concat([["Промолчать.", "quiet"]]);
  const a = await ask(C.q, opts);
  if (a < C.a.length) await say(C.a[a][1], C.a[a][0]); else await say(pick(MIRRA.quiet), "…");
  /* вопросы гостя */
  let left = MIRRA.guestQ.slice(0, 3), first = true;
  while (left.length) {
    const q = await ask(first ? pick(["Спрашивай, если есть что спросить.", "Хочешь спросить меня о чём-то, {n}?", "Карта ещё тёплая. Спрашивай."]) : pick(["Что ещё?", "Ещё вопрос?", "Спрашивай дальше — или пойдём к следующей."]),
      left.map(x => x[0]).concat([[i < G.drawn.length - 1 ? "Открывай следующую." : "Что же в итоге?", "gold"]]));
    first = false;
    if (q === left.length) break;
    const [qt, key] = left[q]; left.splice(q, 1);
    const ans = key === "adv" ? (d.rev ? C.radv : C.adv) : C[key];
    await say(ans, qt);
  }
  el.classList.remove("now");
}
async function finale() {
  const r = G.drawn.filter(d => d.rev).length, n = G.drawn.length;
  await say(OVERALL[r === 0 ? 0 : r * 2 >= n ? 2 : 1]);
  await say(pick(MIRRA.end));
  $("#restart").hidden = false;
  for (;;) {
    const opts = MIRRA.bye.map(x => x[0]).concat([["Спросить что-то о тебе самой", ""], ["Скопировать расклад", "quiet"]]);
    const i = await ask("Ну что, {n}? Свеча коротка.", opts);
    if (i === 3) { await say(MIRRA.bye[3][1], MIRRA.bye[3][0]); return again(); }
    if (i === opts.length - 1) { copy(); continue; }
    if (i === opts.length - 2) {
      const left = SELF.slice(1);
      const j = await ask("Обо мне? Хе. Ну спрашивай — сегодня я добрая.", left.map(x => x[0]).concat([["Не важно.", "quiet"]]));
      if (j < left.length) await say(left[j][1], left[j][0]);
      continue;
    }
    await say(MIRRA.bye[i][1], MIRRA.bye[i][0]);
    const k = await ask("Полог открыт. Иди с огнём.", [["Выйти из шатра", "gold"], ["Остаться и погадать ещё", ""]]);
    if (k === 0) return leave(); else return again();
  }
}
async function again() {
  $("#slots").innerHTML = ""; G.drawn = []; look("guest");
  await topic();
}
function trTextM() {
  const sp = TAROT_SPREADS[G.spread];
  return `🔮 Гадание у Мирры — «${sp.name}»${G.name ? `, гость: ${G.name}` : ""}\nО чём: ${MIRRA.topics[G.topic][0].toLowerCase()}\n` + G.drawn.map((d, i) => { const c = TAROT[d.ci]; return `${sp.pos[i]}: ${c[1]}${d.rev ? " (перевёрнута)" : ""} — ${d.rev ? c[4] : c[3]}`; }).join("\n");
}
function copy() {
  const t = trTextM();
  try { navigator.clipboard.writeText(t).then(() => toast("Расклад скопирован — вставьте его в беседу."), () => toast(t)); } catch (_) { toast(t); }
}
function leave() {
  if (IN_FRAME) { try { parent.postMessage({ velaris: "closeOverlay" }, "*"); return; } catch (_) {} }
  location.href = "index.html" + location.search;
}
$("#leave").onclick = leave;
$("#nope").onclick = leave;
$("#restart").onclick = () => location.reload();
$("#enter").onclick = async () => {
  $("#gate").classList.add("open");
  document.body.classList.remove("outside");
  await wait(1700);
  $("#gate").hidden = true;
  intro();
};
</script>
</body>
